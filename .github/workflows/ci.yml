name: Commercial foundation

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: commercial-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_architecture.py

  backend:
    name: Backend, database, and migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/wechat/package-lock.json
      - run: npm ci
        working-directory: apps/wechat
      - name: Expose isolated PostgreSQL test tools
        shell: bash
        run: |
          postgres_bindir="$(pg_config --bindir)"
          test -x "$postgres_bindir/initdb"
          test -x "$postgres_bindir/pg_ctl"
          echo "$postgres_bindir" >> "$GITHUB_PATH"
      - run: scripts/verify_backend.sh

  wechat:
    name: WeChat contract, structure, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/wechat/package-lock.json
      - run: npm ci
        working-directory: apps/wechat
      - run: scripts/verify_wechat.sh
