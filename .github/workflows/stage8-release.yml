name: Stage 8 immutable staging release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release identifier
        required: true

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: apps/wechat/package-lock.json }
      - run: python -m pip install -e './backend[dev]'
      - run: npm ci
        working-directory: apps/wechat
      - run: scripts/verify.sh
      - run: ops/scripts/rehearse_artifact_switch.sh
      - run: RELEASE_ID='${{ inputs.release_id }}' ops/scripts/build_immutable_artifact.sh
      - uses: actions/upload-artifact@v4
        with:
          name: anan-${{ inputs.release_id }}
          path: |
            dist/anan-${{ inputs.release_id }}.tar.gz
            dist/anan-${{ inputs.release_id }}.tar.gz.sha256
          if-no-files-found: error
