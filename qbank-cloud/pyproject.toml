[project]
name = "anan-qbank-cloud"
version = "0.1.0"
description = "Paid developer API and SkillHub Skill for bounded exam question delivery."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "cryptography>=43,<46",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<9"]
serve = ["uvicorn>=0.30,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
