id: mc_ziliao_jiqiliang_01
exam_scope: guokao
track: xingce
module_name: 资料分析
tag_path: 资料分析/基期与现期/基期量计算
title: 基期量计算：化除为乘
recognition: 题干给出现期量和增长率，问上年或基期的量
applicability:
  include:
    - 题干明确给出现期量
    - 题干给出同比、环比或增长率
  exclude:
    - 问增长量而不是基期量
    - 需要先从图表合并多个现期量
method_steps:
  - 基期 = 现期 / (1 + 增长率)
  - 增长率绝对值小于 5% 时，用现期乘以 (1 - r) 近似
  - 选项差距大于 5% 时优先估算，不列竖式
error_signatures:
  - code: base_period_formula_flip
    description: 把基期公式记成现期乘以 (1 + r)
  - code: unit_trap
    description: 忽略题干与选项单位不一致
fix_action: 做 {n} 题基期量同类题，限时 {sec} 秒/题
time_budget_sec: 55
accuracy_rule: 选项差距大于 5% 时估算；差距小于 5% 时保留一位小数核算
pitfall: 增长率为负时 (1 + r) 是减法，别看错符号
author_note: AI 生成，基于题库基期量 tag 抽样 30 题，经本人回测审定
validation:
