[project]
name = "gongkao-dazi-backend"
version = "0.1.0"
description = "Backend for 考公搭子"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.8,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "PyJWT>=2.8,<3",
  "cryptography>=42,<44",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
  "alembic>=1.18,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
