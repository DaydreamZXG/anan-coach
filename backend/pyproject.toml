[project]
name = "gongkao-dazi-backend"
version = "0.1.0"
description = "Backend for 考公搭子"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.8,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "PyJWT>=2.8,<3",
  "cryptography>=42,<44",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
  "alembic>=1.18,<2",
  "tos>=2.9,<3",
  "fsrs>=6.3.1,<7",
  "reportlab==4.4.7",
  "pypdf==6.14.2",
  "pypdfium2==5.7.1",
  "Pillow==12.3.0",
  "qrcode[pil]>=8,<9",
  "websockets>=15,<16",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.internal_services.assets" = ["*.ttf", "OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
