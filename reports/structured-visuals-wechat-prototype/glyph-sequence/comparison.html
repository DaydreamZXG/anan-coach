<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>字母数字序列：真实样本对照</title>
  <style>
    body {
      margin: 24px;
      font: 14px system-ui;
      color: #101828;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    figure {
      margin: 0;
    }
    img {
      width: 100%;
      border: 1px solid #d1d5dc;
    }
    figcaption {
      margin: 8px 0;
    }
  </style>
  <main>
    <figure>
      <figcaption>source.png</figcaption>
      <img src="source.png" />
    </figure>
    <figure>
      <figcaption>redrawn.svg</figcaption>
      <img src="redrawn.svg" />
    </figure>
  </main>
</html>
