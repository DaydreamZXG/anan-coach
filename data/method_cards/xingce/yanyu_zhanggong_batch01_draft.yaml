- id: mc_yanyu_binglie_sanlie
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/并列关系/三并列
  title: 逻辑填空-三并列与或/且/并引导
  recognition: 题干给"甲、__、丙"形式的三个词语填空,或由"或、且、并"引导的并列结构;空格与前后词构成多角度并列
  applicability:
    include:
    - 甲、__、丙形式的三并列,需据前两词关系推断第三词
    - 由"或/且/并"引导、语义绝对不重复的并列结构
    - 并字引导时语义递进强于词语重复呼应(如"贯穿"后接"至关重要")
    exclude:
    - 仅两词的近义/反义双并列
    - 由"不是...而是..."引导的反义并列
  method_steps:
  - 判断三并列类型:三个词可语义一致(如"脚踏实地、__、真抓实干"都体现"实"),也可仅词性一致角度不同(如"高、__、帅"),先根据前两个词的关系推断
  - 三并列不必然递进:"可感知、可显示、可对话"只需保持逻辑关联,勿强建"感知→操作→对话"的递进链条
  - 遇"或/且/并"引导的并列,语义绝对不重复,选与已知词不同方面的词(痛并快乐/东方或西方/有且只有)
  - 遇"并"字引导且需递进时,优先按关联词选递进义(如与"贯穿"递进的"至关重要"),关联词优先于词语重复呼应
  - 策略:三并列关系灵活复杂,优先从其他空入手解题,最后再处理三并列部分
  error_signatures:
  - code: forced_progression
    description: 在三并列中强行构建递进层级(感知→操作→对话),导致解题偏差
  - code: repeated_semantics
    description: 或/且/并结构中选了与已知词同义重复的词("痛并疼着""东方或东方")
  - code: conjunction_over_repeat
    description: 只看词语呼应(贯穿→一以贯之),忽略"并"等关联词提示的递进/并列关系
  fix_action: 做6道三并列与特殊连词并列真题,先标并列类型(三并列/或且并)再选词,三并列题训练先跳过策略
  time_budget_sec: 60
  accuracy_rule: 三并列/特殊并列题正确率≥80%
  pitfall: 并列关系先辨类型再整体把握,口诀"遇到并列不要急,结合前后看仔细";三并列可能同义也可能仅词性一致,或/且/并则绝对不重复,切勿机械记忆词语搭配或孤立即看单空
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
