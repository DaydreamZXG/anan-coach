- id: mc_yanyu_binglie_jinyi
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/并列关系/近义并列
  title: 逻辑填空-近义并列(顿号/逗号/和引导)
  recognition: 空格前后由顿号"、"、逗号","或"和"连接两个词,形成双并列结构;若空格前后均为成语且用逗号隔开,也按并列处理
  applicability:
    include:
    - 顿号、逗号或"和"引导的双并列(仅两个词)
    - 逗号前后均为成语的情况(此时逗号表并列)
    - 空格处与已知词需构成"语义相近、感情色彩相近"的近义关系
    exclude:
    - 逗号表解释说明而非并列的单空结构
    - 由"不是...而是..."等引导的反义并列
    - 三词及以上的多并列(三并列)
  method_steps:
  - 识别并列标志:先找顿号/逗号/"和"连接的并列结构,确定空格与哪个词构成并列
  - 判断关系类型:近义并列要求语义相近、感情色彩相近,但语义接近不等于重复
  - 选词标准:选与已知词语义相近且角度有别的词(如"广开言路"→"集思广益"含"广"义),排除与已知词完全同义的选项
  - 验证:代回原句读,确认并列词间不重复(避免"美丽的漂亮""精挑细选的挑选"这类重复修饰)
  error_signatures:
  - code: synonym_repetition
    description: 选了与并列已知词语义重复的词,忽略近义并列"接近但不重复"的要求
  - code: comma_no_parallel
    description: 看到逗号就默认并列,忽略逗号仅当前后均为成语时才表并列的特殊规则
  - code: key_char_ignored
    description: 忽略已知词的核心程度字(如"广开言路"的"广"),选了不体现该语义侧的词
  fix_action: 做8道近义并列真题,每题先圈出并列标志和已知词的核心字,再选词并检查是否重复
  time_budget_sec: 55
  accuracy_rule: 近义并列题正确率≥85%
  pitfall: 近义并列是逻辑填空最高频考法,但"语义重复"在考试中很少作为正确项;近义并列要求语义接近且不重复,机械记搭配不如抓住已知词的语义核心(广/少/度/主动等)
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
