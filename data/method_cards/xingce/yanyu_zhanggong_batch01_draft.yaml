- id: mc_yanyu_duice_duixiang
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/中心理解/对策对象
  title: 中心理解-对策与对象抓取
  recognition: 对策类文段选答案时,选项需同时包含"对策(怎么做)+对象(谁做/为谁做)"两个核心主题词
  applicability:
    include:
    - 对策类文段答案筛选(约80%答案含对策+对象)
    - 题干已给出对象时(如"文博展陈应…"),只需在文段找具体对策
    - 宏观对策后跟具体对策的辨析
    exclude:
    - 并列文段全面概括型(无单一对策)
    - 纯细节判断题
    - 对策后跟的意义效果部分(意义效果表述次于具体对策)
  method_steps:
  - 从文段分别抓两个核心主题词:对象=开头引出的大话题/谁去做,对策=具体怎么做(谓语动词)
  - 选项同时包含对策+对象则优先;只给一个时,看另一个选项是否有明显瑕疵(主题词错误/表述不准确)来排除
  - 宏观对策+多方面展开:宏观对策与后文具体概括均可能作答案,结合选项判断(出题人只给一个正确选项)
  - 宏观对策+单一具体对策:后文有举例提示→宏观重要;后文有"关键/核心/更应该"→具体重要;都无→结合选项判断
  error_signatures:
  - code: missing_object
    description: 选项丢对象,如高精尖产业题答案必须含"京津冀"和"高精尖"两个词
  - code: missing_countermeasure
    description: 只描述现状或意义,未体现对策,如"研究领域广阔"
  - code: substitution_concept
    description: 偷换概念,如把"从智能技术赋能到技术融合的转变"偷换成"智能技术赋能的路径"
  fix_action: 做10道对策类真题,每题先写出"对象=?对策=?"再选答案,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 对策+对象双抓准确率≥80%
  pitfall: 尾句对策未出现主题词时不要机械认为脱离主题——通过潜台词确认对策对象(如"主动对接…城市功能疏解…乡村全面振兴"的主体就是县域)
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
