- id: mc_yanyu_luoji_chutiren
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/出题人视角
  title: 逻辑填空-出题人视角(选项分组/语义丰富)
  recognition: 极度纠结时(两三个选项都合理),用选项设置规律辅助取舍:选项分组思维(13/22/211)和语义丰富原则
  applicability:
    include:
    - 两选项纠结无法用常规方法区分时
    - 选项分组规律明显(三一/二二/二一一模式)
    - 语义可拆分组合的近义词
    exclude:
    - 正常能做的题(技巧不能代替语境分析+词语辨析,是辅助非万能)
    - 无法判断选项之间关系的题
    - 依赖主观感受而非选项规律的题
  method_steps:
  - 选项分组:三一模式(三同类一格格不入)答案多在"三"中;二二模式需辨析组内差异;二一一模式(两选项相似)答案大概率出自"2"部分
  - 一正一邪:两个相似选项中一个明显错误("猪队友"),它往往暴露/掩护正确答案(如"荣归"搭配奇怪→暗示选结构相似的"回归")
  - 语义丰富:纠结时选语义更丰富的词(语义可拆分组合,如"残存"="残留"+"保存","锚定"比"实现"多"为之努力"义),仅用于取舍
  - 尊重出题人逻辑:干扰项必与正确答案/文段有关联(文段有对应/选项有共性),从出题角度反推答案
  error_signatures:
  - code: overuse_trick
    description: 把辅助技巧当万能公式,放弃正常的语境分析和词语辨析
  - code: subjective_choice
    description: 凭自己怎么想做题,不尊重作者与出题人的逻辑
  - code: ignore_option_relation
    description: 忽略选项间的相似/对立关系,错过分组线索
  fix_action: 做8道选项设置规律真题,标注每题的选项分组模式和一正一邪,限时55秒/题
  time_budget_sec: 55
  accuracy_rule: 正确率≥75%(辅助技巧正确率略低)
  pitfall: 干扰项遵循"文段有对应、选项有共性"两大原则——选项与文段某词对应但不一定是横线要表达的意思(如"夜以继日"对应"悠长的夜晚"却是干扰项),要抓核心不抓细节
