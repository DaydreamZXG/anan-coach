- id: mc_yjtk_hengxian_wanzhengxing
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/语句填空/横线位置判断
  title: 语句填空-横线完整性判断
  recognition: 语句填空题,横线位于句中或句首,需判断横线所在句子是否完整。
  applicability:
    include:
    - 横线在中间、句子未以句号结尾的题
    - 需按文段结构(问题/对策)填句的题
    exclude:
    - 横线句是完整独立句、只考前后呼应的题
  method_steps:
  - 判断横线完整性:横线所在句子只要不以句号结尾就叫'不完整'
  - 横线不完整时,把横线所在整个句子当成整体理解,不能只看横线本身
  - 划分文段结构不能只看标点:逗号不等于分界,要按语义划分(如'公务员考试很难,所以我们应该好好备考'中'很难'是问题、后半是对策)
  error_signatures:
  - code: punctuation_only
    description: 仅凭逗号句号划分文段结构导致误判
  - code: isolated_blank
    description: 只看横线局部,忽略横线所在整句的意思
  fix_action: 做8道语句填空题,先判断横线完整度再填句,并标出每句的结构角色
  time_budget_sec: 60
  accuracy_rule: ≥80%
  pitfall: '''语句填空的标点符号不重要''是从文段结构角度说的:结构划分与标点没有必然关系,判断横线完整与否却要看句子是否以句号结尾——两个问题不矛盾。'
