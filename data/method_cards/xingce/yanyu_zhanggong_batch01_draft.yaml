    - 无关联词、纯靠时间线/因果推理的题(仍需排除法)
  method_steps:
  - 从选项差入手,先看首句候选,排除不适合做首句的句子
  - 用关联词找'可能紧密相连'的候选:看到'但是'往前看找可能的配对——关联词是寻找线索,不是锁定结果
  - 配套关联词(虽然…但是)只证明两句可能挨着,还要检查其他句子是否也能与'但是'句构成合理逻辑
  - 排序靠排除法:必须证明其他选项不成立,不能仅凭关联词就锁定
  error_signatures:
  - code: lock_paired_connective
    description: 见'虽然…但是'配套就断定两句必挨着
  - code: ignore_other_candidate
    description: 忽略其他句子也能与'但是'句构成紧密相连
  - code: assume_necessity
    description: 把关联词的可能性当成必然性
  fix_action: 做8道语句排序题,每题写出排除依据(首句特征/关联词候选/内容逻辑)
  time_budget_sec: 65
  accuracy_rule: ≥75%
  pitfall: 关联词提供'可能性'不是'必然性':⑤'我吃了很多'和⑥'我(虽)吃了很多不饿'都能接④'但是我饿了',配套关联词无法排除⑤④的可能。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
