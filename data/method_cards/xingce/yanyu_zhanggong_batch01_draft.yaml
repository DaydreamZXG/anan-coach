- id: mc_ljtk_zonggang_duibi_zhuoyou
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/解题总纲
  title: 逻辑填空-文段意思为王+对比择优
  recognition: 出现横线挖空、四个词语选项的逻辑填空题。
  applicability:
    include:
    - 所有逻辑填空题
    - 多空题中某空选项能直接排除三个错误项时
    exclude:
    - 需要概括全篇主旨的中心理解题
  method_steps:
  - 通读文段,弄清文段整体意思与横线处含义,抓句子内部逻辑关系(转折/因果/并列)与提示词,不看选项先想横线要什么词
  - 看一个空做一个空,先按'意思正确'排除意思错误的词,再从选项差异大的空入手
  - 剩余近义词再从搭配对象/程度轻重/感情色彩/使用语境等角度对比择优
  - 用能确定的空去验证不确定的空,不纠结于单空复杂辨析
  error_signatures:
  - code: blind_feeling
    description: 不分析文段逻辑凭语感选词
  - code: partial_analysis
    description: 只看一个空就选,忽视其他空逻辑矛盾(如'共享'与'差异'矛盾)
  - code: sacrifice_meaning
    description: 为求搭配合理牺牲意思正确
  - code: single_word_focus
    description: 只盯着某个词忽略文段整体氛围(积极/消极、程度轻重)
  fix_action: 做15道逻辑填空真题,每道限时60秒,每题写清每个空排除的依据
  time_budget_sec: 60
