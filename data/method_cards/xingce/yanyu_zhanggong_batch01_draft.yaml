- id: mc_yanyu_duice_youxian
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/中心理解/对策文段
  title: 中心理解-对策文段(对策优先)
  recognition: 文段出现对策标志词("应该/需要/必须/势在必行")或反面论证/提出问题,问"意在强调"——对策类文段,优选对策
  applicability:
    include:
    - 直接提对策(有"应该/需要/必须"等标志词,最高频考法)
    - 反面提对策("如果不…则…"→将错误做法反过来即对策)
    - 文段只提问题无对策(优先选针对性对策,无好对策则选概括问题项)
    exclude:
    - 文段既无问题也无对策(非对策类文段,不选对策)
    - 选项对策无针对性或无法解决问题(如问题在"执法权限"却给"健全法律")
    - 细节判断题("只有…才"可能表绝对,不当作对策)
  method_steps:
  - 识别对策:能表达"做/行动"的词(应该/需要/势在必行)或能解决当前问题的做法都是对策
  - 正面提对策直接找;反面提对策则把错误做法反过来(如"互相指责、争论是错误且缺乏远见的"→"应用正确态度与方法面对")
  - 只提问题无对策时:优选能针对性解决问题的对策;若选项无合适对策则退而求其次选概括问题的选项
  - 对策与问题一体两面,纠结时从问题反推对策,验证选项针对性(如执法权限问题→精准赋权)
  error_signatures:
  - code: irrelevant_countermeasure
    description: 选无关对策,对策未针对核心问题,如问题在"保护缺位"却选"加强宣传"
  - code: reverse_negative_wrong
    description: 反面论证不会转正,未把假设的错误做法反过来
  - code: blind_pick_countermeasure
    description: 非对策类文段也强行选对策,如没生病却建议去医院
  - code: problem_over_countermeasure
    description: 有针对性对策却不选,反而去选问题描述项
  fix_action: 做12道对策类真题,每题先标注文段的对策标志词/问题所在再选,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥80%
  pitfall: 在言语中心理解中"必要条件=对策=只有…才=要"三者全等(仅限该题型),但细节判断题中"只有…才"可能表绝对;对策必须针对核心问题,对策对象不对比没有对策更糟
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
