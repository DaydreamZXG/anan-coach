- id: mc_yanyu_duice_xuanze
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/中心理解/对策选择
  title: 中心理解-对策选择原则(内容>形式)
  recognition: 多个对策选项都"像"答案时,用"内容(主题词)>形式(对策标志词)"取舍,并识别不该选对策的情形
  applicability:
    include:
    - 多个选项都含对策标志词、纠结时
    - 意图判断题/标题题中的对策选择
    - 文段有问题但选项对策不靠谱时
    exclude:
    - 文段中心句本身不是对策时
    - 细节判断题
    - 接语选择题(不存在"优选对策",谁衔接紧密选谁)
  method_steps:
  - 先验证选项是否含文段核心内容(主题词):内容正确是第一位的,即使形式上不是对策(如"努力对我们很重要"没有"应该"也可选)
  - 内容都正确时,再优先形式上是对策的选项(如"亟待进一步深入研究"优于"研究领域广阔")
  - 识别"不选对策"两种情形:①文段无问题无对策;②选项对策无针对性或无法解决问题(如"新农人"题"补短板"无中生有)
  - 纠结时对比选项找差异点,回文段验证差异点匹配度
  error_signatures:
  - code: form_over_content
    description: 选有"要/应该"但缺核心主题词的选项,如C项"法治建设"缺"公平正义"而选错
  - code: countermeasure_no_target
    description: 对策无针对性,乱提对策,如问题在执法管辖却选"健全法律"
  - code: option_diff_ignored
    description: 剩余两选项纠结时没对比差异点,如"传承人"是否出现在选项里
  fix_action: 做8道意图判断题,每题标注各选项的"内容(主题词)"和"形式(对策词)"再择优,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥80%
  pitfall: 对策不万能——看到对策就选是误区;文段有问题但选项无好对策时果断选问题本身,但"先看对策"的做题思路不能变
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
  validation:
    tested_count: 0
    passed_count: 0
    sample_question_ids: []
    reviewer: null
    reviewed_at: null
