- id: mc_yanyu_zhuanzhe
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/中心理解/转折文段
  title: 中心理解-转折文段
  recognition: 文段出现"虽然…但是/然而/不过/却/其实/事实上/实际上",考点是转折后是重点(但"事实上"不必然表转折)
  applicability:
    include:
    - 有"但/然而/不过/却"等转折词
    - 有"其实/事实上/实际上"且与前文构成矛盾关系时
    - 转折后引出新话题/新结论时
    exclude:
    - '"事实上/实际上"只是引导事实、前后不矛盾时(如"都说老王是好人,实际上他确实如此")'
    - 结论词(因此/所以)文段
    - 无转折关系的并列文段
  method_steps:
  - 站在全文整体判断转折关系,不能只看某句有"但是"就认定其后是重点,转折是句与句之间的整体关系
  - 判断"其实/事实上/实际上":只有引导的事实与前文构成矛盾关系才表转折,否则可能是举例论证(如用事实证明对策重要性)
  - 转折文段答案两种形式:否定转折前观点 / 直接阐述转折后内容;若两选项都看似正确,优先选表述更明确直接的(阐述后文)
  - 出题人通常不会同时给两个完美选项,会让其一有明显瑕疵(主题词改/逻辑不符)供排除
  error_signatures:
  - code: false_zhuanzhe
    description: 看到"事实上"就断定转折,忽略前后一致时它只是陈述事实或举例论证
  - code: before_zhuanzhe_selected
    description: 选转折前内容,如饮酒题选"长期饮酒危害"而非转折后的偶尔喝酒也有害
  - code: negation_not_mentioned
    description: 答案说"纠正人们的错误认识"但文段只是"不知道",属于无中生有
  fix_action: 做8道转折文段真题,标出转折词并判断"事实上/实际上"是否真表转折,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥80%
  pitfall: '"其实/事实上/实际上"不是强转折词,必须先分析前后内容是否矛盾;转折关系是句子与句子之间的整体关系,不能只看单句'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
