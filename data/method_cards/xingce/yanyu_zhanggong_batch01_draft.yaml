- id: mc_yanyu_juzi_tiankong
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/语句表达/语句填空
  title: 语句填空-话题一致定位
  recognition: 问法"填入横线部分最恰当的一项是",横线位于开头/中间/结尾
  applicability:
    include:
    - 横线在结尾:无问题则总结前文,前文有问题则提出对策(分总结构)
    - 横线在开头:先看有无能概括全文的选项,有则优先;没有则选话题引入
    - 横线在中间:承上启下最优,次选侧重承上或侧重启下
    exclude:
    - 不能凭语感选读起来最顺的选项(语感陷阱)
    - 横线为分句(逗号结尾)时不能只看横线本身,要看横线所在整句话
  method_steps:
  - 抓核心话题(与中心理解找主题词方法一致),填入句子必须话题一致
  - 按横线位置定功能:结尾→总结/对策,开头→概括/引入,中间→承上启下
  - 中间位置优先选"上下兼顾"的选项(同时呼应前后文核心概念)
  error_signatures:
  - code: sense_vs_logic
    description: 凭语感选最顺的选项,忽略话题一致
  - code: only_after_text
    description: 只看后文(如只盯举例就选"满足需求",漏掉前文"质量"问题)
  - code: no_bridge
    description: 中间横线选了只承上或只启下的选项,而非上下兼顾
  - code: topic_wrong
    description: 话题错误比话题缺失更严重——优先保话题一致(选"立法"而非"治国理政")
  fix_action: 做15道语句填空真题,每题标出"横线位置+核心话题"再选
  time_budget_sec: 55
  accuracy_rule: 正确率≥80%
