- id: mc_yanyu_luoji_yujing
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/语境分析
  title: 逻辑填空-文段语境分析(中心理解化)
  recognition: 逻辑填空(成语/实词选空),核心是理解文段意思,不能凭语感或固定搭配选词
  applicability:
    include:
    - 逻辑填空所有题目(语境优先,文段意思是灵魂)
    - 多空题找突破口
    - 选项纠结时回归文段中心/主题
    exclude:
    - 只看词义、只背词典
    - 凭语感选读起来顺的选项
    - 只盯局部不看整体理解
  method_steps:
  - 整体语境优先:感受整个文段传递的感觉和氛围(积极/消极、程度轻重),再选词(如积极优美的语境排除"徘徊""闯入"等消极词)
  - 句内呼应:横线后紧跟逗号时,逗号后内容往往是解题线索(如"堪称奇迹"→选程度同样重的"巧夺天工")
  - 中心理解化:重视首句完整语句(可能提纲挈领)和文段主题词,优先选符合主题本质的选项(如"水到渠成"的集大成者题)
  - 抓关键关系(转折/因果/并列/解释)找提示词,从提示信息明确的空入手,如"时多时少"对应"波动性"
  error_signatures:
  - code: gut_language
    description: 凭语感选词,忽略文段逻辑关系,如"跨越鸿沟"顺口但第一空"共享"逻辑矛盾
  - code: local_only
    description: 只盯横线前后,忽略全文结构与主题,如水资源题只看"尺子"选"精确"而忽略制度本质"公平"
  - code: feeling_color_mismatch
    description: 感情色彩不符,积极语境选"徘徊/闯入"等消极词
  - code: degree_mismatch
    description: 程度轻重不匹配,语境极重却选程度轻的词
  fix_action: 做15道逻辑填空题,每题先概括文段语境(情感基调+逻辑关系)再选词,限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 正确率≥80%
  pitfall: 逻辑填空做不好99%是词语积累不到位;语境分析与词语积累必须并重,采用"看一个空做一个空",卡住就跳过不要纠结一个空
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
