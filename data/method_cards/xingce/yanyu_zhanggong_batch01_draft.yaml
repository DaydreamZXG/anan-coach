- id: mc_yanyu_jieyu
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/语句表达/接语选择
  title: 接语选择-核心话题衔接
  recognition: 问"作者接下来最可能讲述的是/这是一篇文章的开头(引言/序言/前言),这篇文章最可能介绍的是"
  applicability:
    include:
    - 问"接下来最可能讲述"
    - 问"接下来最不可能讲述"(反向思考)
    - 文段尾句引出重点话题或提出问题
    exclude:
    - 语句填空题(选句)
    - 中心理解题(问主旨)
    - 文段已详细论述过的内容(不会重复讲述)
  method_steps:
  - 先做一遍中心理解,找出文段核心话题(重点关注尾句/转折后引出的重点)
  - 按优先级排除:①不涉及核心话题的排除;②前文已具体论述过的排除;③衔接不紧密/跳跃的排除(三步有先后顺序)
  - 只有一个选项含核心话题时直接锁定,无需考虑是否与上文重复
  - 问"最不可能":优先排除话题不一致的(离题最严重),其次排除已论述过的;尾句"也"字并列两个问题时,下文先解决第一个问题
  error_signatures:
  - code: old_topic_repeat
    description: 选文段已详细讲过的内容,如"百姓的关联性"第一句已讲
  - code: topic_off
    description: 选项偏离核心话题,如"产业链"题选"产业链"而非"产业链现代化"
  - code: second_problem_ahead
    description: 尾句"也"字并列两个问题,应先解决第一个问题(图像重建)而非第二个(数据获取)
  fix_action: 做10道接语选择题,先写核心话题再按三优先级排除,限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 正确率≥85%(最简单题型)
  pitfall: 接语选择不存在"优选对策"——接下来可能分析问题也可能提对策,谁衔接更紧密选谁;核心话题优先于重复问题(只有两选项以上含核心话题才考虑重复)
