- id: mc_yanyu_luoji_bianxi
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/词义辨析
  title: 逻辑填空-词语辨析角度(词义/搭配/程度/色彩)
  recognition: 多词意思相近需要辨析时,从基本释义、搭配对象、程度轻重、感情色彩、使用语境、词义侧重多角度区分
  applicability:
    include:
    - 近义成语/实词辨析
    - 固定搭配辨析(摘取桂冠/弥合鸿沟/凝聚共识)
    - 形近/音近词辨析(遏制vs遏止、保持vs维持)
    exclude:
    - 意思正确性明显不符时(意思为王优先)
    - 广东等地方考试考"使用的合理性/规范性"时(此时看规范用法)
    - 词典解释互相套用的词(光背词典没用)
  method_steps:
  - 基本释义优先:意思正确是基本条件,意思对即使搭配不够常见也可选;不能为追求搭配合理牺牲意思正确(如"消磨文化活力")
  - 按辨析角度区分:搭配对象(人/物、真假,如骇人听闻搭真事/耸人听闻搭假事)、程度轻重(息息相关<休戚相关<唇亡齿寒)、感情色彩(蔚然成风褒/风靡一时中/大行其道贬)、使用语境(是否在现场)、词义侧重(拆字)
  - 词语区别是相对的:选项与题干词"沾边"(有共性)即可保留,不能因细微区别直接排除(如"居安思危"想法vs"未雨绸缪"做法,核心共性是忧患意识)
  - 纠结时相信热词/宠词/常见用法(应运而生、塑造、凝聚、诱发疾病/激发积极)
  - 多空题由松到紧:先放宽条件保留沾边选项,再逐步收紧;从选项差异大的空、文段提示明确的空、成语入手
  error_signatures:
  - code: scope_mismatch
    description: 搭配对象错误,如"淹没"不能用于土壤,"超然物外"形容人不能形容岛屿
  - code: degree_off
    description: 程度轻重不匹配,不确定轻重时选程度轻、适用范围广的"息息相关"更保险
  - code: dictionary_reliance
    description: 死记词典解释,词与词互相套用无法区分细微差别
  - code: meaning_sacrificed
    description: 为追求搭配合理牺牲意思正确,违背"意思为王"原则
  fix_action: 建错题本,每道错词记"词义+搭配对象+程度轻重+感情色彩+使用语境"五要素;刷真题积累宠词(应运而生/凝聚/塑造/彰显),限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 正确率≥80%
  pitfall: 词义侧重点靠"拆字"猜:遏制(制约,程度轻)vs遏止(停止,程度重);保持(从容游刃)vs维持(艰难咬牙)——官方媒体用词讲究微言大义
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
