- id: mc_yanyu_paixu_xiansuo
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/语句表达/语句排序/文段线索
  title: 语句排序-文段线索解题法
  recognition: 若干句子重新排列语序,文段线索多(指代词/关联词/举例/时间词/下定义)时,从文段线索入手
  applicability:
    include:
    - 文段有下定义("XX是XX/称为/定义为/指的是")
    - 有指代词(这/它/其)需要找指代对象
    - 有转折/并列/举例关联词
    - 剩余选项3个及以上
    exclude:
    - 剩余2个选项时(看选项差异更高效)
    - 文段线索不明显时
    - 纠结倒序可能性(排序题基本不会倒序,不要因噎废食)
  method_steps:
  - 下定义线索:下定义引出话题的句子(含"称为/定义为/指的是")必须在该话题所有提及句之前
  - 指代词线索:含"这/那/它/其/这些/他们"等指代不清的句子向前找指代对象形成捆绑,且不能做首句(指代清楚可做首句)
  - 关联词线索:转折前后语义相反且话题相关;并列话题强相关;举例(比如/例如/就像)通常跟在观点或解释之后
  - 时间线索:按时间先后排列(如"20世纪"与"宋代"、"长期以来"与"目前")
  error_signatures:
  - code: definition_after_topic
    description: 下定义句排在提到该概念的句子之后
  - code: pronoun_misread
    description: 指代词指代对象找错,没有向前文寻找(应向前找而非向后)
  - code: example_first
    description: 举例句放首句,例子通常跟在观点后
  - code: time_order_wrong
    description: 时间顺序颠倒,如"长期以来"(过去)排在"目前"(现在)之后
  fix_action: 做10道语句排序题,先标注线索(下定义/指代词/关联词/时间)再排列,限时70秒/题
  time_budget_sec: 70
  accuracy_rule: 正确率≥70%(排序题难度较大,允许较低正确率)
  pitfall: 关联词是"可能性"不是"必然性"——配套关联词(虽然…但是)不必然紧密相连,排序靠排除法,必须证明其他选项不成立才能锁定
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
