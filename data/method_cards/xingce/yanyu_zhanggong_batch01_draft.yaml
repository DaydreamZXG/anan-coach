  title: 逻辑填空-干扰项识别(文段有对应)
  recognition: 某个选项与文段具体细节词形成对应,诱使你选它,但该细节并非横线所需核心。
  applicability:
    include:
    - 选项与文段某词'撞词'的题
    - 对策类逻辑填空
    exclude:
    - 无明显细节干扰的简单对应题
  method_steps:
  - 抓住文段真正强调的核心内容(主题/问题/对策),不看选项先定核心
  - 识别干扰项:出题人常利用文段非重点内容(具体细节、次要信息)与选项形成表面对应
  - 对策类题:对策必须针对文段核心问题,不能针对次要特征(如'知名度虽然有',问题不在知名度)
  - 不能仅凭某词与文段对应就选,横线处意思优先
