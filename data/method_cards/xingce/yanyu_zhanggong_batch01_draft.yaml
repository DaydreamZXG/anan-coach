  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/空际关联
  title: 逻辑填空-空际关联(多空关系)
  recognition: 多空逻辑填空,横线之间可能存在相近/相反关系(转折/并列/祈使句文段)
  applicability:
    include:
    - 多空题(2-3空)
    - 转折文段(虽然…但是,前后空常呈反义)
    - 并列文段(同向并列近义/对比并列反义)
    - 祈使句/对策文段("要A…不能B"反义结构)
    exclude:
    - 无空际关联的题(需结合具体语境判断,不是所有题都有)
    - 单空题
    - 顿号引导的近义并列(允许语义重复,如"墨守成规、循规蹈矩")
  method_steps:
  - 先做常规横线-文段对应分析
  - 再检查多空间语义关系:转折前后相反、同向并列相近、对比并列相反("等量齐观"与"因地制宜"反义对应)
  - 注意双重否定变肯定:虽…但结构中前句含否定词"不"时两空实际相近(如"虽然不A,但不B"→A≈B)
  - 综合两方面验证选项合理性
  error_signatures:
  - code: negation_logic_miss
    description: 忽略双重否定变肯定,如"虽然不A但不B"误判两空为相反关系
  - code: parallel_direction_wrong
    description: 把同向并列当反义,或把反义并列当近义
  - code: single_empty_only
    description: 只看单空合理,忽略空际逻辑约束(如防空导弹两空都需含"单独"义)
  fix_action: 做10道多空逻辑填空题,先标出句间关系(转折/并列/祈使)再选,限时55秒/题
