- id: mc_yanyu_xuanxiang_shezhi
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/选项设置
  title: 逻辑填空-出题人选项设置
  recognition: 多空逻辑填空难以抉择时,从出题人设置选项的角度反推
  applicability:
    include:
    - 选项可分组(三一/二二/一一一)时
    - 两个选项纠结且其中一个明显"奇怪"时(一正一邪/猪队友)
    - 选项语义可拆分组合时
    exclude:
    - 这些技巧不能代替正常做题(语境分析+词语辨析是正路),仅在极度纠结时辅助
    - 选项分组规律是概率不绝对(一一一模式:选项没设陷阱,重点找文段内部逻辑线索)
  method_steps:
  - 干扰项设置原理:文段有对应(干扰项对应非重点细节)或选项有共性(外形/意义/性质相似)——选答案必须抓核心而非某个词对应
  - 选项分组:三一模式答案多在"三"中(但需文段验证);二二模式辨析组内差异;两个长得像的选项中答案大概率在其中
  - 一正一邪(猪队友):纠结的两个选项中,若另一个明显错误的选项与其中一个字形/读音相似,该错误项"暴露"正确答案
  - 语义丰富原则:纠结时选语义更丰富的词(残存=残留+保存)
  error_signatures:
  - code: detail_correspondence_trap
    description: 干扰项与文段某细节对应(如"悠长的夜晚"→"夜以继日")却非核心
  - code: weird_option_misread
    description: 没利用"猪队友"暴露的正确答案(明显奇怪的词指向与之结构相似的答案)
  - code: overrely_on_technique
    description: 一开始就依赖技巧,解题思路走偏
  - code: ignore_subject
    description: 忽略主语主体(一以贯之配"我",一枝独秀需主语与技术本身可比)
  fix_action: 做10道近年国考逻辑填空题,每题复盘"干扰项为何诱人+正确答案被什么暴露"
