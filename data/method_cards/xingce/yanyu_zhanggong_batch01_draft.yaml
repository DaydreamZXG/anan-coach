    - 不存在空际关联的题(需先结合语境判断)
  method_steps:
  - 先完成常规的横线-文段对应分析
  - 检查多空间语义关联:转折前后空常反义,并列同向空相近,'要…不能…'结构反义,两空为完全同义组合的优先
