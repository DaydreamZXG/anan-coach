  tag_path: 言语理解与表达/细节判断/反推法
  title: 细节判断-反推法验证无中生有
  recognition: 细节判断/细节查找题,需判断选项表述是否有原文依据;尤其问'下列说法与文段不符的是'。
  applicability:
    include:
    - 选非题(选出不符合/错误的选项)
    - 选项较长的细节判断题
    exclude:
    - 直接能在原文找到原句的简单对应题
  method_steps:
  - 假设选项为真,反推文段应如何写
  - 与原文对比,判断选项是否无中生有或偷换概念
  - 选非题可找'格格不入'的选项:与其他三个选项方向(肯定/否定、范围)明显不同的那个优先检查
  error_signatures:
  - code: read_invented
    description: 选了原文根本没写、纯属脑补的选项
  - code: concept_switch
    description: 把原文的表述偷换成另一个概念仍误判正确
  fix_action: 做8道细节判断题,每题在原文标出与选项对应的句子,无对应的标记'无中生有'
  time_budget_sec: 55
  accuracy_rule: ≥80%
  pitfall: 原文提及不代表选项正确:干扰项常把原文有的词重新排列组合成原文没说的意思,反推法专治这类无中生有。
