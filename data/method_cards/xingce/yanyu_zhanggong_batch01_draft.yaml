- id: mc_ljtk_xuanxiang_fenzu
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/选项设置规律
  title: 逻辑填空-选项分组思维(出题人角度)
  recognition: 在两个或三个选项间极度纠结、常规方法无法区分时的辅助判断技巧。
  applicability:
    include:
    - 纠结在2-3个选项时
    - 选项分布有明显分组特征时
    exclude:
    - 未纠结、正常按语境选词的题(技巧不能替代正常做题)
  method_steps:
  - 观察四个选项分布:一一一(差异大,重点找文段内部逻辑线索)/三一(三个同类+一个格格不入)/二二(两两一组)/二一一
  - 一三模式:格格不入的'一'常优先排除,答案多在'三'中但必须结合文段验证
  - 二一一'一正一邪':两个相似选项中有一个明显错误(猪队友)时,它常暴露另一个正确答案(如'关照'奇怪则答案可能是'观照')
  - 语义丰富原则:纠结时优先语义更丰富的词(残存=残留+保存,感悟=感受+领悟)
  error_signatures:
  - code: overrely_tricks
    description: 一开始就用技巧代替语境分析+词语辨析
  - code: skip_context_verify
    description: 分组后不结合文段验证直接选
  - code: absolute_grouping
    description: 把分组规律当绝对真理,如见猪队友必反推
  fix_action: 做10道逻辑填空题,先正常做完,再复盘每道题的选项分布规律
  time_budget_sec: 60
  accuracy_rule: ≥75%
  pitfall: 这些技巧只是考场上纠结时的辅助取舍,不是万能公式;老师slogan:路走对了才不怕遥远,切勿一开始就依赖技巧。
