- id: mc_yanyu_yinguo
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/中心理解/因果文段
  title: 中心理解-因果文段(结论词)
  recognition: 文段出现"因此/所以/故而/可见/总之/这意味着"等结论词,结论之后是重点
  applicability:
    include:
    - 尾句有结论词(尾句结论作中心句概率80%以上)
    - 大量原因/意义论述的因果文段
    - 过程复杂的文段(层层递进,首尾兼顾抓结果)
    exclude:
    - 转折文段
    - 需要结合上下文才能判断褒贬/范围的尾句(不能只看尾句)
    - 纯对策文段
  method_steps:
  - 定位结论词,结论之后是重点、结论之前(原因/过程)是铺垫
  - 答案常为"果+因"结构:核心必须体现"果"(结论/对策),原因可带可不带(如"废墟何以是美的"重点在"废墟是美的")
  - 过程复杂时层层递进抓结果:首尾兼顾,忽略中间过程(如"好成绩→好心态→好身体→好休息→好睡眠"核心是"好成绩需要好睡眠")
  - 正常情况即使尾句有结论词也要结合上下文(前文核心话题/褒贬判断),只有完全看不懂才可退而只看尾句
  error_signatures:
  - code: cause_as_answer
    description: 选原因/过程而非结果,如蜜蜂题选"花蜜与咖啡因"而非"蜜蜂离不开花蜜"
  - code: tail_only_ignore_context
    description: 只看尾句结论忽略前文核心话题,如"脑衰老"题尾句无"脑衰老"三字就误选
  - code: middle_process_selected
    description: 层层递进题选中间过程,如西风带题选"槽和脊如何波动"而非尾句结果
  fix_action: 做10道因果文段真题,每题标出结论词和"果",再判断选项是否体现"果",限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥80%
  pitfall: 因果文段有反套路设计:看到"原因"别直接当非重点排除——正确答案常以"结论+原因"形式出现,但选它的根本理由是体现了"果"
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
