- id: mc_yanyu_binglie_fanyi
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/并列关系/反义并列
  title: 逻辑填空-反义并列与相同句式
  recognition: 出现"不是...而是...""多一些...少一些...""既不能...也不能...""要...不要..."等反义引导词,或排比式相同句式("讲...不讲...""代表...代表...")
  applicability:
    include:
    - 由"并非/不是...而是...""要...不要..."等引导的反义并列
    - 相同句式(排比)构成的并列,需结合全文判断近义或反义
    - 空格处需与对应词构成相反相对的语义
    exclude:
    - 顿号/"和"引导的近义并列
    - 无任何并列标志、靠语境推断的单空题
  method_steps:
  - 圈出反义引导词(不是...而是...等),确定空格须与对应词意思相反
  - 若为相同句式排比,先看全文感情基调:感情一致则选近义词,文段有明显对比则选反义词
  - 选词时注意感情色彩与全文一致:中性/学术语境选含中性义的选项(如"按图索骥"),排除贬义过强项
  - 多空题用重复句式逐空定位(如"讲X不讲Y"式,第一空对应"无自主思考"、第二空对应"无病呻吟"),再整体验证
  error_signatures:
  - code: reverse_direction_miss
    description: 忽略"并非...而是..."结构,选了与对照词同向(如与"意外之喜"同表偶然)的选项
  - code: idiom_polarity_only
    description: 只记成语贬义,忽略多义成语的中性义(如"按图索骥"亦可表依计划行事)
  - code: parallel_forcing_progression
    description: 在相同句式并列下强加递进关系,或只看局部句式忽略全文感情基调
  fix_action: 做8道反义并列真题,每题圈出反义引导词并标出对照词,再选相反相对的词
  time_budget_sec: 60
  accuracy_rule: 反义并列题正确率≥80%
  pitfall: 反义并列考频低于近义并列但稳定出现;最大的坑是成语多义性——同一个词(如"按图索骥""守株待兔")既有消极义也有中性义,要结合动作场景(主动研究≠被动等待)和感情色彩选,不能只按字面惯性选
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
