- id: mc_yanyu_ciyi_bianxi
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/词义辨析
  title: 逻辑填空-词语辨析多角度
  recognition: 多个选项词义相近、难以取舍时,从多角度辨析
  applicability:
    include:
    - 搭配对象(人/物、真假):骇人听闻配真事,耸人听闻配虚假
    - 程度轻重:息息相关<休戚相关<唇亡齿寒
    - 感情色彩:蔚然成风褒/风靡一时中性/大行其道贬
    - 使用语境:取长补短须明说长短,水乳交融配党群关系
    - 词义侧重:遏"制"轻 vs 遏"止"重;保持从容 vs 维持艰难
    exclude:
    - 不能只背词典释义(词典解释互相套用,无法区分细微差别)
    - 词语区别是相对的,死记"某个词必须配某对象"会生搬硬套
  method_steps:
  - 基本释义优先满足(意思正确性>使用合理性)
  - 词义相近时按顺序辨析:搭配对象→程度轻重→感情色彩→使用语境→词义侧重
  - 形近词通过"不一样的字"猜侧重点(拆字组词法:遏"止"→停止更重)
  error_signatures:
  - code: object_mismatch
    description: 搭配对象不符(眼花缭乱通常以人为主体,直接修饰"世界变局"不当)
  - code: degree_mismatch
    description: 程度轻重不符(不确定轻重时误选"休戚相关",应选范围广更保险的"息息相关")
  - code: color_mismatch
    description: 感情色彩不符(消极语境选了褒义词)
  - code: fixed_collocation_unknown
    description: 固定搭配不熟(摘取桂冠/弥合鸿沟/整合资源/凝聚共识)
  fix_action: 用错题本积累近义词辨析(真题语境+官方媒体用词),做15道词义辨析题
