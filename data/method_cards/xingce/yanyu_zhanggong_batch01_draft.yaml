- id: mc_yanyu_yuju_tiankong
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/语句表达/语句填空
  title: 语句填空-话题一致与横线位置
  recognition: 问"填入横线部分最恰当的一项是",核心原则是"话题一致、衔接得当"(本质是中心理解题)
  applicability:
    include:
    - 横线在结尾(总结前文或提对策)
    - 横线在开头(概括后文或话题引入)
    - 横线在中间(承上启下)
    exclude:
    - 逻辑填空题(选词)
    - 接语选择题(问接下来)
    - 凭语感判断的题(语感陷阱)
  method_steps:
  - 横线在结尾:前文有问题则提对策,无问题则总结前文;承担功能的是横线所在的整句而非横线本身
  - 横线在开头:优先选能概括后文全文的选项,无则退而求其次选能引出话题的(如"我想喝一杯奶茶"引出"喝东西"话题)
  - 横线在中间:最优是"承上启下"(既承接上文又引出下文),次选侧重承上或侧重启下
  - 抓"反复说"的核心词:对策要点多时,后文反复出现的词就是核心话题(如"循环"在"一是…二是…"中都出现)
  error_signatures:
  - code: topic_mismatch
    description: 话题不一致,选项话题与文段核心话题无关,如立法题选"治国理政"而非"立法"
  - code: one_side_only
    description: 横线在中间只呼应一侧,如只看后文举例而忽略横线前的"质量"问题
  - code: gut_feeling_trap
    description: 凭语感选读起来最顺的选项,落入语感陷阱
  - code: topic_wrong_vs_missing
    description: 选话题错误的选项而放弃话题缺失但正确的选项,话题错比话题缺更严重
  fix_action: 做12道语句填空题,先判横线位置再按功能选,每题标出文段核心话题,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥80%
  pitfall: 横线不完整(逗号结尾/缺主语宾语)时不能只看横线本身,把横线所在整句当整体理解核心话题;不要被"即""两者"等字面词误导
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
