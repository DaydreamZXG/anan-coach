  recognition: 三空/多空逻辑填空,纠结从哪个空入手
  applicability:
    include:
    - 选项差异大的空(意思差别明显易排除)
    - 文段提示信息明确的空(有转折/并列/解释关联)
    - 混搭填空优先从成语入手(成语辨析角度多相对容易)
    exclude:
    - 不能从意思相近、线索模糊的空入手(浪费时间)
    - 宠词/热词只是纠结时的辅助,不能替代正常语境分析
  method_steps:
  - 从选项差异最大或文段线索最明确的空入手
  - 用确定信息解决不确定信息:一个空能排除三个错误选项就直接锁定
  - 纠结时相信"宠词"(高频正确答案:应运而生/塑造/重塑/凝聚/激发配积极/诱发配疾病)、"热词"和常见用法
