  title: 逻辑填空-空际关联与整体理解
  recognition: 多空逻辑填空,各空之间或与文段中心存在逻辑关联
  applicability:
    include:
    - 转折文段前后空反义;"虽然...但..."前句含否定词时双重否定表肯定,两空实际同义
    - 并列文段同向并列空义近、对比并列空义反
    - 祈使句对策段"要A...不能B"反义结构
    - 首句是完整语句、文段为总分结构时
    exclude:
    - 并非所有题都存在空际关联,需结合具体语境判断
    - 首句提示属于概率事件,不能作为唯一判断依据
  method_steps:
  - 先完成常规横线-文段对应分析
  - 检查多空之间语义关联(相近/相反):转折/并列/对策祈使句
  - 重视完整语句(尤其首句,可能提纲挈领)+主题词,优先选与主题对应的选项
  error_signatures:
  - code: ignore_double_negative
    description: 忽略"虽然...但..."前句含否定词导致双重否定表肯定(两空实为同义近义)
  - code: fragment_understanding
    description: 只盯横线前后文,忽略全文结构(理解碎片化)
  - code: miss_antonym_pair
    description: 没看出空际反义对应(如"等量齐观"与"因地制宜"形成反义)
