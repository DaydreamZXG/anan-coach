- id: mc_yanyu_zhongxin_lizi
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/中心理解/例子处理
  title: 中心理解-例子与解释说明的处理
  recognition: 文段出现"比如/例如"或对观点的具体展开,需区分例子/观点/对策,避免误选例子内容
  applicability:
    include:
    - 文段出现"比如/例如"等明显举例标志
    - 观点+解释说明的总分结构
    - 观点拿捏不定时用例子反向推断观点侧重点
    exclude:
    - 通篇都在讲某个具体对象的文段(该对象是论述主体,不是例子,如"上海""长三角")
    - 带对策表述的具体对象(如"古典名画需要跨界融合""京津冀要发展高精尖",是对策不是例子)
    - 需要精确理解例子本身的细节判断题
  method_steps:
  - 识别举例标志(比如/例如),例子内容一般不作答案可快速略过,但需判断例子到哪里结束(看内容是否转为总结或观点转换)
  - 无标志也判断例子:前后核心思想一致且是观点的具体化即为例子;越简短的句子越可能是观点,越长的越可能是解释或例子
  - 区分例子与对策:完成时态是例子(已发生),将来时态(带"需要/应该/还必须"的对策)不是例子
  - 纠结时用例子辅助理解观点:例子与观点意思一致,看例子在解释什么来确定观点侧重点
  error_signatures:
  - code: example_as_answer
    description: 把例子中的具体内容当答案,如"青绿热""人在画中游"是例子非重点
  - code: main_subject_as_example
    description: 把通篇论述对象误当例子排除,通篇讲的对象本身就是论述主体
  - code: countermeasure_as_example
    description: 把带对策表述的具体对象当例子排除,对策对象是文段核心之一
  - code: example_range_misread
    description: 看到"比如"就跳过所有内容,未判断例子到何处结束
  fix_action: 做8道含例子的中心理解真题,标出例子起止范围和观点句,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥80%
  pitfall: '"比如"后不能直接跳过所有内容,要判断例子到哪里结束——后续内容转为总结或观点转换时例子结束,否则仍在例子范围内'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
