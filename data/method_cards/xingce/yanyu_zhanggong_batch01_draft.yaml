- id: mc_yanyu_zhongxin_shouju
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/中心理解/首句话题
  title: 中心理解-首句引出核心话题
  recognition: 文段首句为引入式(下定义/背景/范畴限定),正确答案往往=后文重点内容+回扣首句引出的话题
  applicability:
    include:
    - 首句引出话题、后文围绕该话题深入讨论(最高频情况,如"线上教学"后文提"引入社会力量")
    - 国考正确答案"后文重点+回扣开头话题"规律题
    - 选项纠结时用首句话题检验是否偏离讨论范畴
    exclude:
    - 首句即提出观点/中心句的文段(此时首句本身是重点,不叫引出话题)
    - 后文完全反驳/推翻首句话题的情况(新话题更重要)
    - 后文提出并列新话题且未反驳(所有话题都重要,需全面概括)
  method_steps:
  - 判断首句是"引出话题"还是"提出观点":读完全文若观点不在首句,则首句引出的核心话题词仍很重要(它规定探讨范畴)
  - 定位后文真正重点(转折后/结论后/对策),牢记首句话题作为讨论范畴
  - 选答案时同时保留"后文重点+回扣首句话题",如"在线教育健康发展需要引入社会力量"
  - 尾句未出现主题词时,通过潜台词确认仍围绕首句话题(如县域对策未提"县域",但"疏解城市功能又助力乡村振兴"的主体就是县域)
  error_signatures:
  - code: forgot_opening_topic
    description: 只看后文重点,忽略回扣首句引出的话题,如区块链题只看后文误选"提升公信力"
  - code: first_sentence_as_view
    description: 把引出话题句当成观点句,误选首句本身内容
  - code: tail_without_theme
    description: 尾句无主题词就以为脱离主题,机械寻找关键词而非理解内在逻辑
  fix_action: 做8道"后文重点+回扣开头"型真题,标注每题的"首句话题词"和"后文重点",限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥80%
  pitfall: 新话题>老话题与首句话题重要并不矛盾:只要后文没有全面反驳首句话题,首句引出的话题仍重要(它规定了探讨范畴),需分三种情况判断
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
