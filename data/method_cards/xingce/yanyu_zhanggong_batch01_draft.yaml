- id: mc_yanyu_paixu
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/语句表达/语句排序
  title: 语句排序-线索排除法
  recognition: 问法"将以下6个句子重新排列,语序正确的一项是"
  applicability:
    include:
    - 文段含指代词、关联词、举例、时间词、下定义等明显线索时
    - 只剩两个选项时看选项差异
    exclude:
    - 不能先读文段直接排答案——必须从选项出发用排除法
    - 配套关联词(虽然...但是)只提供"可能性"非"必然性",不能仅凭它锁定紧密相连
  method_steps:
  - 看首句:排除指代不清(这/那/它/其)、关联词后半部分(但/却/而且)、明确举例(例如/比如)开头的句子
  - 线索多或剩3个以上选项→从文段找线索:下定义(XX是XX)必须在该话题句之前、指代词向前找对象、转折/并列/举例捆绑、时间先后
  - 线索不明显或剩2个选项→对比选项差异,判断某两句谁先谁后
  error_signatures:
  - code: pronoun_first
    description: 指代不明的句子放首句(如"他们"无指代对象)
  - code: wrong_define_order
    description: 下定义句(首次引出概念,"称为/定义为")放在概念已出现之后
  - code: force_bind_connector
    description: 看到配套关联词就强制捆绑(可能隔句,其他句子在内容上也能衔接)
  - code: subjective_order
    description: 凭主观语感排序,忽略选项差异这个最直接线索
  fix_action: 做15道排序题,每题先排除非首句,再标出1-2个关键捆绑线索(指代/下定义/时间)
  time_budget_sec: 70
  accuracy_rule: 正确率≥75%
