- id: mc_yanyu_zhongxin_paichu
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/中心理解/排除干扰项
  title: 中心理解-干扰项三级排除
  recognition: 已定位中心句并初步匹配选项后,用三大类干扰项特征做最终筛选
  applicability:
    include:
    - 选项数量多、表述相近难以取舍时
    - 选项看起来都对需要对比择优时
    exclude:
    - 细节判断题(干扰项类型不同:偷换/无中生有/相悖)
  method_steps:
  - 绝对排除(三大死罪):与文意直接矛盾、文段完全未提及、无关对策(问题在保护缺位对策却是加强宣传)
  - 相对排除(基本不选):缺主题词(90%排除)、非重点内容(转折前/结论前/程度词前)、片面表述
  - 次选确认:主题词适当替换但核心一致、表述笼统但无原则错误
  error_signatures:
  - code: irrelevant_countermeasure
    description: 无关对策——对策无针对性,问题在A却提B的对策
  - code: non_key_content
    description: 选项对应分述句/举例/数据/背景等非重点内容
  - code: countermeasure_effect
    description: 将对策的效果当重点(如"更好服务制造业"只是对策结果而非核心)
  fix_action: 做20道中心理解题,每道先写出该题干扰项属于哪类再选
