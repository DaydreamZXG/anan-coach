- id: mc_yanyu_luoji_jiunei
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/句内呼应
  title: 逻辑填空-句内呼应(横逗结构)
  recognition: 横线后紧跟逗号、顿号或提示词,逗号后内容往往解释/提示横线处意思
  applicability:
    include:
    - 横线+逗号结构(逗号后是解释说明)
    - 横线后有"堪称/遍布/声应气求"等提示词
    - 横线后跟"短视行为"等概念需要找对应词
    exclude:
    - 无句内线索的题
    - 需要看文段整体的题(只做局部会误判)
    - 转折/因果等跨句关系题
  method_steps:
  - 看横线后紧跟的逗号内容,它往往直接解释横线处意思(如"可以说遍布于人生的各个时段"→"广泛")
  - 前后构成解释/并列/转折关系时,选与提示语义最贴切的词(如"短视行为"→"急功近利")
  - 优先选与文段核心概念最直接最明确的选项,沾边但不精准的"顾此失彼"不如"急功近利"
  - 验证时不只验证一个空,多个空都匹配才选
  error_signatures:
  - code: loose_correspondence
    description: 选含义沾边但不精准的词,如"顾此失彼"不如"急功近利"直接对应"短视"
  - code: second_empty_miss
    description: 只看第一空就选,未验证第二空是否匹配,如"娱乐性"第一空对但第二空"敬畏感"被故意重复设陷阱
  - code: partial_hint
    description: 忽略逗号后提示,凭前半句猜词
  fix_action: 做10道句内呼应题,圈出横线后提示词再选,限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 正确率≥80%
  pitfall: 横逗结构类似语句填空,逗号后的内容几乎就是答案的"谜底";看到"两者"等词要回文段确认实际指代(如科技应用vs文物保护),避免被字面误导
