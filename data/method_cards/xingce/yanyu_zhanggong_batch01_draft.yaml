- id: mc_yanyu_xijie_shunxu
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/细节判断/做题顺序
  title: 细节判断-做题顺序与优先验证
  recognition: 问"下列说法正确/不正确(与文意相符/不符)的一项",是细节判断题,看对错而非找重点
  applicability:
    include:
    - 选是题(问"正确的是/最准确")
    - 选非题(问"不符合/未提及/无法解释")
    - 晦涩科技文段(先看选项再回文段比对)
    exclude:
    - 中心理解题(找重点)
    - 需要理解文段结构的题
    - 无选项的片段阅读
  method_steps:
  - 审题:判断选是/选非(选非题在答案处打叉防遗忘),判断选项内容文段是否提及
  - 定顺序:文段晦涩(科技说明类)先看选项再回文段比对;文段通俗(人文社科选是题)先看文段;选项短/差异大/有验证点可先看选项
  - 优先验证:选是题优先验证相对项(可能/也许/往往/之一)和符合常识项;选非题优先验证绝对项(一定/都/最/无法/最新)和对比项(高于/优于/比…更)
  - 找"特殊":关注选项中只有某个选项才有的特殊字词,快速定位原文比对
  error_signatures:
  - code: absolute_overreach
    description: 把"概念验证实验"当"已在临床验证",时间/程度偷换
  - code: comparison_error
    description: 对比项"超过三分之一"与原文"相当于三分之一"矛盾
  - code: order_wrong
    description: 难懂文段还先读文段,浪费时间
  fix_action: 做15道细节判断题,标出选是/选非和优先验证项,限时50秒/题(细节题可快速定位)
  time_budget_sec: 50
  accuracy_rule: 正确率≥85%
  pitfall: 优先验证只是提高概率、并非直接锁定答案;优先验证的选项都错时仍要回头验证其他选项,该看的文段一个都不能少
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
