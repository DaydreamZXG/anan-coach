- id: mc_yanyu_paixu_chayi
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/语句表达/语句排序/选项差异
  title: 语句排序-选项差异解题法
  recognition: 文段线索不明显或只剩两个选项时,从选项差异(首句/尾句/某两句子先后)入手,用排除法
  applicability:
    include:
    - 剩余两个选项(差异点清晰,效率最高)
    - 文段线索不明显(缺关联词/指代词)
    - 需要快速排除首句时
    exclude:
    - 剩余3个及以上选项(差异太多显杂乱,先看文段线索)
    - 文段线索丰富时(优先文段线索法)
    - 直接选答案而不排除(排序本质是排除法)
  method_steps:
  - 第一步看首句:排除不适合做首句的句子——指代词指代不清、关联词后半部分(但/却/而且)、明确举例标志(例如/比如)
  - 第二步选思路:剩余2个选项时对比选项差异(首句/尾句/某两句先后最常用),判断谁在前更合理
  - 用行文逻辑判断先后:先观点后解释、先提问后回答、先问题后对策、时间先后
  - 验证(酌情):验证句子的逻辑性而非读起来的通顺性;一步到位的题可酌情验证,一般不需要
  error_signatures:
  - code: pronoun_open
    description: 首句"他们/那些人"指代不明仍做首句
  - code: time_bucket_wrong
    description: 首句时间排错,把"进入新时代/建设美丽中国"(今天)排到"中国古代"(古代)前
  - code: tail_unsuitable
    description: 对策/总结性句子不放尾句,违背"对策总结适合结尾"的逻辑
  - code: forced_binding
    description: 看到关联词(一方面…另一方面)就强行捆绑,此路不通要及时切换思路
  fix_action: 做10道语句排序题,先排首句再对比选项差异,限时70秒/题
  time_budget_sec: 70
  accuracy_rule: 正确率≥70%
  pitfall: 首句"1:3"分布只是概率技巧不能绝对排除唯一首句;话题必须一致才能判断先后,不同主体不可比(如③④判断"更合适"而非绝对规则)
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
