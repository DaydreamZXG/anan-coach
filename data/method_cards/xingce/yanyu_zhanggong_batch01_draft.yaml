- id: mc_yanyu_xijie_ganrao
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/细节判断/干扰项排除
  title: 细节判断-干扰项识别与对比择优
  recognition: 细节判断题选项辨析时,识别"与文意相悖/偷换概念/偷换逻辑/无中生有"等干扰项,并学会对比择优
  applicability:
    include:
    - 细节判断题(选是/选非)
    - 选项"片面/扩大缩小/适度联想"拿不准时
    - 两个选项纠结时
    exclude:
    - 中心理解题(选项处理方式不同,需找重点而非查找)
    - 需要精确阅读的例子本身
    - 无中生有话题范畴判断以外的题
  method_steps:
  - 用判断思维(集合关系)判断扩大缩小:缩小到子集可对("言语老师了解学生心理"⊂"老师了解学生心理"),扩大到父集或反向不可对
  - 识别四大干扰项:与文意相悖、偷换概念(概念替换/概念混搭)、偷换逻辑(强加因果/因果倒置/并列偷换)、无中生有
  - 对比择优:选"正确"题选问题最不明显的;选"错误"题选问题最明显的(如"超过三分之一"与原文"相当于"矛盾,比"约半数"的过度推断更明显)
  - 细节主旨化:当文段中心句清晰时优先判断选项是否与中心句匹配(人文社科选是题常见陷阱)
  error_signatures:
  - code: no_scratch_mention
    description: 无中生有,选项内容文段未提及,如"农业保险预防天气灾害"违反常识(保险是事后补偿)
  - code: concept_swap
    description: 偷换概念张冠李戴,如"交感神经负责放松"实为"负责战斗"
  - code: causal_inversion
    description: 强加因果/因果倒置,把无因果事件强行建立因果
  - code: parallel_substitution
    description: 把并列关系偷换成主次等其他关系
  fix_action: 做10道细节判断题,逐项标注干扰项类型(相悖/偷换概念/偷换逻辑/无中生有),限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 正确率≥85%
  pitfall: 片面≠错——细节题中"我爱言语"相对"我爱言语也爱数资"虽片面但正确可选;不要死记"扩大错缩小对",必须用集合包含关系判断
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
