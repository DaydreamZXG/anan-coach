- id: mc_yanyu_duice_xuanqu
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/中心理解/对策选取
  title: 对策文段-内容优先与对策对象
  recognition: 多个选项都像对策或都含主题词时判断选哪个;宏观对策后又出现具体对策时
  applicability:
    include:
    - 选项形式上是/不是对策的对比
    - 宏观对策+多方面展开(总分类)时
    - 需要抓"对策+对象"两个主题词时
    exclude:
    - 后文明显举例(如"例如/比如")时——重点在宏观对策,具体对策是例子
    - 选项只给对策或只给对象时,出题人通常会让另一选项有明显瑕疵
  method_steps:
  - 内容(主题词)>形式(对策标志词):先看选项是否含文段核心内容,二选一时优先选内容正确的
  - 抓两大主题词:对策(怎么做/谓语)+对象(谁做/为谁做/主宾),80%对策题答案含两者
  - 宏观对策后具体对策:有多方面展开→宏观与概括均可;有重点词(关键/核心/更应该)→后面具体对策更重要
  error_signatures:
  - code: form_over_content
    description: 选形式上像对策但缺核心主题词的选项(如"要贯穿"却缺"公平正义")
  - code: concrete_over_macro
    description: 宏观+举例结构误选具体对策(例子非重点)
  - code: switch_concept
