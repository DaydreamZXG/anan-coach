- id: mc_yanyu_zhongxin_zhaozhongdian
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/中心理解/找重点句
  title: 中心理解-重点句定位(七大句子关系)
  recognition: 问"这段文字意在强调/主要说明/主旨概括"的片段阅读题,需从众多句子中找出最关键的主旨句
  applicability:
    include:
    - 问"意在强调/主要说明/主旨是"的中心理解题
    - 标题填入题(本质是中心理解题的变型)
    - 文段有明显的转折/因果/对策等句间关系标志
    exclude:
    - 问"下列说法正确/不正确"的细节判断题(考对错,不考找重点)
    - 纯并列结构无主次之分的文段(需全面概括而非找一句)
    - 逻辑填空题(考点在词语,不是找中心句)
  method_steps:
  - 通读文段,用七大句子关系判断句间逻辑并定位中心句:转折后>前、结论>原因、对策>问题、论点>论据、强调部分>非强调、新话题>旧话题,并列关系无主次
  - 删除关联词验证句意是否变化:如"今天不舒服,(但是)我还是来了"删"但是"仍是转折,说明本质是转折关系
  - 站在全文整体角度确认重点,警惕"局部重点≠全文重点"(前半的转折可能是铺垫,后文的结论/对策才是最终落脚点)
  error_signatures:
  - code: partial_focus_miss
    description: 看到前半部分转折就匆忙定重点,忽略后文更重要的结论或对策
  - code: overrely_conjunction
    description: 把关联词当绝对真理,忽略同一关联词可表不同关系(如"而"表转折/顺承/并列/递进)
  - code: ignore_overall_structure
    description: 只看局部关系未通篇分析,把局部重点当全文重点
  fix_action: 做15道中心理解真题,每题先给每句标注句子关系再定中心句,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 中心理解题正确率≥80%
  pitfall: 转折/结论只是定位重点的"拐杖",删除关联词后句意不变的句子关系才是本质;前文有转折、后文又给结论/对策时,后文往往超越前文所有内容
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
  validation:
    tested_count: 0
    passed_count: 0
    sample_question_ids: []
    reviewer: null
    reviewed_at: null
  priority: 4
  status: draft
- id: mc_yanyu_zhongxin_zhutici
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/中心理解/主题词筛选
  title: 中心理解-主题词判断与选项筛选
  recognition: 中心理解题选答案阶段,用"正确答案必须包含主题词或其同义替换"快速锁定与排除选项
  applicability:
    include:
    - 中心理解题同义替换选答案时
    - 选项多且相近需要对比择优时
    - 晦涩难懂的科技类文段(优先用高频词+首句定主题词)
    exclude:
    - 细节判断题(看对错不看主题词,片面选项在细节题可以选)
    - 专业名词必须保留原词时(如"全国统一大市场"不可替换)
    - 纯并列文段(无单一主题词,需全面概括)
  method_steps:
  - 用三种方法定主题词,以中心句提炼法最优先:中心句核心话题(抓核心动名词"谁+做什么")、每句高频词锁定、首句引出话题
  - 确认选项包含主题词或其同义替换(允许适当扩大/缩小/替换,如文化→文明、技术→技艺,核心概念不能偏移)
  - 排除"死罪项":与文意直接矛盾/文段完全未提及/无关对策;再排"慎选项":缺主题词/非重点内容/片面表述
  - 抓大放小:先确保主题词匹配,再考虑细节表述
  error_signatures:
  - code: missing_theme_word
    description: 选项缺少主题词仍误选,90%情况下缺主题词应排除
  - code: theme_scope_overexpand
    description: 主题词范围不当扩大,如"巴氏芽孢杆菌"扩大为"细菌/混凝土新材料"
  - code: professional_term_replaced
    description: 专业名词被替换,如"现代公共法律服务体系"不能省略"现代"
  - code: non_emphasis_selected
    description: 选转折前/结论前/程度词前的非重点内容
  fix_action: 做12道中心理解题,每道先写出主题词再选答案,养成"无主题词不选"的习惯,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 主题词判断准确率≥85%
  pitfall: 主题词不一定是高频词——当中心句明显(前有引入后有解释说明)时主题词频次可能很低,必须抓中心句的核心动名词
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
