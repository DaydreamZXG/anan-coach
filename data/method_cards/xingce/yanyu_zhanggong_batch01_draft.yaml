  tag_path: 言语理解与表达/细节判断/相对绝对项
  title: 细节判断-相对绝对项与优先验证
  recognition: 问法为"与文意相符/不相符/最准确"的细节判断题,选项表述有绝对或温和之分
  applicability:
    include:
    - 选是题(选正确):优先验证表述温和(可能/也许/往往/之一)且符合常识的选项
    - 选非题(选错误):优先验证绝对表述(一定/必定/都/只有...才/最新)、对比项(A高于B/比...更)、不符常识的选项
    - 选项含特殊字词(数字/字母/专有名词)时
    exclude:
    - 优先验证不等于直接锁定,若优先选项均错仍需回头看其他选项
    - 选项字数长、差异不明显的题(优先验证收益低)
  method_steps:
  - 审题:判断选是/选非,选非题在答案处打叉防遗忘
  - 选是题优先验证相对项+符合常识项;选非题优先验证绝对项+对比项+不符常识项
  - 找到"独一无二"的特殊字词快速定位,但永远要回文段对应验证
  error_signatures:
  - code: absolute_option
    description: 绝对化表述(只有...才/无法/最新)当作正确项
  - code: comparative_option
    description: 对比项(A比B更/高于/优于)误选
  - code: skip_verification
    description: 优先验证后不再回文段比对,直接锁定
  fix_action: 做20道细节判断题,每题先标出"绝对/相对/对比/特殊标志"再验证
  time_budget_sec: 50
