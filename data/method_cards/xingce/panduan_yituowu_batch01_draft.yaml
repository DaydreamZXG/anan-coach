- id: mc_grouping_basic
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类
  title: 一拖五-分组类基础套路
  recognition: 7-10个元素分到2-3个组、组间无顺序，条件含确定/绑定/隔离/推理类(组间无顺序类条件)
  applicability:
    include:
    - 分两组(上午/下午、一二编队)与分三组
    - 绑定(A=B同组)、隔离(A≠B不同组)、逻辑箭头条件
    - 问'一定为真/不可能'的分组题
    exclude:
    - 组间有顺序的队列+分组混合题(见混合卡)
    - 每组空间数题目未给出的(见组空间数量卡)
  method_steps:
  - 第一步定背景:几组、每组几个空位，写下(60-70%错题源于漏背景)
  - 第二步填确定类条件；第三步用隔离条件(A≠B→两组时各占一组，两组空间各减1)
  - 第四步用绑定条件(A=B→合成大零件，只能放进空位≥零件大小的组)
  - 第五步用推理条件:同时写逆否命题；假设前件为真推出矛盾→前件必假，得到隐藏确定条件
  error_signatures:
  - code: background_skip
    description: 忽略分组方式(2-2-3还是1-3-3)直接推
  - code: at_least_at_most_confuse
    description: 把'至少一个'(允许两人同组)与'至多一个'(不允许同组)混为一谈
  - code: space_not_enough
    description: 绑定大零件没检查目标组剩余空间是否放得下
  - code: contrapositive_miss
    description: 逻辑箭头只记正命题，不写逆否命题
  fix_action: 做12道分组基础题，限时100秒/题，每步推理前先写各组剩余空间数
  time_budget_sec: 100
  accuracy_rule: 85%以上
  pitfall: '''至少一个在A组''≠''两人不同组'':前者允许两人同时在A组，混淆必选错'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
