- id: mc_ytw_fenzu_standard
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/标准分组
  title: 一拖五-分组类套路1标准分组
  recognition: 题目明确告知元素总数与每组具体空间数(如7元素分3人+4人两组)。
  applicability:
    include:
    - 题干直接给出每组人数(7分3+4、8分2+3+3)
    - 条件含'甲丙不在同一编队''己必须第二编队''若乙在第一编队则丁也在第一编队'这类直接分组关系
    - 问'以下哪项不可能'或'哪项一定为真'
    exclude:
    - 题干未给每组人数的分组题(用'先确定组空间数量'套路)
  method_steps:
  - 填确定类条件(如己在第二编队)并划掉占用空位
  - 隔离条件必一边一个:甲丙不同组⇒各占一组;若再推出丙在第二组则甲必在第一组
  - 推矛盾定位置:假设某元素在某组,若连同其绑定元素超过该组剩余空位则假设不成立,该元素必去另一组
  - 收官检查:两组各剩1个空位时,剩余两人必不同组(高频考点,直接锁定答案)
  error_signatures:
  - code: miss_leftover_separate
    description: 两组各剩1个空位时,没推出剩余两人必然不在同一组
  - code: skip_converse
    description: 推理类条件'乙→丁'只写正向,漏写逆否'丁不在→乙不在'
  - code: option_must_vs_may
    description: 把'可能为真'选项(如甲在第一组)当'必然为真'
  fix_action: 做8道标准分组真题(7元素3+4型:2024省联考专家分组/舰艇分组),每题限时100秒
  time_budget_sec: 100
  accuracy_rule: 正确率≥90%
  pitfall: 隔离类条件中的甲丙位置可互换,选项'甲在第一组'只是可能为真,不是必然为真;必同/必不同才可锁定。
