- id: mc_yituowu_general
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/通用
  title: 一拖五-通用题型方法
  recognition: 一个材料/条件组连续出5问，背景条件(队列长度、组空间数)贯穿全题
  applicability:
    include:
    - 一拖五整套(5问)所有题型:队列类/分组类/队列+分组/数独
    - 问'一定为真/一定为假/可能为真'三类问题
    - 单问带附加条件(如'若甲在第二天')的场景
    exclude:
    - 单题(非一拖五)无连续5问
    - 只需构造完整排列、无需逐问判断的题
  method_steps:
  - 读题先锁定背景限制(队列长度、组数量、每组空间数)并写下，5问共用
  - 每问先把该问的附加条件圈出来(它是钥匙)，再沿用前问已推出的公共结论
  - 问'一定为真'只能严格正向推理、禁用代入；问'一定为假'代入验证找矛盾、优先验极端选项；问'可能为真'排除3个矛盾选项或构造一组无矛盾排列
  - 推理只剩两种可能时分情况讨论，只有两种情形都成立的结论才是一定为真
  error_signatures:
  - code: use_substitution_for_certain
    description: 问'一定为真'时用代入法，把'可能真'选项误当'一定真'
  - code: ignore_background_limits
    description: 忽略队列长度/组空间数等背景限制，后续推理全错
  - code: ignore_added_condition
    description: 做后几问时忘记该问新给的附加条件
  - code: miss_case_split
    description: 只剩两种可能时不分类讨论，直接下结论
  fix_action: 做10套一拖五整套(每套5问)，整套限时60-70秒/题，每题强制先圈附加条件
  time_budget_sec: 80
  accuracy_rule: 每套5问至少对4问(80%)
  pitfall: 每问的附加条件才是该问的钥匙，只靠公共条件做题、漏用附加条件，大概率选错
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
  validation:
    tested_count: 0
    passed_count: 0
    sample_question_ids: []
    reviewer: null
    reviewed_at: null
  priority: 4
  status: draft
  knowledge_nodes:
