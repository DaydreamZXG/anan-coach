  title: 一拖五-分组类条件翻译与逆否推理套路
  recognition: 题干带"如果X则Y"型充分条件(如"丁勇=人事→李明=财务")和"不能单蹦"型约束,如5项工作分3人
  applicability:
    include:
    - 带充分条件(如果…则…)的分组分配题
    - 带"某对象必须至少做两件事"型约束的题
    - 问"某人可能做哪些/不可能完成哪些"的题
    exclude:
    - 无条件关联、只靠代入的题
    - 队列排序题
    - 元素数量较大的复杂分组
  method_steps:
  - 逐条把文字条件翻译成符号等式/不等式:如"王莉≠人事且≠管理"
  - 识别充分条件并写出逆否:丁=人事→李=财务,逆否为李≠财务→丁≠人事
  - '"不能单蹦"转成约束:做教育的人必须还做至少1项其他工作,教育不能单独出现'
  - 问"不可能"时优先验证会触发条件前件(如丁=人事)的选项,前件为真即引入限制
