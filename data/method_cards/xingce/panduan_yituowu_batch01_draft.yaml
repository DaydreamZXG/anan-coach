- id: mc_ytw_dl_conditions
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类
  title: 一拖五-队列类五类条件与空间思维
  recognition: 几个元素排成一列顺序未定,题干给出确定/顺序/绑定/隔离/推理五类条件。
  applicability:
    include:
    - 6-7个元素排成一条线,只有'谁排第几/谁在谁前后/谁与谁相邻'这类条件
    - 问法为'以下哪项可能为真/一定为真/不可能为真'
    - 条件含'A在第3位''B不在第4位''C在第3或第5位'等确定类表述
    exclude:
    - 题中有分组但条件里没有任何顺序类条件(按普通分组题处理,组间编号无效)
    - 题干是'某元素在某组'而非线性排序的题目
  method_steps:
  - 符号化全部条件:确定类写'A=3/A≠4/C=3或5','或'条件拆成两种情况分别想;顺序类统一用'<'写'A<B<C';绑定类分三型写(AB)相邻位置可互换、[EF]相邻且E在F前、(C__D)隔两格可互换
  - 优先填入确定类条件,把大空间切成小空间:A=4则左边3空右边2空,优先思考空间少的一侧能否容纳其他条件
  - 用顺序类条件限制边界:A<B<C则A不能排最后两位、C不能排前两位、B不能排首尾;E=4且E<F则E后面只剩1空位
  - 每推一步同步更新'剩余空位数',空间不够即排除该假设或强制归位
  error_signatures:
  - code: confound_order_binding
    description: 混淆'紧挨/间隔固定格数'(绑定)与'不相邻'(隔离)两类条件,前者间隔大小固定后者不固定
  - code: ignore_spatial_split
    description: 只记元素位置不记空间分割,如A=4后没算出左边3空右边2空
  - code: swap_position_assumed
    description: 绑定类条件如(AB)相邻擅自固定A在前B在后,忽略前后位置可互换
  fix_action: 做15道队列类一拖五真题,每题限时90秒,专练符号化与'剩余空间够不够'判断
  time_budget_sec: 90
  accuracy_rule: 正确率≥85%,条件符号化与一步推理必须在0.5秒内反应
  pitfall: 确定类条件'醉翁之意不在酒':A=4的真正含义不是A在4,而是A左边只剩3个位置、右边只剩2个位置,空间不够时绑定组(A+B相邻需2格)放不下。
