- id: mc_ytw_queue_questiontype
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类/提问方式
  title: 一拖五-队列类提问方式与附加条件推理
  recognition: 队列材料下连续追问'以下哪项可能为真/一定为真/不可能为真',每问带一个新的附加条件,需按提问强度选打法。
  applicability:
    include:
    - 问'不可能为真':由已知条件正向推矛盾,矛盾项即答案
    - 问'可能为真':排除三个一定假的选项,剩下的就是答案
    - 附加条件给出后需要连锁一步推理(如安徽第一→江西第七、浙江第四、福建第五)
    exclude:
    - 问'一定为真'的题(应正向推理,代入法必错)
    - 第一问直接代入选项验证的送分题(不属于推理题打法)
  method_steps:
  - 问'不可能为真':先做一步推理锁定禁位(如调料前必须有酒→调料≠第一排;粮油前必须有零食→粮油最早也只能第四排),再对照选项秒排
  - 问'可能为真':逐项找其违反的确定/绑定条件,排除三个一定假的;若剩两个再用构造法补齐验证
  - 附加条件推理:把附加条件当确定条件填入后连锁推出(安徽第1→江西必第7、浙江必第4、福建必紧挨浙江即第5);不确定的位置只标注'可能真',如'福建可能第1或第6'就不是一定真
  - 判断'一定为真'时找所有可能情形的共同结论,而非某一种情形的结论
  error_signatures:
  - code: possible_vs_must
    description: 把'可能为真'当成'一定为真'作答,未区分提问强度
  - code: uncertain_as_certain
    description: 把可能的位置(如福建第1或第6)当成确定结论选成'一定为真'
  - code: extra_cond_miss
    description: 新问题漏用本题新给的附加条件,只按公共条件推理
  - code: reverse_direction_wrong
    description: 问'不可能为真'时按'可能为真'的方向排除,推反了
  fix_action: 做8道队列类'可能/一定/不可能'三问组合题,做题前先把每问的提问类型写在题干旁,再决定用排除还是正向推。
  time_budget_sec: 60
  accuracy_rule: 提问类型判定不允许失误,组合推理题正确率≥75%后再提速。
  pitfall: '''可能为真''=排除三个一定假的,''一定为真''=必须正向推出,两者是相反方向;代入法在''一定为真''题中只能证明''可能'',必然误选,严禁使用。'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
