- id: mc_ytw_sudoku_extra
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/数独/附加条件
  title: 一拖五-数独附加条件(对角线/区域框/拐角)
  recognition: 数独基础上增加'两条对角线元素也不重复'或'粗线框区域元素不重复'的附加约束,问特定空格。
  applicability:
    include:
    - 5×5+两条对角线(酸甜苦辣咸、生旦净末丑)
    - 4×4/5×5+粗线区域框(天地日月、俄罗斯方块形五山),拐角处为考点
    - 区域框内也须包含全部元素的变形数独
    exclude:
    - 纯行列约束的普通数独(用基础三技巧)
    - 区域框内不要求包含全部元素的题
  method_steps:
  - 对角线条件优先用:多一个约束反而简化推理——某格所在行+列+对角线已含4个不同元素,该格即第5个(空格②行列对角线已含苦辣咸等→只能填甜)
  - 区域框条件找拐角:拐角顶点已确定某元素时,框内其余位置都不能放该元素而框内又必须有它→该元素必在拐角顶点本身(如(1,1)处必为华山)
  - 变形数独先排除法:观察问的空格所在列/区域,用'不能是什么'排除选项(汉字数独第1列排除C/D/E),缩小到两个后再针对关键行列推
  - 定位一个空格后,其所在行列随即成为新的信息较多行列,配合区域框约束连锁推进
  error_signatures:
  - code: diagonal_ignored
    description: 漏用对角线约束,明明多一重限制可简化却绕远路
  - code: corner_not_used
    description: 没识别出拐角顶点的独占性,区域框题卡壳
  - code: region_vs_full_grid
    description: 区域框题只按行列推,漏掉'区域框内也必须含全部元素'这一约束
  fix_action: 做6道带对角线/区域框的数独题限时90秒/题,做题前先圈出对角线和所有拐角顶点再推。
  time_budget_sec: 90
  accuracy_rule: 附加条件反而让推理更简单,正确率≥85%后再压时间。
  pitfall: 拐角推理:拐角框内除顶点外的位置都不能放该元素,而框内又必须有该元素,所以唯一落点就是拐角顶点本身——不要被俄罗斯方块形的复杂图形吓住,核心就是找拐角的独占性。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
