- id: mc_yituowu_duilie_guiding_gongge
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类/固定序列与计数分配
  title: 一拖五-队列类固定序列与计数分配套路
  recognition: 元素按规则自动排成固定序列(如"同类不连续→单双位固定"),再叠加"每人答N道"的计数分配
  applicability:
    include:
    - '"同类元素不能连续出现"型题(自动得到固定插空序列)'
    - 每个对象有答题/分配数量约束(至少N道、只能答某类)的题
    - 问"最少答题数/剩余题目/数量分配可能"的题
    exclude:
    - 无固定序列的自由排列题
    - 位置由条件自由决定的题
    - 分组题
  method_steps:
  - 识别"同类不连续":插空得固定序列(历史占1/3/5/7、地理占2/4/6),先画出来
  - 把数量约束写成数值等式:总任务=各人数量之和,枚举可能的分配组合(如赵/陈各≥2道→只有三种组合)
  - '"一半/全对"类条件转成数量等式,用最值思路求极值(如王全错时答对总数最少)'
  - 问"补充条件可唯一确定":代入选项,看哪个能锁死所有自由变量的分配
  error_signatures:
  - code: miss_insertion_pattern
    description: 没发现"同类不连续"已锁死序列,仍当自由排列处理
  - code: allocation_sum_wrong
    description: 枚举人数分配时漏掉某种组合或违反"至少N道"约束
  - code: min_max_direction_error
    description: 求"答对总数最少"时方向弄反,没让无约束对象取最小
  - code: possible_vs_must_confusion
    description: 把"可能为真"当"一定为真"(19年第三问B选项陷阱)
  fix_action: 做8道固定序列+计数分配题,每题限时90秒,先画序列再列数量等式
  time_budget_sec: 90
  accuracy_rule: 计数分配题正确率≥80%
  pitfall: '"至少"条件用来卡下限:王只答1道→赵+陈共6道,赵、陈各≥2道→分配组合只有三种,漏一种就错。'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
