- id: mc_ytw_queue_onestep
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类/条件一步推理
  title: 一拖五-队列类条件符号化与一步推理
  recognition: 几个元素排成一列、顺序不确定,题干给确定/顺序/绑定/隔离/推理五类条件,需要把每类条件翻译成'空间被切掉多少格'。
  applicability:
    include:
    - 确定类条件:某元素第3位、不在第4位、在第3或5位
    - 顺序类条件A在B前、绑定类条件(AB相邻/中间隔固定格数/E紧挨F且在前)、隔离类A和B不相邻
    - 推理类条件'如果A在第3位则B不在第5位'这类逻辑箭头
    exclude:
    - 组与组之间无顺序、没有'谁在谁之前'关系的纯分组题
    - 需要两两列举排列而非单步推理就能解决的全排列题
  method_steps:
  - 统一符号化:前后关系用<、确定位置用=、相邻写(AB)、隔固定距离写(C__D)、不相邻和逻辑箭头各用专属符号;推理类条件当场把逆否命题写出来
  - 确定类=切空间:A=4意味着左边3格右边2格,优先思考空间较少的一侧;或条件(C=2或4)拆成两种可能,0.5秒内反应'别格占2则C必4'
  - 顺序类背成条件反射:A<B<C→A不能排末两位、C不能排前两位、B不能排首尾;再叠加确定条件(E=4且E<F→E后只剩1空)看剩余空间够不够其他条件放
  - 绑定类做位置联动与空间影响:A=1且AB相邻→B=2;C=2且CD隔两个→D=5;G=2时AB相邻→A、B≠1;隔离类AB不相邻+B=2→A≠1、3只能=4
  error_signatures:
  - code: or_cond_not_split
    description: 把'在第3或5位'当单个条件,忘记拆成两种可能分别推理
  - code: bind_swap_ignore
    description: 相邻/间隔固定距离条件允许前后位置互换,误当成顺序固定
  - code: contrapositive_miss
    description: 推理类条件只写正向推理,漏写逆否命题导致漏解
  - code: isolation_vs_fixed_gap
    description: 把'不相邻'(中间隔几个不定)当成'恰好隔一个'(间隔固定)处理
  fix_action: 做20道队列条件一步推理小题限时60秒/题,把'顺序类不能排首尾''隔离类禁相邻''绑定位置联动'背成条件反射;对或条件单独加练。
  time_budget_sec: 60
  accuracy_rule: 一步推理是30%-50%一拖五题的唯一解法,正确率须≥90%才算合格。
  pitfall: 确定条件A=2的真正含义不是'A在2',而是'A左边只剩1个空间'——考官的醉翁之意在于让你检查绑定件(如BC相邻需2格)是否放得进这个窄空间。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
