- id: mc_queue_circle
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类/环形
  title: 一拖五-环形队列(圆桌)
  recognition: 圆桌/围成一圈，座位编号逆时针或乱序，含'某人在某人左边第N张'表述
  applicability:
    include:
    - 圆桌座位号推理
    - 绑定类+左右方向混合的环形题
    - 座位编号不按顺时针顺序给的题
    exclude:
    - 直线排队题
    - 编号连续且按顺时针给出的顺序题
  method_steps:
  - 先记口诀'左顺右逆':面对桌子左手边=顺时针，右手边=逆时针
  - 把'右边第N张'换算成逆时针数N格，'左边第N张'=顺时针数N格
  - 用确定类条件(丙在1号)定锚，逐个元素按方向一步推理排除
  - 某个座位被占后，其绑定元素的对应编号同步失效(如乙所在座位被占→甲、丙不能是该编号)
  error_signatures:
  - code: direction_reverse
    description: 把左边/右边与顺/逆时针搞反，所有推理颠倒
  - code: anchor_missing
    description: 不从已确定座位开始推，直接猜位置
  - code: ignore_occupied
    description: 某座位被占后没同步排除其绑定元素的对应编号
  fix_action: 做5道环形队列题，限时90秒/题，动笔前先标清每个方向的换算
  time_budget_sec: 90
  accuracy_rule: 80%以上
  pitfall: '''左边第N张''是顺还是逆方向判断错则整题全错，先花10秒标方向再推'
