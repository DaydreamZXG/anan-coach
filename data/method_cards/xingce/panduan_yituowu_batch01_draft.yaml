- id: mc_grouping_twice_intersection
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/两次分组找交集
  title: 一拖五-分组两次找交集
  recognition: 同批元素按两种属性各分一次组(年龄/性别、学历/性别)，最终求同时满足两个属性的元素(如'17岁女生')
  applicability:
    include:
    - 7人/6人/5人按两种属性各分组一次
    - 条件含'X与Y相同'绑定、'X与Y不同'隔离
    - 问'谁同时满足A和B属性'
    exclude:
    - 只按一种属性分一次组
    - 属性超过两组且目标不是找交集
  method_steps:
  - 第一次分组:用'两人不同→一边一个'占位，再用'三人相同→必须同组'但该组剩余放不下3人→逼三人进另一组(大组被填满)
  - 第二次分组:同样操作按另一属性再来一遍，分别列出每属性的'候选名单'
  - 找交集:两个候选名单唯一重合的元素即答案
  error_signatures:
  - code: group_capacity_skip
    description: 没算'17岁组只剩2空、放不下3人'，没把三人组逼进另一组
  - code: first_round_leak
    description: 第一轮结论没写全就急着做第二轮
  - code: intersection_miss
    description: 候选名单列错或漏项，交集找错人
  - code: same_attr_swap
    description: '''X与Y年龄相同''的两人可都17或都18，没结合剩余空间定死'
  fix_action: 做6道两次分组找交集题，限时110秒/题，每题最后画两列候选名单再取交集
  time_budget_sec: 110
  accuracy_rule: 90%以上(套路固定，应拿满)
  pitfall: 核心是'大组被绑满、小组放不下→三人必进大组'，每轮分组都要走到这一步再进下一轮
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
