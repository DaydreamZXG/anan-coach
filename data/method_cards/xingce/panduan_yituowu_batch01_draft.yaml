  - 把顺序条件逐个转成位置禁区:丁在乙之后→乙≠最后组;丙在丁之后→丙≠最前组
  - 绑定(甲、戊同组)+顺序叠加时用排除法锁定每个元素的可去组集合(如甲、戊只能去第三/四季度)
