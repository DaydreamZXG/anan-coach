- id: mc_yituowu_fenzu_jiandan
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/简单分组
  title: 一拖五-分组类简单分组套路
  recognition: N个元素分成M组每组固定人数、无前后顺序条件(如"乙的结对城市不是丁"),本质是纯分组
  applicability:
    include:
    - 6元素分3组每组2人、分组对应年份但无顺序要求的题
    - '"甲必须与乙或丙同组"型绑定'
    - 附加"甲/乙不在某年"型时间槽限制的题
    exclude:
    - 组内有前后位置要求的题(队列类)
    - 每组人数不固定的题(用人数不固定分组卡)
    - 带"谁在谁之前"顺序条件的题
  method_steps:
  - 先判断无顺序条件即"简单分组",把时间槽(年份)只当组标签使用
  - 翻译绑定并做一步推理:甲=乙或丙→若乙不与甲同组则丙必与甲同组
  - 用组容量排除:每组只有2个位置,丁/戊/己所在的组不可能有甲(甲需与乙或丙占满)
  - 附加固定条件(某元素在某年)时,先用绑定+排除锁定约束最强的元素(如甲)的年份,再填其余
  error_signatures:
  - code: treat_group_as_queue
    description: 把分组的年份当有先后顺序,引入不存在的顺序约束
  - code: bind_or_miss
    description: 漏掉"甲=乙或丙"的反向一步推理(乙不绑则丙必绑)
  - code: group_capacity_ignore
    description: 忽略每组只有2个位置,把第3个元素塞进已满组
  - code: year_slot_miss
