- id: mc_ytw_dl_question_types
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类
  title: 一拖五-队列类'可能/一定/不可能'问法应对
  recognition: 队列题问'以下哪项可能为真/一定为真/不可能为真',需区分确定性强度。
  applicability:
    include:
    - 题目出现'可能为真''不可能为真''一定为真'等强度问法
    - 条件含逻辑箭头'若A在某位则B不在某位'(推理类条件)
    - 条件中两个元素限制完全相同(对称元素,如丁和戊地位对称)
    exclude:
    - 直接问'谁排第几'的确定性单一问题
  method_steps:
  - '''可能为真'':逐一排除三个''一定为假''的选项,剩下那个即答案'
  - '''不可能为真'':推矛盾定位——假设某元素在某位置,若人数或规则冲突则假设不成立'
  - 推理类条件立刻写逆否命题(A=3→B≠5 等价于 B=5→A≠3),假设前件为真推出矛盾则前件必假
  - 对称元素(丁和戊条件完全相同)要么同时成立要么同时不成立,选项必成对出现才可选
  error_signatures:
  - code: option_must_vs_may
    description: 把'可能为真'的选项当'必然为真'(如甲丙位置可互换的候补项)
  - code: skip_converse
    description: 推理类条件只写正向逻辑箭头,漏写逆否命题
  - code: miss_contradiction
    description: 假设前件为真推出矛盾后,没有顺势得出'前件必假'这一确定结论
  fix_action: 做10道队列类真题,每题动笔前先标注问法类型(可能/一定/不可能),再选策略
  time_budget_sec: 90
  accuracy_rule: 正确率≥90%,确定性与可能性的区分题不许错
  pitfall: '''可能为真''≠''必然为真'':位置可互换的候补元素(如甲、丙各占一组可互换)通常作为迷惑项出现,只能算''可能''。'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
