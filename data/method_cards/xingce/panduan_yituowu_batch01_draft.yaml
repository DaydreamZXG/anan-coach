- id: mc_yituowu_duilie_huo_erdangyi
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类/或条件二选一绑定
  title: 一拖五-队列类"或"条件二选一绑定套路
  recognition: 条件形如"人事部紧接在研发部或生产部的后面""法务部后面紧挨研发或销售",是两对象二选一绑定
  applicability:
    include:
    - '"X紧接在A或B之后"型条件'
    - '"X后面是A或B"型条件'
    - 与顺序类条件(如"销售在财务和生产之前")叠加的题
    exclude:
    - 无"或"、只绑定单个对象的题
    - 分组型题
    - 位置关系明确、无二选一的题
  method_steps:
  - 把"或"条件翻译成反向锁定:若X前面不是A,则X必须与B绑定(二选一必居其一)
  - 先把冗长名称简化为数字(如戊己庚辛→1-6),降低干扰
  - 用顺序类条件推位置上限:如"销售在财务和生产之前"→销售最晚只能放第4位
  - 问"不可能相邻/安排"时,找同时限制两个"或"条件的选项——它最容易产生矛盾
  error_signatures:
  - code: or_condition_wrong_direction
    description: 把"X在A或B之后"反推成"A或B必须在X之后",方向搞反
  - code: ignore_following_space
    description: 得到[法务销售]绑定后,忽略销售后面还需给财务、生产留2个空位
  - code: not_check_both_bindings
    description: 只检查一个"或"条件,漏掉另一个同时被限制的绑定
  - code: shorthand_confusion
    description: 简化成数字后把原名称与数字对应关系记错
  fix_action: 做10道带"或"绑定条件的队列题,每题限时100秒,重点练反向锁定绑定
  time_budget_sec: 100
  accuracy_rule: '"或"条件题正确率≥80%'
  pitfall: 二选一绑定的"反向锁定"是破题点:某个位置被占使X前面不是A时,X必须与B绑定,并继续检查绑定后的空间需求(销售后面要留财务和生产)。
