  - code: fixed_group_occupancy
    description: 忘了丁、辛已在第二季度占2个位置,乙因"在丁前"进不了第二季度
  fix_action: 做8道队列+分组混合题,每题限时100秒,先列每个元素的"可去组集合"再逐问
