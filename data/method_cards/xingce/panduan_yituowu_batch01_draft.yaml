- id: mc_ytw_group_space_count
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/先确定组空间数量
  title: 一拖五-分组类先确定组空间数量套路
  recognition: 题干只告知分几组、不告知每组人数,需先根据'每组1-2人'和总数推出唯一分组模式(如5人3组=2-2-1),再用数量关系确定每组人数。
  applicability:
    include:
    - 5人分3组每组1-2人(唯一模式2-2-1)、6人报4种奖(两奖2人两奖1人)、4户选3企业家(一人选2户)
    - 条件含'某组比某组多/某组最少'的数量关系
    - 含一个逻辑箭头条件(如'只有戊选陈老师'与陈老师2人矛盾)
    exclude:
    - 已明确各组人数的标准分组题
    - 没有数量关系线索、空间模式无法确定的题
  method_steps:
  - 先定空间:按'每组1-2人'+总人数穷举出唯一分组模式(5人3组只能是2-2-1),再用数量关系锁定每组分几人(陆>张→陆2人张1人陈2人;南山最少→南山1人)
  - 用已定空间检验箭头条件后件:后件'只有戊选陈老师'与实际'陈老师2人'矛盾→后件必假,取逆否得前件假(甲丙丁都不选陆老师)
  - 逆否后再填人:排除不能进某组的元素后,剩余元素必须填满该组空位(乙、戊填满陆老师2空)
  - 当箭头条件前件'恒真'时直接推后件(市场部需3人但乙戊最多2人→甲丙丁至少1人选市场部→前件恒真→后件成立)
  error_signatures:
  - code: space_mode_wrong
    description: 没先确定2-2-1模式就开推,或把'多/少'方向搞反导致人数分配错
  - code: consequent_contradiction_miss
    description: 没发现后件与已定空间矛盾,错过逆否推理这步关键得分点
  - code: full_spot_overflow
    description: 填人时不检查'一人不能进两组'或空位是否足够
  - code: even_split_assume
    description: 对只知道总和的部门(乙丁辛共2人)默认平均分配
  fix_action: 做7道'先确定组空间'真题(2021管综/2022省联考/2024浙江/2025考研等),第一步固定写成'空间=2-2-1'再动笔,养成先定空间习惯。
  time_budget_sec: 90
  accuracy_rule: 空间模式判定不允许失误,此类题正确率≥80%。
  pitfall: 出现'只有X选某组'这类后件时,先拿已确定的组空间对照——后件与实际空间数矛盾时立刻逆否,这是全场最快得分点,也是考官固定埋的点。
