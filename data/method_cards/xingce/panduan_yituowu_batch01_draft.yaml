- id: mc_queue_long_span_overlap
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类/大跨度绑定
  title: 一拖五-大跨度绑定相交
  recognition: 两个'中间隔n个元素'的绑定条件占格之和>总人数(7人排队，隔3人=5格+隔3人=5格，5+5=10>7)
  applicability:
    include:
    - 排队/隧道/跑步赛道出现两个大跨度间隔条件
    - 两个条件存在交叉关系的题
    - 问'可能/不可能/可以推出'及'最多隔几人'
    exclude:
    - 只有一个间隔条件的题
    - 占格之和≤总人数、可以平铺的题
  method_steps:
  - 把每个间隔条件折算成占格数(相邻=2格，隔1个=3格，隔3个=5格)，求两个条件占格之和
  - 占格和>总人数→两个条件必须相交(重叠放)，枚举相交方式:谁卡在谁中间，通常只有2-3种
  - 先摆相交的大跨度块，剩余空格填入剩余元素；每问附加条件用来排除某几种相交方式
  - 问'最多/最少隔几人':最远=放首尾(总人数-2)，最近=相邻(0)
  error_signatures:
  - code: span_count_wrong
    description: 折算占格数出错(隔3人应占5格，误算成4格)
  - code: flat_assumption
    description: 默认两个大跨度条件能平铺，没算占格和是否超过总数
  - code: arrangement_miss
    description: 只列一种相交排列，漏掉另一种，选项判错
  - code: ignore_swap
    description: 间隔条件未声明顺序时，两端元素可互换没考虑
  fix_action: 做8道大跨度绑定题，限时100秒/题，每题必须画出全部相交排列再验证选项
  time_budget_sec: 100
  accuracy_rule: 80%以上
  pitfall: 相交排列不唯一，先把所有可能排列全列出来再逐问验证，少列一种就错
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
