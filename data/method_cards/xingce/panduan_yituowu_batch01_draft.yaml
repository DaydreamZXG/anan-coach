- id: mc_ytw_meta_guide
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/总纲
  title: 一拖五-题型识别与做题总纲
  recognition: 同一材料(元素排队或分组的条件组)下连续5问,题型分队列/分组/队列+分组/数独,做题前必须先读懂背景限制。
  applicability:
    include:
    - 题干给出6-7个元素排队或分组的一组材料,随后连续5道小题共用背景条件
    - 提问含'一定为真/一定为假/可能为真'等强度词,需要按提问类型换打法
    - 材料中混有确定/顺序/绑定/隔离/推理类条件,需先分类再逐个一步推理
    exclude:
    - 与共同材料无关的独立形式逻辑/真假话单题
    - 多对多表格等低频复杂题型(江苏/广东特色,备考阶段跳过)
    - 题干只给了组编号但条件中完全没有顺序类关系的题(按普通分组处理)
  method_steps:
  - 先读背景限制:明确队列长度或组空间数量(如7元素分3+4还是2-2-3),这一步决定推理框架,约60%-70%错题源于背景理解错误
  - 标注每一问的附加条件(它是本题的解题钥匙),并注意每问独立,不要沿用上一问的附加条件
  - 按提问换打法:问'一定为真'用正向推理且禁用代入法(代入只能证可能);问'一定为假'用代入验证找矛盾;问'可能为真'用排除法排掉三个矛盾项或构造法补齐验证
  - 对'要么A要么B'式条件做分情况讨论,比较两种情况的共同结论作为'一定为真'项
  error_signatures:
  - code: background_ignore
    description: 忽略背景限制(队列长度/组空间数)直接推理,导致60%-70%题做错
  - code: extra_cond_leak
    description: 新问题没用上本题附加条件,或把上一问的附加条件误带入
  - code: substitute_for_must_true
    description: 问'一定为真'却用代入法,代入只能证明可能为真,必误选
  - code: conditional_both_ways
    description: 遇到'要么都选要么都不选'类条件只推一边,漏掉分情况讨论
  fix_action: 做10套一拖五真题,每套动笔前先默写背景(队列长度/组空间),并把每问的提问类型标注在题号旁;复盘时只对背景误判和提问误读两类错因复盘。
  time_budget_sec: 90
  accuracy_rule: 材料阅读与背景框架搭建不允许丢分,整体正确率≥70%后再开始压时间。
  pitfall: 同一组元素按不同分组方式(如7人分2-2-3还是1-3-3)推理结论完全不同,做题前必须先把背景限制定死再动笔。
