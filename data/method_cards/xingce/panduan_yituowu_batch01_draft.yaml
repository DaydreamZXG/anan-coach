- id: mc_ytw_fenzu_intersection
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/分组两次找交集
  title: 一拖五-分组类套路2分组两次找交集
  recognition: 同一组人按两种属性各分一次组(如年龄+性别),问同时满足两个特定属性(如17岁女生)的元素。
  applicability:
    include:
    - 7人按年龄和性别、5人按年龄和课程、6人按学历和性别各分组
    - 条件结构固定:'X与Y不同'各占一组 + 'P与Q相同'绑定
    - 最终问交集,如'谁既是17岁又是女生''谁是女硕士'
    exclude:
    - 只按一种属性分组的题
  method_steps:
  - 第一维度分组:用'不同'关系把两人拆到两组各占1位,用'相同'关系绑定2-3人
  - 检查'放不下':若某组只剩1-2个空位而绑定组占2-3人,则绑定组被迫进另一组(如17岁组剩2空放不下甲丙戊3人⇒甲丙戊必18岁)
  - 第二维度同理再分一次,同样用'放不下'定位人员归属
  - 找交集:分别列出两个维度的候选名单,唯一交集即答案
  error_signatures:
  - code: forget_space_capacity
    description: '''相同''绑定条件占多人时,没检查目标组剩余空位是否放得下'
  - code: single_dimension_only
    description: 只按一种属性分组就选答案,漏做第二维度
  - code: max_gap_misread
    description: 把'年龄相差最大'误当普通不同关系,其实意味着一个青年一个中年(各占1位)
  fix_action: 做6道'分组两次找交集'真题(江苏/山东/辽宁/浙江/管综),每题限时110秒
