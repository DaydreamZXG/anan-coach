- id: mc_ytw_mixed_queue_group
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列+分组
  title: 一拖五-队列+分组混合套路
  recognition: 元素分成若干组且组与组之间有顺序区别(第1天/第2天),条件含'谁在谁之前/前一天'。
  applicability:
    include:
    - 9人分3天值班每天3人+AB同组+AD跨组顺序条件
    - 8门课分4学年每学年1-3门+绑定'丙己辛同学年、丁紧随其后'
    - 7个项目分4天每天不超过3个+顺序链'能源<文化<社会<交通'
    exclude:
    - 分组但条件中没有顺序类条件(按普通分组处理,组间编号无效)
    - 只有线性排序无分组的纯队列题
  method_steps:
  - 优先处理顺序条件:顺序类条件是突破口,先列'谁在谁前一天'的2种可能位置分情况讨论
  - 再填绑定与确定条件:AB同组、G在第三天等,按组空间(每天几人)逐步填入,同步更新各天剩余空位
  - 区分两类顺序表述:'A在B之前'可同组也可跨组;'A在B的前一天'必跨组,不可混用
  - 收尾:某组只剩1个空位时结合绑定条件强制归位;两组各剩1空时剩余两元素必不同组
  error_signatures:
  - code: group_order_ignored
    description: 组间无顺序类条件却按混合题处理,把组间编号当顺序用
  - code: same_day_vs_day_before
    description: 混淆'A在B之前'(可同组)与'A在B的前一天'(必跨组)
  - code: day_capacity_forgot
    description: 某天已满/剩几个空位没同步更新,导致绑定元素放错天
  fix_action: 做6道队列+分组混合题(2025一拖五真题值班/2022考研课程选修),每题限时120秒
  time_budget_sec: 120
  accuracy_rule: 正确率≥80%,混合题首次接触先限时120秒,熟练后压到100秒
  pitfall: '''A在B之前''只要求A比B早,可同一天(A早班B晚班);只有明确说''A在B的前一天''才必然跨组,这是考官常挖的坑。'
