  method_steps:
  - 识别后立刻画表格:行=一类元素(人)，列=另一类(城市/月份)，格内填第三类(数字/词)
  - 技巧1唯一余数法:某格所在行+列已含其余所有数，直接填缺的那个
  - 技巧2两空格法(最高频，60-70%题目靠它):某行只缺两格→确定候选组合，再用其中一格的列已有数字排除一个
  - 技巧3三空格法:某行缺三格，观察各格所在列的数字把重复的排除，剩唯一；有对角线/粗线框时优先利用，拐角顶点常是唯一可放位
