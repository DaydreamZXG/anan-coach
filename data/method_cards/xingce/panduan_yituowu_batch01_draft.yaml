  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/数独
  title: 一拖五-数独题型套路
  recognition: 题干给出4×4/5×5表格(常文字化:人物×城市填顺序),每行每列元素不重复。
  applicability:
    include:
    - '''每行每列(各元素)均不同''的表格填数/填词题'
    - '''每个月中4人调研的城市均不同''这类表述(本质是数独)'
    - 加变形:对角线不重复、粗线框区域不重复(拐角框,2025江苏)
    exclude:
    - 非表格结构的排队/分组题
  method_steps:
  - 画表格:行=人、列=地(或两类别),格内填顺序/内容,先把题干所有已知条件填入
  - 唯一余数法:某格所在行列已含其余所有元素⇒填唯一缺失的那个
  - 双空格法(考最多,60-70%题靠它):某行剩2空,看其中一空格所在列已有其一⇒锁定该空,另一空填剩下的;填完再找新双空格行/列循环
  - 只推到题目所问的格子就停,不必填满整个表格;有对角线/拐角框条件时优先利用
  error_signatures:
  - code: fill_all_waste
    description: 把整个表格推完才选答案,浪费时间
  - code: ignore_key_row_col
    description: 不找已知信息最多的行/列切入,乱推
  - code: exclusion_insufficient
    description: 只靠选项排除法,不结合行列推理,排除不彻底
  fix_action: 做8道数独真题(2024国考4×4/2018江苏/2023江苏5×5/2025江苏拐角),每道限时60秒
  time_budget_sec: 60
  accuracy_rule: 正确率≥90%(4×4是送分题;5×5限时内允许错但≥80%)
  pitfall: 问'不可能为真'时,只需用双空格法推出目标格唯一值再对照选项即可,切忌把整个数独表推完。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
