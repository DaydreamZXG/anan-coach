  - code: capacity_overflow
    description: 季度/天数满员后仍把元素往里塞
  - code: forget_extra_position
    description: 附加条件推出位置后，不再验证剩余元素的唯一落点
  fix_action: 精做近5年国考一拖五真题(21/22/23/24/25年)，限时90秒/题，动笔前先写公共一步推理结论
