  - 用绑定+数量比较排除不可行方案:如1-1-5时教育/财务/宣传/后勤全归丁,王/卫无二选一可选→矛盾
  - 锁定方案后用二选一条件推逻辑链:某元素被占→卫必选工会→王必选教育(连锁反应)
  - 验证时核对人数上限:推出某人分得数量超过该方案上限即为矛盾
  error_signatures:
