- id: mc_grouping_standard
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/标准分组
  title: 一拖五-标准分组
  recognition: 题干明确告知元素总数和每组人数(7元素分3人+4人两组，8元素分2/3/3三组)
  applicability:
    include:
    - 空间数明确的两组/三组分法
    - 隔离+推理+绑定混合条件
    - 问'一定为真/不可能'的分组题
    exclude:
    - 空间数未明确的分组(套路3)
    - 连续两次分组找交集(套路2)
  method_steps:
  - 先用确定条件定锚(如航母己必在第二编队)，算每组分完确定元素后的剩余空位
  - 隔离条件(A≠C)→两边各占一个，两组剩余空间各减1
  - 推理条件写逆否(若乙在一→丁在一，逆否:丁不在→乙不在)，配合空间不足推矛盾:假设丁在二→乙被迫也在二→超员→丁必在一
  - 两侧各剩1个空位时，最后两个元素必'一边一个'→不可能同组
  error_signatures:
  - code: position_interchangeable
    description: 甲丙位置可互换却当确定条件用，把'可能真'当'一定真'
  - code: three_people_binding_overflow
    description: 绑定后形成三人组，没检查组内只剩2个空位、超员仍往下推
  - code: assume_alone_one_side
    description: 没意识到最后剩两个元素时必然一边一个
  fix_action: 做8道标准分组题，限时90秒/题，优先找'各剩一个空位→剩余两人不同组'形态
  time_budget_sec: 90
  accuracy_rule: 85%以上
  pitfall: 最后'两边各剩一个空位'时剩余两人必不同组，是最高频考法，主动去找这个形态
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
