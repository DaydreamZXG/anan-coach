- id: mc_queue_basic
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类
  title: 一拖五-队列类套路
  recognition: 若干元素排成一列(排队/排名/货架/值班)顺序不确定，给确定/顺序/绑定/隔离/推理五类条件
  applicability:
    include:
    - 纯顺序题与带身份(中/外、男/女、军官/士兵)的排队题
    - 确定类+顺序类+绑定类条件组合
    - 问'可能/一定/不可能'任意问法
    exclude:
    - 圆桌环形题(方向规则不同，见环形卡)
    - 只考分组不考顺序的题目
  method_steps:
  - 条件符号化:确定类A=3/B≠4直接写；顺序类统一写成<号(猴<妙<美)；绑定类(AB)=相邻可互换、[EF]=顺序固定
  - 先填确定类条件并按'空间分割'思考:A=4→左边3个右边2个位置，先看空间少的一侧能否装下其他条件
  - 顺序类转空间限制:A<B<C→A不能排倒数两位、C不能排前两位、B不能排首尾；再扣已占位置算剩余空间
  - 绑定类确定其一即确定其二；位置可互换时分别考虑两种排法，剩余空间不够时绑定块整体前移/后移
  error_signatures:
  - code: ignore_position_exclusive
    description: 忘了'一个位置只能占一个元素'，A=3后其他元素仍排3
  - code: sequence_space_blind
    description: 顺序条件只记大小不换算空间需求(A<B<C→A右边需2个空位)
  - code: binding_swap_miss
    description: 只写一种前后顺序，忽略相邻/间隔固定时元素位置可互换
  - code: confuse_insulation_binding
    description: 把'不相邻'(隔离,中间隔几个不固定)当'恰好隔一个'(绑定,格数固定)
  fix_action: 做12道队列类题目，限时90秒/题，每题先用符号化+空间分割写出一步推理再动笔
  time_budget_sec: 90
  accuracy_rule: 85%以上
  pitfall: 绑定类'AB相邻'只约束相邻不约束前后，推位置时漏算可互换的两种排法必错
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
  validation:
    tested_count: 0
    passed_count: 0
    sample_question_ids: []
    reviewer: null
    reviewed_at: null
  priority: 4
