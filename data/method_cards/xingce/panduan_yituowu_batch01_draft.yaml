  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类
  title: 一拖五-分组类四类条件与空间五步法
  recognition: 7-10个元素分到2-3个无顺序的组,组间没有顺序类条件。
  applicability:
    include:
    - 多个元素分进若干组(如7元素分3人+4人两组),题干给确定/绑定/隔离/推理条件
    - 问元素在哪一组、哪些元素必同组/必不同组
    - 条件含'X不在第2组''X必须与Y同组''X与Y不能同组''若X在第1组则Y不在第3组'
    exclude:
    - 组与组之间有明确先后顺序且含顺序类条件的题(见队列+分组卡)
  method_steps:
  - 第一步定背景:写清几组、每组几个空位(7分3+4则第一组3空第二组4空),分组方式不同直接影响后续推理
  - 第二步填确定类条件:无歧义直接填入,同时该组空位减1
  - 第三步隔离条件:两组时'A≠B'⇒各占一组,两组空间各减1;三组时结合'某组已满'强制归位
  - 第四五步绑定+推理:绑定作'大零件'只放空位≥其大小的组;推理条件写逆否,假设前件为真推矛盾则前件必假
  error_signatures:
  - code: miss_background_limit
    description: 忽略背景限制(组数/每组空位),这是60%-70%分组错题的第一原因
  - code: least_one_not_split
    description: '''至少一个''(A=1或B=1)≠''不在一起'',前者允许两人同组'
  - code: bound_big_part_space
    description: 绑定后没检查该组空位是否放得下2-3个元素组成的'大零件'
  fix_action: 做12道分组类基础题,每题先写下'分组+每组空位'再动笔,限时100秒/题
  time_budget_sec: 100
  accuracy_rule: 正确率≥85%,四类条件(确定/绑定/隔离/推理)分类判断不许错
  pitfall: 忽略背景限制(总人数与各组空位)是分组题60%-70%错题的原因,例如7个元素分3组既可以是2-2-3也可以是1-3-3,不同分组方式结论完全不同。
