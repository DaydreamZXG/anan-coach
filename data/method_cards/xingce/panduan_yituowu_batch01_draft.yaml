- id: mc_ytw_mixed_queue_group_v2
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列+分组混合
  title: 一拖五-队列+分组混合套路
  recognition: 多个元素分到有顺序的组(第1/2/3天、第一/二/三学年),条件里同时含'谁在谁之前'的顺序类和'同组'绑定类,需先排顺序再定分组。
  applicability:
    include:
    - 9人分3天值班每天3人,含AB同组、A在D前一天这类跨组顺序+绑定条件
    - 4天会议/8门课分学年,含'能源<文化<社会'顺序和'交通信息同天'绑定
    - 6件事分3天含'②在③前一天'+绑定件,需要先分析分组模式
    exclude:
    - 只说1/2/3组但条件中无顺序类关系的题(按普通分组处理,组间顺序视为无效)
    - 纯队列或纯分组题(不跨题型)
  method_steps:
  - 先处理队列顺序再分组空间:顺序类条件是突破口,优先用'跨组顺序'(A在D前一天→A=1则D=2或A=2则D=3)排出组的先后,队列长度一般3-4组
  - 严格区分两种表述:'A在B之前'可同组(组内A早班B晚班),'B在H的前一天'必跨组;混淆必错
  - 跨组顺序+绑定联动逐组填满:A在第二天→B同天;→D第三天→C同天;两组都只剩一空时,H和I必各占一空、不可能同组(高频结论)
  - 数'前面有几个元素'判位:I在A、C之前,且A<B、C<E、EF绑定→I后面至少5个元素→I必在第一天;先分析分组模式(6事分2天=2+4或3+3)再填
  error_signatures:
  - code: cross_vs_within_order
    description: 把'在之前'(可同组)当成'在前一天'(必跨组),跨组关系推错
  - code: bind_need_space_ignore
    description: 绑定件(EF占2格)没检查目标组剩余空位,放进只剩1格的组
  - code: space_mode_miss
    description: 没先分析分组模式(如6事分2天只有2+4和3+3两种)就乱填
  fix_action: 做6道队列+分组混合真题(2020考研休息日/2022考研课程/2025国考),先画'组行+空位'表再填,专项标记'在之前vs在前一天'的判定。
  time_budget_sec: 120
  accuracy_rule: 低频但2025国考刚考,正确率≥70%后再压时间,优先保证跨组判定零失误。
  pitfall: '''A在B之前''是组内关系可以同组,只有明确表述''在前一天''才是跨组——这两种表述混用是这类混合题最大的坑,也是考官最爱埋的点。'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
