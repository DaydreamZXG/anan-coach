    description: 用分组方案时漏用"丁>卫"数量比较排除
  - code: chain_reaction_miss
    description: 二选一条件的连锁反应(后勤被占→卫选工会→王选教育)只推一半
  - code: overflow_capacity
    description: 代入时未核对人数上限(王最多管4个),推出5个却不判矛盾
  fix_action: 做8道人数不固定分组题,每题限时100秒,必须先把分配方案枚举到唯一再逐问
