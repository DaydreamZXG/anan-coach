- id: mc_ytw_group_standard
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/标准分组
  title: 一拖五-分组类标准分组套路
  recognition: 题干明确告知元素总数和每组固定人数(如7元素分第一编队3人/第二编队4人),配隔离/推理/至多/确定类条件。
  applicability:
    include:
    - 明确给出总人数和每组具体人数的分组题
    - 含'甲丙不在同一组''如果乙在一则丁在一''戊和丙至多一个在一''己必在二'这类条件
    exclude:
    - 未告知每组人数的'先确定组空间数量'题(套路3)
    - 按两个属性各分一次再找交集的题(套路2)
    - 同一类别元素须分散在不同组的分类分组题(套路4)
  method_steps:
  - 先写死空间:第一组3空/第二组4空,填入确定条件(己在第二组)后立刻重算两组剩余空位
  - 隔离条件=一边一个:甲丙不同组→各占一组、空间各减1;'至多一个'等价转化为'至少一个在另一组'并写出两个方向箭头(戊在一→丙在二;丙在一→戊在二)
  - 推理条件写逆否:乙=一→丁=一,逆否丁=二→乙=二;假设某元素在某组导致该组超员即矛盾,前件必假(如假设丁在二会带进乙=二导致超员→丁必在一)
  - 剩余空间推理:两边各剩一个空位时,剩余两人只能'一边一个'→它们不可能在同一组(高频答案)
  error_signatures:
  - code: swap_taken_as_fixed
    description: 把甲丙'一边一个'当成甲必在一组,忽略位置可互换而误选'可能为真'项
  - code: space_not_recounted
    description: 填入确定/隔离条件后忘记重算各组剩余空位,后续超员判断失效
  - code: reverse_not_written
    description: 推理条件不写逆否命题,无法用矛盾法锁定位置
  fix_action: 做6道标准分组真题(7元素分3人/4人两组的管综与省联考同构题),每步把两组剩余空位数写在组旁;专项练'乙和庚不可能在同一组'这类结论。
  time_budget_sec: 75
  accuracy_rule: 标准分组是分组类基本功,正确率须≥85%。
  pitfall: 当分组空间被占满、最后两个元素只能'一边一个'时,它们必然不同组——'X和Y不可能在同一组'是标准分组最高频的确定结论,也是选项最爱考的答案。
