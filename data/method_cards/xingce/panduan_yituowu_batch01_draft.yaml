- id: mc_ytw_group_intersect
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/分组两次找交集
  title: 一拖五-分组类两次找交集套路
  recognition: 同一组人按两种不同属性各分一次组(如年龄+性别、学历+性别、年龄+课程),最终求同时满足两个属性的交集元素(如17岁女生)。
  applicability:
    include:
    - 7人按年龄(18岁4人/17岁3人)和性别(女3男4)各分一次
    - 5人按年龄(青年3/中年2)和课程(语文2/数学3)等3+2组型
    - 条件含'XX年龄/性别不同''XX学历/课程相同'两组相同与不同关系
    exclude:
    - 只按一个标准分一次的普通分组题
    - 求的是位置而非属性交集的队列题
    - 没有'最终录用/确定某类人'目标的纯分组题
  method_steps:
  - 第一次分组(属性一):用'乙庚年龄不同'把两人分置两组各占1位;用'甲丙戊年龄相同'当绑定件,发现绑定3人>17岁组剩余2空放不下→甲丙戊必为18岁;据此列出属性一的完整分布
  - 第二次分组(属性二):同法用'甲庚性别不同'+'乙丁己性别相同'重复一遍,列出属性二的完整分布
  - 找交集:分别写出两个属性的候选名单(17岁候选:丁、己+乙/庚之一;女生候选:丙、戊+甲/庚之一),两名单共同出现的元素即答案(只有庚)
  - 五人选组长变式:'年龄相差最大'等价于'一个青年一个中年'(=不同关系),同样走'不同分置+相同放不下归另组'流程
  error_signatures:
  - code: intersection_multiple
    description: 候选名单有多个候选时漏核对,没有逐一取两名单交集
  - code: bind_not_size_checked
    description: 相同关系绑定件没检查'放不放得下'(3人>2空)就乱归组
  - code: candidate_half_missed
    description: 列候选名单时漏掉'或'的另一半(如乙/庚二选一),导致交集找错
  fix_action: 做5道'分组两次找交集'真题(2010江苏/2012管综/2023江苏/2024山东/2018浙江),每道强制先写两个候选名单再找交集,检查是否含'或'项。
  time_budget_sec: 90
  accuracy_rule: 套路固定,正确率≥85%后可压到90秒内完成。
  pitfall: 交集元素必须是两个候选名单的交集,而候选名单常含'或'项——17岁候选是'丁、己+乙/庚之一',女生候选是'丙、戊+甲/庚之一',别只列确定的那几个导致交集算错。
