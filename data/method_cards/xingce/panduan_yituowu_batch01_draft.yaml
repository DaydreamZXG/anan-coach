- id: mc_yituowu_duilie_bangding_weizhi
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类/绑定位置排除
  title: 一拖五-队列类绑定位置排除套路
  recognition: 给N天值班/座位,元素带"X必须在Y前一天/紧挨Y"的绑定条件,并叠加位置禁用条件
  applicability:
    include:
    - 值班排班、站位排序,带"紧挨前/后一天"绑定
    - 带链式绑定(如研发→后勤→法务)的队列题
    - 绑定+固定禁用位置(如法务≠第2/4天)叠加的题
    exclude:
    - 无绑定、只有"谁在谁之前"宽松顺序的题(改用顺序类位置排除)
    - 分组题(不涉及前后位置)
    - 大跨度"隔几排"题(用大跨度条件卡)
  method_steps:
  - 把绑定翻译成箭头图:研发→后勤→法务,并逐元素列出位置禁区
  - 一步推理:由"后勤→法务"+"法务≠第2/4天"推出后勤≠第1/3/6天(第6天后无位置给法务)
  - 用禁区清单快速排除非法位置;问"可能值"时先列候选位置再逐个排除
  - 有链式绑定时检查边界:绑定尾元素不能放最后、头元素前面要留出后续绑定位置
  error_signatures:
  - code: forget_tail_slot
    description: 忽略绑定尾元素后面还必须空位,把后勤排在第6天
  - code: ignore_chain_dependency
    description: 有研发→后勤→法务链时只看相邻一条,漏掉研发的前置位置限制
  - code: count_people_mistake
    description: 涉及"每个部门推荐2人"时错把部门数当人数,名额耗尽判断失误
  - code: bind_direction_reverse
    description: 把绑定方向搞反(研发→后勤记成后勤在前),禁区清单整体出错
  fix_action: 做12道队列类绑定题,每题限时90秒,重点练"一步推理列禁区清单"
  time_budget_sec: 90
  accuracy_rule: 绑定+位置排除题正确率≥85%
  pitfall: 绑定有方向:研发→后勤→法务表示研发在前、法务在后;位置禁区要按方向从尾元素反推,漏掉"后勤不能在第6天"这类尾空位即错。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
