- id: mc_grouping_space_count
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/组空间数量
  title: 一拖五-先确定组空间数量
  recognition: 题干只说元素分几组、不说每组几人，但给组间数量关系('A组比B组多')，需先算每组空间数
  applicability:
    include:
    - 5人分3组每组1-2人→唯一模式2-2-1
    - 有'某组最多/最少/一样多'或'至少n人'的数量线索
    - 逻辑箭头后件与已定人数矛盾的题
    exclude:
    - 题干已明确每组人数的标准分组
    - 没有组间数量关系的题
  method_steps:
  - 第一步:按'每组1-2人'等限制+总人数，穷举出唯一分组模式(5人分3组→2-2-1)
  - 第二步:用数量关系('X比Y多'→X=2人、Y=1人)把各组空间数定死
  - 第三步:逻辑箭头后件与某组人数矛盾(如'只有戊选陈老师'但陈老师=2人)→后件必假→逆否得前件假
  - 第四步:排除已定元素后，剩余元素必须填满剩余空间，逐组补全
  error_signatures:
  - code: mode_list_incomplete
    description: 穷举分组模式漏情况(6人分4组有2-2-1-1与3-1-1-1两种)
  - code: consequent_contradiction_miss
    description: 没发现'只有X在A组'与'A组应2人'矛盾
  - code: double_role
    description: 同一元素被分进两个组
  - code: average_assumption
    description: 只知道几组人数之和却默认平均分配
  fix_action: 做8道组空间数量题，限时110秒/题，第一步必须写出分组模式再动笔
  time_budget_sec: 110
  accuracy_rule: 80%以上
  pitfall: '''只有X选A组''意思是A组只有X一人，若A组实际应2人则后件必假→逆否推前件，这是最常用的突破口'
