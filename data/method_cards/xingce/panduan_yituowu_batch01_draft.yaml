- id: mc_ytw_group_classified
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/分类分组
  title: 一拖五-分组类分类分组套路
  recognition: 不同元素分成几类(菜/椒/瓜/豆),同一类别元素不能在同一组,每组从每类中各取一个(如12种蔬菜分3餐,每餐菜椒瓜豆各一)。
  applicability:
    include:
    - 12种蔬菜分早中晚三餐、每餐'菜椒瓜豆各一'这类'每类取一个'题
    - 各大洲国家分三组、每组每洲选一个(每类取一个)
    - 条件含绑定(黄椒=豇豆)与排斥(芹菜≠黄椒)需要传递推理
    exclude:
    - 组与组之间有顺序的队列+分组混合题
    - 同一元素可重复出现在多组的题(每类取一个意味着同类必须分散)
  method_steps:
  - 先标出全部排斥/绑定关系并做传递推理:芹菜≠黄椒且黄椒=豇豆→芹菜≠豇豆;A=B且B=C→A、B、C三者同组
  - 已知一组已含三类元素时,先确定该组占用了哪些类别,剩余同类元素必分到其他组
  - 用'同类不共组'两两排除:某元素因所在组已有同类只能换组,再配合绑定条件(黄椒=豇豆)锁定其最终组位
  - 新增类别(如加南美洲)不影响原有推理框架,只需把新条件(巴西=法国、巴西≠韩国)纳入已有分组逐步排除
  error_signatures:
  - code: same_class_together
    description: 把同类两个元素放进同一组,违反'每类取一个'的核心规则
  - code: transitivity_ignore
    description: 只看到直接关系,没做排斥与绑定的传递推理(芹菜≠豇豆)
  - code: group_unordered_mistake
    description: 把无顺序的组当有顺序处理,推出多余的位置关系
  fix_action: 做5道分类分组题(2024天津蔬菜/国家分组),每步先写'同类分散'约束再填,错误只复盘在'同类同组'和传递推理两类错因上。
  time_budget_sec: 75
  accuracy_rule: 低频考点(考研公考各考一次),会做即可,正确率≥70%。
  pitfall: 排斥传递(A≠B且B=C→A≠C)与同组传递(A=B且B=C→三者同组)是两条不同的推理规则,同组传递只适用于绑定关系、不能跨组推,混淆即错。
