- id: mc_ytw_fenzu_space_count
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/空间数量
  title: 一拖五-分组类套路3先确定组空间数量
  recognition: 题干只告知分几组与每组人数范围,未告知各组具体人数,需先算出各组空间才能推理。
  applicability:
    include:
    - '''5人分3组,每组1-2人''''6名员工申报4种奖项,每种1-2人''这类只有总人数+范围'
    - 条件含组间数量关系('陆老师比张老师多''南山最少''A和B人数一样多')
    - 条件含逻辑箭头,其后件与已知组人数矛盾('只有戊选择陈老师'但陈老师有2人)
    exclude:
    - 题干已给每组具体人数的分组题(用标准分组套路)
  method_steps:
  - 定唯一分组模式:5人分3组每组1-2人⇒唯一'2-2-1';6人分4组每组1-2人⇒'2-2-1-1'
  - 用组间数量关系定各组分值:'A比B多'⇒A=2、B=1;'A最少'⇒A=1;'A和B一样多'⇒同为2
  - 检查推理条件后件是否与空间矛盾('只有X选某组'但该组有2人)⇒后件必假,逆否得前件为假
  - 剩余元素按各组分值填满空位,同一人不能同时分两组
  error_signatures:
  - code: skip_group_volume
    description: 不先算每组空间数量直接推元素位置
  - code: miss_posterior_contradiction
    description: 推理条件后件与已算出的组人数矛盾时,没识别后件必假并逆否
  - code: assume_average
    description: '''乙丁辛共2人''只知道总和,却默认三人平均分配'
  fix_action: 做8道'空间数量'真题(2021管综/2022省联考志愿者/2025浙江度假/市场部招聘),每题限时120秒
  time_budget_sec: 120
  accuracy_rule: 正确率≥80%,第一步必须先列出分组模式再动笔
