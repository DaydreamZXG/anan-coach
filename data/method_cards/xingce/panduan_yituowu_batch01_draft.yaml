- id: mc_yituowu_bukeneng_sha
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/通用/不可能项与必真项判断
  title: 一拖五-不可能项与必真项判断套路
  recognition: 问"以下哪项不可能/一定为真",题干有多条条件且部分为"如果…则…"或二选一绑定
  applicability:
    include:
    - 问"不可能"的选项判断(20/21/17年均有)
    - 问"一定为真"需分情况讨论找共同结论的题(24年)
    - 选项会同时限制多个条件的题
    exclude:
    - 问"可能为真/符合条件"的题(改用首问代入排除卡)
    - 问数量或最值的题
    - 选项只涉及单一无限制元素的题(信息不足无法判断)
  method_steps:
  - 不可能项:优先验证"同时限制最多条件"的选项——限制条件越多越容易推出矛盾
  - 优先验证带触发条件的选项:如"如果丁=人事则李=财务"这类前件为真的选项必触发限制
  - 一定为真:对关键元素分2-3种情况逐一构造可行方案,找所有情况下的共同结论才是必真
  - 代入验证一旦推出矛盾立即选该选项,无需验证其余选项
  error_signatures:
  - code: possible_is_not_must
    description: 把某种情况"可能成立"当成"必然成立"(19年第三问B选项陷阱)
  - code: verify_low_constraint_first
    description: 先验证限制少的选项,白费时间构造可行解
  - code: ignore_max_capacity
    description: 推出某元素占用数量超过上限(如王最多管4部门)却不判矛盾
  - code: single_branch_conclusion
    description: 分情况讨论时只推一种情况就下"必真"结论
  fix_action: 做10道"不可能/一定为真"型题,每题限时100秒,先练"锁定限制最多选项"再动手验证
  time_budget_sec: 100
  accuracy_rule: 此类题难度中等偏上,正确率≥80%;问"一定为真"时答案必须能由条件必然推出
  pitfall: '"可能为真"和"一定为真"是两回事:构造出一种可行方案只能证"可能",要证"必真"必须排除其他所有情况;考官常用"可能真"选项做陷阱。'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
