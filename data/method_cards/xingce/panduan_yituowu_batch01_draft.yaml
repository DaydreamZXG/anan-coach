- id: mc_ytw_fenzu_pairing
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/配对
  title: 一拖五-分组类配对模型(有男必有女/人员配教授)
  recognition: 条件要求两类元素必须配对不能单独出现('凡有男性的社区必须有女性''工作人员必须有教授陪同')。
  applicability:
    include:
    - 三男三女分四社区,有男性去的社区必须有女性
    - 工作人员与教授分项目,双方都不能单独出现
    - 问某人必去某地/某两人不能同时在某项目
    exclude:
    - 无'必须配对'约束的普通分组题
  method_steps:
  - 识别配对规则:男性不能单独出现、工作人员必须有教授陪、教授必须有工作人员陪
  - 把已确定的配对对象逐个填入位置(张去A或B、李去C、乙去D),排除已占用者
  - 找剩余唯一候选人:剩下的唯一女性王必去D配乙;唯一能陪钱教授的人必去历史
  - 反推排除项:某两人中必有一人陪教授⇒他俩不可能同时出现在某项目
  error_signatures:
  - code: single_element_left
    description: 忽略'有男必有女''人员须配教授'约束,把可单独的元素当必须配对或漏掉配对元素
  - code: pairing_direction_wrong
    description: 把'女性可单独'当成'女性也必须配对',方向反了
  fix_action: 做4道配对模型真题(2023广东男女配对/2024江苏工作人员+教授配对),每题限时80秒
