- id: mc_ytw_fenzu_classified
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/分类分组
  title: 一拖五-分组类套路4分类分组
  recognition: 不同类别元素分几组,同一类别的元素不能在同一组(每组各类各取一个)。
  applicability:
    include:
    - 蔬菜分'菜椒瓜豆'四类共12种分3餐、国家分'亚北美欧'三洲分3组,每组各类取一个
    - 条件给'芹菜不能与黄椒同组''黄椒必须与豇豆同组'等排斥/绑定关系
    - 已知某组已有几种元素,推剩余元素位置
    exclude:
    - 元素不分类、每组无'各类各取一个'限制的普通分组题
  method_steps:
  - 标出所有排斥(≠)与绑定(=)关系,先找绑定关系
  - 传递推理:A≠B且B=C⇒A≠C;A=B且B=C⇒A、B、C三者同组
  - 已知某组元素时:该组已占的类别,其余同类元素必须分散到其他组
  - 用绑定条件锁定位置:黄椒=豇豆,则豇豆所在组必须放黄椒;再配合排斥条件逐格填充
  error_signatures:
  - code: confound_ne_relationship
    description: 混淆'不能同组'(排斥)与'必须同组'(绑定)两类关系
  - code: skip_transitivity
    description: 忽略传递推理:A≠B且B=C应推出A≠C
  - code: miss_class_disperse
    description: 已知某组占了某类后,没把其余同类元素强制分散到其他组
  fix_action: 做6道分类分组题(2024天津真题+蔬菜/国家模型),每题限时90秒
  time_budget_sec: 90
  accuracy_rule: 正确率≥80%
  pitfall: 组与组之间没有顺序(不区分早/中/晚),只关注元素是否在同一组;题目问'哪项不可能'时别用'可能'推理作答。
