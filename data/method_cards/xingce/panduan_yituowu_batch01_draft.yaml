  - code: singleton_violation
    description: 忽略"教育不能单蹦",把只做教育的方案当合法
  - code: trigger_condition_order
    description: 没优先验证含前件(如丁=人事)的选项,先验无关选项浪费时间
  - code: orphan_task
    description: 推出一项工作无人可做(如人事没人能管)却未识别为矛盾
  fix_action: 做10道带"如果…则…"的分组题,每题限时90秒,先把所有条件翻译成符号再动笔
