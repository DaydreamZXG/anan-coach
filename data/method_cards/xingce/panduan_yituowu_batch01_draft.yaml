- id: mc_ytw_sudoku_basic
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/数独/基础三技巧
  title: 一拖五-数独基础三技巧(唯一空格/双空格/三空格)
  recognition: 给出4×4或5×5表格,每行每列填入的数字/词不能重复,问某个空格的内容(题干常隐藏为'每个人调研的城市均不同'之类的话)。
  applicability:
    include:
    - 4×4表格填1-4数字或四字词(国考/江苏送分题)
    - 5×5表格填数字/五谷/五词,只问某个特定空格
    - 题干出现'每月中4人调研的城市均不同'这类每行每列不重复的描述
    exclude:
    - 带对角线或粗线区域框附加条件的变形数独(另有专门技巧)
    - 需要填满全表才能作答的题(通常只问部分空格,不必全填)
  method_steps:
  - 立刻画表:行/列代表两类元素(人物×城市,格内填顺序数字),先把题干确定的对应关系填入(王3月苏州→王行苏州列填3)
  - 技巧一唯一空格法:某格所在行列已含其余全部元素→填唯一缺失的那个(行有2,3列有1,4→只能填5)
  - 技巧二双空格法(主力,60%-70%题靠它):某行列剩两空时先定两空可能组合,再用其中一空所在列/行的已有数排除一个可能性,锁定另一个;填入后往往生成新的'两空格'行列,连锁推进
  - 只推到题目所问的空格即可停,不必填满全表;排除法把选项缩小到两个时,推一个关键格即可锁定答案
  error_signatures:
  - code: row_col_cross_miss
    description: 只看行或只看列,漏掉行与列交叉共同约束某格
  - code: overfill_whole_grid
    description: 把整个数独填完才看选项,白白浪费时间
