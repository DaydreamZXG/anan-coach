  recognition: 元素分进有顺序的组(第1/2/3天、第1-4季度)，且条件含'谁在谁之前/前一天'(2025年国考一拖五即此型)
  applicability:
    include:
    - 分组且有组间顺序(每天3人、每季度几次)
    - 绑定(同组)+跨组顺序(前一天)+组内顺序混合
    - 组内顺序与跨组顺序并存(如'A在B之前'可同组、'B在H前一天'必跨组)
    exclude:
    - 只有分组、无顺序类条件的题(按普通分组处理)
    - 组间编号无顺序意义的题
  method_steps:
  - 先确认有无顺序类条件；若无则按普通分组做
  - 优先排队列顺序:处理'前一天/之后'的跨组顺序，定出跨组两两位置(通常2种可能)
  - 再算组空间:每组容量上限(每天3人/每季度次数)挤压元素归属，绑定同组条件同步生效
  - 组只剩1个空位时剩余两元素必各占一组→不可能同组；每问附加条件用于排除排列
  error_signatures:
  - code: ignore_queue_condition
    description: 题目有顺序条件却当普通分组做
  - code: before_vs_previous_confuse
    description: 混淆'A在B之前'(可同组可跨组)与'A在B前一天'(必跨组)
  - code: space_capacity_forget
    description: 忘了每季度/每天容量上限，超员仍往下推
  - code: leftover_pair_same_group
    description: 两组各剩1空时仍认为剩余两人可能同组
  fix_action: 做5道队列+分组混合题(含2025年国考真题)，限时120秒/题，先排顺序再算空间
