- id: mc_yituowu_rukou_dairu
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/通用/首问代入排除
  title: 一拖五-首问代入排除套路
  recognition: 一拖五第1问几乎都问"以下哪项符合/可能",题干只给基础条件、无附加条件
  applicability:
    include:
    - 第1问"符合全部条件/可能为真"的直接判断
    - 选项给出完整排列或完整分组、需整体验证的题
    - 附加条件出现但选项只判断单点是否可能的题
    exclude:
    - 问"一定为真/不可能"的题——代入只能证伪不能证必真
    - 问数量或最值(如"最多隔几排")的题
    - 需从条件推出唯一结论的题
  method_steps:
  - 把每个条件先翻译成"可快速验证的否定句":如"法务≠第2/4天""后勤后面必须接法务"
  - 逐条代入选项,顺序固定为:先验顺序/位置类条件(秒杀),再验绑定/二选一类条件
  - 验"充分条件"时注意方向:题干若为"如果有X则Y",选项不含X则不受该条约束,不要误判
  - 排除到只剩一项即为答案,无需再验证其余选项
  error_signatures:
  - code: ignore_sufficient_condition
    description: 把"若有后勤则接法务"当成"必须安排后勤",误排合法选项
  - code: validate_in_wrong_order
    description: 先验复杂的二选一条件浪费时间,应优先验位置/顺序类条件
  - code: over_verify
    description: 已排除到唯一答案后仍逐个验证其余选项,浪费答题时间
  - code: treat_possible_as_must
    description: 把"可能为真"的选项当成"一定为真"选入
  fix_action: 做15道一拖五首问型题,每题限时90秒,重点练"先验位置条件、后验绑定条件"的验证顺序
  time_budget_sec: 90
  accuracy_rule: 首问属送分题,正确率要求100%,每问不超过1.5分钟
  pitfall: 选项验证要盯充分条件方向:题干是"如果有后勤则接法务",选项里有后勤才需查其后面;无后勤的选项不受此条限制。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
