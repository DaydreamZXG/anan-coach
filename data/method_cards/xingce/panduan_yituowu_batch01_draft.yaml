  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/分类分组
  title: 一拖五-分类分组
  recognition: 元素按类别(菜/椒/瓜/豆、大洲)分组，同类元素不能同组，每组各类取一个
  applicability:
    include:
    - 每类n种元素分m组、每组各类恰一个
    - 绑定(必须同组)与排斥(不能同组)的传递推理
    - 已给某组元素、求剩余元素归属
    exclude:
    - 不限制'同类不同组'的普通分组
    - 元素不属于任何类别体系的题
  method_steps:
  - 标记传递关系:A≠B且B=C→A≠C；A=B且B=C→三者同组
  - 已知某组元素时，先列该组已占的类别，其余同类元素必分到其他组
  - 结合绑定条件锁定位置:某类别在某组已被占，则对应绑定元素只能去有该类空位的组
  - 按'每组各类各一个'网格逐步填满
  error_signatures:
  - code: transitivity_miss
    description: 忽略A≠B且B=C可推出A≠C的传递关系
  - code: category_duplicate
    description: 同类别两个元素放进同一组，违反'同类不同组'
  - code: ignore_occupied_slot
    description: 某组该类别已被占，仍把同类的另一个放进去
  - code: binding_against_rejection
    description: '''必须同组''与''不能同组''冲突时没按排斥优先排除'
  fix_action: 做5道分类分组题，限时100秒/题，先标出所有排斥与绑定再填网格
  time_budget_sec: 100
  accuracy_rule: 80%以上
  pitfall: '''同类不同组''是主约束，所有推理都围绕每组各取一个类别展开，忘了这层每步都错'
