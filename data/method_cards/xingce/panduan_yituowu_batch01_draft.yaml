- id: mc_queue_fill_up
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类/占满法
  title: 一拖五-数量占满法
  recognition: 两类元素数量之和恰好等于槽位总数(6瓶12球红3绿3；7天每天2部电影科幻3武侠3=剩余6天)
  applicability:
    include:
    - 每个槽位放2个的配对题(球入瓶、电影排期、课程复习)
    - 给出'某两类不能同槽'约束的题
    - 加'同类连续'附加条件的排期题
    exclude:
    - 每槽放1个的普通排列题
    - 没有明确槽位数量的题目
  method_steps:
  - 先做数量加法:算两大类的数量之和是否等于槽位总数(红3+绿3=6瓶)
  - 若相等且两类不能同槽→每槽必且只能放这两类中的一个，另一组散类(白3黑2蓝1=6)每槽一个
  - 推出散类中任意两个不能同槽(白黑、白蓝、黑蓝都不行)，直接对应'不可能同槽'选项
  - 有'连续'附加条件时，把已占满的两大类按连续段摆好(前3天/后3天)，再排散类
  error_signatures:
  - code: skip_quantity_calc
    description: 不先算数量之和，直接穷举组合
  - code: forget_residual_rule
    description: 占满后没意识到散类元素每槽只能放一个、任意两个散类不同槽
  - code: ignore_fixed_slot
    description: 没注意'周四已放2部科幻'，基数没先从总数里扣掉
  - code: pair_assume
    description: 误以为同类两两同槽，实际靠'数量之和=槽位数'逼出每槽必放其一
  fix_action: 做6道占满法题目，限时100秒/题，每题先写出两个数量加法
  time_budget_sec: 100
  accuracy_rule: 85%以上
  pitfall: '''红绿不同槽''不是简单互斥，真正的钥匙是''数量之和恰好=槽位数''→每槽必放其一，丢掉这一步本题全废'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
  validation:
    tested_count: 0
    passed_count: 0
    sample_question_ids: []
