  title: 一拖五-分组类人数不固定分组套路
  recognition: 题干"N元素分M组"但未说明每组人数,并带"丁分管数量>卫分管数量"这类组间数量比较
  applicability:
    include:
    - N元素分M组且每组人数不定的题
    - 带组间数量比较条件(如A>B)的题
    - 带二选一条件(王管教育或工会之一)的题
    exclude:
    - 每组人数固定的分组题(用简单分组卡)
    - 队列排序题
    - 无数量比较的分组题
  method_steps:
