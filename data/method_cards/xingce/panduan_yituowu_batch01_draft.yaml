  title: 一拖五-数独
  recognition: 4×4/5×5表格每行每列元素不重复，题干出现'每月4人调研的城市均不同'等描述
  applicability:
    include:
    - 4×4、5×5方阵填数字/词汇
    - 行+列不重复；进阶加对角线或粗线框区域不重复
    - 问某个空格/某一行的内容
