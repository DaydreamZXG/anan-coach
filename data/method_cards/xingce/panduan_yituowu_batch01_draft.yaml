- id: mc_yituowu_duilie_dakuadu
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/队列类/大跨度条件
  title: 一拖五-队列类大跨度条件套路
  recognition: 条件形如"文具与调料隔3排""粮油在零食之后隔2排",给出两点间距或位置差值
  applicability:
    include:
    - '"A与B隔N个位置/排"型条件'
    - '"A在B后N位"型条件'
    - 问"某元素不可能在的位置"或"最多隔几排"的题
    exclude:
    - 只含相邻绑定的题(改用绑定位置排除卡)
    - 分组题
    - 无条件间距的宽松顺序题
  method_steps:
  - 区分"隔N排"与"中间隔N个格子":前者间距=N,后者间距=N+1,先统一记数口径
  - 大跨度条件列位置方程:A在p位→B在p+N位,由首尾边界推出A、B的位置禁区
  - 两个大跨度条件必须"相交"(共用位置):用位置带互相约束缩小范围
  - 问"最多隔几排":把两个大跨度条件分别推向两端,再算中间最远间距
  error_signatures:
  - code: count_gap_wrong
    description: '"隔3排"与"中间隔3格"混淆,记数口径不一致导致位置推算整体偏移'
  - code: not_consider_intersect
    description: 忽略两个大跨度条件必须共用位置,范围不收敛
  - code: forget_boundary
    description: 大跨度条件推到首尾边界时未检查是否越界
  - code: space_overrun
    description: 多个条件叠加时未算总占位(超过总排数),该判无解或该验证的漏掉
  fix_action: 做10道大跨度条件题,每题限时100秒,动笔画位置轴辅助推算
  time_budget_sec: 100
  accuracy_rule: 大跨度题正确率≥75%
  pitfall: '"隔3排"与"间隔3个格子"是两种记数,全题必须用同一口径,一个选项口径错整题崩;同时大跨度条件必须相交(共用位置)才能收敛范围。'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
