- id: mc_ytw_fenzu_two_dim
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/分析推理/一拖五/分组类/二维分配
  title: 一拖五-分组类单题模型:先选组再选档
  recognition: 每人既要选'组'(书/营/部门),又要选'档'(专题数/时段/档次),组与档双重约束。
  applicability:
    include:
    - 4人分3组×3档,条件:'1人选1档、2人选2档、1人选3档'+某两人'组与档均不同'
    - 确定类条件如'小李选第三卷''小白选综合素质营第三档'
    - 问某人的档位数或某人在某组某档
    exclude:
    - 只有单一维度(只分组或只排队)的题
  method_steps:
  - 先定组:由确定类条件+剩余填补推出各组归属(4人选3组,锁定2人后剩1人必去剩余组)
  - 再定档:档位数量分布(1/2/2/3档)已知,确定类条件锁定某人档位
  - '''两人组不同且档不同''⇒两人档位必为1档与2档各占一个,剩余名额必属确定的那个人'
  - 选答案时区分必然真/可能真
  error_signatures:
  - code: must_vs_possible
    description: 把可能成立选项当必然成立(如'小赵选第一卷2档'可能为真但非必然)
  fix_action: 做5道'先选组再选档'真题(2021/2025浙江+预测值班题),每题限时100秒
  time_budget_sec: 100
  accuracy_rule: 正确率≥85%,每道都要能讲清'哪些必然、哪些可能'
  pitfall: '''小赵选择了第一卷的2个专题''只是可能成立(小赵也可能选1档),只有确定类条件锁定的那人才是必然。'
