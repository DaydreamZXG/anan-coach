- id: mc_graph_jue13_blackwhite
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/图形整体轮廓相同
  title: 图形整体轮廓相同-黑白运算
  recognition: 多图形外轮廓完全相同、内部有黑有白(点/星可视为黑),以两幅图或九宫格呈现时,直接进入黑白运算思维。口诀:整体轮廓若相同,有黑有白算黑白。黑白运算占轮廓相同类考点的23%,与旋转翻转合计超80%。
  applicability:
    include:
    - 九宫格或两幅图,轮廓相同且有黑有白
    - 黑白块数量多、格子规则
    - 轮廓相同+黑白但直接算不通→考虑先旋转再运算
    exclude:
    - 只有一幅图(连续多图)→多为旋转/平移/遍历,黑白运算概率低
    - 黑块很少(2-4个)且轮廓不同→提示图形考点
    - 纯单色线条、无黑白对比→求异/求同
  method_steps:
  - 先判图形数量:两幅图或九宫格+有黑有白→黑白运算
  - 看四个选项,找颜色不同的一处位置(差异定位)
  - 在题干前两图(或九宫格前两行)同一位置找该颜色的运算组合(如白+黑),得结果排除不符合的选项
  - 再找下一个差异位置重复,直至唯一答案(熟练后20秒内)
  error_signatures:
  - code: forget_rotate
    description: 黑白运算+旋转题只做运算忘了旋转(正确率仅44%)
  - code: whole_grid_slow
    description: 整图逐格运算浪费时间,应从选项差异位置反推
  - code: assume_horizontal
    description: 九宫格默认横看,横行规律被破坏时不转竖行验证(2023省联考大坑)
  fix_action: 做5道九宫格/两幅图黑白运算题+3道黑白运算+旋转复合题,限时40秒/题,每题先找选项差异位置再运算
