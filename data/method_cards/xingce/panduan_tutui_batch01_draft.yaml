- id: mc_one_face_arithmetic_operation
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/一个面
  title: 一个面-数量加减运算
  recognition: 前90%常规规律都无效、图形可量化为数字(面/线/点/对称轴数)时,考虑图形间数量加减;此类题型在1600道中约60道(加法30道+减法30道),低频但易错
  applicability:
    include:
    - 两幅图/九宫格形式,每图考单一属性,前两图数字之和=第三图
    - 三图数字之和构成规律(3+2+5=10)
    - 分类分组题每图考两种属性,两属性相减成等差(面数-交点数)
    - 出现'零交点'图形时优先考虑加减而非等差
    exclude:
    - 常规规律(对称/面数/笔画/线点)已验证出唯一解
    - 图形太复杂无法快速量化
    - 数字序列本身成等差数列且唯一(不必硬套加减)
  method_steps:
  - 在图形旁直接标注数字(面/线/点/对称轴数),先验证单一属性(面最快1秒)
  - 两图/九宫格:验证'前两图数字之和=第三图',九宫格要验证两行以上
  - 分类分组:同时记录两种属性(如面数和交点数),相减看差值是否成等差或恒定
  - 曲线与直线分开统计,验证直线数-曲线数是否恒定(±1)
  error_signatures:
  - code: only_single_attribute
    description: 只记单一属性,漏掉'面数-点数=等差'的双属性减法规律
  - code: mechanical_sequence
    description: 机械找1,2,3,4,5递增,没看出加法关系(1+2=3,2+3=5)
  - code: merge_curve_line
    description: 曲线直线合并计数,曲直差值规律丢失
  - code: mental_math
    description: 只靠心算不书面标注,漏数字
