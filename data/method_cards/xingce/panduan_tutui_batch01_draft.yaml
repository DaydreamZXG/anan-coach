  - code: wrong_angle
    description: 旋转角度判断错(90°还是180°)
  fix_action: 做3道黑白运算+旋转复合题,限时50秒/题,做题先标'先转再算还是先算再转'
  time_budget_sec: 50
  accuracy_rule: 70%以上(此类题历年正确率40-48%,达到70%即领先)
  pitfall: 运算与旋转的先后顺序决定结果,必须用'直接算规则是否统一'来判断是否需要先旋转
