  title: 汉字-面数量（口月日田）
  recognition: 看到汉字题、题干出现口/月/日/田等封闭部件时优先数封闭区域——这是汉字题最大考点,占35%,70%以上汉字题可快速解决
  applicability:
    include:
    - 含口/月/日/田/目等可明确区分1/2/3/4个面的部件
    - 面数呈等差/递增/分组/相邻相加规律(0+2=2、2+2=4)
    - 文字+抽象图形混合题(封闭区域特征两域通用)
    exclude:
    - 全部汉字都0个面且无控制部件时
    - 立体图形混合时(立体图无法按平面数面)
    - 选项面数无差异时
  method_steps:
  - 数每个字图形实际封闭区域数:口=1、月=2、日=3、田=4;月旁无封闭不算面
