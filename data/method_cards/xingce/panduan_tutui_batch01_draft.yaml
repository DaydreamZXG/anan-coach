    - 多根线密集交叉(先数奇点而非死记)
  method_steps:
  - 用去框法:去掉封闭外框(仅与点相交的框可直接去),看剩余部分
  - 剩余部分能一笔画出→一笔画;需两笔→两笔画;三笔→三笔画
  - 用奇点复核:连通图形奇点数为0或2是一笔画,4个奇点两笔画
  - 背典型图形库:一笔画(五角星/O形/S形),两笔画(十字/H形/A形),5秒内判定为熟练
