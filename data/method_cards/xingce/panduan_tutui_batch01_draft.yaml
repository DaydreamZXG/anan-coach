  module_name: 判断推理
  tag_path: 判断推理/图形推理/图形整体轮廓相同
  title: 图形整体轮廓相同-样式遍历
  recognition: 一幅图中轮廓相同、内部样式多样(白色/横线/斜线/网格/黑色),各样式出现次数相同,想到样式遍历。遍历仅占轮廓相同类的3%,几乎不单独考,常与其他考点结合。
