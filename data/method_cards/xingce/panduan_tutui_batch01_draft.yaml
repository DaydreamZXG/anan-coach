- id: mc_one_line_symmetry
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/一根线
  title: 一根线-对称性(对称轴方向/中心对称)
  recognition: 一根线图形明显对称、或所有图形均为对称图形时优先验证对称性;对称性在一根线考点中占8%,在全图推占比12%为最高频
  applicability:
    include:
    - 轴对称/中心对称图形
    - 对称轴方向旋转规律(平行→斜45°→垂直→横向)
    - 分类分组题(轴对称vs中心对称vs双重对称)
    exclude:
    - 图形明显不对称
    - 一笔画已唯一判定
    - 对称无规律时立即转向数量
  method_steps:
  - 判断每个图形:轴对称/中心对称/双重对称
  - 所有图对称→观察对称轴数量或方向变化(如每次旋转45°)
  - 分类分组:按对称类型分两组(如纯轴对称 vs 轴对称+中心对称)
  - 选项验证唯一符合项,排除多对称轴或中心对称的干扰项
  error_signatures:
  - code: skip_symmetry
    description: 未先验证对称直接数数,漏掉最高频考点
  - code: axis_direction_ignored
    description: 只判是否对称,忽略对称轴方向变化的旋转规律
  - code: confound_symmetry_types
    description: 混淆轴对称与中心对称,选错分类
  fix_action: 做15道对称性图推题,限时30秒/题,每图标注对称类型和对称轴方向
  time_budget_sec: 30
  accuracy_rule: ≥90%
  pitfall: 对称性是全图推最高频考点(12%),必须作为遍历第一优先级;对称+一笔画复合考点要分步处理
