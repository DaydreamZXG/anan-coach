- id: mc_hanzi_zigraph
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/汉字
  title: 汉字-相同子图形（共同部件）
  recognition: 多个汉字反复出现相同偏旁/部件(日/口/心/贝/乂/立)或'撇、横竖'等简单笔画时,考虑共同子图形——占比25%,考官称'最有技术含量'
  applicability:
    include:
    - 汉字含重复部件且结构复杂(日/口/心/贝/乂易识别)
    - 问号在中间提示递增数列(如撇数3-?-5)
    - 汉字与几何图形混合、所有图形含同一四边形结构
    exclude:
    - 选项都含同一部件时(如四选项全含'木'是干扰项)
    - 部件特征在选项间无法区分时
  method_steps:
  - 先排除面数、笔画数(常无规律)
  - 找题干所有图形共有的子图形部件:撇/横竖需计数(一撇两撇三撇递增),复杂结构看有无
  - 选项选唯一含该部件或数量递增匹配的那项
  - 若多项符合,结合结构/笔画二次筛选
  error_signatures:
  - code: count_only_existence
    description: 对撇/横竖只看有无不看数量递增,导致多个选项符合
  - code: fake_common_part
    description: 被所有选项都有的'木'类干扰部件迷惑,以为找到了规律
  - code: partial_misjudge
    description: 把相似笔画误当完整部件(如'背'字部件识别错)
  fix_action: 做15道汉字相同子图形真题,限时45秒/题,练'撇/横竖计数递增+复杂部件有无'双识别
