- id: mc_graph_jue17_intersection
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/阴影
  title: 阴影-与外框/白块相交关系
  recognition: 阴影对称/边数都无规律时,看阴影与外框、与相邻白块的相交关系。占阴影考点的50%以上,是近年国考/省考高频。口诀:再查外框/白块相交。
  applicability:
    include:
    - 阴影与外框相交边数(1边/2边分组)或相交位置(下→右→上→左循环)
    - 阴影与白块相交数量(固定3个/4个,或三一分布/二二分布)
    - 分类分组题且结构完全相同时排除面积
    exclude:
    - 外框规则可算面积→面积题
    - 阴影可对称、边数有规律→先看对称边数
  method_steps:
  - 排除对称、边数规律后,看阴影与外框相交:相交几条边/相交位置
  - 再看阴影与相邻白块的相交数量(交3个还是4个)
  - 按相交边数或'三一分布/二二分布'分类分组
  error_signatures:
  - code: forget_intersection
    description: 只知道对称边数,不知道看相交关系(75%考生不会)
  - code: miss_distribution
    description: 没区分三一分布(3+1)与二二分布(2+2)
  - code: repeat_edge
    description: 没注意'相交于不同边'与重复相交同一边的区别(2026国考分组依据)
