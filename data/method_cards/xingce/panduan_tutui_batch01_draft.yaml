- id: mc_one_line_faces
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/一根线
  title: 一根线-面数量
  recognition: 纯线条图形数封闭区域(默认0面,每封闭1区+1面),面数呈等差/恒定/交替/分组时考面数量;一根线考点中面占11%
  applicability:
    include:
    - 多根线围成封闭区域的图形
    - 单线弯曲成环(1个环=1个面)
    - 面数递增1,2,3,4、或交替2,3,2,3
    exclude:
    - 纯开放单线无线框(0面无区分度)
    - 一笔画/对称已唯一判定
    - 面数无规律
  method_steps:
  - 数封闭区域数量:一个封闭环=1面,两个相交环=2面,嵌套逐层数(如Q形=1面)
  - 列各图面数找等差/恒定/交替/分组规律
  - 选项匹配唯一符合项
  - 多个选项符合时,转面形状/独立vs包含关系等二次筛选
  error_signatures:
  - code: nested_face_miss
    description: 嵌套图形漏数内部面
  - code: default_face_error
    description: 把纯线条开放图形误算为有面
  - code: no_second_verify
    description: 面数多选项符合时未继续验证面形状(如山东题两片面形状不相同)
  fix_action: 做15道数面题,限时30秒/题,每图标注每个封闭区域
  time_budget_sec: 30
  accuracy_rule: ≥90%
  pitfall: 面+笔画+曲直三重验证难题正确率仅35%;面数规律对多个选项时按'面→线→点'顺序叠加验证,不能提前跳关
