  title: 两图形分两部分-相离看样式（对称/一笔画/曲直）
  recognition: 题干所有图形都由两个独立几何图形构成、两图完全分离无接触时，优先『分开看样式』（占比30%，最高频考点）。
  applicability:
    include:
    - 两图形相离（完全分离无接触）且每个图都恰为两部分
    - 两子图对称性组合有规律（如一个轴对称+一个中心对称）或笔画数组合有规律（一个一笔画+一个两笔画）
    - 两子图曲直性组合交替（上曲下直/上直下曲）
    exclude:
    - 两图存在相接或重叠关系（走连接方式/重叠面路线）
    - 子图均不对称且笔画数一致，样式规律无法区分
  method_steps:
  - 先确认两图分离，同时排除部分数考点（所有图均为两部分时部分数不适用）
  - 分别记录两子图的对称性（轴对称/中心对称/不对称）与笔画数（一笔画/两笔画），找组合规律
  - 对称/笔画无规律时，分别看两子图曲直性组合是否交替或重复
  - 多个选项符合时，用面数量/直线数等附加特征二次筛选
  error_signatures:
  - code: only_symmetry
    description: 只验证对称性漏看笔画数，单一维度误选
  - code: miss_axis_direction
    description: 忽略对称轴方向关系（平行/垂直/45度交替）
  - code: count_parts
    description: 看到分离图形去数部分数，忽略所有图部分数相同无法区分
  - code: not_double_check
    description: 需同时满足对称+笔画双规律，只验一个条件
  fix_action: 做8道两图形相离真题，限时40秒/题
  time_budget_sec: 40
  accuracy_rule: 正确率90%以上
