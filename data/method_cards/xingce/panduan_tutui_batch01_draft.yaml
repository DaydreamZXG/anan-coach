- id: mc_right_angle_count
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/一根线
  title: 一根线-直角数量与方向
  recognition: 图形出现直角三角形、四边形缺角(矩形缺角)、多直角折线时,优先数直角数;考官设计的直角'绝对不是随意出现的'
  applicability:
    include:
    - 直角三角形或矩形缺角图形
    - L/U/口字形等折线(分别1/2/4个直角)
    - 组合图形中明显直角特征
    exclude:
    - 图形圆滑无直角
    - 对称/一笔画已唯一判定
    - 仅1个直角、无设计痕迹
  method_steps:
  - 逐段检查折线数直角:L形转折=1个直角,U形=2个,口字形=4个
  - 列各图直角数找等差/分组规律(如1,2,3递增)
  - 选项数直角匹配唯一项
  - 若各图直角数相同,改看直角方向是否规律旋转(如每次顺时针90°)
  error_signatures:
  - code: count_omission
    description: 复杂图形漏数隐藏直角(如一根线中不易察觉的转折)
  - code: wrong_ansatz
    description: 误判为竖线数量相加等机构错误规律(该规律2000多题仅出现30次,非高频)
  - code: ignore_direction
    description: 只数直角数量,忽略直角方向旋转规律
  fix_action: 做15道直角数专项题,限时40秒/题,每图标注直角数量和方向
  time_budget_sec: 40
  accuracy_rule: ≥85%
  pitfall: 直角数易误判为线数或面数;考官画出16个直角的图形意图性极强(非常规绘制难度大),这是'数直角'的强信号
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
