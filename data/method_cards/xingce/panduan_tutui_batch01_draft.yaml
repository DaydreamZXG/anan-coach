  - code: wrong_subfigure
    description: 子图形分别旋转时只盯一个子图形,漏看其他子图形的旋转规律
  fix_action: 做6道轮廓相同旋转/翻转题,限时45秒/题,每题先用参照物法判断旋转还是翻转再算
