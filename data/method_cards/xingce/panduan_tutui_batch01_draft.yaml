  title: 平面拼合-5大秒杀定理（线段抵消）
  recognition: 平面拼合题(给若干碎片选拼成整体)不要硬拼,用边缘线'平行+位置对应+等长'抵消分析:唯一线必现、同侧线叠加、无中生有线排除、等长成对消、长线被短线抵消
  applicability:
    include:
    - 只能平移的拼合题(碎片含清晰边缘线)
    - 线段特征明显的拼合题
    - 选项外框差异在线段构成上的题
    exclude:
    - 俄罗斯方块/纯格子类(无边线,用格子数法)
    - 翻转黑白面题(颜色参与判断)
  method_steps:
  - 先找最长横线/竖线(最不易被完全抵消)
  - 再看最长斜线及其平行线
  - 定理筛选:①唯一无平行线线段必现外框(定理1) ②同侧平行线只能叠加/独立(定理2) ③题干没有的线型选项禁止出现(定理3) ④等长平行线成对抵消、余下奇数条必现外框(定理4)
    ⑤长线可被两条短线拼合抵消(L长=L短1+L短2)(定理5)
  - 未被抵消的最长线必须体现在正确选项外框
  error_signatures:
  - code: brute_force_assembly
    description: 执着还原完整拼合过程,传统1分钟/题 vs 秒杀10秒/题
  - code: same_side_ignore
    description: 两条图右线平行等长也硬抵消,其实同侧不能拼合
  - code: fabricated_line
    description: 选项出现题干没有的线型没排除(定理3)
  fix_action: 做15道平面拼合真题,限时40秒/题(熟练后10秒/题),练'先长线→再斜线→抵消验证'三步
  time_budget_sec: 40
  accuracy_rule: 85%以上(秒杀熟练后)
  pitfall: 拼合必要三要素=平行+等长+位置对应(图左+图右或图上+图下);同侧平行线即使等长也不能抵消
