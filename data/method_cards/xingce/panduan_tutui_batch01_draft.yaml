- id: mc_tangent_point_count
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/切点
  title: 导学-曲线与直线切点数量
  recognition: 图形出现圆/弧线与直线相切时,优先数切点数量(相切圆→切点数是课程强调的条件反射之一);典型如'每个图形含1个曲线与直线切点'
  applicability:
    include:
    - 圆/弧线与直线相切
    - 相切圆图形
    - 曲线与直线仅接触一点(相切而非穿过)
    exclude:
    - 图形无明显相切关系、只有普通相交
    - 对称/一笔画/面等高频规律已唯一判定
    - 切点难以精确定义的图形
  method_steps:
  - 识别切点:曲线与直线只接触一点且不相交穿过
  - 逐图数切点数量,找恒定/等差规律
  - 选项验证唯一符合项
  - 区分切点与交点总数,不要混数
  error_signatures:
  - code: mix_with_intersection
    description: 把切点混入交点总数一起数,规律失效
  - code: miss_tangent
    description: 只数线/面/对称,忽略明显的相切特征
  - code: priority_error
    description: 切点占比仅0.6%,不应在遍历第一步尝试
  fix_action: 做10道切点专项题,限时50秒/题,先走高频遍历再数切点
  time_budget_sec: 50
  accuracy_rule: ≥80%
  pitfall: 切点是低频考点(约0.6%),只在图形明确出现'圆/弧+直线相切'且高频规律失效时才数;单图常有干扰信息(如5根线/平行线),需先剔除
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
