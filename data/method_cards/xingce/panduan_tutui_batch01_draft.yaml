  tag_path: 判断推理/图形推理/相同位置有相同线条
  title: 相同位置有相同线条-一次改变一点
  recognition: 相邻图形整体框架相同、只差一个元素,看到'邻图几乎一样'就往一次改变一点想。识别特征:相同位置有重复的线条或小图形,相邻图形非常接近。
  applicability:
    include:
    - 一组图,相邻图形非常接近,一次只变一个元素
