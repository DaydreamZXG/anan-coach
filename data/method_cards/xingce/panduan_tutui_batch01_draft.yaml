- id: mc_scientific_traversal_order
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/科学遍历
  title: 科学遍历-按考频顺序验证规律
  recognition: 图形信息多、一时看不出考点时,不要随机试错,按'对称(12%)→一笔画(7%)→面(7%)→直线数(4%)→交点数(3%)→直角数(1.5%)→切点数(0.6%)'的考频降序快速验证;约50%-60%题由典型特征图形直接定位考点
  applicability:
    include:
    - 一组图/两组图/九宫格/分类分组等平面题通用
    - 图形规整、信息量大、无法一眼定位考点时
    - 难题(单图同时含线数/平行线/面/切点等多特征,如导学第一题)
    exclude:
    - 特征图形极其明显(日字形/五角星/内嵌三角形)可直接定位考点
    - 立体图形、平面拼合类题目
    - 黑白格变换等专题
  method_steps:
  - 第一步验证对称性(轴对称/中心对称),对称是全图推最高频考点占12%
  - 第二步验证一笔画(去框法/奇点0或2),占7%
  - 第三步按面→线→点顺序逐个数数量,找恒定/等差/分组
  - 前序全无效再试直角数/平行线组数/切点数等低频特征,选项必须唯一符合
  error_signatures:
  - code: random_trial
    description: 随机暴力试错规律(面→角→对称乱跳),漏掉对称、一笔画等基础考点,耗时是系统解法的6-10倍
  - code: reverse_order
    description: 倒序从低频考点入手(先数切点/交点),浪费验证成本
  - code: over_stay
    description: 单题死磕超过2-3分钟,未按顺序转移
  - code: miss_compound
    description: 只验单一规律,未处理约15%的复合考点题(需分步排除)
  fix_action: 做30道混合考点图推题,限时40秒/题,每道在草稿记录按遍历顺序验证的规律序列
  time_budget_sec: 40
  accuracy_rule: 常规题正确率≥90%;遍历顺序本身5-10分钟内背熟
  pitfall: 复合考点约占15%:单一规律可能同时满足多个选项,要用线数排除一部分、面数再确定最终答案,不能用单个规律硬选
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
