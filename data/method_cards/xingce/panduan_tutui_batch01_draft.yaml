  tag_path: 判断推理/图形推理/四个图形
  title: 四个图形-有相同子图形看位置
  recognition: 每个图形内部有重复子图形(如两个相同),看相同子图形的位置排列关系。口诀:有相同图看位置。该考点2016-2026年反复出现。
