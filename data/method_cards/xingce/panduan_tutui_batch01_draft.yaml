- id: mc_graphic_operation
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/图形运算
  title: 图形运算-求同求异叠加黑白
  recognition: 两组图或九宫格中,单张图形本身数量无规律时,转向图与图之间的运算:求同(留共同)、求异(去共同)、叠加、黑白运算、三图数字相加
  applicability:
    include:
    - 两组图题型(第一组3图+第二组3图)
    - 九宫格题型(每行3图有运算关系)
    - 图形外形相似、有重叠区域
    - 黑白块图形
    exclude:
    - 一组图题(6图找整体规律)
    - 分类分组题(6图分两组)
    - 单图特征规律已唯一确定
  method_steps:
  - 先确认单图特征(对称/面/线)均无统一规律
  - 两组图:验证前两图求同/求异/叠加得到第三图
  - 三图数字运算:第一组图一+图二=图三的特征值(如面数4+3=7),第二组套用同式
  - 九宫格:每行三图同理;再试按列、米字型或全图整体看
  error_signatures:
  - code: only_single_figure
    description: 只在单张图上数数,忽略图间运算关系
  - code: wrong_axis
    description: 九宫格只按行验证,未尝试按列或米字型
  - code: premature_unique
    description: 把部分符合的选项当成唯一解,未验证运算式对第二组也成立
  fix_action: 做20道两组图/九宫格图形运算题,限时45秒/题
  time_budget_sec: 45
  accuracy_rule: ≥85%
  pitfall: 同一图形运算考点,掌握方法后正确率90%,未掌握骤降至58%;关键是'先单图、后图间运算'的顺序
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
