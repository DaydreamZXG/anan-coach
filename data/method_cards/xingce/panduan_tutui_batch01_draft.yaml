  module_name: 判断推理
  tag_path: 判断推理/图形推理/相交圆
  title: 相交圆-识别与五大考点优先级
  recognition: 图形由若干圆/椭圆相交、相切组合而成(有公共点或重叠区域),多圆接触重叠;考点分布:一笔画70%(含结合面数量),交点20%,曲直10%,对称仅7%
  applicability:
    include:
    - 两个圆相切/相交、三个圆相切等多圆组合
    - 圆形元素相互接触或重叠(无论有无连接线)
    - 圆+直线混合的相交图形
    exclude:
