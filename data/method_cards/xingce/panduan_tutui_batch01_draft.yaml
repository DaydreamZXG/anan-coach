  - code: skip_sequence_rule
    description: 只数单个字面数,漏看序列规律(如相邻相加0+2=2)
  - code: hasty_count
    description: 复杂字面数数漏,未逐格清点就下结论
  fix_action: 做20道汉字面数量真题,限时35秒/题,重点练口/月/目/贝/日部件的图形实际封闭清点
