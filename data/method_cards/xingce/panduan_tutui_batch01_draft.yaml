- id: mc_graph_jue14_yunsuan
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/相同位置有相同线条
  title: 相同位置有相同线条-求异求同叠加
  recognition: 不同图形在相同位置出现相同线条(或阴影/符号),立即进入图形运算思维。口诀:相同位置线条重,两两相同必求异。考点分布:求异占50%、求同20%、叠加20%。
  applicability:
    include:
    - 三图一组/九宫格,相同位置两两相同→求异
    - 三图都有相同线条且线条数越来越少→求同
    - 线条越来越多→叠加
    exclude:
    - 相邻图形只差一个元素→一次改变一点
    - 轮廓完全相同且有黑有白→黑白运算
    - 图形整体在转→旋转
  method_steps:
  - 判断运算类型:两图相同→求异;三图相同且线条减少→求同;线条增多→叠加
  - 用关键线条法:对比选项,只盯有区别的那1-2条线,不整图运算
  - 反推:该线在题干两图都有→求异后应无;只有一个图有→求异后应有,据此排除选项
  error_signatures:
  - code: over_think_simple
    description: 图形太简单反而不敢选求异,想复杂了(正确率仅65%)
  - code: whole_figure_slow
    description: 整图逐一运算耗时易错,应盯住选项差异线反推
  - code: confuse_same_diff
    description: 求异(去同存异)与求同(保留相同)混淆
  - code: assume_horizontal
    description: 九宫格默认横看,实际是竖看运算(正确率仅35%)
  fix_action: 做6道求异/求同/叠加题,限时30秒/题,每题先判断运算类型再用关键线条法
  time_budget_sec: 30
  accuracy_rule: 95%以上(求异是必拿分题型,3-5秒判断考点、10-15秒出答案)
  pitfall: 相同位置线条重复且两两相同必求异;三图相同则求同或叠加——线条少=求同,线条多=叠加
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
