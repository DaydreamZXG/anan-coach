- id: mc_two_lines_standard_check
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/两根线
  title: 两根线-标准化排查与复合考点
  recognition: 两根线组合图形,常规属性(对称/笔画)无解时,按固定顺序排查面数量、曲直性、交点数,最后找交点位置
