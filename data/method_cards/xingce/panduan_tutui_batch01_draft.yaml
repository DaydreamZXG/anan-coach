  title: 两根线-两笔画判断
  recognition: 图形由两根独立线条构成(开放或封闭),或'内十字''日字变形'结构,往两笔画想
  applicability:
    include:
    - 图形含内十字结构(典型两笔画标志)
    - '''外框+内部线条''组合图形'
    - 日字变形(去掉框后剩两根线)
    exclude:
    - 图形明显为一笔画(五角星、O形、S形)
