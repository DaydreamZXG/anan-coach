  title: 两图形分两部分-相接看连接方式（点接/边接/夹角）
  recognition: 两图形以点或边相接时，考连接方式差异：相接边数等差、点接vs边接分类、相接边长短或夹角（占比约25%）。
  applicability:
    include:
    - 两图形点/边相接，相接边数呈等差递增（1,2,3,5…）
    - 分类题：一部分点相接、另一部分边相接（如①③④边接 vs ②⑤⑥点接）
    - 非典型：相接边长/短分类，或相接边夹角（直角/锐角）分类
    exclude:
    - 两图形相离或重叠（不属于相接考点）
    - 对称性明显有规律时优先对称路线
  method_steps:
  - 确认两图相接，先数相接边数看是否等差递增（短线连接也计入边数）
  - 相接边数无法区分时，改分类：点相接一组、边相接一组
  - 仍无法区分时，观察相接边附加属性：长短、夹角（直角/锐角）
  error_signatures:
  - code: only_count_edges
    description: 只数相接边数陷入死胡同，忽略夹角/长短等次级特征
  - code: count_overlap
    description: 混淆重叠面积与相接方式（重叠不等于相接）
  - code: ignore_short_edge
    description: 漏计短线连接导致相接边数少算
  - code: angle_miss
    description: 没观察相接边夹角（直角/锐角）这一关键特征
  fix_action: 做6道相接连接方式真题（含分类题），限时40秒/题
  time_budget_sec: 40
  accuracy_rule: 正确率90%以上（送分题正确率可达90-91%）
  pitfall: 相接边数都相同时容易卡住，此时转向相接边夹角（直角/锐角）或长短等非典型特征；此类考点近十年仅考1-2次但一旦考出即可秒杀，也可用『相接处交点数递增』（2021北京题规律）兜底。
