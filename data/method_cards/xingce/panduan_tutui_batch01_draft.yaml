- id: mc_parallel_lines_count
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/一根线
  title: 一根线-平行线组数
  recognition: 图形出现内嵌三角形、四边形缺角、规则多边形或多条平行线段时,优先数平行线组数(2条平行线=1组);规律可为等差数列也可为交替数列(如3,2,3,2,3)
  applicability:
    include:
    - 内嵌三角形结构(考官偏爱的平行线标志结构)
    - 图形中有多组平行线段、Z形折线、梯形
    - 反复出现的'特殊三角形绘制方式'暗示平行线考点
    exclude:
    - 图形中没有任何平行线段
    - 已唯一判定一笔画/对称等高配频考点
    - 平行线段数量少且不成规律
  method_steps:
  - 逐图数平行线组数:同方向的两条平行线段=1组,Z形折线也含1组
  - 列出各组数量,找等差(0,1,2,3,4,5)/恒定/交替数列
  - 选项逐个匹配平行线组数,取唯一符合项
  - 首组无规律时检验奇偶位交替数列(3,2,3,2)
  error_signatures:
  - code: miss_parallel
    description: 对平行线不敏感,真题正确率仅22%,因为根本没往平行线方向想
  - code: wrong_group_count
    description: 把方向不同的线段误算为一组,或漏数隐藏的平行组
  - code: only_arithmetic
    description: 只找递增等差数列,忽略3,2,3,2这类交替数列
  fix_action: 做20道平行线专项图推题,限时40秒/题,每图必标出平行线组数
  time_budget_sec: 40
  accuracy_rule: ≥85%
  pitfall: 平行线题真实正确率仅22%-25%,难点不在数错,而在没有'见平行线就数组数'的条件反射
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
