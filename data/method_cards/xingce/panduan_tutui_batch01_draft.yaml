  module_name: 判断推理
  tag_path: 判断推理/图形推理/图形整体轮廓相同
  title: 图形整体轮廓相同-黑白运算+旋转复合
  recognition: 轮廓相同有黑有白,但直接按黑白运算验证规则矛盾(同一位置结果不统一),提示是黑白运算与旋转复合。历年真题仅4-5道,是拉分题。
  applicability:
    include:
    - 九宫格/两幅图,轮廓相同,直接黑白运算算不通
    - 图形有明显旋转关系(180°)或一正一斜(45°)
