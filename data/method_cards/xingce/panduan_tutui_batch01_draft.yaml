- id: mc_graph_jue14_yunsuan_rotate
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/相同位置有相同线条
  title: 相同位置有相同线条-运算+旋转/翻转复合
  recognition: 相同位置有相同线条但直接求异/求同结果对不上(位置不对应),想到运算后还做了旋转或翻转。考官常用'加旋转/翻转'来加大难度。
  applicability:
    include:
    - 直接运算得不到结果,且图形方向在变(三角形尖角/十字方向变化)
    - 选项中出现两个互为旋转90°或互为镜像的图→提示考点
    - 图形为正方形/圆形/带尖角→优先想旋转
    exclude:
    - 直接运算规则成立→普通求异/求同
    - 无方向变化的重复线条→普通运算
  method_steps:
  - 判断旋转还是翻转:线条从上方转到下方→旋转180°;位置不变但左右/上下颠倒→翻转
  - 有斜线提示→先转45°再求异;无斜线→先求异(去同存异)再旋转/翻转
  - 用关键点验证:取一个角,判断求异+旋转/翻转后该点的位置与颜色,排除选项
  error_signatures:
  - code: wrong_order
    description: 先转再算还是先算再转分不清,两者结果不同
  - code: rotate_flip_confuse
    description: 把翻转当旋转或反之(翻转是镜像、旋转是转动)
  - code: angle_error
    description: 旋转角度判断错(45°vs90°),此类正确率仅44-53%
  fix_action: 做5道求异+旋转/翻转复合题,限时50秒/题,先判断'旋转还是翻转'再动手
  time_budget_sec: 50
  accuracy_rule: 75%以上(复合题历年正确率44-75%)
  pitfall: 考官常给的提示:有明显斜线→先旋转45°再求异;选项中互为旋转的图形就是旋转考点的提示
