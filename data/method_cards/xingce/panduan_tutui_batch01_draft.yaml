- id: mc_one_line_stroke
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/图形推理/一根线
  title: 一根线-一笔画判断(去框法)
  recognition: 图形由一根连续线条构成(直线/曲线/折线/扭曲带尖角线条/带线头),明显不对称时优先判一笔画;一根线图形中一笔画考点占41%
  applicability:
    include:
    - 单一线条图形(直线、曲线、折线、缠绕线条)
    - 封闭面内单线图形
    - 仅以点相交的多图形组合
    - 五角星、日字形等特征图
    exclude:
    - 图形明显对称且有对称规律
    - 规整多边形(优先平行线/直角)
    - 十字交叉图形(必为两笔画干扰项)
  method_steps:
  - 用去框法:去掉仅以点相交的封闭图形和最外围框,看剩余线条
  - 判断剩余部分能否一笔不抬笔画成(或数奇点:0或2个为一笔画)
  - 题干前几图确认一笔画后,逐个选项去框验证
  - 熟练者10秒判考点+10秒选答案,单图判断2秒内
  error_signatures:
  - code: frame_interference
    description: 被外框迷惑,把一笔画图形误判为多笔画
  - code: cross_misjudge
    description: 十字交叉图形误判为一笔画(实际两笔画)
  - code: oddpoint_slow
    description: 一上来数奇点拖慢速度,应先肉眼去框
  - code: ignore_cannot
    description: 忽略题干'不能'的要求,选成符合规律项
  fix_action: 做20道一笔画判断题(含去框法),限时30秒/题,单图2秒内判断
  time_budget_sec: 30
  accuracy_rule: 简单题100%,中等题≥90%(难题不超过1分钟)
  pitfall: 一笔画占41%是一根线图形的压倒性第一考点;'扭来扭去带尖角'的图形90%考一笔画或曲直性
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
