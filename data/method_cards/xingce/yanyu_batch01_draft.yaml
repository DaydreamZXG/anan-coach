- id: mc_yanyu_shici_01
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/实词辨析
  title: 实词辨析：先看搭配再看语境
  recognition: 空格前后有名词、动词或形容词待选，选项是近义实词
  applicability:
    include:
      - 选项为近义实词且空格所在句有明确语境线索
      - 空格与前后词存在可判定的固定搭配
    exclude:
      - 空格考查关联词或虚词
      - 选项是成语而非单字实词
  method_steps:
    - 读空格所在完整句，圈出与空格直接搭配的主语或宾语
    - 排除明显不合搭配的选项，留两到三个候选
    - 代回原句读，验剩余选项与前后句语境是否呼应
    - 比两项的轻重和感情色彩，选与全文基调一致的
  error_signatures:
    - code: logic_fill_context_ignored
      description: 只看空格近处搭配，忽略全文语境呼应
    - code: logic_fill_synonym_confused
      description: 近义词当可互换，忽略轻重或感情色彩差异
  fix_action: 做 {n} 题实词辨析同类题，限时 {sec} 秒/题
  time_budget_sec: 45
  accuracy_rule: 先用搭配排除，再用语境内核；两项都可时比感情色彩
  pitfall: 近义词大多都能搭配，区别在轻重和感情色彩，不在能不能填
  author_note: AI 生成（GLM），基于言语高频考点方法论总结；待产品负责人按流水线回测
  validation:
