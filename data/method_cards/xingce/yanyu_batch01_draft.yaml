- id: mc_yanyu_paixu_01
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/语句表达/语句排序题
  title: 语句排序题：先定首句，再抓衔接信号
  recognition: 给出若干打乱顺序的句子，要求排列成通顺文段
  applicability:
    include:
      - 题干给出五到六个句子的乱序
      - 选项为首尾句组合
    exclude:
      - 句子间逻辑被省略号打断
      - 句子过长无法快速定位衔接
  method_steps:
    - 扫各句，排除不适合做首句的，如指代词或总结性连词开头的
    - 找指代词、时间词、关联词，确定必须相邻的句对
    - 拿首句加相邻句对匹配选项，排除不符的
    - 剩两项时验尾句是否为总结或收束
  error_signatures:
    - code: sentence_order_head_wrong
      description: 排序首句选错，整段逻辑崩
    - code: sentence_order_link_missed
      description: 漏抓指代或时间衔接信号，相邻句排错
  fix_action: 做 {n} 题语句排序同类题，限时 {sec} 秒/题
  time_budget_sec: 65
  accuracy_rule: 首句先定；指代和时间信号定相邻；尾句验收束
  pitfall: 指代词开头的句子几乎不可能是首句
