- id: mc_yanyu_guanlianci_01
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/关联词辨析
  title: 关联词辨析：先判逻辑关系再配对
  recognition: 空格处需填关联词，前后分句存在因果、转折、条件等关系
  applicability:
    include:
      - 空格前后是完整分句且逻辑关系可判定
      - 选项为成对关联词或单一关联词
    exclude:
      - 空格考查实词而非关联词
      - 分句逻辑被省略号打断无法判定关系
  method_steps:
    - 读空格前后分句，判定是因果、转折、条件还是递进
    - 排除方向与判定关系不符的关联词
    - 验成对关联词的前后搭配是否成立
    - 代入后通读，看语意是否通顺、逻辑是否自洽
  error_signatures:
    - code: logic_fill_context_ignored
      description: 只看空格近处分句，忽略全文逻辑链
    - code: logic_fill_conjunction_reversed
      description: 把转折当因果、把条件当递进等逻辑判反
  fix_action: 做 {n} 题关联词辨析同类题，限时 {sec} 秒/题
  time_budget_sec: 45
  accuracy_rule: 逻辑关系判定优先；成对词验前后呼应
  pitfall: 关联词方向判反是最常见错误，先定关系再选词
