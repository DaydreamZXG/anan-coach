- id: mc_yanyu_xijie_01
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/片段阅读/细节判断题
  title: 细节判断题：选项回文比对
  recognition: 题干问"符合或不符合文意、正确或错误的是"，选项是具体陈述
  applicability:
    include:
      - 选项均为文段细节的具体陈述
      - 题干要求判断对错
    exclude:
      - 题干问主旨或意图
      - 选项需整体概括而非细节比对
  method_steps:
    - 读题干，判定选对还是选错
    - 拿每个选项回原文定位，圈出对应句
    - 比对选项与原文的主语、时态、范围、程度是否一致
    - 找到一个明显不符的即定答案
  error_signatures:
    - code: detail_swap_subject
      description: 偷换主语或客体，把甲做的事说成乙做
    - code: detail_swap_time
      description: 偷换时态或时间范围，把将来说成已发生
  fix_action: 做 {n} 题细节判断同类题，限时 {sec} 秒/题
  time_budget_sec: 60
  accuracy_rule: 选项与原文逐项比对主语、时态、范围；一处不符即排除
  pitfall: 细节题最爱偷换主语和时间，比对时盯这两处
