  recognition: 题干要求为文段选标题，选项是短语或短句
  applicability:
    include:
      - 文段有明确主题词且选项为标题形式
      - 全文围绕一个对象展开
    exclude:
      - 文段是多对象并列无主线
      - 选项需概括为完整论点而非标题
  method_steps:
    - 找文段反复出现的主题词
    - 排除没有主题词的选项
    - 比较剩余标题的覆盖范围，选能涵盖全文的
    - 排除太窄只覆盖某段、太宽超出文意的选项
  error_signatures:
    - code: title_too_narrow
      description: 标题只覆盖某一段，未涵盖全文
    - code: title_too_broad
