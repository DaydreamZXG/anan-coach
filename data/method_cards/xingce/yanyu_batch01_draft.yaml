- id: mc_yanyu_yitu_01
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/片段阅读/意图判断题
  title: 意图判断题：主旨之上推一步
  recognition: 题干问"意在说明、想表达、作者意图"，选项是言外之意
  applicability:
    include:
      - 文段有明确主旨且选项含合理引申
      - 主旨与意图之间逻辑可推
    exclude:
      - 选项是文段原话复述无引申
      - 文段主旨本身已是要表述的意图
  method_steps:
    - 按主旨题方法先找出文段主旨
    - 看主旨是否已直接回答意图，若是选主旨项
    - 主旨偏描述时，推一步到作者想呼吁或强调的做法
    - 排除超出主旨范畴的过度引申项
  error_signatures:
    - code: intent_over_infer
      description: 意图题过度引申，选了主旨推不出的选项
    - code: intent_under_infer
      description: 引申不足，把主旨原话当意图
  fix_action: 做 {n} 题意图判断同类题，限时 {sec} 秒/题
  time_budget_sec: 55
  accuracy_rule: 主旨能直接答意图就不引申；需要引申时只推一步
  pitfall: 意图题不是越深越好，过度引申和引申不足都错
