- id: mc_yanyu_chengyu_01
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/逻辑填空/成语辨析
  title: 成语辨析：先辨语义再验语境
  recognition: 选项是四字成语，空格所在句描述某种行为或状态
  applicability:
    include:
      - 选项均为成语且含义相近
      - 空格前后有能限定成语褒贬或轻重的语境
    exclude:
      - 选项是实词而非成语
      - 成语考查的是典故出处而非用法
  method_steps:
    - 标出每个成语的核心语义和褒贬，写在选项旁
    - 读空格所在句，圈出能判定褒贬或轻重的关键词
    - 排除褒贬方向与语境不符的选项
    - 验剩余成语的适用对象是否与句中主语匹配
  error_signatures:
    - code: logic_fill_context_ignored
      description: 只凭成语字面意思选，忽略句中语境限定
    - code: logic_fill_synonym_confused
      description: 近义成语当可互换，忽略适用对象或轻重
  fix_action: 做 {n} 题成语辨析同类题，限时 {sec} 秒/题
  time_budget_sec: 45
  accuracy_rule: 褒贬方向先排除；对象错配再排除；最后比轻重
  pitfall: 很多成语字面相近但适用对象不同，能用不等于用对
