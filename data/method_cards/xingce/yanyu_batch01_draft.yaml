- id: mc_yanyu_zongfen_01
  exam_scope: guokao
  track: xingce
  module_name: 言语理解与表达
  tag_path: 言语理解与表达/片段阅读/主旨概括-总分结构
  title: 总分结构主旨题：首句立论，分述支撑
  recognition: 文段首句提出观点，后文用"例如、比如、首先"等展开论证
  applicability:
    include:
      - 首句是完整判断句且后文为展开论证
      - 题干问主旨或中心论点
    exclude:
      - 首句是背景引入而非观点
      - 文段是分总结构，观点在尾句
  method_steps:
    - 读首句判断是否为观点句，圈出主题词
    - 扫后文，确认是举例、并列还是递进支撑
    - 拿首句观点与选项比对主题词
    - 排除只讲分述内容的选项
  error_signatures:
    - code: main_idea_detail_as_main
      description: 把分述句当主旨句，选了举例内容
  fix_action: 做 {n} 题总分结构主旨同类题，限时 {sec} 秒/题
  time_budget_sec: 55
  accuracy_rule: 主旨必含首句主题词；分述内容选项不选
  pitfall: 分述句往往更长更具体，容易误当主旨
