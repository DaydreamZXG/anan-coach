  module_name: 常识判断
  tag_path: 常识判断/历史人文/战国/商鞅变法
  title: 商鞅变法-两次变法内容
  recognition: 题干问商鞅变法内容/第一次或第二次归属/立木为信/最不可能发生的变法场景时
  applicability:
    include:
    - 两次变法措施归属(高频)
    - 变法支持者与商鞅结局
    - 土地制度判断(允许自由买卖)
    - 商鞅与李悝/吴起变法区分
    exclude:
    - 秦始皇统一措施
    - 春秋霸主人物
    - 七雄位置
  method_steps:
  - '背景: 秦孝公发求贤令(痛斥四代昏君)→卫鞅(公孙鞅, 卫国人)怀《法经》入秦任左庶长; 支持者=秦孝公(非秦穆公/秦景公/秦献公); 事前"徙木立信"(五十金)树立官府威信'
  - '第一次(前356): 连坐法+轻罪重罚; 废除世卿世禄+奖励军功(军功爵制20级, 最高"彻侯"避汉武帝刘彻讳改"通侯"); 重农抑商/奖励耕织; 强制个体小家庭'
  - '第二次(前350): 废井田开阡陌(土地私有、允许自由买卖); 统一度量衡(度=长度/量=容积/衡=重量); 迁都咸阳; 推行县制'
  - '结局: 太子犯法→刑其傅公子虔(劓刑割鼻), "法之不行自上犯之"; 商鞅逃亡"作法自毙"(住店被自己定的实名登记法拒绝); 秦孝公死后被车裂; 秦惠文王"商君之法一字不易"→商君虽死秦法未亡'
  error_signatures:
  - code: first_vs_second_du_tl
    description: '统一度量衡误入第一次: 属第二次变法'
  - code: shiqing_shilu_wrong
    description: '废除世卿世禄误入第二次: 属第一次变法'
  - code: qinxiaogong_wrong_king
    description: '秦穆公/秦景公误为变法支持者: 支持者是秦孝公'
  - code: land_sale_forbidden
    description: '误认为商鞅变法禁止土地买卖: 第二次变法废井田、允许自由买卖'
  fix_action: 默写"一次=法治军事(连坐/军功/重农), 二次=经济政治(土地/度量衡/迁都/县制)"; 做12道商鞅变法真题, 限时30秒/题
