  - 澶渊之盟1004:真宗在寇准胁迫下渡黄河御驾亲征,宋军胜后却议和,岁币银10万绢20万(占财政收入1.5%),政治是城下之盟、经济是最优解;泰山封禅六帝=始皇/武帝/光武/唐高宗/唐玄宗/宋真宗(最后一个)
  - 庆历新政(仁宗,范仲淹):废年限升迁改政绩考核,一笔勾销典故;因得罪权贵+朋党论(欧阳修)仅一年废止;范仲淹岳阳楼记先天下之忧而忧
