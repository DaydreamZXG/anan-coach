- id: mc_yueqiu_texing_tianti
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/科技地理/天体常识
  title: 月球特征与恒星行星卫星分类
  recognition: 题干出现"月球""潮汐锁定""月球背面""环形山""没有大气""恒星/行星/卫星""八大行星""天狼星"等。
  applicability:
    include:
    - 月球物理特征判断(自转公转/引力/大气/流星)
    - 恒星行星卫星分类与别称类比(金乌=太阳、玉盘=满月)
    - 八大行星顺序与核聚变核裂变应用
    exclude:
    - 月相四相时间与观测
    - 月食/潮汐成因
    - 月球别称的诗词对应细节
  method_steps:
  - 月球速记:地球唯一天然卫星,自转=公转≈27天且均自西向东(潮汐锁定→始终同一面朝地球,背面是嫦娥六号采样点);引力≈地球1/6;无大气(无流星、昼夜温差极大);表面环形山由陨石撞击形成;土壤含大量氦-3
  - 天体三层:恒星(太阳/天狼星,靠核聚变自发光发热)、行星(绕恒星运行,清空轨道,冥王星2006年降级为矮行星)、卫星(绕行星运行,月球/木卫二);天狼星=除太阳外肉眼可见最亮恒星
  - 八大行星"水晶(金)地火木土天海":水金地火(类地/固态),木土天海;金星自转与地球相反(太阳西升东落);哈雷彗星周期约76年
  - 核能对照:核聚变=太阳/氢弹(小聚大,能量更大),核裂变=原子弹/核电站(大拆小)
  error_signatures:
  - code: moon_face_wrong
    description: 误以为能看到月球背面:潮汐锁定导致月球始终同一面朝地球
  - code: moon_meteor_wrong
    description: 误以为月球有流星:无大气无法摩擦发光,只有陨石直接撞月面成陨石坑
  - code: planet_order_mix
    description: 八大行星顺序记错:水金地火木土天海,冥王星已降级
  - code: jubin_liebian_swap
    description: 聚变裂变应用记反:太阳/氢弹=核聚变,原子弹/核电站=核裂变
  fix_action: 默写月球五大特征(潮汐锁定/引力1/6/无大气/环形山/氦-3)+八大行星顺序,做6道月球天体真题,限时25秒/题。
  time_budget_sec: 25
  accuracy_rule: 正确率≥85%
  pitfall: 误把"月球看不到流星"记成"有流星",月球无大气故无流星现象。
