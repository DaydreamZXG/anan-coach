  title: 宋徽宗艺术(瘦金体/宣和画院/汝官哥钧定)与靖康之变
  recognition: 题干出现宋徽宗、瘦金体、清明上河图、千里江山图、靖康之变、海上之盟、花石纲、六贼、牵羊礼等即定位
  applicability:
    include:
    - 考宋徽宗艺术成就(瘦金体/瑞鹤图/大观茶论/宣和画院)
    - 考宋代五大名窑特征(汝天青/官紫口铁足/钧窑变/哥开片)
    - 考靖康之变时间、二帝被俘、北宋灭亡、赵构南渡
    - 考海上之盟、花石纲、方腊起义的前因后果
    exclude:
    - 考北宋开国与重文轻武(属国策卡)
    - 考南宋绍兴和议与岳飞(属岳飞卡)
  method_steps:
  - 徽宗两面:艺术=瘦金体、宣和画院培养王希孟(千里江山图)与张择端(清明上河图)、著大观茶论、定宋瓷美学;政治=重用六贼(蔡京/童贯/朱勔)、花石纲逼反方腊、联金灭辽引狼入室
  - 靖康链:金灭辽→宋金接壤→1127年金破汴京→徽宗禅位钦宗→李纲守城胜后钦宗自毁长城(遣散勤王军贬李纲)→信郭京六甲神兵城破→二帝被俘牵羊礼→北宋亡,赵构南渡建南宋
  - 五大名窑口诀:汝(天青色,雨过天青云破处,纵有家财万贯不及汝窑一片)、官(紫口铁足)、哥(开片裂纹)、钧(入窑一色出窑万彩窑变)、定
  - 易混:花石纲=搜刮奇石运艮岳;海上之盟=与金海路结盟灭辽,岁币转付金朝
