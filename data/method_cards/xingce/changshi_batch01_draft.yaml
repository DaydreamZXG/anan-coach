  - 透镜口诀:凸透镜会聚(放大镜/照相机/投影仪/远视老花镜),凹透镜发散(近视镜);面镜靠反射成像,透镜靠折射成像
  - 颜色规律:物体颜色=它反射的光色(红衣服反射红光),黑色=吸收所有光;光三原色RGB红绿蓝(叠加成白),颜料三原色品红黄青(叠加成黑);可见光红光波长最长紫光最短
  - 小孔成像成倒立实像(墨子最早记载于《墨经》,墨子称科圣);投影仪本身用凸透镜=折射,投影仪幕布粗糙=漫反射(审题看清问哪个)
