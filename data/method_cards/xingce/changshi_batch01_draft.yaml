  tag_path: 常识判断/历史人文/秦朝-楚汉争霸与典故
  title: 秦末楚汉争霸(陈胜起义/巨鹿/鸿门宴/垓下/乌江自刎)与典故
  recognition: 题干出现陈胜吴广、项羽刘邦、破釜沉舟、鸿门宴、四面楚歌、约法三章、背水一战等成语典故即定位
  applicability:
    include:
    - 考成语典故与人物、战役的对应关系(如破釜沉舟-巨鹿之战-项羽)
    - 考楚汉争霸关键战役的时间轴与以少胜多战役
    - 考秦汉成语辨析(一字千金-吕不韦/一饭千金-韩信/问鼎中原-楚庄王/指鹿为马-赵高)
    exclude:
    - 考秦始皇生前统一措施(属上一卡)
    - 考岳飞/文天祥等宋元人物(另卡)
  method_steps:
  - 时间轴:前210沙丘病逝→前209大泽乡起义(王侯将相宁有种乎,建张楚)→前207巨鹿之战(破釜沉舟)→前206秦亡(前221-前206享国15年)+鸿门宴→前205彭城之战(项羽3万破刘邦56万)→前203鸿沟之盟(楚河汉界)→前202垓下(十面埋伏四面楚歌霸王别姬)+乌江自刎
  - 两场以少胜多:巨鹿之战项羽5万破40万秦军;彭城之战项羽3万破56万联军(睢水为之不流);韩信背水一战在井陉
  - 成语人物表:破釜沉舟/鸿沟之盟/四面楚歌/霸王别姬→项羽;明修栈道暗度陈仓/背水一战/十面埋伏/多多益善/胯下之辱→韩信;约法三章/楚河汉界→刘邦;项庄舞剑意在沛公→鸿门宴
  - 人物关系辨析技巧:多人物成语先一级看人物相关,再二级看说话主体与对象(如多多益善=韩信对刘邦说)
