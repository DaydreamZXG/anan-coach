  - '山东六国: "山"=崤山, 指崤山以东六国(齐楚燕韩赵魏)vs秦国; 与今天"山东=太行山以东"是两个概念'
  - '七雄方位口诀: 西秦(陕西)、东齐(山东, 都临淄)、北燕(蓟, 北京天津)、南楚(湖北安徽, 纬度最低/最南)、中原韩魏+赵(赵都邯郸, 邯郸学步出处);
