  title: 燕云十六州(石敬瑭割让/柴荣北伐/北宋失机/明初收复)完整链
  recognition: 题干出现燕云十六州、儿皇帝石敬瑭、契丹辽、澶渊之盟、高梁河、幽州云州等即定位
  applicability:
    include:
    - 考燕云十六州被谁割让、割给谁、何时丢失
    - 考澶渊之盟是否割让燕云十六州(易混陷阱)
    - 考柴荣北伐、高梁河之战等收复尝试
    exclude:
    - 考辽金元与西夏的建国民族(属西夏卡)
    - 考北宋城市经济与交子(属北宋经济卡)
  method_steps:
  - 一条链:936年后唐节度使石敬瑭为反叛向契丹称儿皇帝(尊耶律德光为父)并割让燕云十六州→后周世宗柴荣北伐连克关口将收复时39岁暴毙→北宋宋太宗高梁河之战大败丧失战略主动→澶渊之盟只赔岁币未割地→至明朱元璋才彻底收复,被辽金元统治400余年
  - 地理:燕云十六州以幽州(今北京)、云州为中心,含燕山山脉与长城防线,是抵御北方骑兵的天然屏障,失去后华北平原门户大开
  - 易混辨:澶渊之盟(1004,宋真宗,银10万绢20万,未割地)≠石敬瑭割让(936,五代,燕云十六州割给辽)
  error_signatures:
