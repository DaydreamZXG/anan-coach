  - code: wutai_shian_wrong_period
    description: 乌台诗案与贬黄州路线记混,苏轼贬谪为黄州→惠州→儋州纬度由高到低
  fix_action: 做8道变法措施对应真题限时30秒,复述新旧党争三阶段(神宗变法→高太后废法→哲宗复法)
