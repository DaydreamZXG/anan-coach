- id: mc_chunqiu_chengyu
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/历史人文/成语典故
  title: 成语典故-春秋定位与朝代归属
  recognition: 题干问"下列成语发生在春秋/战国/西汉/东汉/东晋……"或成语↔主人公对应时
  applicability:
    include:
    - 成语所属朝代判断(尤其春秋vs战国vs秦汉)
    - 成语-主人公对应关系(真题高频)
    - 干扰项识别(马革裹尸/金屋藏娇/草木皆兵/投鞭断流等)
    exclude:
    - 五霸人选与辅臣组合
    - 古籍著作考点
    - 战役过程本身
  method_steps:
  - '春秋档: 管鲍之交(管仲鲍叔牙)、退避三舍(晋文公)、卧薪尝胆(勾践)、问鼎中原(楚庄王)、秦晋之好、一鸣惊人(楚庄王)'
  - '战国档: 负荆请罪(廉颇蔺相如)、围魏救赵(孙膑)、纸上谈兵(赵括)、邯郸学步(赵都邯郸)、鸡鸣狗盗(孟尝君)'
  - '非春秋干扰项: 马革裹尸(东汉马援)、金屋藏娇(西汉汉武帝陈阿娇)、草木皆兵/风声鹤唳/投鞭断流(东晋淝水之战, 前秦苻坚)、一字千金(吕不韦)、指鹿为马(赵高)、破釜沉舟(项羽巨鹿之战)'
  - '兔死狗烹"双关陷阱": 既可指春秋勾践-文种, 也可指汉朝刘邦-韩信, 需结合选项判断出题人当它属哪朝'
  error_signatures:
  - code: tusi_goupeng_default_chunqiu
    description: '兔死狗烹默认春秋: 也可能是汉朝刘邦韩信, 出题人常利用双关设陷阱'
  - code: weizhao_jiuzhao_mis_author
    description: '围魏救赵错配孙武: 是孙膑的计策(孙武著《孙子兵法》)'
  - code: feishui_idioms_in_chunqiu
    description: '草木皆兵/风声鹤唳/投鞭断流误入春秋: 出自东晋淝水之战'
  - code: tuibi_sanshe_battle_break
    description: '退避三舍与城濮之战断链: 二者必须捆绑记忆'
  fix_action: 按"春秋-战国-秦汉-东晋"四栏默写成语; 做12道成语归属真题, 限时30秒/题
  time_budget_sec: 30
