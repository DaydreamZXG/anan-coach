  title: 沙丘之谋与秦二世(赵高专权/指鹿为马/李斯之死)
  recognition: 题干出现沙丘、赵高、胡亥、李斯、扶苏、指鹿为马、中车府令等关键词即定位
  applicability:
    include:
    - 考秦始皇之死与遗诏被篡改的来龙去脉
    - 考指鹿为马、东窗事发等成语出处
    - 考赵高官职变化(中车府令→郎中令)与九卿概念
