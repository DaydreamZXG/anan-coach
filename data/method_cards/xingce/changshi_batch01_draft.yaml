  - code: qianyang_li_place
    description: 牵羊礼与五国城囚禁地点记混,徽宗被囚五国城(今黑龙江依兰)
  - code: jingkang_duke_wrong
    description: 靖康之变时间记错,为1127年;徽宗钦宗被俘
  - code: nanyaote_guest_feature
    description: 五大名窑特征记混,如把天青色记到钧窑头上
  fix_action: 复述靖康之变因果链(海上之盟→灭辽→南侵→城破→南渡),做5道徽宗艺术+靖康真题限时30秒
