- id: mc_yueshi_chaoxi
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/科技地理/月相变化
  title: 月食成因与潮汐大小潮
  recognition: 题干出现"月食""红月亮""大潮小潮""朔望""引潮力""潮汐"等词。
  applicability:
    include:
    - 月食发生时间与日地月位置关系
    - 大潮小潮对应哪个月相
    - '"红月亮"的光学原理'
    exclude:
    - 月相四相的时间与观测口诀
    - 月球特征/别称
    - 恒星行星卫星分类
  method_steps:
  - 月食=望(满月)+地球在日月之间三者一线;分月全食/月偏食/半影月食,不存在月环食(地球直径约为月球4倍,本影足够大)
  - 并非每逢满月都月食:月球轨道与地球轨道不在同一平面
  - 大潮小潮:大潮=朔和望(日月地一线,引力叠加潮差最大);小潮=上弦和下弦(成直角,引力部分抵消);每天两次涨潮两次退潮;引潮力主因是月球引力(距地近)
  - 红月亮原理:太阳光经大气折射散射,蓝紫短波被散射掉,红光波长长穿透强照到月球再反射回来(与汽车尾灯用红色同理,红光不易被散射)
  error_signatures:
  - code: yueshi_time_wrong
    description: 月食时间记错:月食只发生在望(满月),不是朔
  - code: daychao_smallchao_mix
    description: 大小潮记反:大潮=朔+望,小潮=上弦+下弦
  - code: huan_yueshi_nonexist
    description: 误以为有月环食:只有月全食、月偏食、半影月食,不存在月环食
  - code: position_wrong
    description: 位置关系错:满月(望)时地球在日月之间,朔时月球在日地之间
  fix_action: 复述"月食=满月+地球居中""大潮=朔望、小潮=弦月"两个结论,做6道月食潮汐真题,限时30秒/题。
  time_budget_sec: 30
  accuracy_rule: 正确率≥85%
  pitfall: 把"朔(月球在日地之间)"当成月食时刻,月食实际发生在望。
