  - code: chengyu_renwu_misattribution
    description: 把一字千金(吕不韦)、问鼎中原(楚庄王)、纸上谈兵(赵括)张冠李戴到赵高等人
  - code: qin_ming_year_wrong
    description: 秦亡时间记错,前206年子婴投降,享国仅15年
  - code: wujiang_liang_food_mixed
    description: 把十面埋伏(琵琶曲)与霸王别姬(京剧)的曲艺门类记错
  fix_action: 默画前210→前202楚汉时间轴,做8道成语人物对应真题限时25秒
