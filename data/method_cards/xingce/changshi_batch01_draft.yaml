    description: 误以为澶渊之盟割让燕云十六州,实为五代石敬瑭所割
  - code: cut_person_wrong
    description: 把割让人记成赵匡胤或宋真宗,实为后晋石敬瑭
  - code: recover_time_wrong
    description: 把收复时间记成宋代,实为明朝朱元璋时期收复
  fix_action: 复述燕云十六州时间线:936割让→柴荣北伐将成→高梁河失利→澶渊未割→明初收复,做5道真题限时30秒
