  tag_path: 常识判断/历史人文/秦朝-五德终始说与尚黑
  title: 五德终始说(周火秦水/尚黑/以六为吉)
  recognition: 题干出现朝代尚某色、属某德、五行相克、吉祥数字、五行与五色五方对应等考法即定位
  applicability:
    include:
    - 考秦朝尚黑色属水德的缘由
    - 考五行对应五色/五方/五季(木青东春/火赤南夏/土黄中/金白西秋/水黑北冬)
    - 考36郡、车同轨六尺、天子驾六等秦朝数字背后的五德逻辑
    exclude:
    - 考朝代建立灭亡时间或人物事迹(不属此卡)
    - 考中医五行的生克应用(超出本课范围)
  method_steps:
  - 五德终始说由阴阳家邹衍提出:朝代更替源于五行相克;周属火,秦灭周故水克火,秦属水德
  - 水对应黑色(水深为渊),秦尚黑,皇帝袍服宫殿用黑;百姓黑巾裹头故称黔首
  - 水对应数字1和6,6为成数,故六为秦吉数:符节六寸、车轨六尺、六尺一步、天子驾六、36郡=6x6、铸12金人=6x2
  - 五行五色五方五季口诀:木青东春/火赤南夏/土黄中央/金白西秋/水黑北冬
  error_signatures:
  - code: zhou_huo_qin_shui_cause
    description: 记错相克方向,应水克火故秦属水德,非火克水
  - code: wu_se_wu_fang_mismatch
    description: 五行与五色五方对应错位,如水对应南方(实为北方)
  - code: ji_shu_liu_wrong_source
    description: 把秦以六为吉误当成偶然,实际源于水对应数字1和6
  fix_action: 复述五行-五色-五方-五季-数字对应表三遍,做5道五德终始说真题限时30秒
  time_budget_sec: 25
  accuracy_rule: 正确率≥90%,五行对应表须一次写对
  pitfall: 把秦尚黑的理由答成纯审美,忘记根因是水克火的水德对应黑色
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
