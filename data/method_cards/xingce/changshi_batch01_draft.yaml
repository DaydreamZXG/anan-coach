- id: mc_chunqiu_zhuzuo
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/历史人文/古代典籍
  title: 春秋典籍-《春秋》与诸子著作
  recognition: 题干问古籍体裁/作者/体例/五经/诸子思想词云时
  applicability:
    include:
    - 《春秋》体例与春秋三传辨析
    - 著作-作者对应(论语/老子/孙子兵法/考工记/天工开物/吕氏春秋)
    - 诸子百家思想匹配(儒家入世/道家出世/墨家兼爱非攻)
    exclude:
    - 成语典故朝代归属
    - 历史人物事件
    - 战国变法
  method_steps:
  - '《春秋》: 孔子编撰, 第一部编年体史书, 五经之一(诗书礼易春秋); "微言大义""春秋笔法"(寓褒贬于记事); 注解称"传"不称"序", 春秋三传=左传+公羊传+谷梁传(左丘明作《左传》叙事详备)'
  - '作者陷阱: 《论语》=孔子弟子及再传弟子(非孔子); 《老子》=《道德经》"万经之王", "紫气东来"指老子出函谷关遇尹喜; 《孙子兵法》=孙武(兵圣,
    中国现存最早兵书, 非孙膑); 《考工记》=最早手工业文献(对照明代宋应星《天工开物》"17世纪工艺百科全书")'
  - '思想词云速配: 仁/礼→儒家(入世), 清静自然/无为→道家(出世), 兼爱/非攻→墨家, 以法治国→法家'
  - 《吕氏春秋》=吕不韦组织门客编(杂家, "一字千金"); 《战国策》记纵横家谋略
  error_signatures:
  - code: lunyu_author_is_confucius
    description: '《论语》作者误写孔子: 实为孔子弟子及再传弟子'
  - code: sunzi_bingfa_author_mis
    description: '《孙子兵法》误配孙膑: 作者是孙武(兵圣)'
  - code: zhuan_vs_xu_mixup
    description: '注解体裁"传"与"序"混淆: 补充阐发《春秋》的作品叫"传"'
  - code: kaogongji_tiangongwu_dynasty
    description: 《考工记》(战国齐)与《天工开物》(明代)朝代错位
  fix_action: 默写五经与春秋三传; 做10道古籍著作真题, 限时30秒/题
  time_budget_sec: 30
  accuracy_rule: 正确率≥85%
  pitfall: 《论语》作者是孔子弟子及再传弟子, 这是最高频的错误选项
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
