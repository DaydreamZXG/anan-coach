  applicability:
    include:
    - 七雄方位与纬度/经度判断(楚国最南纬度最低)
    - '"山东六国"含义与崤山定位'
    - 战国起止时间与分界线事件
    - 都城-国家对应(赵都邯郸/齐都临淄/燕都蓟)
