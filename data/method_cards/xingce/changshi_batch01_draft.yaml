  title: 王安石变法(熙宁变法)措施与新旧党争
  recognition: 题干出现青苗法/募役法/方田均税法/保甲法等变法名、王安石、司马光、积贫积弱即定位
  applicability:
    include:
    - 考变法措施名称与其内容作用对应
    - 考王安石(新党激进)与司马光(旧党保守)立场
    - 考乌台诗案与苏轼贬谪路线(黄州/惠州/儋州)
    exclude:
    - 考庆历新政(范仲淹,属上卡)
    - 考商鞅变法/张居正一条鞭法(跨朝代辨用)
  method_steps:
  - 经济措施六法速记:青苗法(青黄不接低息贷,打击高利贷)、募役法/免役法(钱代差役)、方田均税法(清丈土地分五等,打击逃税)、农田水利法(垦荒修水利)、市易法(官收滞销货平物价)、均输法(徙贵就贱用近易远)
  - 军事:保甲法(农闲军训兵农合一)、裁兵法(50岁退役)、将兵法(废更戍法改专人训练)、保马法、军器监法
  - 新旧党争:王安石激进主张民不加赋而国用饶,司马光保守认为财富不在民即在官,神宗支持变法,司马光退编《资治通鉴》;高太后废新法,哲宗亲政复新法;苏轼立场摇摆两头被贬
  - 变法局限:青苗法强贷、免役钱压贫农、农田水利凑政绩,执行走样民怨大;永乐城惨败20万人死,神宗痛哭而亡
  error_signatures:
  - code: bianfa_measure_mix
    description: 青苗法与免役法、方田均税法作用记混(打击高利贷vs打击逃税)
  - code: liangzhe_sima_opposite
