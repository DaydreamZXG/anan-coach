  - code: shu_vs_shufa
    description: 文字与书法画等号:书法艺术始于东汉,东汉之前只有写字没有书法
  fix_action: 复述一遍演变时间线"甲骨→金→篆→隶→草楷行"及各书体的时代与特征,做8道文字演变类真题,限时25秒/题。
