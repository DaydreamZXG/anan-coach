  recognition: 题干出现书体名称(甲骨文/金文/隶书/篆书/楷书)、"文字演变顺序""书同文""古今汉字分水岭""六书"等词。
  applicability:
    include:
    - 排序题:给若干书体按出现先后排序
    - 判断某字体的时代、载体、别称(如"真书"指楷书)
    - 类比推理考书体与载体/别称的全同、种属关系
