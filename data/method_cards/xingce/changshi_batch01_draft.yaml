  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/历史人文/春秋战役工程
  title: 春秋战役与水利工程
  recognition: 题干出现战役-典故-人物三重对应, 或芍陂/邗沟/京杭大运河时
  applicability:
    include:
    - 战役↔典故↔人物对应(长勺/城濮/邲/柏举/夫椒)
    - 水利工程-修建者对应
    - 京杭大运河"春秋→隋→元"发展链
    exclude:
    - 战国桂陵/马陵/长平之战
    - 七雄地理
    - 五霸人物总览
  method_steps:
  - '战役速记: 长勺之战=鲁国曹刿"一鼓作气再而衰三而竭"(齐桓公少有的败仗, 体现边际效用递减); 城濮之战=晋文公退避三舍; 邲之战=楚庄王称霸/饮马黄河;
    柏举之战=吴阖闾破楚都(孙武伍子胥); 夫椒之战=吴夫差胜勾践→卧薪尝胆'
  - '水利: 芍陂=楚相孙叔敖修(安徽寿县, 最早人工水库之一); 邗沟=吴王夫差开凿=中国第一条人工运河(连长江淮河, 京杭大运河最早部分)'
  - '大运河链: 春秋开邗沟→隋炀帝以洛阳为中心扩建(通济渠/永济渠/江南河)→元朝弃弯取直(济州河/会通河/通惠河)→明清维护; 最早开凿于春秋而非隋朝'
  - '秦国三大水利工程对照记忆: 郑国渠、都江堰(秦昭襄王李冰父子)、灵渠(秦朝)'
  error_signatures:
  - code: grand_canal_first_dynasty
    description: '京杭大运河误记始凿于隋朝: 最早是春秋邗沟, 隋朝只是扩建'
  - code: hangou_digger_wrong
    description: '邗沟开凿者误配: 吴王夫差; 也勿与永济渠混淆'
  - code: yigu_zuoqi_person
    description: '一鼓作气人物记错: 曹刿, 鲁国'
  - code: shaobei_builder_wrong
    description: '芍陂修建者误配: 孙叔敖(楚国令尹)'
  fix_action: 做10道战役-工程真题, 限时30秒/题; 复述大运河"春秋邗沟→隋扩建→元取直"三段
