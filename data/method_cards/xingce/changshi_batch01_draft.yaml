- id: mc_chunqiu_wuba_renwu
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/历史人文/春秋五霸
  title: 春秋五霸-人选与人物典故
  recognition: 题干出现"春秋五霸""霸主""会盟"或五霸人名及其标志成语/辅臣时
  applicability:
    include:
    - 五霸人选判断、五霸vs七雄辨析
    - 贤臣-君主对应(管仲/百里奚/文种/孙叔敖)
    - 霸主标志事件/会盟/典故对应、称霸时间排序
    exclude:
    - 春秋成语朝代归属(另有卡)
    - 战国人物与变法
    - 春秋古籍著作
  method_steps:
  - '五霸是"五个人"不是国家: 可说"齐桓公是五霸", 不能说"齐国是五霸"; 七雄才是七个国家'
  - '两种说法都正确: ①史记: 齐桓公、晋文公、秦穆公、楚庄王、宋襄公 ②荀子: 齐桓公、晋文公、楚庄王、吴王阖闾、越王勾践'
  - '时间轴: 齐桓公称霸最早(春秋早期)→宋襄/晋文/秦穆/楚庄(中后期)→吴越最晚(春秋晚期); 战国起点=三家分晋(韩赵魏瓜分晋国)'
  - '人物速记: 齐桓公(姜小白,姜子牙后代)=尊王攘夷/九合诸侯一匡天下/葵丘会盟+管仲; 晋文公(姬重耳)=城濮之战退避三舍/践土会盟(周天子亲临)/寒食节介子推;
    楚庄王(芈旅)=一鸣惊人/问鼎中原/邲之战/饮马黄河+孙叔敖修芍陂; 秦穆公=独霸西戎/百里奚"五羖大夫"/秦晋之好; 宋襄公=泓水之战"宋襄之仁"(贬义);
    勾践=卧薪尝胆/鸟尽弓藏兔死狗烹最早出处/范蠡(商圣)文种(被赐死)'
  error_signatures:
  - code: sushuao_aux_predict_wrong
    description: '孙叔敖误配楚怀王: 应为楚庄王, 楚怀王是战国人物'
  - code: yiming_jingren_wrong_king
    description: '一鸣惊人误配齐威王: 考试重点考楚庄王'
  - code: tuibi_sanshe_miles
    description: '退避三舍里程记错: 一舍30里, 三舍共90里'
  - code: wuba_qixiong_confuse
    description: '五霸与七雄混淆: 勾践/阖闾是五霸人选, 不是战国七雄'
  fix_action: 默写两种五霸说法并给每位霸主配2个关键词; 做10道人物对应真题, 限时30秒/题
  time_budget_sec: 30
  accuracy_rule: 正确率≥85%
  pitfall: '贤臣-君主错配是最常见陷阱: 管仲-齐桓公、百里奚-秦穆公、文种-勾践、孙叔敖-楚庄王'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
