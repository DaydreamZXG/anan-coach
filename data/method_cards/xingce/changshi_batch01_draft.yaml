- id: mc_qin_yingzheng_tongyi_zhidu
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/历史人文/秦朝-秦始皇统一与制度
  title: 秦始皇统一与制度创建(小篆/半两钱/郡县/三公九卿)
  recognition: 题干出现秦始皇、统一文字货币度量衡、郡县制、三公九卿、书同文车同轨、焚书坑儒、半两钱等关键词即定位
  applicability:
    include:
    - 直接考秦朝巩固统一的措施及对应内容
    - 考古代水利工程(灵渠/都江堰/郑国渠)与修建时期、目的
    - 考制度沿革排序(三公九卿制→中外朝制→三省六部制→内阁制→军机处)
    exclude:
    - 考秦末楚汉争霸人物与战役典故(属另一张卡)
    - 考五行五德终始说与颜色对应(属单独卡)
    - 考商鞅变法细节(战国时期,非秦朝)
  method_steps:
  - 统一措施四件套:政治=三公九卿制(丞相行政/太尉军事/御史大夫监察)+废分封行郡县;经济=半两钱+统一度量衡+车同轨(六尺);思想=书同文小篆+焚书坑儒;军事=北击匈奴修长城+南征百越开灵渠
  - 三公速记:丞相=总理,太尉=国防部长,御史大夫=中纪委书记;地方层级郡(郡守/郡尉/监御史)→县(县令/县丞/县尉)→乡亭里;最初36郡后增至48郡
  - 焚书坑儒真相:烧民间私藏《诗》《书》与他国史书,留医药占卜农书;坑的主要是方士(术士)460余人,西晋才出现坑儒说法,勿理解为杀尽儒生
  - 三大水利工程辨:灵渠=秦朝秦始皇,沟通湘江漓江,军事运输;都江堰=战国李冰父子,至今仍用;郑国渠=战国韩国水工郑国主持,本意疲秦反使关中沃野
  - 秦尺约23.1cm,秦始皇身高八尺六寸约1.98米,佩剑长七尺约1.62米;统一货币设计寓意天圆地方
  error_signatures:
  - code: lingqu_zhenghequ_purpose_confused
    description: 把灵渠(军事运输)与郑国渠(灌溉)的修建目的和时期记混
  - code: unified_writing_xiaozhuan_lishu
    description: 误以为官方统一文字隶书,实为小篆,民间才流行秦隶
  - code: sangong_functions_swap
    description: 三公职能记错,把太尉(军事)与御史大夫(监察)搞混
  - code: shaoshu_shushu_ru
    description: 把焚书坑儒理解为杀尽儒生,实为主要坑方士460余人
  fix_action: 做10道秦朝统一与制度真题,每道限时30秒,重点复盘三公九卿职能与水利工程目的
  time_budget_sec: 30
  accuracy_rule: 正确率≥90%,三公九卿与焚书坑儒细节错题率降至0
  pitfall: 官方文字与日常实际用字混淆——官方规定小篆,实际民间更多用隶书,题目常在这里设陷阱
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
