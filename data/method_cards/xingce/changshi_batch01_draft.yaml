- id: mc_yuexiang_sixiang_guanche
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/科技地理/月相变化
  title: 月相四相与观测时间(朔/上弦/望/下弦)
  recognition: 题干出现"农历初几""月相""上弦月/下弦月/满月/朔""月出月落""上半夜/下半夜看到月亮"等。
  applicability:
    include:
    - 由农历日期推月相或由月相推日期
    - 判断诗句描述的月相(枫桥夜泊"月落夜半"=上弦月)
    - 考月相可见时段、方位、亮面方向
    exclude:
    - 月食成因与分类(月全食/月偏食)
    - 潮汐大潮小潮
    - 月球物理特征与别称
  method_steps:
  - 核心四相时间表:朔/新月(初一,月球在日地之间,暗面朝地看不见)→上弦(初七初八,日月地成直角)→望/满月(十五十六,地球在日月之间,整圆)→下弦(廿二廿三,成直角)
  - 升落时间:朔=同升同落(晨起昏落);上弦=中午升起午夜落下(上半夜可见);满月=黄昏升起清晨落下(整夜可见);下弦=午夜升起中午落下(下半夜可见)
  - 口诀"上上上西西,下下下东东":上弦月=上半月+上半夜+西边天空+亮面朝西;下弦月=下半月+下半夜+东边天空+亮面朝东
  - 诗词对应:中秋/元宵(正月十五)=满月,"杨柳岸晓风残月"的残月=下峨眉月(农历廿五之后)≠下弦月;峨眉月=初三初四(上)/月末(下)
  error_signatures:
