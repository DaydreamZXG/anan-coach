  - code: zhaogao_official_change
    description: 赵高由中车府令升郎中令(九卿之一)的官职变化记不清
  fix_action: 复述沙丘之谋三幕(劝胡亥/逼李斯/篡诏)与秦亡三年时间轴,做5道相关真题限时25秒
