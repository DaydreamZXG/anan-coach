- id: mc_diancibo_pu_yingyong
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/科技物理/电磁波
  title: 电磁波谱排序与波段应用
  recognition: 题干出现"电磁波""波长/频率""红外线/紫外线/X射线/伽马射线/无线电波/微波""穿透力""伦琴射线"等。
  applicability:
    include:
    - 电磁波波长/频率/能量排序题
    - 各波段特性与应用对应(红外热效应、紫外杀菌、X射线透视)
    - 穿透能力与频率的关系(金属车厢内手机能通收音机不能)
    exclude:
    - 声音三要素
    - 光学现象具体辨析(反射折射散射)
    - 月相月食潮汐
  method_steps:
  - 波谱排序(波长长→短):无线电波→微波→红外线→可见光→紫外线→X射线→γ射线;波长越长衍射/绕障越强(广播覆盖远),频率越高能量越强、穿透越强
  - 波段应用表:无线电波(广播电视)、微波(雷达/卫星通信/微波炉加热,方向性强)、红外线(热效应:遥控/夜视/热成像,蛇的颊窝感知红外线仿生,任何有温度物体都辐射)、可见光(400-700nm)、紫外线(杀菌消毒/荧光效应验钞)、X射线=伦琴射线(CT透视/安检)、γ射线(能量最强,肿瘤放疗)
  - 光学本质:光=电磁波,真空中速度3×10⁸m/s,传播不需介质;同频率电磁波在不同介质中速度不同(c=λf)
  - 电磁波易被金属反射(电梯里信号差);地震波是机械波不是电磁波
  error_signatures:
  - code: spectrum_order
    description: 波谱排序记错:波长从长到短是无线电→微波→红外→可见→紫外→X→γ
  - code: hongwai_ziwai_swap
    description: 红外线紫外线应用记反:红外=热效应(遥控/夜视),紫外=杀菌/荧光
  - code: lunqin_ray_mix
    description: 伦琴射线=X射线(用于CT),不是伽马射线;伽马射线能量穿透最强
  - code: wavelength_freq
    description: 波长频率关系记反:波长越长频率越低能量越弱,波长越短频率越高穿透越强
  fix_action: 默写波谱"无线→微→红→可见→紫→X→γ"及各波段一个典型应用,做8道电磁波真题,限时30秒/题。
  time_budget_sec: 30
  accuracy_rule: 正确率≥85%
  pitfall: 红外线(热效应)与紫外线(杀菌)的应用配对记反。
