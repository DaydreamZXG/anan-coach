  method_steps:
  - 顺序口诀:甲骨文→金文→篆书(大篆/小篆)→隶书→草书/楷书/行书,总规律"从繁到简"
  - 商代节点:甲骨文刻于龟甲兽骨用于占卜,称"契文""卜辞",最早系统文字;发现者王懿荣(甲骨文之父),殷墟在今河南安阳,商代始有信史
  - 秦汉节点:秦"书同文"统一为小篆(笔画圆转、无方折、书写慢);隶书始创于秦、通行于汉(蚕头燕尾/一波三折),是"古今汉字分水岭";草楷行均由隶书演变而来
  - 逻辑记忆:草书"写着爽看着不爽"、楷书"看着爽写着不爽"、行书"写着爽看着也爽";六书(象形指事会意形声转注假借)是造字法
