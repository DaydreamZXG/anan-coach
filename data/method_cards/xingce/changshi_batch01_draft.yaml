  - code: jianzao_youdi_wrong_battle
    description: '减灶诱敌与桂陵/马陵错位: 减灶诱敌在马陵之战'
  - code: shangyang_weiguo_official
    description: '商鞅误配魏国官员: 商鞅功绩在秦国, 效力秦孝公'
  fix_action: 默写"变法-国家-人物-关键词"四列表格; 做10道变法+两战真题, 限时30秒/题
