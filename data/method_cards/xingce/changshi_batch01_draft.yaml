    - 桂陵、马陵两战与孙膑庞涓
    - 魏国由盛转衰→秦国崛起的时间线
    - 平籴法的经济学原理(谷贱伤农/丰收悖论)
    exclude:
    - 商鞅变法细节(另有卡)
    - 长平之战
    - 七雄方位
  method_steps:
  - '李悝变法(魏国, 法家始祖): 《法经》=第一部较系统的成文法典; 两项核心经济措施="尽地力"+"平籴法"(丰年平价收/灾年平价售); 魏国成战国第一强国'
  - 平籴法=国家宏观调控雏形; "谷贱伤农/丰收悖论"=粮食缺乏弹性(价格大跌需求只微增→农民收入反降)
  - '桂陵之战: 孙膑"围魏救赵"(攻魏都大梁诱庞涓回救, 方式与目的关系可考类比); 马陵之战: "减灶诱敌"(十万灶→五万→三万造假象), 庞涓死马陵道'
  - '魏衰→迁都大梁→秦趁势收复河西→商鞅变法后秦成第一强国; 解题钥匙: 变法"特性关键词"(尽地力/平籴法=李悝)才能区分, 通性(废世卿世禄/奖励军功)各国都有不能区分'
