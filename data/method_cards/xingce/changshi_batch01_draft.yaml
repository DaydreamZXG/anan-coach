- id: mc_shengyin_sanyaosu
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/科技物理/声音声波
  title: 声音三要素与超声波次声波
  recognition: 题干出现"音调/响度/音色""频率/振幅""超声波/次声波""蝙蝠回声定位""曲高和寡""闻其声知其人""B超/声呐/雷达"等。
  applicability:
    include:
    - 判断成语/现象对应的声音要素(曲高和寡=音调高、震耳欲聋=响度大)
    - 超声波次声波的应用与动物对应
    - 机械波产生传播条件与声速大小
    exclude:
    - 光学现象(反射/折射/散射)
    - 电磁波谱与波段应用
    - 光色散与颜色
  method_steps:
  - 机械波=振动产生+介质传播,传递能量和振动形式,介质本身不随波迁移;真空不能传声(太空听不见说话但能看到光),声速固体>液体>气体,15℃空气约340m/s
  - 三要素对照:音调=高低/频率Hz(波形图波峰密则音调高),响度=大小/振幅与距离(波峰到波谷距离大则响度大),音色=区分声源/材料结构(闻其声知其人)
  - 超声波>20000Hz:蝙蝠回声定位、海豚、B超、声呐、碎石、零件探伤;次声波<20Hz:大象交流、预测地震海啸(水母感知异常次声波而迁徙)
  - 易混设备:军用雷达=电磁波,汽车倒车雷达=超声波;"五音"宫商角徵羽指音调
  error_signatures:
  - code: shengyaosu_mix
    description: 三要素张冠李戴:音调靠频率、响度靠振幅、音色靠材料结构
  - code: vacuum_chuansheng
    description: 误以为真空能传声:真空不能传声,但光能传播(太空看到爆炸)
  - code: chaoci_swap
    description: 超声次声记反:蝙蝠用超声波(>20000Hz),大象用次声波(<20Hz)
  - code: radar_type_wrong
    description: 雷达类型记错:军用雷达用电磁波,汽车倒车雷达用超声波
  fix_action: 背"音调-频率、响度-振幅、音色-材料"并为每个要素想2个生活例子,做8道声音真题,限时30秒/题。
  time_budget_sec: 30
  accuracy_rule: 正确率≥90%
  pitfall: 音调(由频率决定)与响度(由振幅决定)的决定因素记反。
