- id: mc_mc_changshi_gdwx_shishu_01
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/历史人文/史书体例
  title: 史书体例：编年/纪传/国别与第一部称号
  recognition: 题干出现《史记》《汉书》《资治通鉴》《春秋》《国语》等史书名，考体例分类或第一部X史书的称号
  applicability:
    include:
    - 考某部史书是什么体例或谁是第一部某体例史书
    - 作品-作者对应题（如《汉书》作者班固）
    - 通史与断代史的辨析
    exclude:
    - 只考史书具体内容或人物故事本身
    - 考二十四史具体书目清单
  method_steps:
  - 编年体按年份记：孔子《春秋》最早编年体、左丘明《左传》最早叙事详备的编年体；纪传体以人物传记写历史：司马迁《史记》第一部纪传体通史、班固《汉书》第一部纪传体断代史（记西汉）、范晔《后汉书》记东汉；国别体按国家记：左丘明《国语》最早国别体、《战国策》亦国别体（战国策=国别体，战国国家多好记）
  - 司马光《资治通鉴》是第一部编年体通史；《史记》是通史（黄帝→汉武帝太初四年，3000多年），《汉书》《后汉书》是断代史
  - 体例记忆口诀：编年=按年份、纪传=按人物、国别=按国家；前四史=史记+汉书+后汉书+三国志，二十四史全部纪传体（乾隆钦定故无清史）
  - 《史记》结构130卷：本纪记帝王、世家记诸侯、列传记一般人物、表=大事年表、书=典章制度；例外：项羽入本纪（司马迁推崇）、陈涉入世家（反秦首功）
  error_signatures:
