- id: mc_shengwu_jinhua_shixu
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/科技生物/生物进化
  title: 生物进化顺序与分类层级(植物+动物两条线)
  recognition: 题干出现"进化顺序""由低等到高等""离水越近""藻类→苔藓→蕨类→裸子→被子""界门纲目科属种""孢子植物/种子植物"等。
  applicability:
    include:
    - 植物或动物的进化先后排序题
    - 生物分类层级与种属/并列关系辨析(类比推理)
    - 植物五大类群特征判断
    exclude:
    - 生态系统组成与能量流动
    - 动物具体纲目特征(节肢/软体/鱼类)
    - 变态发育与种间关系
  method_steps:
  - 植物线:藻类→苔藓→蕨类→裸子→被子(由低到高);划分依据=有无种子:孢子植物(藻苔藓蕨)vs种子植物(裸子+被子);蕨类是最高级的孢子植物
  - 动物线:原生(单细胞草履虫)→腔肠/刺胞→扁形→线形→环节→软体→棘皮→节肢→鱼类→两栖→爬行→鸟类→哺乳;爬行动物是真正摆脱水生生殖的飞跃
  - 总规律"离水越近越低等";排序题技巧"看首尾"(先确定第一个和最后一个,快速排除)
  - 植物特征速记:藻类(无根茎叶,提供约80-90%氧气,海带紫菜也是藻类)、苔藓(假根无真根,监测空气污染,二氧化硫可杀死)、蕨类(有根茎叶,唯一木本蕨类=桫椤)、裸子(种子裸露无果皮,无花无果,口诀"松柏山银杏苏铁")、被子(六器官齐全,除裸子外其余都是被子植物)
  error_signatures:
  - code: plant_order_mix
    description: 植物进化顺序记混:藻类→苔藓→蕨→裸子→被子,藻类最低等
  - code: liangqi_paxing_order
    description: 两栖爬行先后记反:两栖(蛙)在前,爬行动物在后且更高等
  - code: luzi_baizi_swap
    description: 裸子被子记反:裸子种子裸露无果皮(银杏/苏铁/松柏杉),被子有果皮(牡丹/竹/玉米)
  - code: level_cross_compare
    description: 分类层级跨级比较:节肢动物(门)不能与鱼类(纲)并列,藻类(门)可与被子植物(门)并列
  fix_action: 默写植物线+动物线两条时间轴并为每级标一个代表生物,做8道进化顺序真题,限时30秒/题。
  time_budget_sec: 30
  accuracy_rule: 正确率≥85%
  pitfall: 把"两栖动物"排到爬行动物之后,实际爬行更高等(真正摆脱水的生殖)。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
