    description: '山东六国的"山"误为太行山: 战国时指崤山以东'
  - code: chu_latitude_wrong
    description: '楚国方位/纬度判断错: 楚国最南、纬度最低'
  - code: zhanguo_end_time
    description: '战国结束时间记错: 前221秦灭六国, 不是前311'
  - code: sanjia_fenjin_wrong_states
    description: '三家分晋记成"韩赵燕": 是韩、赵、魏三家'
  fix_action: 手绘七雄方位图并标注都城; 做10道七雄地理真题, 限时30秒/题
  time_budget_sec: 30
  accuracy_rule: 正确率≥85%
