  - 宋四家"苏黄米蔡"均北宋:苏轼、黄庭坚(苏轼学生,苏门四学士之一,二十四孝"涤亲溺器")、米芾、蔡襄(几乎不考);皇帝书法家宋徽宗赵佶创"瘦金体",关联靖康之变北宋灭亡
