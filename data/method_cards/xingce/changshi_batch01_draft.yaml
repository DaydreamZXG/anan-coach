- id: mc_xizhou_zhidu_dongzhou
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/历史人文/西周与东周
  title: 西周制度与东周开篇
  recognition: 题干出现分封/宗法/井田/礼乐/列鼎/牧野之战/烽火戏诸侯/平王东迁/镐京洛邑时
  applicability:
    include:
    - 西周四大制度辨析与贵族等级类比推理
    - 商周更替、西周末年事件与平王东迁的排序题
    - '"封建"古义、九鼎/列鼎与礼乐制对应、都城别称(镐=长安)'
    exclude:
    - 春秋五霸的人物与典故
    - 战国变法与七雄地理
    - 具体战役过程类考法
  method_steps:
  - '制度四件套速记: 分封=封土建国(等级链天子→诸侯→卿→士; 分封对象三类: 同姓亲戚/商朝后裔武庚/异姓功臣姜子牙→齐国); 宗法=嫡长子继承(正妻所生长子);
    井田=土地制度(井字形, 中间公田收归贵族); 礼乐=等级制度(列鼎: 天子九鼎八簋→诸侯七→卿五→士三/一), 周公制礼作乐'
  - '牧野之战: 周武王姬发伐纣, 商军"临阵倒戈", 以少胜多(纣王号称70万); 二京制: 宗周=镐京(西安, 别称镐/长安), 成周=洛邑(洛阳)'
  - '亡周链: 周幽王宠褒姒"烽火戏诸侯"→废申后→申侯联合犬戎破镐京→幽王死'
  - 平王东迁(镐京→洛邑)=西周/东周分界线; 东周=春秋+战国; 此后周天子仅剩洛阳周边, 沦为"天下共主"吉祥物, 礼崩乐坏
  error_signatures:
  - code: fenfeng_object_mixup
    description: '分封对象张冠李戴: 姜子牙=异姓功臣封齐; 鲁/晋/蔡=同姓诸侯国'
  - code: chengzhou_vs_anyang
    description: '成周与安阳混淆: 成周=洛阳; 安阳=商朝殷墟'
  - code: dongxi_zhou_boundary_wrong
    description: '东西周分界线记错: 平王东迁才是分界, 不是某次战役'
  - code: liyue_jingtian_swap
    description: '礼乐制与井田制功能错位: 礼乐管等级, 井田管土地'
  fix_action: 复述时间轴"牧野之战→西周→烽火戏诸侯→犬戎破镐京→平王东迁→东周"; 做10道西周制度真题, 限时30秒/题
  time_budget_sec: 30
  accuracy_rule: 正确率≥80%
  pitfall: '"封建"古义=分封诸侯(封土建国), 与郡县/监察/嫡长子继承都不沾边'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
