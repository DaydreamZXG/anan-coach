- id: mc_shengtai_xitong_nengliang
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/科技生物/生态系统
  title: 生态系统组成与能量流动
  recognition: 题干出现"生产者/消费者/分解者""食物链""营养级""能量递减""生物富集""生物圈""一山不容二虎"等。
  applicability:
    include:
    - 判断某生物在生态系统中的角色(消费者/分解者)
    - 食物链起点与能量流动方向
    - 抵抗力与恢复力稳定性关系
    exclude:
    - 进化顺序与生物分类
    - 变态发育/种间关系
    - 动物特征(鱼/爬行/哺乳)
  method_steps:
  - 三大角色口诀:生产者=植物(自养,无机物→有机物,是基石必需),消费者=动物(异养,非必需但加快物质循环),分解者=微生物(细菌真菌,蚯蚓屎壳郎也算,必需);食物链起点永远是生产者(植物)
  - 营养级:第一营养级=生产者,第二=初级消费者(食草),第三=次级消费者...;能量沿食物链逐级递减且单向流动(一山不容二虎=能量有限)
  - 生物圈=最大生态系统,范围=大气圈底部(约10km)+水圈大部+岩石圈表面(约10km);最复杂生态系统=热带雨林;抵抗力与恢复力一般呈负相关(雨林抵抗力强但恢复力弱)
  - 生物富集:有害物质在营养级越高的生物体内越易富集
  error_signatures:
  - code: producer_consumer_swap
    description: 生产者消费者记反:食物链起点是生产者(植物),不是食草动物
  - code: consumer_not_necessary
    description: 误以为消费者必需:消费者非必需(无它仍可循环),分解者必需
  - code: energy_flow_direction
    description: 能量流动记反:能量逐级递减而非递增,且单向不可逆
  - code: resistance_resilience
    description: 稳定性关系记反:抵抗力强则恢复力弱(负相关)
  fix_action: 复述"生产者=基石、分解者=必需、消费者=加快循环"+食物链起点为生产者,做6道生态系统真题,限时30秒/题。
  time_budget_sec: 30
  accuracy_rule: 正确率≥85%
  pitfall: 误把蚯蚓/土壤动物一律当分解者:判断角色要看行为描述(题干"同化建造自身+排泄"=消费者)。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
