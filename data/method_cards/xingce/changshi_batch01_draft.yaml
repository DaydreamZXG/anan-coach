  - 岳飞主线:岳家军冻死不拆屋饿死不掳掠→郾城之战破铁浮图拐子马(撼山易撼岳家军难)→直捣黄龙(迎二圣)→十二道金牌十年之功废于一旦→莫须有之罪风波亭遇害39岁
  - 易混刺字:岳母刺字=尽忠报国,赵构赐旗=精忠岳飞,民间合流为精忠报国
  - 绍兴和议1141:宋向金称臣、以淮河大散关为界、岁贡银绢各25万;金兀术附加条件必杀岳飞而后和可成;秦桧东窗事发(与王氏东窗密谋)
