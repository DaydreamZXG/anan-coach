    - 考楚汉争霸人物命运(属上卡)
  method_steps:
  - 沙丘之谋三知情人:丞相李斯、中车府令赵高(掌管玉玺)、第十八子胡亥;秦始皇生前未立太子,死讯封锁用鲍鱼咸鱼掩盖尸臭
  - 篡诏链:赵高先劝胡亥(我太想进步了)→六次威逼利诱李斯(比才能谋略功勋人缘信任五不如蒙恬)→伪造诏书赐死扶苏(四大虚构罪名)与蒙恬
  - 秦二世暴政:杀旧臣提新臣、杀十公子十二公主、大兴土木修阿房宫与骊山陵;赵高诬李斯谋反,假御史拷打至认罪,腰斩并夷三族,遗言牵犬东门
  - 指鹿为马=赵高试探群臣、清除异己;前207赵高逼杀胡亥欲自立,因异象放弃,立子婴;子婴设计诛杀赵高并灭三族
  error_signatures:
  - code: shaqiu_insider_wrong
    description: 把沙丘之谋知情人记成更多人,实仅李斯赵高胡亥三人
  - code: zhihuwaima_purpose
