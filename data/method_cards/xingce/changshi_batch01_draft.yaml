- id: mc_dongwu_fenlei_biantai
  exam_scope: guokao
  track: xingce
  module_name: 常识判断
  tag_path: 常识判断/科技生物/动物分类
  title: 动物分类与变态发育(恒温/昆虫/拟态)
  recognition: 题干出现"是不是鱼/昆虫/哺乳动物""完全变态/不完全变态""有蛹""恒温动物""警戒色/保护色/拟态""共生/寄生""社会性昆虫"等。
  applicability:
    include:
    - 判断"xx是不是鱼/昆虫/哺乳动物"
    - 变态发育类型判断(孑孓:蚊子=完全变态,蝌蚪:青蛙=变态发育)
    - 警戒色/保护色/拟态的诗句判断与种间关系
    exclude:
    - 进化顺序与分类层级
    - 生态系统组成与能量流动
    - 植物特征(裸子被子)
  method_steps:
  - '"是不是"速判表:昆虫=6条腿(蜘蛛8条腿属蛛形纲,蝎子/蜈蚣也都不是昆虫);章鱼乌贼=软体动物不是鱼;鲸/海豚=哺乳动物(肺呼吸)不是鱼;海马海龙鳗鱼=真鱼;企鹅=鸟类不是哺乳动物;鸭嘴兽=卵生哺乳动物(最古老现存)'
  - 变态发育:有蛹=完全变态(卵→幼虫→蛹→成虫,蚊蝇蝶蜜蜂蚕),无蛹=不完全变态(卵→若虫→成虫,蝗虫蜻蜓蟋蟀螳螂);两栖只称"变态发育"(蝌蚪→蛙)不分完全不完全;蜕皮=外骨骼不会随身体长大
  - 恒温动物=哺乳类+鸟类,变温动物=其余(爬行/两栖/鱼);鳄鱼、蜥蜴的性别由孵化温度决定
  - 防御与关系:警戒色=鲜艳警告有毒(箭毒蛙/黄蜂条纹)、保护色=颜色融入环境(青蛙绿/黄蝶菜花)、拟态=形态模仿(尺蠖像树枝/竹节虫/枯叶蝶);种间四关系=共生(小丑鱼+海葵、寄居蟹+海葵、犀牛+犀牛鸟)/寄生(双盘吸虫控蜗牛、菟丝子寄生豆科、冬虫夏草是寄生不是共生)/竞争(牛羊争草)/捕食
  error_signatures:
  - code: insect_legs_wrong
    description: 昆虫判断错:昆虫6条腿,蜘蛛8条腿不是昆虫,蜈蚣马陆是多足纲也不是
  - code: fish_misclassify
    description: 鱼的分类记错:鲸/海豚/章鱼/乌贼不是鱼,海马海龙鳗鱼是鱼
  - code: biantai_type_confusion
    description: 完全不完全变态记反:有蛹=完全(蚊蝶蜜蜂),无蛹=不完全(蝗蜻蟑螳)
  - code: jingbao_baohu_nitai
    description: 警戒色/保护色/拟态混淆:黄蜂条纹=警戒色,黄蝶飞入菜花=保护色,尺蠖像树枝=拟态
  fix_action: 默写"昆虫/蛛形纲/软体/鱼/哺乳"分类判断表+完全与不完全变态代表例,做10道动物分类真题,限时35秒/题。
  time_budget_sec: 35
  accuracy_rule: 正确率≥80%
  pitfall: 蜘蛛被误判为昆虫(6条腿才是昆虫),以及"黄蝶飞入菜花"被误判为拟态(实为保护色)。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
