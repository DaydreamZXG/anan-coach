  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/论证推理/削弱/固定总量分配
  title: 固定总量-多变量分配(零和破解)
  recognition: 题干限定总量/总利润固定(利润总额$2亿、玉米总产量定值),由一方增加推导另一方减少,问削弱
