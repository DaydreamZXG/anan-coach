  tag_path: 判断推理/逻辑判断/评价结构/首尾锚点
  title: 结构类比-首尾锚点法
  recognition: 问"推理逻辑最相似"，题干句首与句尾是同一词的肯定与否定（如"古丝绸之路"vs"不可能重现辉煌"）
  applicability:
    include:
    - 首尾构成A/非A否定关系的题干
    - '"A靠B和C，只有B不能有A"结构'
    - '"A不是B，所有B都要C，因此A不用C"结构'
    exclude:
    - 简单连锁推理（直接锚定"因此"首尾即可）
