- id: mc_logic_support_causal_claim
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/削弱加强/支持方式
  title: 支持因果关系结论三法
  recognition: 结论为"A是B的原因/改变A可改变B",问支持或前提
  applicability:
    include:
    - 支持"改变A就能改变B"的前提假设
    - 实验结论的支持
    - 题干为共现或正相关结构
    exclude:
    - 问削弱
    - 解释现象题
    - 结论并非因果关系
  method_steps:
  - 三选一:①排除因果倒置(不是B导致A,如"焦虑症不会让狗产生更多镁离子")②建立联系(解释A→B机制)③前假后假(无A则无B)
  - 前提型优先找"排除因果倒置"项(否定B→A)
  - 注意"有无"≠"高低":题干说含量高,选项说"没有"是概念错位
  error_signatures:
  - code: have_vs_high
    description: 选项用"没有X"回应题干"X含量高"(有无≠高低)
  - code: side_effect_irrelevant
    description: 选"无副作用"类选项(与因果无关,任何药都有副作用)
  - code: degree_mismatch
    description: 程度词不匹配(题干"长期应激",选项"缓解应激"≠没有应激)
  - code: dose_variation
    description: 选"剂量因人而异"类个体差异项(不同阶段不同剂量)
  fix_action: 做5道因果支持/前提题,每题把选项归到三法之一,限时75秒/题
  time_budget_sec: 75
  accuracy_rule: 正确率≥80%
  pitfall: 支持前提题最优先找"排除因果倒置",不要被"建立联系"的机制选项抢先(铝题、狗镁离子题D项为标答)
