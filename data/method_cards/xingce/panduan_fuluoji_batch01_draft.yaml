  title: 一一对应-比较与共同活动定"不是同一人"
  recognition: 条件为"教师比乙年龄大""甲与丙一起爬山/下棋""和第一名是好友"等比较或共同活动表述 → 蕴含"两者不是同一人"
  applicability:
