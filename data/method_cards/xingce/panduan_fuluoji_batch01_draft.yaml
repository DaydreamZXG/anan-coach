    - 问"有些X是Y"或交集数量比较
    - 占比明确的集合题
    exclude:
    - 只有一个"超过一半"
    - 两个占比相加≤100%
    - 问具体个体归属
  method_steps:
  - 找出两个占比>50%的集合
  - 直接写结论:有些(集合1)是(集合2)(必有交集)
  - 若比较大小:两个>50%集合的交集,必大于两个<50%集合(非1且非2)的交集
  error_signatures:
  - code: single_half
    description: 只用一个过半集合就下交集结论
  - code: half_boundary
    description: 把"恰好50%"当成超过一半
  - code: compare_direction
    description: 交集大小比较写反(大的是两个过半的集合,不是两个不过半的)
  fix_action: 做2道过半交集题(2021山东工学就业、2012管综阔叶珍稀),直接套公式
