  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/两者相比
  title: 引入他因-两者相比(A与B比较)
  recognition: 结论是'A比B好 / A将取代B / 首选A'这类比较句
  applicability:
    include:
    - A与B比较类支持削弱题(海水养殖vs盐碱地/糖电池vs锂电池/纸质vs数字阅读)
    - 多个竞争对象偏好题(一线vs二线vs三线城市)
    exclude:
    - 单主体利弊题
    - 比较基准不明、只列数据的题
  method_steps:
  - 先明确结论偏好哪一方
  - '支持''胜方''两条路: ①说胜方优点 ②说败方缺点; 削弱反之: 说胜方缺点/说败方优点'
  - 多对象比较须覆盖全部竞争对象(首选二线城市须同时否定一线与三线)
  - 按关键词与结论核心的匹配度选最强项(纸质深度阅读→系统思维/专注力, 优于泛谈'独特体验')
  error_signatures:
  - code: reverse_support
    description: '选成反向: 说结论偏好方的优点, 实为削弱(结论''海水养殖难被替代'', 选盐碱地养殖优点)'
  - code: hidden_evaluation
    description: 没识别'不求甚解''未尝不可'等隐性贬义/褒义词
  - code: incomplete_coverage
    description: 只否定部分竞争对象, 支持不完整
