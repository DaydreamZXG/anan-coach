- id: mc_logic_causal_link_third_party
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/由因推果
  title: 由因推果-通过第三者建立联系
  recognition: 题干存在两派观点,反对者明确否定初始原因A并主张B才是真正原因(典型表述如"与情绪无关""不是营养不均衡")
  applicability:
    include:
    - 题目出现"有人反对/第二种观点认为",且反对者否定了某个初始原因
    - 问"最能削弱/支持第一种(或反对者)观点"
    - 题干可概括为A→B→C传递关系,反对者只承认B→C
    exclude:
    - 只问一般性削弱、无两派观点对立的题
    - 题干是实验组对照组设计(改用起点比较法)
    - 问解释型或评价型题目
  method_steps:
  - 标出反对者否定掉的初始原因(A)与反对者主张的直接原因(B),把争议锁定为"B是C的原因,A与C无关"
  - 在选项中找"A导致B"的陈述,即承认A先导致B、再由B导致C的传导链
  - 命中"从被否定因素指向反对者主张因素"的选项直接选
  error_signatures:
  - code: causal_reversal
    description: 选了因果倒置项(颠倒A/C关系),未针对反对者的否定链
  - code: irrelevant_third_factor
    description: 选了无关第三方因素,没有把A与B联系起来
  - code: support_opponent
    description: 误选支持反对者观点的选项(如"催产素确实影响社交")
  - code: misread_direction
    description: 方向反了,选了"B导致A"而非"A导致B"
  fix_action: 做10道"反对者观点"削弱题,每题先口头复述A→B→C链条再选,限时80秒/题
  time_budget_sec: 80
  accuracy_rule: 正确率≥85%(本考点国考近五年出现三次,结构固定,识别后应秒杀)
  pitfall: 容易被"其他原因也能导致结果"的选项迷惑(如四川真题B选项),它不构成对反对者否定链的反驳
