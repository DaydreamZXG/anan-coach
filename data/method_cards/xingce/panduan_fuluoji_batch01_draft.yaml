- id: mc_dose_insufficient_quantity
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/由因推果/量变质变
  title: 由因推果-量变不等于质变(剂量不可行)
  recognition: 结论称某物质/行为"有好处/有效",削弱选项提到"需要达到XX剂量才有效"的数值表述
  applicability:
    include:
    - 削弱"X有保健/治疗/助眠等效果"的结论
    - 选项出现"需要摄入XX剂量才有效"的剂量表述
    exclude:
    - 题干未给出可量化的效果阈值
    - 存在更强的逻辑断点选项(因果误判、概念偷换、比较对象错误)
    - 选项剂量数值未达"极端不可行"程度(如"每天喝1斤")
  method_steps:
  - 1. 锁定结论中的"有效/有益"主张,标出剂量断点位置(实际摄入量 vs 有效剂量)
  - 2. 检查"量不足"选项的数值是否极端离谱(如每天25罐饮料、1公斤干茶叶),不够离谱先排除
  - 3. 优先排查其他逻辑断点:因果误判、概念偷换、比较对象错误等更直接的削弱
  - 4. 仅当其他选项明显错误且数值绝对不可行时,才选"量不足"项
  error_signatures:
  - code: partial_valid_confused_as_invalid
    description: 混淆"部分有效"与"完全无效"(仅对Ⅱ型有效仍算有效)
  - code: mild_quantity_option
    description: 接受缺乏极端数值的"量不足"选项(小份牛奶效果不足)
  - code: missed_stronger_weaken
    description: 选量不足项而忽略更直接的因果否定(被试服抗抑郁药)
  fix_action: 做5道剂量/摄入量类削弱题,限时80秒/题
