  title: 真话假话-矛盾关系定真假
  recognition: 题干说明"只有一句真话(或假话)",条件中存在互为矛盾的两句话 → 矛盾对必一真一假,占据唯一名额,其余话全假(或全真)
  applicability:
    include:
    - '"只有1句真话"+能找到矛盾对(A与非A;A或B与非A且非B;A→B与A且非B)'
    - '"只有1句假话"+能找到矛盾对'
    - 两真两假:先找矛盾对占一真一假
    exclude:
    - 所有条件均为真(直接代入推理)
    - 找不到矛盾对(改用同真/不能同假/代入验证)
    - 选项是逻辑箭头
  method_steps:
  - 逐句找矛盾对:矛盾要求"永远一真一假",且主语必须完全相同
  - 矛盾两句占据唯一的真话名额(或假话名额),其余所有话必然为假(或为真)
  - 对"其余话"取否推出确定事实(假言为假→前件真且后件假)
  - 把推出的事实代回验证
  error_signatures:
  - code: false_contradiction_or
    description: 把"A或B"与"非A"当矛盾(非A且B时两句话同真,不是矛盾)
  - code: false_contradiction_and
    description: 把"A且B"与"非A"当矛盾(A且非B时两句话同假)
  - code: prem_leap
    description: 真假未定就按"肯前推肯后/否后推否前"推理
  - code: subject_mismatch
    description: 只盯否定词,不核对主语是否完全相同
  fix_action: 做5道找矛盾真话假话题(2022国考五句、2025省联考五人说对),每题先标出矛盾对
