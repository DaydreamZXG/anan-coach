  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/做了也白做
  title: 引入他因-做了也白做(措施失效)
  recognition: 题干'采取某措施→预期效果', 削弱=找使措施无效/效果被抵消的他因(虽然...但是...结构)
  applicability:
    include:
    - 措施有效性削弱题(防沉迷/虚拟号码/张贴求助电话)
    - 政策效果质疑题(遗产/早起不迟到)
    - 食品安全类'吃了也白吃'题(猪蹄胶原蛋白/鱼油/牛蛙寄生虫)
    exclude:
    - 由果推因题
    - 支持措施效果的题
  method_steps:
  - 定位结论的预期效果及其限定词('马上''一定'等)
  - '找''实施障碍'': 引入阻碍/抵消原措施的他因, 证明''即使做了也无效''(堵车/轮胎被扎/外援腿伤)'
  - '击穿措施成立的前提: 防沉迷系统→冒用身份无法识别; 虚拟号→下单环节信息已泄露'
  - '排除: 部分有效≠完全无效、事后补救/后续影响(维权困难≠泄露发生)、无关比较项(考公与生活改变)'
  error_signatures:
  - code: scope_shift
    description: 混淆结论限定范围('防网络游戏沉迷'≠'防所有游戏')
  - code: partial_vs_total
    description: 选'部分有效'选项当作完全无效(仍获得部分遗产)
  - code: post_hoc_treatment
    description: 选事后补救/后续影响选项(泄露后的维权困难)
  - code: key_condition_not_broken
    description: 未破坏措施成立的关键前提(身份识别这一前提)
  fix_action: 做10道做了也白做题, 限时65秒/题
  time_budget_sec: 65
  accuracy_rule: 正确率≥85%
  pitfall: '''运到≠用到'': 削弱输送有效性只需证明物质无法完好送达(彗星撞击高温高压破坏磷分子结构), 不关心后续利用; 正确选项直接切断''建议→效果''的联系(夜间无人接听)。'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
