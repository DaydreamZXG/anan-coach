- id: mc_logic_explain_contradiction
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/解释评价/解释矛盾
  title: 解释矛盾-引入让结果成立的他因
  recognition: 问"解释上述现象/看似矛盾",论据"按理说"推出的情况与实际结果相反
  applicability:
    include:
    - 收费后晚接反而增多、政策降药价但药价上涨、装软件后员工更忙
    - 按常理结果应怎样与实际结果矛盾
    - 问"最能解释"
    exclude:
    - 论据与结果一致(那是解释现象)
    - 问削弱/支持
    - 选项只解释"没有减少"而非"增多"
  method_steps:
  - 写出对立:"按理说应→实际却是→"
  - 找能解释"实际结果为何成立"的他因,方向必须对准结果
  - 检验选项:必须让"增多/上涨/更忙"成立,只解释"没减少/没下降"的不选
  error_signatures:
  - code: explain_no_change
    description: 选项只能解释"数量没减少",不能解释"数量增加"(收费标准低)
  - code: individual_case
    description: 用个别家长抗议、个别宠物猫解释整体数据变化
  - code: ignore_quantity_word
    description: 忽略"一些/部分"这类不确定数量词,不足以支撑大幅变化(流浪猫增1.5倍)
  - code: one_sided_explain
    description: 只解释矛盾的一半(麦子题只解释不愿种或只解释成主食)
  fix_action: 做6道解释矛盾题,每题先写"按理/实际"两行再核对选项方向,限时70秒/题
