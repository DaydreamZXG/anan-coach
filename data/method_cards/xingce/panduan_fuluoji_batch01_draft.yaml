- id: mc_aeio_duidang
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/AEIO/对当关系
  title: AEIO对当关系-真假话定位
  recognition: 题干为"所有…都是/都不是"与"有的…是/不是"的直言命题,并告知真话/假话数量 → 用对当关系占名额
  applicability:
    include:
    - 出现"所有…都有/都没有""有人…""有的…不是"表述,且问真假
    - '"只有一句真话/一句假话/两真两假"'
    - 需要利用对当关系占名额后取否推事实
    exclude:
    - 文氏图题(问"推出什么",不涉及真假判断)
    - 以假言命题为主
    - 无"所有/有的"结构
  method_steps:
  - 给每句话标注类型:A=所有都是、E=所有都不是、I=有的是、O=有的不是
  - 找矛盾对:A与O、E与I,一真一假占两名额(记"IE矛盾,浏览器")
  - 无矛盾用:上反对A-E至少一假、下反对I-O至少一真、差等A真→I真且E真→O真(反向不行)
  - 确定某句为假后取否推出事实(A假→O真,E假→I真)
  error_signatures:
  - code: ae_treated_contradiction
    description: 把A-E上反对当矛盾(A-E可同假,只占假话名额)
  - code: reverse_subaltern
    description: 由"I真"推"A真"(特称真推不出全称真)
  - code: type_label_wrong
    description: '"没有人…"翻译错(E与O混淆)'
  - code: singular_ignored
    description: 忽视单称命题(可视为特殊I/O处理)
  fix_action: 做6道AEIO真题(2018国考、2018山东、2022上海、2022山东),每题先标注每句类型与关系
  time_budget_sec: 75
  accuracy_rule: 正确率≥80%
  pitfall: 上反对A-E"至少一假可同假"、下反对I-O"至少一真可同真",两者方向相反;记反或记混直接错
