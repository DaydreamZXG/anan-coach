- id: mc_shutu_tonggui
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/推矛盾/殊途同归
  title: 殊途同归-正反两路夹逼必真
  recognition: 对同一对象,无论它为真还是为假都推出同一结论(如"想学乐器→学电吉他"与"不学乐器→学电吉他")→ 该结论必然为真
  applicability:
    include:
    - 题干出现"若A则C"与"若非A则C"式的对称条件
    - 通过逆否转换能把不同前件归到同一对象的正反两条路
    - 题目要求推出"一定为真"的结论
    exclude:
    - 只有单向逻辑,找不到对同一对象的正反两路
    - 题干已给事实真(直接代入更快)
    - 问"可能为真/不可能为真"
  method_steps:
  - 翻译并把条件逆否化,统一成"对象X→结论C"与"非X→结论C"两条路径
  - 确认两条路径推出的结论是同一个命题(殊途同归点)
  - 无论X真假结论都为真,该结论即为隐藏事实真;锁定后再代入原条件验证其余结论
  error_signatures:
  - code: non_contrapositive_used
