- id: mc_qianzhen_houjia
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/代入验证/前真后假
  title: 问一定为假-直接找前真后假
  recognition: 题干给逻辑(如果…那么…),问"一定为假/不可能为真/说法有误/断定不成立",选项是具体情况 → 找"前件真且后件假"的选项
  applicability:
    include:
    - 问法:"哪项一定为假""不可能为真""说明断定不成立""表明说法有误"
    - 题干给出一个或多个逻辑箭头
    - 选项是具体情境(某情况发生与否)
    exclude:
    - 问"一定为真"要推结论(用推矛盾/代入)
    - 选项是逻辑箭头而非具体事实
    - 条件真假未知(真话假话题)
  method_steps:
  - 翻译题干所有逻辑箭头(A→B),逐一编号
  - 套规则:A→B为假当且仅当"A为真且B为假"(前真后假);可先改写成非A或B再取否理解
  - 逐个选项比对是否为某条逻辑的"前真后假"
  - 题干多条逻辑时逐条核对,用过的条件打勾防漏
  error_signatures:
  - code: reverse_judged
    description: 把"前假后真"或"后件为真"误判为逻辑为假
  - code: missed_condition
    description: 题干多条逻辑只核对了其中一条
  - code: cross_chain_confusion
    description: 把跨条件串行元素当成同一逻辑的前真后假
  - code: text_diving
    description: 陷入文字语义,不用结构化"前真后假"比对
  fix_action: 做5道"一定为假"题,每题写出"哪个选项构成A且非B"再对答案
