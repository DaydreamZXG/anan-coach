  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/前提假设/取反验证
  title: 引入前提-取反验证法
  recognition: 问法出现"要得到上述结论，需要补充的前提假设/必须假设"，要选结论成立的必要条件，前提常来自题干外信息
  applicability:
    include:
    - 问"需要补充的前提假设""必须假设"类题目
    - 题干给论证结构、前提在题干外
    - 支持题选项中出现"前提假设"表述
    exclude:
    - 问削弱/加强（不需要验证必要性）
    - 题干结论已有充分支撑、问"最能支持"
  method_steps:
  - 划出题干论证链条：论据→结论
  - 对每个选项取反（否定）后代入题干，判断结论是否"明显不成立"
  - 取反后结论明显不成立的选项就是必要条件，当选
  - 互检：若A是B的前提，则非A即削弱B——正确前提的否定应能削弱结论
  error_signatures:
  - code: chose_sufficient_condition
    description: 把充分条件/一般支持项当成必要前提，取反后结论只是"可能不成立"而非"明显不成立"
  - code: scope_expanded
    description: 选项扩大了结论限定范围（如结论"判断佳酿"被扩为"判断一般酒/品质"）
  - code: negated_wrong_link
    description: 取反时对准了无关环节，没有作用于结论成立的必要条件上
  fix_action: 做10道引入前提真题，每题手写"选项取反→结论是否明显不成立"两栏记录，限时80秒/题
  time_budget_sec: 75
  accuracy_rule: 正确率≥85%
