  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/文氏图/思维误区
  title: 文氏图-"有的…不/是"不可互推
  recognition: 排除型选项常考:"有的A不是B"推不出"有的B不是A";"有的A是B"推不出"有的A不是B" → 见到即判不可推出
  applicability:
    include:
    - 选项出现"有些A不是B"类的反向断言
    - 判断某个"有的"命题能否推出
    - '"并非所有A都是B"需翻译为"有的A不是B"'
    exclude:
    - 由箭头链能直接推出的结论
    - 选项为具体个体断言
  method_steps:
  - 判断选项是"有的A是B"还是"有的A不是B"还是"所有…"
  - 能推出"有的A不是B"的情形:由箭头链把A代入非B侧(如 有的博士→非统计→非男性)
  - 凡是从"有的A是B"推"有的B不是A"、或从"有的A是B"推"有的A不是B"的,一律判为推不出
  error_signatures:
  - code: o_to_o_reverse
    description: 由"有的A不是B"推"有的B不是A"(A包含B时所有B都是A,此推断不成立)
  - code: i_to_o
    description: 由"有的A是B"推"有的A不是B"(可能所有A都是B)
  - code: not_all_mistranslated
    description: '"并非所有A都是B"错翻成"所有A都不是B"(应为"有的A不是B")'
  fix_action: 做3道误区辨析题(2023广东博士男性、2025管综果树、2018北京语言奖),每题标注哪些选项是误区
