  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/由果推因/他因削弱
  title: 由果推因-引入真实他因削弱
  recognition: 题干已知结果Y并归因于原因X(结论"X导致了Y"),削弱需引入真实发生在题干情境中的另一个原因Z
  applicability:
    include:
    - 结论将结果归因于特定原因(由果推因)
    - 生物/天文/社会现象类削弱题
    - 国考特征:每年至少1道因果推理题
    exclude:
    - 由因推果(结论"X会导致Y",削弱方式不同)
    - 支持题
  method_steps:
  - 1. 识别推理方向:已知结果Y→结论声称原因X
  - 2. 削弱=引入真实发生在题干情境中的他因Z(雨林火灾←异常降雨;成绩差←游戏占用精力;产量差←土质不同)
  - 3. 关键:他因必须"实际发生",理论可能性("自驾也可以去北京")无效
  - 4. 排除仍在归因于X的选项(家庭教育改进仍说教育)和无关类比(北面地亩产、邻国情况)
  error_signatures:
  - code: theoretical_cause_only
    description: 只列理论可能的他因,未说明实际发生
  - code: repeat_original_cause
    description: 选项仍归因于原原因方向(仍说家庭教育相关内容)
  - code: post_result_change
    description: 用结果发生后的变化削弱(时间晚于结果,无关)
  - code: cross_object_analogy
    description: 拿第三方对象类比(北面地亩产、邻国情况)
  fix_action: 做8道由果推因削弱题,限时70秒/题
  time_budget_sec: 70
  accuracy_rule: 85%
  pitfall: 由因推果削弱=引入使结果不成立的他因;由果推因削弱=引入真实发生的替代原因,方向不可混
