- id: mc_luoji_lunzheng_liubu_fa
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/论证推理/解题总法
  title: 论证推理解题总法-六步定位
  recognition: 题干是"背景故事+结论引词+结论"的长文,提问为削弱/支持/假设等,需先剥离文字找推理骨架。
  applicability:
    include:
    - 论证推理题(削弱/支持/假设/解释/评价),题干文字多、易读晕
    - 需要快速定位论据与结论的题
    - 训练"先想正确选项模板再看选项"的题
    exclude:
    - 形式逻辑题(翻译/真假/代入验证),无结论引词结构
    - 分析推理(队列/分组/数独)等非论证题
    - 一句式纯数据背景题(可直接支持结论,不按此六步)
  method_steps:
  - 看提问句,只区分"正着说"(支持/假设)还是"反着说"(削弱),不纠结提问词
  - 从下往上找结论引词("因此/所以/据此认为/科学家认为"),引词后面就是结论
  - 结论往前倒一句找论据;背景信息占7-8成,可直接略过
  - 盖住选项先判断推理结构(共存因果/对比实验/两句式/一句式),预想正确选项模板后再开选项锁定
  error_signatures:
  - code: read_from_top
    description: 从上往下通读,陷入背景故事,找不到结论和论据
  - code: options_first
    description: 先看选项再做阅读理解,被选项带偏开始脑补
  - code: conclusion_only
    description: 只盯结论对错,忽略论据在推理中的参与作用
  - code: story_matching
    description: 按选项文字故事匹配,而不是按推理结构匹配
  fix_action: 做10道论证推理真题,每题盖住选项先写下"结论+论据+推理结构"再选,限时70秒/题
  time_budget_sec: 70
  accuracy_rule: 正确率≥90%
  pitfall: 不要依赖排除法——先盖住选项建立正确选项的预期模板,打开选项直接锁定,否则每题白白多花30秒-1分钟。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
  validation:
    tested_count: 0
    passed_count: 0
    sample_question_ids: []
