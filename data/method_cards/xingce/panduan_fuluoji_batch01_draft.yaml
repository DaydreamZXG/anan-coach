  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/文氏图/代入替换
  title: 文氏图-所有写箭头、有的代入替换
  recognition: 题干同时出现"所有…都是"与"有的…是",问"可以推出什么" → 文氏图题(不是真话假话)
  applicability:
    include:
    - '"所有A都是B"+"有的C是A"类组合'
    - 两个"所有"+一个"有的"
    - 补前提题型:已知"有的A是C",目标"有的B是C",需补"所有A都是B"
    exclude:
    - 问"只有一句真话/假话"(AEIO真假话)
    - 无"所有/有的"结构
    - 问"可能/不可能为真"
  method_steps:
  - 把"所有…都是/都不是"写成箭头(A→B、C→非B)
  - 把"有的X是Y"中X代入箭头,沿箭头方向推出的内容替换后件(只能替换后件,不能逆推前件)
  - 需反向时先换位:"有的A是B"↔"有的B是A",再代入
  - 补前提:要使"有的A是C"变"有的B是C",必须补"所有A都是B"(方向A→B)
  error_signatures:
  - code: antecedent_substitute
    description: 把"有的"条件错误替换到前件(只能替换后件)
  - code: no_commutation
    description: 忘了"有的A是B"可换位为"有的B是A"
  - code: reverse_all
    description: 由"有的"反推"所有"
  - code: individual_overreach
    description: 推出"有的教师…"却去推断具体某个老师
  fix_action: 做6道文氏图题(2023北京、2018国考、2025管综、2018北京语言奖),每题先写箭头链再代入
