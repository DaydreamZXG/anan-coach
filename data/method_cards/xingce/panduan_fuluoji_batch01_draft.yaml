- id: mc_sentence_structure_identification
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/论证推理/句式判定
  title: 判定一句式与两句式推理
  recognition: 论据与结论是否前后一半重复, 是否存在概念跳跃/断点(车轱辘话还是桥断开)
  applicability:
    include:
    - 论证推理读题第一步, 决定削弱/支持的操作对象
    - 统计相关类推理(牛磺酸水平高→健康好, 属于一句式)
    exclude:
    - 形式逻辑充分/必要命题的推导题
    - 已明确是建立联系或引入他因的题
  method_steps:
  - 用'因此/结果发现'定位结论, 检查论据是否重复结论的关键词
  - '论据结论完全重复→一句式: 削弱/支持直接针对结论本身, 可自由引入他因(牛奶题不必针对色氨酸)'
  - '前后半不同、存在概念断点→两句式: 支持必须补全''论据→结论''缺失链条(B与C的关系), 削弱可攻击任一推理环节'
  - '口诀: 完全重复一句式, 概念断点两句式'
  error_signatures:
  - code: sentence_count_confusion
    description: 按句子数量判断, 把'两句话'当成两句式
  - code: missing_conclusion_keyword
    description: 没发现论据已含结论关键词, 误判为两句式
  - code: loose_weakening_two_sentence
    description: 两句式支持题选了只支持结论、不补逻辑链条的选项
  fix_action: 做8道句式判定辨析题, 限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥90%
  pitfall: 所有由果推因都是一句式(论据是事实结果); 所有两句式都是因推果。删除论据中的结论关键词可把一句式改编成两句式(色氨酸→助眠 改为 色氨酸→穿过屏障)。
