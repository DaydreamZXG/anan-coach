  tag_path: 判断推理/逻辑判断/论证推理/支持/前假后假
  title: 前假后假支持(无因无果)
  recognition: 论据是"A与B同时存在或同增同减(相关)",结论是"A是B的原因(因果)",问支持
  applicability:
    include:
    - 支持"X能降低/导致/治疗Y"的因果结论
    - 题干给出A与B共变或同存的观察论据
    exclude:
    - 削弱题(改找前真后假/前假后真)
    - 题干无比率或共变数据
  method_steps:
  - 1. 判定论据只是"相关"(A与B同存/共变)而结论是"因果"(A导致B)
  - 2. 优先找"前假后假":没有A时B也不出现(没吃蘑菇→认知风险高),直接支持
  - 3. 次选"建立联系":解释A通过什么机制导致B(茶多酚→基因表达改变)
  - 4. 排除单边选项(只有A或只有B)与概念偷换(得病vs治病、增强减弱vs有无)
  error_signatures:
  - code: one_side_condition
    description: 选项只含前真或后假单边,缺另一半(只论证A有/无)
  - code: disease_vs_treatment
    description: 混淆"得病率"与"治疗效果"(无刺激得病率低≠治疗无效)
  - code: strength_vs_existence
    description: 混淆"A增强减弱"与"A有无"(奖赏回路仍有活动≠活动强)
  - code: middle_chain_support
    description: 支持了中间链条而非题干核心(支持叶绿素与营养而非颜色与叶绿素)
  fix_action: 做8道"无因无果"支持题,限时65秒/题
  time_budget_sec: 65
  accuracy_rule: 85%
  pitfall: 前假后假必须同时包含"没A"和"没B"两部分,只给"没A"不给"没B"是迷惑项
