  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/形式逻辑/连词翻译/逆否等价
  title: 逆否命题与等价转换
  recognition: 需要找与题干等价/最接近的表述，或题干含"或"要转成"如果"条件式
  applicability:
    include:
    - A→B找逆否¬B→¬A
    - A∨B转换¬A→B/¬B→A
    - 复合逆否：A→(B∨C)的逆否=(¬B∧¬C)→¬A
    - '"除非A否则B"三等价：¬A→B、¬B→A、A∨B'
    exclude:
    - 代入事实真推理（直接推理，非找等价）
    - 判断逻辑真假里选项直接匹配题干
  method_steps:
  - 逆否：箭头反向+两边加非，A→B≡¬B→¬A
  - 或转箭头：否定一边推另一边——¬A→B、¬B→A与A∨B三者等价；肯定一边不能推另一边
  - 复合逆否逐层处理，先内后外
  - 遇到"除非否则"可三式互换，选表述一致者
  error_signatures:
  - code: affirmative_or_inferred
    description: '"或"里肯定一边就推另一边（你付了→我不用付），实际可能AA制'
  - code: half_negation_contrapositive
    description: 逆否只加了一半非或没反向
  - code: equivalence_direction_reversed
    description: ¬A∨B错写成¬A→¬B
