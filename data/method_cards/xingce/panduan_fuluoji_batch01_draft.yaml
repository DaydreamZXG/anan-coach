- id: mc_direct_pros_cons
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/引入他因
  title: 引入他因-直接说利弊
  recognition: 结论是'某措施/因素带来好(坏)结果', 题干主体单一, 问支持或削弱
  applicability:
    include:
    - 政策/技术/材料可行性支持削弱题(水闸/儿童食品/黑匣子/环保材料)
    - 措施效果评价题
    exclude:
    - A与B比较题(两者相比另卡)
    - 需权衡多因利弊的题(利弊相权另卡)
  method_steps:
  - '死扣结论字面: 确认主体范围+具体效果, 不脑补延伸'
  - '定方向: 支持=引入正向他因(让结论成立, 如''肥料有营养促生长''); 削弱=引入反向他因(让结论不成立)'
  - '削弱直接否定核心要件: 选直接针对结论关键点的选项(成分与普通食品无差异/隔热耐久不足/信号受不可控因素影响)'
  - '排除外围: 替代方案、成本效益、特殊人群过敏、''不能完全替代''(≠材料不成立)'
  error_signatures:
  - code: over_extension
    description: 过度脑补, 把结论主体范围扩大或缩小
  - code: peripheral_factor
    description: 选成本/社会影响等外围因素(黑匣子题的投入产出比选项)
  - code: sample_size_without_defect
    description: 只说'样本量太少'却不配具体缺陷, 不构成削弱
  - code: special_case_only
    description: 选只针对特殊人群/场景的选项(过敏人群), 非本质缺陷
  fix_action: 做12道直接说利弊题, 限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥85%
  pitfall: '削弱=否定结论核心要件, 而非指出管理/标准缺陷(国家标准缺失≠不安全)或使用方式问题(过量进食≠不健康)。口诀: 削要害, 避外围, 特殊案例不算数。'
