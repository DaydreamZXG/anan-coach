- id: mc_logic_causal_reversal
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/因果倒置
  title: 因果倒置-识别并秒选
  recognition: 题干"具备A特征的人同时具备B特征(或实验组有A有B),所以A是B的原因",问削弱
  applicability:
    include:
    - 现象共现:A与B同时存在,推出A导致B
    - 实验对照:实验组有A→有B,对照组无A→无B,推出A导致B
    - 结论含"改变A就能改变B"的因果作用
    exclude:
    - 结论已有明确时间先后或机制解释(不再仅凭共现)
    - 问支持
    - 题干不是共现结构
  method_steps:
  - 看到"A与B同时存在→A是B的原因"且问削弱,优先想因果倒置
  - 找"具备B特征的人更倾向选择A"或"B是A的原因"的选项,直接选
  - 无标准倒置项时,退而找"起点不同/他因"类次强削弱
  error_signatures:
  - code: concept_swap
    description: 混淆相近概念(晚睡早睡vs睡多睡少、使用社交软件vs长时间用手机)
  - code: brain_fill
    description: 脑补选项与题干关联(居住条件好≠幸福、工作忙≠不幸福)
  - code: incomplete_same
    description: 选"两组并不完全相同"类模糊表述(不完全相同≠不相同)
  - code: support_confused
    description: 误把建立联系的支持项当削弱(门窗关紧→空气质量差→影响睡眠)
  fix_action: 做8道因果倒置削弱题,看到共现结构先写"B→A?"再对选项,限时75秒/题
