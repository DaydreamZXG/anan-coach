- id: mc_logic_necessary_condition_refute
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/削弱加强/必要条件
  title: 反驳"不需要B"-证明B是A的必要条件
  recognition: 观点隐含"有了A就能达成C,所以不需要B"(如上网能查词、电子书能满足阅读、人造肉能满足吃牛肉)
  applicability:
    include:
    - 问"最能削弱/质疑"某个"某物将被取代/不再需要"的观点
    - 底层逻辑是A(新方式)可直接达成C(目的),因此否定B(旧事物)
    - 反驳方向是证明B是A得以成立的前提
    exclude:
    - 问支持,或直接比较A与B谁更好
    - 题干只谈B自身有优点,未涉及A对B的依赖
    - 双方都主张某物有用、只是路径不同
  method_steps:
  - 抽出底层逻辑:题干认为A能达到C,所以不需要B
  - 扫选项,找"要达成A必须先有B"的必要条件表述
  - 命中必要条件即反驳"不需要B",直接选
  error_signatures:
  - code: praise_b_unrelated
    description: 被"B自身很好/有市场/有人用"迷惑,这些不构成对"被取代"的反驳
  - code: quality_argument
    description: 讨论A的缺陷(电子书伤眼、网上解释不准),未涉及A对B的依赖
  - code: missing_necessary_condition
    description: 找不到"必要条件"选项时被无关项带偏
  fix_action: 做5道"取代/不需要"类削弱题,先写"A→C→不需B"框架再逐项核对,限时80秒/题
  time_budget_sec: 80
  accuracy_rule: 正确率≥80%
  pitfall: '"A不完美/有缺陷"不等于"需要B",考官常以A的瑕疵作干扰(如词典题D选项)'
