  title: 实验对照-比较之前起点必须相同
  recognition: 题干为实验组(有A)与对照组(无A)对比,据结果差异推出"A有效/是原因"
  applicability:
    include:
    - 实验组对照组对比,问支持/削弱/前提假设
    - 比较类:两组人、两个城市做与不做某事,结果不同
    - 问"结论成立的必要假设/前提"
    exclude:
    - 两派观点争议题(改用第三者建立联系)
    - 题干没有明确分组对比
    - 解释现象题
  method_steps:
  - 确认实验前两组条件,自问"起点是否相同"
  - 支持/前提:找"实验前两组起点相同/无差异"或"实验组不比对照组好"的选项
  - 削弱:找"实验组起点本身就更好/更差"的选项;比较维度必须对准关键变量(如叶酸题只比对叶酸水平)
  error_signatures:
  - code: baseline_keyword_miss
    description: 选泛泛的"两组情况没有差异"项,未对准关键变量(叶酸题选健康情况相同不如叶酸水平相同)
  - code: endpoint_compare
    description: 拿"努力后的自己"与别人终点比,误用起点不同的比较
  - code: vagueness_option
    description: 选模糊项(如"大小城市事故率不同"未指明谁高谁低)
  - code: support_as_weaken
    description: 把"起点相同"(支持项)当成削弱项选
  fix_action: 做8道实验对照削弱/支持题,先找"之前/本来/无差异"关键词判断起点,限时75秒/题
