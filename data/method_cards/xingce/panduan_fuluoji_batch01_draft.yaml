  title: 结论推出-排除法五原则
  recognition: 问"由此可以推出/不能推出"，答案是题干能严格推出的信息，严禁脑补
  applicability:
    include:
    - 结论推出类全部题目
    - 选项含主观/绝对/程度/比较词时
    - 题干信息多需快速排除
    exclude:
    - 削弱/支持/假设题（可结合常识推理）
    - '"最能解释"类题目'
  method_steps:
  - 严守"不脑补"：题干没说的信息一律不选
  - 遇五类词直接排除：①主体与题干不同 ②题干未提的比较 ③程度副词（急剧/最/过于）④绝对词（所有/一定/必然）⑤主观词（应该/惊讶）
