- id: mc_true_antecedent_false_consequent
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/论证推理/削弱/前真后假
  title: 前真后假/前假后真削弱
  recognition: 题干为"如果A那么B""因为A所以B"或"只有A才B"的逻辑箭头关系,问削弱
  applicability:
    include:
    - 削弱充分条件结论(有A必有B)
    - 削弱必要条件结论("必不可少"→箭头指向条件)
    - 结论含"必然/一定/只要就"的逻辑推断
    exclude:
    - 支持题(改找前假后假)
    - 题干只有相关性而无箭头指向
    - 选项只描述前件或后件单边状态
  method_steps:
  - 1. 写出逻辑箭头并确认方向:充分条件"A→B";必要条件"必要箭头指条件"(只有A才B = B→A)
  - 2. 优先找"前真后假"反例(条件满足但结果不成立),是最强削弱
  - 3. 无前真后假再找"前假后真"(条件不满足但结果成立),次强削弱
  - 4. 确认选项同时包含前件和后件的状态,只说一边是迷惑项
  error_signatures:
  - code: one_sided_option
    description: 选项只描述前件或后件单边状态而误选
  - code: arrow_direction_reversed
    description: 必要条件方向搞反("必不可少"指向条件而非结果)
  - code: he_in_without_outcome
    description: 只引入他因而未关联结果状态(语言题缺"精神健康"关键词)
  - code: background_true_true
    description: 把"前真后真"的题干背景信息当作有效选项
  fix_action: 做8道前真后假/前假后真削弱题,限时70秒/题
  time_budget_sec: 70
  accuracy_rule: 85%
  pitfall: 当选项出现"有些...但是..."句式,立即锁定前真后假/前假后真结构快速匹配;前真后真只是题干背景
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
