- id: mc_luoji_yijushi_zhijie_zhichi
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/论证推理/一句式推理/直接支持
  title: 一句式-直接支持结论
  recognition: 论据是调查数据/统计/背景信息,与结论无主语或效果重复,结论是独立的因果判断。
  applicability:
    include:
    - 论据为纯数据(如调查显示绿地面积与孤独感数据),结论独立(绿地增加→孤独感降低)
    - 结论自身是"A→B"关系,支持可直接针对结论
    - 举例支持型(具体比例/案例数据)在此题型有效
    exclude:
    - 论据结论有重复要素、需补链条的题(两句式)
    - 需论据参与推理才能成立的前提/假设型题
    - 结论无因果结构、需"指出相同"来支持的题
  method_steps:
  - 确认论据是纯背景(与结论无重复要素),判定为一句式
  - 支持:直接建立结论内部的因果链条(绿地面积增加→社交频率上升→孤独感降低)
  - 举例支持有效:带具体数据/比例的选项(如47%受试者出现愤怒情绪)可支持"饥饿→愤怒"
  - 排除只重复结论信息、无实质推进的选项
  error_signatures:
  - code: mistaken_as_double
    description: 一句式当两句式处理,苛求"补链条"而误杀直接支持结论的正确项
  - code: evidence_repeat_only
    description: 选了只重复结论、没提供新支持信息的弱选项
  - code: example_support_ignored
    description: 忽视举例/数据型选项在本题型的支持效力
  - code: option_outside_conclusion
    description: 选了支持别的关系、没对准结论A→B的选项
  fix_action: 做6道一句式真题,每题先判断"论据是否与结论重复"再决定支持方式,限时55秒/题
  time_budget_sec: 55
  accuracy_rule: 正确率≥90%
  pitfall: '"重复找链条,独立看结论"——同一结论改成两句式结构后,正确答案会从"直接支持结论"变成"补中间环节",先分清结构再选。'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
