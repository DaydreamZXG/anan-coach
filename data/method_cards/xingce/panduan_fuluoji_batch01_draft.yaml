  - code: premise_count_wrong
    description: 题干两个前提，选项只有一个前提就选
  - code: second_premise_form_wrong
    description: 前提2应为"许多X是A"，选项却写成其他关系
  fix_action: 做8道结构类比题，只练"首尾锚点筛选→内部比对"两步，限时70秒/题
