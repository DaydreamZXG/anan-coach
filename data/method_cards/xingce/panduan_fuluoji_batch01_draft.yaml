  title: 建议措施类-执行可行性前提
  recognition: 题干是"建议某人做某事"或"政策/措施能解决问题"，问前提，核心是执行可行性
  applicability:
    include:
    - 建议类（戒烟、报修、发展副业）有效的前提
    - 政策落地类（设集中营业区、全球回收CO2）
    - 措施能否见效的论证
    exclude:
    - 讨论措施本身利弊而非执行
    - 问削弱措施效果
  method_steps:
  - 明确建议/措施内容，问"要它有效还缺什么"
  - 依次检查三类前提：①此事尚未被做过 ②对方/各地有能力执行 ③大家会真的执行
  - 对候选选项取反：不执行/无能力→措施失效，则是前提
  error_signatures:
  - code: ignored_will_to_execute
    description: 只看到措施本身合理，忽略"是否真的会执行"（如全国每人给1元缺乏执行基础）
  - code: confused_demand_and_effect
