- id: mc_logic_common_cause
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/引入共同原因
  title: 共同原因C-同因异果削弱
  recognition: A与B同时存在→A导致B,削弱选项中出现第三方C同时导致A和B
  applicability:
    include:
    - 削弱共现因果,而因果倒置项不明显
    - 选项出现"一个因素同时导致了两者""根本原因是C"
    - 正相关数据推出的因果(应激高与疼痛慢性化正相关)
    exclude:
    - 问支持
    - 题干已排除共同原因
    - 选项只是解释A如何导致B(那是支持项)
  method_steps:
  - 看到"共现→因果",除因果倒置外同时找"C同时导致A和B"的表述
  - 验证:该C确实分别解释了A与B两个现象
  - 命中即削弱(A、B只是同因异果,无直接因果),直接选
  error_signatures:
  - code: mechanism_support
    description: 把解释A→B机制的选项(建立联系=支持)当削弱(应激削弱疼痛抑制系统是支持项)
  - code: partial_cause
    description: 选项只与A或只与B相关,未同时涵盖两者
  - code: data_reconfirm
    description: 误选"再次证实A、B同时存在"的选项(只支持论据不证因果)
  fix_action: 做6道共同原因削弱题,每题检查选项是否"一因双果",限时75秒/题
