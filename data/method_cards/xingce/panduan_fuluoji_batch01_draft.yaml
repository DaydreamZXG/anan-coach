- id: mc_zhenhua_dairu
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/真话假话/代入验证
  title: 真话假话-选项代入数真假
  recognition: 条件间无明显矛盾/同真/不能同假关系,但选项给出完整具体的情况 → 直接代入选项数真话数
  applicability:
    include:
    - 选项给出完整的分配/排名/获奖数
    - 规则特殊:"得2个奖项的人说假话""一人全对、一人一对一错、一人全错"
    - 从条件无法直接推理
    exclude:
    - 选项只给单一事实而非完整情况
    - 存在明显矛盾对(先用逻辑推理更快)
    - 选项数量巨大且关系可推理
  method_steps:
  - 把选项代入题干,逐句判断每句话真假
  - 统计真话数,或核对特殊规则(如"得2奖者应说假话")
  - 一旦发现"应假却真/应真却假"立即排除该选项,不必验完
  - 留下唯一满足数量/规则要求的选项
  error_signatures:
  - code: rule_read_backwards
