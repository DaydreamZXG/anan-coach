    - 由统计数据推出的因果结论(文学借阅量高→更受欢迎)
    - 实验对象有明确群体(久坐青少年、不吃早餐男女)
    exclude:
    - 题干无比率/数量数据
  method_steps:
  - 1. 锁定"统计数据→因果结论"的跳跃点(借阅量→受欢迎)
  - 2. 找替代解释:数量差异可由基数/占比解释(馆藏占比过半→借阅量大≠更受欢迎)
  - 3. 他因必须匹配实验对象主语(久坐青少年→沉迷恐怖游戏;不吃早餐男女→睡懒觉)
  - 4. 排除"偏好/支持原结论"类选项(乘客偏好餐车)
  error_signatures:
  - code: base_rate_ignored
    description: 忽略基数/占比差异,把绝对数量当趋势
  - code: subject_mismatch
    description: 他因主语与实验对象不符("这些孩子中"未限定久坐群体)
  - code: anachronism
    description: 用不符合时代背景的他因(现代美容技术解释200万年前脸型变化)
  - code: support_option_mistaken
    description: 误选支持原结论的选项(乘客偏好餐车)
