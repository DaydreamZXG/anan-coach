  recognition: 结论是"做了A没效果/没有A反而好",题干只看最终结果没看"做与不做"的差别
  applicability:
    include:
    - 问"最能削弱/支持",结论包含"某措施没用/没变好"
    - 问"评价/关键问题",需对比做与不做的差别
