  module_name: 判断推理
  tag_path: 判断推理/形式逻辑/连词翻译/德摩根取非
  title: 德摩根定律-或且取非互换
  recognition: 题干含"并非""为假""不同意""论断不成立"，需对"或/且"整体取非
  applicability:
    include:
    - 非(A或B)与非(A且B)的计算
    - 复合结构(A或B)且非C的整体否定
    - '"董事长不同意某意见"=否定其复合意见'
    - '"所有都化验且没发现"为假→有的没化验或有发现'
    exclude:
    - 题干无否定词、直接顺推的题
  method_steps:
  - 写清括号内的或/且结构
  - 或取非：非(A∨B)=非A∧非B（口诀"非乘进去，或变且"）
  - 且取非：非(A∧B)=非A∨非B（否定同时成立=至少一个不成立）
  - 嵌套结构逐层取非；且(∧)优先级高于或(∨)；否定"或"一边可推另一边
  error_signatures:
  - code: or_negation_one_branch
    description: '"或"取非只否定了一支（把非A∨非B当成非A∧非B）'
  - code: and_negation_both
    description: '"且"取非错误推出"两者都不成立"'
  - code: operator_not_swapped
    description: 复合否定时内外层或/且运算符没互换
  fix_action: 做10道德摩根题，每题先写符号式再展开，标出或且互换处，限时55秒/题
