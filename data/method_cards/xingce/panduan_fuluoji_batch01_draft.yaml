  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/形式逻辑/推理规则/四情形代入
  title: 事实真vs逻辑真-四种代入
  recognition: 题干给逻辑关系A→B，再给一个事实（A真/¬A/B真/¬B），问能推出什么
  applicability:
    include:
    - 判定"能推出/不能推出"
    - 肯定前件得后件真（A→B + A真⇒B真）
    - 否定后件得前件假（A→B + ¬B⇒¬A）
    - 否定前件/肯定后件→无法确定
    exclude:
    - 判断逻辑真假（题干无事实真）
    - 补条件推理
  method_steps:
  - 分清"逻辑真"（关系成立）与"事实真"（状态确定），逻辑真≠事实真
  - 肯定前件：A→B + A真 ⇒ B真
  - 否定后件：A→B + ¬B ⇒ ¬A
  - 前件假/后件真→无法确定，选"无法确定/什么也推不出"
  error_signatures:
  - code: denied_antecedent_concluded
    description: 由¬A硬推¬B（不赌博≠不破产）
  - code: affirmed_consequent_concluded
    description: 由B真硬推A真（收到房≠必中奖，可能继承）
  - code: logic_real_as_fact
    description: 把"如果中500万就送房"当成已中奖/已送房的事实
  fix_action: 做12道"能推出/不能推出"题，每题标出应用的是哪条推理规则
  time_budget_sec: 55
  accuracy_rule: 正确率≥90%
  pitfall: 现实中多因一果——A→B不意味¬A→¬B，禁止脑补唯一性（"没带钥匙"可能还有备用钥匙）
