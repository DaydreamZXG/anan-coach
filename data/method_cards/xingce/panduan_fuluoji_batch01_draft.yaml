  title: 逻辑不能逆推-否定前件/肯定后件坑
  recognition: 题干给出A→B，已知¬A或已知B，问能推出什么——答案常是"无法确定/都推不出"
  applicability:
    include:
    - '"否定前件"情形（没大嘴鲈鱼→鲦鱼/浮藻推不出）'
    - '"肯定后件"情形（没被批准→具体原因推不出）'
    - '"或"命题肯定一边推不出另一边（有红桶→不一定在商店）'
    exclude:
    - 顺推可确定的题（肯定前件/否定后件）
  method_steps:
  - 把题干第一句翻译成A→B
  - 已知¬A（否定前件）→关于B什么也推不出
  - 已知B（肯定后件）→关于A什么也推不出
  - 秒杀：这类题正确项常是逆否命题（如"无垃圾桶→不在商店"），或直接选"都推不出"
  error_signatures:
  - code: concluded_from_neg_antecedent
