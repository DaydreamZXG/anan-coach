    - 结论非绝对化(有"可能/有些"等程度限定)
    - 支持题
  method_steps:
  - 1. 圈出绝对化连词(只要就/必定/最重要/一定)
  - 2. 优先找"前真后假"反例(满足前提但结果不成立,如少吃仍不能减重)
  - 3. 无直接反例时用"复合条件"削弱:指出结果还需其他协同条件(根毛+营养、菌群+生活环境)
  - 4. 其他选项明显无关时,可接受表述不完全严谨的正确选项(不完美但唯一)
  error_signatures:
  - code: partial_related_not_weaken
    description: 选项部分相关但未否定因果关系(技术未改变艺术面貌≠被淘汰)
  - code: reject_imprecise_correct
    description: 因正确选项表述不严谨(郁郁寡欢间接关联死亡风险)而不敢选
  - code: better_method_distractor
    description: 误选"有更好的方法"类干扰项(不算直接反驳)
  fix_action: 做6道"只要就/必然"类削弱题,限时75秒/题
  time_budget_sec: 75
  accuracy_rule: 85%
  pitfall: '"只要就"的削弱=证明前提不是充分条件;复合条件削弱(需协同条件)与直接反例同样有效'
