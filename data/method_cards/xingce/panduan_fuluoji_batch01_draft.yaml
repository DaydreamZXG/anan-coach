- id: mc_assumption_bridge
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/论证推理/前提假设
  title: 找前提/假设-建立论据与结论的联系
  recognition: 题干'论据A→结论B'存在概念跳跃, 问'隐含假设/必要前提/基于哪一假设'
  applicability:
    include:
    - 前提/假设型必选项题(区域治理/视网膜筛查/做笔记阅读效果)
    - '''应做A因有B''式建议题的暗含前提(读红楼梦/提高收入)'
    exclude:
    - 支持题(前提必须必要, 支持可不必需)
    - 削弱题
  method_steps:
  - 找出论据概念与结论概念, 定位中间断开的环节
  - '两条搭桥路: ①A的作用/因素/影响导致B(交通运输是碳排放主要来源) ②A是衡量B的重要指标/主要因素/标志之一(民生服务水平是衡量治理能力重要指标)'
  - '''应做A因有B''结构: 前提必说B是目标/重要(年轻人都该了解传统文化, 满意度是政府主要任务)'
  - '验证: 选项须与题干论据结构匹配(不是见''重要指标''字眼就选), 且是结论成立的必要条件'
  error_signatures:
  - code: keyword_without_structure
    description: 看到'重要指标'字眼就选, 忽略与题干论据结构是否匹配
  - code: not_necessary
    description: 选项只是加强项而非必要前提(仅说明相关性强弱)
  - code: missing_target
    description: '''应做A''题选了只谈A属性的选项, 未建立''B是目标''的联系'
  fix_action: 做10道前提/假设题, 限时70秒/题
