- id: mc_zhenhua_tongzhen
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/真话假话/同真关系
  title: 真话假话-同真关系定假话
  recognition: '"只有一句真话"但找不到矛盾对 → 找"一句为真必导致另一句也为真"的同真关系,则该句必假'
  applicability:
    include:
    - 无矛盾对,但"若①为真则②必为真",与"只有1句真话"冲突→①为假
    - 常见同真:①"A为真"→"A或B为真";②前件为假→"A→B"为真;③后件为真→"A→B"为真;④唯一冠军时"A夺冠"→"B不夺冠"
    - 两真两假:找完矛盾后,在剩余一真一假的两句里找同真
    exclude:
    - 存在矛盾对(优先用矛盾关系)
    - '"只有一句假话"(用不能同真,不是同真)'
    - 选项已给完整情况(直接代入)
  method_steps:
  - 假设某句为真,看是否连锁推出另一句也为真
  - 若会→该句必假(否则真话数超限)
  - 由该句为假推出事实(如"甲或乙"为假→甲和乙都假),再判断剩余句真假
  - 判断"A→B"真假:前件假或后件真时整个命题为真,只有"前件真且后件假"才为假
  error_signatures:
  - code: same_true_missed
    description: 只找矛盾漏掉同真,两真两假卡壳
  - code: two_methods_confused
    description: 混淆"矛盾推理"(推出其余话全假)与"同真推理"(推出触发句为假)
  - code: antecedent_false_wrong
    description: 误以为前件为假就是假话(A→B前件假时命题为真)
  fix_action: 做4道同真类题(2023省联考、陕西2024两真两假、上海2019三句),每题标出"谁真→谁真"
