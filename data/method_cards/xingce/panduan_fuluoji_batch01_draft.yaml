  tag_path: 判断推理/逻辑判断/一一对应/矛盾排除
  title: 一一对应-找抢位矛盾排除选项
  recognition: 三/四元素一一对应,选项给完整分配,条件为"若A在X位则B在X位" → 推出两元素抢同一位的矛盾,排除相关选项
  applicability:
