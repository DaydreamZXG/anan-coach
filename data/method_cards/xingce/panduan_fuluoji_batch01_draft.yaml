  method_steps:
  - 把"比较/共同活动/好友"统一翻译成"X≠Y"(不是同一人)
  - 结合一一对应逐一排除,锁定唯一归属
  - 剩两种可能时做分情况讨论:假设一种成立,推出矛盾则另一成立
