  title: 入选名额法-人数限制推矛盾
  recognition: 题干有"几人选几人"的名额限制(4选3、7选4等),条件是逻辑真、选项是事实 → 用名额上限制造矛盾
  applicability:
    include:
    - 题干明确给出入选/不入选人数(如"7人中选4人")
    - 出现"如果A或B,则C"结构可做逆否
    - 假设某人入选会连锁推出"全部入选"从而超名额
    exclude:
    - 题干没有人数限制
    - 选项是逻辑箭头
    - 已给事实真可直接代入
  method_steps:
