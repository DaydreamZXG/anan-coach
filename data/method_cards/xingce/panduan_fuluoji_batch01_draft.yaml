- id: mc_luoji_jianli_lianxi_zhengxiangguan
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/论证推理/建立联系
  title: 建立联系-特征量与结果量
  recognition: 题干"因为A特征多,所以具备B特点"(神经细胞多→更聪明),正确选项需建立特征与结果的正相关或作用机制。
  applicability:
    include:
    - 论据为特征量(牙齿数量/离子流速/丁酸盐水平),结论为结果量(体长/抗旱性/大脑功能)
    - 论据"有A有B、无A无B"(本质表达A导致B),需建立A与B的关联
    - 支持/假设类提问
    exclude:
    - 论据结论能直接拼成A→B→C链条、需逻辑连词补全的题(补全逻辑)
    - 论据结论主体完全不同、需指出相同的题
    - 削弱类提问(本卡只覆盖正向建立联系模板)
  method_steps:
  - 提取论据特征A与结论结果C
  - 支持:找建立"A→C"关系的选项——"A越多C越明显"(正相关)或"A带来的某作用/因素导致C"(机制)
  - 区分"论据内部关系(a→b)"与"论据-结论关系(a→c)",只选后者
  - 两句式结构(如久坐→颞叶缩小→记忆影响)时,正确项必须同时含论据与结论两个关键要素
  error_signatures:
  - code: internal_relation
    description: 误选建立论据内部要素关系的选项(如论据内部因果),而非论据与结论的桥
  - code: reversed_relation
    description: 误选反向建立关系的逻辑倒置选项
  - code: missing_bridge
    description: 正确项缺一个关键要素(只含特征或只含结果)导致搭不上桥
  - code: irrelevant_comparison
    description: 被无关平行比较选项干扰(对比开花植物/讨论年龄差异)
  fix_action: 做8道建立联系真题,每题先写"论据特征→结论结果",再核对选项是否同时含两个要素且方向正确,限时65秒/题
  time_budget_sec: 65
  accuracy_rule: 正确率≥85%
  pitfall: 建立联系靠"相关性/机制"(B越多C越多),补全逻辑靠"逻辑连词直接搭链"(只要/只有式条件句)——两者都搭桥但模板不同,别混用。
