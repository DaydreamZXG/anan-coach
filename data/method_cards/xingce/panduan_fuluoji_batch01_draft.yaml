- id: mc_introduce_alternative_cause
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/由因推果/引入他因
  title: 引入他因-直接针对结论
  recognition: 结论把结果/成败归因于单一原因或方案,正确选项直接针对结论引入另一个因素
  applicability:
    include:
    - 方案对比支持题(支持"做浅"方案需其独有理由)
    - 结论是"某计划难以实现/应更换某方法/某事物不可用"
    - 论证"变化导致某结论"时需判断变化后结论是否仍成立
    exclude:
    - 题干是标准两句式推理(有更规范的反驳句式可用)
    - 数据统计型由果推因题(归入由果推因卡)
  method_steps:
  - 1. 锁定结论主张并判断类型:归因型、可行性型、更换型
  - 2. 支持某方案→找该方案独有的优势(订单不稳定→灵活模式);质疑计划→找制约前提
  - 3. 论证"应更换方法/模式/人员"→必须证明原方法失效(如误差10-20倍),仅强调"重要/必要性"是陷阱
  - 4. 排除主体不符、效果范围不符的边缘选项;带"可能"的无确定性选项不选
  error_signatures:
  - code: importance_instead_of_failure
    description: 用"研究对象重要"代替"原方法失效"(太阳风题C项陷阱)
  - code: subject_scope_mismatch
    description: 选项主体与结论主体不一致(指纹题B项说DNA更可靠)
  - code: modal_weak_option
    description: 选带"可能"的弱表述(外星人"可能看不懂")
  - code: no_plan_edge_option
    description: 方案对比题误选未区分两方案优劣的选项(仅强调需自主培养)
  fix_action: 做8道引入他因支持/削弱题,限时70秒/题
