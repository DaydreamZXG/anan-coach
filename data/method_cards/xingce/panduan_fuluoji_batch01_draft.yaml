- id: mc_build_link_support
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/由因推果
  title: 由因推果-建立联系(支持/加强)
  recognition: 题干'A与B相关/同时存在'或'有A有B无A无B', 结论'A导致B', 问支持/加强
  applicability:
    include:
    - A→B因果支持题(睡眠与癌症/绿茶与心血管/站立与专注/废水与地震)
    - 对比实验类研究结论支持题
    exclude:
    - '找前提/假设题(另卡: 前提是必要条件, 支持可非必要)'
    - 削弱题(不需搭桥, 直接断桥)
  method_steps:
  - '主体定位: 选项主语必须与结论主体完全一致(防晒霜/站立听课/废水注入岩石), 无一致项再考虑引入他因'
  - '效果聚焦: 选项效果必须指向结论的效果, 防止''全因死亡率''''抗癌''''健康''等效果泛化'
  - '搭桥: 选建立''A→机制→B''完整作用链条的选项(乙醛附着DNA→癌变), 排除仅重复相关、时间重合、定义性描述选项'
  - '力度排序: 机制解释 > 剂量反应 > 时序 > 统计显著性; 排除因果倒置(焦虑倾向)与第三方因素(吸烟)项'
  error_signatures:
  - code: correlation_as_causation
    description: 选仅重复相关性或时间重合的选项(干旱与玛雅衰落时间重合)
  - code: subject_shift
    description: 主体偏移(讨论蜜蜂习性替代农田利用方式)
  - code: effect_generalization
    description: 效果泛化(全因死亡率≠心血管健康)
  - code: causal_reversal
    description: 因果倒置选项(焦虑倾向导致高应激和高疼痛, 实为削弱)
  fix_action: 做15道建立联系支持题, 限时65秒/题
  time_budget_sec: 65
  accuracy_rule: 正确率≥85%
  pitfall: '''时间重合/统计相关''≠因果; 支持必须说明作用机制。考官常用同义替换(长期应激=长期巨大压力)与科学术语隐藏因果链(甲状腺激素→脂肪代谢),
    也常把''高发病率''与''发病率变高''偷换。'
