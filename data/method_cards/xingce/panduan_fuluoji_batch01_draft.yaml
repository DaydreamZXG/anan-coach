- id: mc_conclusion_from_effect_alt_cause
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/由果推因
  title: 由果推因-引入替代原因削弱
  recognition: 题干给出已发生的结果/现象, 结论把该结果归因于某个原因(果→因, 常含'解释''说明')
  applicability:
    include:
    - '''解释/说明''某现象原因的削弱题(桃树套袋/文蛤红霉素/牛奶入睡)'
    - 对归因类研究结论的质疑题
    exclude:
    - 由因推果题(该模式不通用)
    - 支持题(支持需排除替代原因, 而非引入)
  method_steps:
  - '锁定归因: 结论为''Q是因P''(如小果占比75%是因套袋过早)'
  - '找替代解释: 选项引入另一个与P无关、能解释Q的原因(R导致Q, 如未追施肥)'
  - '三重验证: ①新原因与原原因互斥(不能与P同时成立) ②能解释结果Q ③该原因需确在研究样本中存在'
  - '排除干扰: ''程度型''选项(承认P但说其作用慢/弱)与''共存型''选项(与P可同时成立)均不削弱'
  error_signatures:
  - code: coexist_with_original
    description: 新原因与原原因可同时成立, 未排除原归因
  - code: cannot_explain_result
    description: 他因不能解释题干结果(与套袋无关却未解释小果现象)
  - code: factor_not_in_sample
    description: 他因未说明在研究样本中存在(观众案例的'其他选手关注'选项)
  - code: weaken_but_not_negate
    description: 只削弱P的强度(合成速度慢), 未否定'P是原因'的归因
  fix_action: 做12道由果推因削弱题, 限时70秒/题
  time_budget_sec: 70
  accuracy_rule: 正确率≥85%
  pitfall: '桃树套袋题: 他因必须同时满足''与套袋无关''+''能解释小果''两个条件; 只解释现象不谈归因的选项不算。'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
