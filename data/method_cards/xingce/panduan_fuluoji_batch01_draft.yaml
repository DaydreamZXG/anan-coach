- id: mc_luoji_zhichu_xiangtong_butong
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/论证推理/指出相同与不同
  title: 指出相同(支持)/指出不同(削弱)
  recognition: 论据与结论的主体或概念不一致(动物实验→人体、样本调查→全体、局部健康→整体健康),通过指出同/异来支持或削弱。
  applicability:
    include:
    - 论据结论主体不同:动物实验→人、杂志读者→社会群众、网购场景→家庭控制权
    - 概念发生转换:心脏健康→整体健康、死亡风险→健康状况、量变→质变
    - 借鉴他国/他群体经验的论证(发达国家→我国)
    exclude:
    - 论据结论主体一致、无概念转换的题
    - 论证缺陷是缺中间环节的题(应补全逻辑)
    - 题干本身无"以偏概全"式差异的题
  method_steps:
  - 比对论据与结论的主体/概念是否一致,找出差异点
  - 支持:找指出两者相同的选项(如"我国是发展中国家"、"规律适用于我国")
  - 削弱:找"X≠Y"式的选项(如"心脏健康不等于身体健康""动物实验结果不能推广到人")
  - 样本类题:给样本贴特殊标签(如读者更富有)削弱"以偏概全"
  error_signatures:
  - code: direction_reversed
    description: 把指出不同当支持、指出相同当削弱,方向搞反
  - code: concept_shift_missed
    description: 没识别论据到结论的概念偷换(如死亡风险→健康状况、质变→量变)
  - code: nitpick_weak
    description: 选只挑小毛病(调查方式/需要时间/未全员参与)而非针对主体差异的弱选项
  - code: absoluteness_trap
    description: 被"难以准确评估"类绝对化表述迷惑,误当有效质疑("难以评估"≠"不能评估")
  fix_action: 做8道指出同/异真题,每题先标"论据主体 vs 结论主体",再判断该题考的是相同支持还是不同削弱,限时65秒/题
  time_budget_sec: 65
  accuracy_rule: 正确率≥85%
  pitfall: 支持=指出相同,削弱=指出不同,方向不能反;且"指出不同"要针对主体/概念的本质差异,不是针对论证细节的小瑕疵。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
