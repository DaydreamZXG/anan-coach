- id: mc_inevitability_he_cause
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/论证推理/削弱/必然性结论
  title: 引入他因-必然性结论的正反向反驳
  recognition: 结论含"必然/必定/才能/是最重要"等预测或必要性表述,从其他角度引入真实因素支持或反驳
  applicability:
    include:
    - 反驳"必然灭绝/衰亡/亏损"→引入保护措施、环境改善、额外收入等正向因素
    - 反驳"必然可行/有效/占领市场"→引入产能、成本等制约因素
    - 必要条件类结论→指出必要条件缺失(缺硫磷等必需元素)
    exclude:
    - 结论无必然性程度表述
    - 题干论据已充分覆盖其他因素
  method_steps:
  - 1. 判断结论的必然性程度(必然/必定/才是唯一)
  - 2. 削弱"必然坏结果"→找正向因素(保护措施、浮游生物增长),注意数据小波动不能证明趋势逆转
  - 3. 削弱"必然好结果"→找制约因素(产能仅满足1%需求)
  - 4. 比较型结论→比较对象必须一致(白酒vs葡萄酒),可引入新评价维度(成功率指标)
  error_signatures:
  - code: trend_reversal_misread
    description: 把数据小幅波动当趋势逆转(减少量0.4万→0.3万吨)
  - code: internal_comparison_trap
    description: 用对象内部比较代替题干跨对象比较(白酒内部含量对比)
  - code: wrong_dimension
    description: 引入与结论维度无关的因素(利润影响≠市场占有率)
  - code: absolute_unverified
    description: 不验证"必然"类选项的实际影响方向就接受
  fix_action: 做8道必然性结论削弱/支持题,限时75秒/题
  time_budget_sec: 75
  accuracy_rule: 85%
  pitfall: 要证明"不灭绝"必须出现资源量增长的绝对数据,仅有减少量收窄不足以反转趋势
