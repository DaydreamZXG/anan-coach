    description: 忽略"唯一冠军/唯一通过/顺序围坐"等隐含限制,判不出不能同假
  - code: direction_swapped
    description: '"只有一句假话"却错用"找不能同假"'
  fix_action: 做3道不能同真同假题(2023广东专家、2023陕西红蓝、2023山东冠军),每题先判断关系类型
