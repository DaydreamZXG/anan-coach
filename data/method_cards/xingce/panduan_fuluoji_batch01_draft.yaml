  tag_path: 判断推理/逻辑判断/因果推理/断桥削弱
  title: 削弱-切断论据与结论的联系(断桥)
  recognition: 题干'因A所以B', 削弱=简单粗暴指出A与B无关/无必然联系
  applicability:
    include:
    - 削弱/质疑题(睡眠时长与失智/收视率与节目水准/第一场雪与冬季气温)
    - 评价题型(关键问题决定支持或削弱)
    exclude:
    - 支持题(加强需搭桥)
    - 需要引入他因的精细削弱题
  method_steps:
  - 定位论据A与结论B
  - '断桥: 找''A与B无必然关联/无关''的直接否定项(失智是脑部疾病, 与睡眠时长无关)'
  - '或举反例证普遍性不足: 指出其他群体不满足结论(黑碳暴露男孩相关女孩不相关)'
  - '评价题: 找''决定A与B是否相关''的关键问题(交通事故数量与宣传工作有无直接关系)'
  error_signatures:
  - code: partial_negation
    description: 只削弱A的强度(睡眠变短是年龄导致), 未切断A-B联系
  - code: correlation_strength_only
    description: 选仅说明相关性强弱(不断增强)的选项, 未断桥
  - code: irrelevant_negation
    description: 质疑角度与结论核心无关(睡眠过长的影响/其他风险因素)
