- id: mc_luoji_youyintuiguo_jianli
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/由因推果
  title: 由因推果-识别结构与支持削弱
  recognition: 论据是"A与B同时存在"的相关数据或"有A有B、无A无B"的对比实验,结论是"A是B的原因"。
  applicability:
    include:
    - 结论出现"是…的原因/导致/有助于预防/可治疗"等因果表述
    - 论据为共存统计(如使用社交软件的人患病概率低)或对比实验(睡眠短患癌高、睡眠长患癌低)
    - 支持/削弱/假设类提问均适用
    exclude:
    - 论据结论构成明确的A→B→C链条、需补中间环节的题(属补全逻辑)
    - 论据结论主体完全不同的题(属指出不同)
    - 论据为特征量、结论为结果量的"越多越"结构(属建立联系正相关)
  method_steps:
  - 锁定结论,确认因果方向:A是因、B是果
  - 判断论据类型:共存相关 还是 对比实验(实验组/对照组有无A的差异)
  - 支持:找说明"A通过某机制/作用导致B"的选项(如感染激活NK细胞杀死癌细胞、牙龈炎细菌入脑致神经损伤)
  - 削弱:找"因果倒置"(方向反说)或"引入他因"(B取决于D而非A)或"实验对象不可推广"的选项
  error_signatures:
  - code: causal_reversal
    description: 把因果倒置选项当成支持,或没认出"B是因A是果"的削弱(如老年痴呆导致忘记刷牙→牙龈炎)
  - code: correlation_as_causation
    description: 把A与B共存的相关性当成因果必然,忽略可能只是巧合
  - code: mechanism_missing
    description: 支持题选了只说A与B有关、没说A如何导致B的选项
  - code: group_design_ignored
    description: 忽略对比实验组的设置,没利用"有无A"的差异判断因果
  fix_action: 做8道由因推果真题,每题先写出因果方向,再分别预想"支持选项长什么样、削弱选项长什么样"再选,限时75秒/题
  time_budget_sec: 75
  accuracy_rule: 正确率≥85%
  pitfall: 考点是题干结构而不是提问形式:同一道题把提问从"支持"改成"削弱",正确答案会从"建立机制"变成"因果倒置/主体差异"。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
