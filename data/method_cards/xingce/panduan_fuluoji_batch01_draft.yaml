  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/真话假话/不能同真同假
  title: 真话假话-不能同时为真/为假占名额
  recognition: 两句话不能同时为假(至少一真)或不能同时为真(至少一假),配合真话/假话名额直接锁死范围
  applicability:
    include:
    - '"唯一通过/唯一冠军"类限制下,"甲没通过"与"丙没通过"不能同假(否则两人都通过)'
    - 进阶模型:"A→B"与"非B"不能同时为假(非B假→B真→A→B真)
    - '"只有一句假话"时,找不能同时为真的两句(如"冠军是欧洲"与"冠军是南美洲")占假话名额'
    exclude:
    - 能直接找到矛盾对(优先用矛盾)
    - 判不出两句话是否不能同假/同真
    - 选项完整可代入验证
  method_steps:
  - 判断两句话是否不能同时为假:同时为假会不会违反人数/唯一限制或逻辑→是,则至少一真
  - 这两句占据唯一真话名额,其余话必假;从其余话取否推出事实
  - '"只有一句假话"时反向:找不能同时为真的两句,占假话名额,其余话必真'
  - 需要时再回验到底哪句是真话(或假话)
