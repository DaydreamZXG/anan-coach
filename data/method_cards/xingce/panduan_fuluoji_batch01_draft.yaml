  - 假设某前件为真,若推出"全部N人入选"与"只选M人(N>M)"矛盾→该前件必假
  - 秒杀:对"如果A或B,则C"做逆否得"非C→非A且非B",直接凑齐"不入选名额",剩余的人全部入选
  - 正确选项必含"非C情况下那批必入选者"中至少一人,直接找含该批人员的选项
