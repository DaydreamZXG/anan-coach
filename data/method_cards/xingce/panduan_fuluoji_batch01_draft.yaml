  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/由果推因
  title: 由果推因-三刀削弱
  recognition: 观察到结果A并发现特征B,推断B是导致A的原因(如蛋感染率低+溶菌酶→抗感染关键)
  applicability:
    include:
    - 现象(结果)+伴随特征→推断特征为原因
    - 问"最不能削弱/最能削弱"
    - 抗感染、耐旱、抗病类原因推断
    exclude:
    - 由因推果(题干已给原因找结果)
    - 两派观点链
    - 问支持
  method_steps:
  - 抽结构:结果A,特征B,结论"B是A的原因"
  - 削弱强度排序:①引入他因(最强)②前假后真(无B却有A)③前真后假(有B却无A)
  - 最不能削弱题:识别无关项(未触及因果链,如耐缺氧vs抗旱),而非选最弱削弱
  error_signatures:
  - code: new_cause_strongest
    description: 没优先识别"他因"这个最强削弱(基因说、碳酸钙包裹说)
  - code: irrelevant_picked
    description: 把无关项(无氧气能活60天vs抗旱)当削弱
  - code: reverse_support
    description: 误把支持原结论的选项(战争导致男性死亡→支持战争致失调)当削弱
  - code: scope_mismatch
    description: 主体范围不同(身体严重受损vs适度受损)不能类比
  fix_action: 做6道由果推因削弱题,每题先写"结果/特征/结论",再给选项排三刀强度,限时75秒/题
