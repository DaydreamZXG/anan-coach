  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/一一对应/隐藏含义
  title: 一一对应-三大隐藏考点展开
  recognition: N个元素与N个位置一一匹配,每个位置只放一个 → 关键在于把"A=某位"展开成隐藏的不等式
  applicability:
    include:
    - '"A在位置1"→展开为"B≠1且C≠1"(一山不容二虎)且"A≠2且A≠3"(一人不能分饰两角)'
    - '"A≠2且B≠2"→最后一个元素C必须=2(最后的位置留给最后的人)'
    - 用于剩余元素的收尾推理
    exclude:
    - 元素数≠位置数(多对一)
    - 顺序排列题(元素有序)
    - 未给位置匹配关系
  method_steps:
  - 每读一条条件就展开隐藏含义:某元素占某位→其他元素不能去该位,该元素也不能去其他位
  - 综合排除,逐个元素锁定唯一位置
  - 收尾用"最后的位置必须给最后的人"快速补全
  error_signatures:
  - code: one_hill_only
    description: 只看"A=1"推出别人不能去1,忘了A自己不能去别处
  - code: one_person_only
    description: 反过来只推出"A≠2,A≠3",忘了排除别人
  - code: last_slot_missed
    description: 推到最后一个位置还不认领归属
  - code: exclude_not_synced
    description: 推出A=2后没同步排除其他位置
  fix_action: 做5道一一对应题,每读一条条件就在草稿写展开式(A=1→B≠1,C≠1;A≠2,A≠3)
