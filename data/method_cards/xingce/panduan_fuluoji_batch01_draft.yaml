  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/利弊相权
  title: 引入他因-利弊相权(弊大于利)
  recognition: 题干'因某优点而推广某措施/方案', 要求削弱/质疑/找最大难题
  applicability:
    include:
    - 措施推广类削弱题(HOV车道/阔叶树降尘/蟑螂处理垃圾/太空种植)
    - 方案评估质疑题(时间管理软件/神经刺激技术)
    exclude:
    - 支持题(支持=利大于弊)
    - 直接说利弊的简单单因题
  method_steps:
  - 明确题干的核心益处(健康/效率/环保)
  - '削弱=找''弊大于利''项: 引入更严重弊端, 优先含比较级''更大/超过/抵消并超过''的选项'
  - '三重验证: 弊端实质有害(生态/安全/健康) + 主体与结论一致(航天员健康) + 直接否定核心益处'
  - '排除: ''还需评估/意想不到''中性表述、''不完美≠有害''、成本高(除非限定预算)、''国际认可''权威表述'
  error_signatures:
  - code: neutral_wording
    description: 选'需要进一步评估/意想不到'等中性表述选项
  - code: imperfection_as_harm
    description: 把'不能100%解决问题/不完美'当成弊端
  - code: cost_as_harm
    description: 把养护/投入成本当弊端(阔叶树D选项)
  - code: subject_shift
    description: 主体转移到别处(太空种植题讨论植物而非航天员健康)
  fix_action: 做10道利弊相权题, 限时75秒/题
  time_budget_sec: 75
  accuracy_rule: 正确率≥85%
