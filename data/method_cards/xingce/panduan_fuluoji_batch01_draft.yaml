- id: mc_eval_structure_anchor_therefore
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/评价结构/连锁推理
  title: 评价结构-锚定"因此"对比首尾
  recognition: 问"与上述推理结构形式最相似"，题干是"要A必须B，要B必须C，因此要A必须C"式连锁推理
  applicability:
    include:
    - 一句话/两句话/三句话连锁推理结构
    - '"只有...才""必须""最根本的是"表达的条件结构'
    - 需把自然语言符号化为A→B的题目
    exclude:
    - 两人对话（看标准分歧）
    - 评价论证缺陷（看概念错误）
    - 内容起作用的削弱/支持题
  method_steps:
  - 只看逻辑连词，忽略具体内容，把每句写成A→B符号式
  - 以"因此"为锚点："因此"前第一句主语=结论主语，"因此"前最后一句宾语=结论宾语，必须一致
  - 注意连词方向："只有...才"是后推前（要A必须B=A→B），结论常写成A→C
  - 先排除"因此"前后句子数量不符的选项，再比对首尾关键词
  error_signatures:
  - code: content_led_astray
    description: 被具体话题内容带偏，忘了只看结构不看内容
  - code: arrow_direction_flipped
    description: '"只有...才"当成前推后处理，方向反了'
  - code: anchor_head_tail_mismatch
    description: 结论首尾与前提首尾对不上（A→C写成C→A）
  fix_action: 做10道评价结构题，每题先把题干写成字母符号式再比对选项
