  recognition: 实验对比后结论把结果差异全归因于唯一因素,问削弱/支持
  applicability:
    include:
    - 削弱:实验组同时做了其他事、两组其他情况不同
    - 支持:排除其他因素(两组其他情况都一样)
    - 题干有"排除了某因素影响"的表述时尤其注意
