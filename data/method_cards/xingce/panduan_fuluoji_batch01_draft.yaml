- id: mc_tuimao_guiwufa
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/推矛盾/归谬法
  title: 推矛盾-归谬法找隐藏事实真
  recognition: 题干只有逻辑真(条件全是"如果…则…"等逻辑箭头),选项却都是确定的事实 → 必须假设某个前件为真,推出矛盾后反推隐藏事实真
  applicability:
    include:
    - 题干给出多个逻辑命题,选项为"谁通过/谁去/买什么"等具体事实判断
    - 多个条件的后件与前件能对接成链条(后件and中任一元素可触发另一条件的前件or)
    - 要求推出"一定为真"的确定结论
    exclude:
    - 题干已给出事实真(直接代入推理即可,勿硬推矛盾)
    - 选项也是逻辑箭头(应做前件验证,不是推矛盾)
    - 问"一定为假/不可能为真"(用代入验证找前真后假)
  method_steps:
  - 把文字条件翻译成逻辑符号(A→B、A或B),记住"逆否等价、或的否定是且"
  - 找连接点:某条件的后件(或后件and中的一支)正好是另一条件的前件(或前件or中的一支),串联成链
  - 假设某个前件为真,沿链推导;若同时推出X与非X(或与题干事实冲突),则"谁产生矛盾,谁就不能为真"——该前件必假
  - 把假命题(前件为"X或Y"时取"非X且非Y")代回原条件,继续推出其余确定事实
  error_signatures:
  - code: mistaken_logic_conflict
    description: 误以为两个逻辑命题本身矛盾;实际是"加上某前件为真"才矛盾,两逻辑可同时为真
  - code: wrong_conclusion_target
    description: 把结论写成"某条件逻辑为假";正确结论是"某条件的前件这个事实为假"
  - code: or_negation_error
    description: 把"非(A或B)"错写成"非A或非B";应为"非A且非B",否则漏解
  - code: missed_chain_link
    description: 漏连链条(未发现后件and中一支能触发另一条件的前件),导致推不出矛盾
  fix_action: 做5道推矛盾真题(2024国考预选赛、2023广东橱柜卫浴),每题先在纸上写出逻辑符号和串联链条再选答案
  time_budget_sec: 80
  accuracy_rule: 正确率≥80%,低于则重做链条连接专项
  pitfall: '"不去丹麦和冰岛"翻译为"不去丹麦 且 不去冰岛"(否定整个合取);"或"前件只要一支为真即触发后件,要否定"或"必须两支全否'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
