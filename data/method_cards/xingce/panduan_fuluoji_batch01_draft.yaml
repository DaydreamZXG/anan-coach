- id: mc_luoji_liangjushi_buquan_luoji
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/论证推理/两句式推理/补全逻辑
  title: 两句式-补全逻辑链条
  recognition: 论据和结论存在前一半或后一半的重复内容,中间有逻辑跳跃,需补全缺口推理才成立(论据+正确选项=结论)。
  applicability:
    include:
    - 结构为"论据A→B,结论A→C"(前重复,补B→C)或"论据A→C,结论B→C"(后重复,补B→A)
    - 支持/假设/前提类提问,多为科学考古论证(现象→本质)
    - 选项出现"只要…就…""只有…才…"句式
    exclude:
    - 论据为纯数据背景、与结论无重复的题(一句式,不需补链条)
    - 论据结论主体不同、需指出相同/不同的题
    - 选项只是举例支持、无逻辑连词的题(仅一句式有效)
  method_steps:
  - 从下往上找结论引词,往前倒一句找论据,并把两者拆成A→B/A→C 或 A→C/B→C
  - 找出重复部分,确定缺口:前重复补B→C,后重复补B→A
  - 用"只要B就C"(充分)或"只有C才B"(必要/后推前,等价于B→C)构建设定,检验选项是否正好补上缺口
  - 检查箭头方向:必须从论据要素指向结论要素,方向反了直接排除
  error_signatures:
  - code: arrow_reversed
    description: 选项含论据结论两个关键词但推理方向反了(如"祭祀→牛角"而非"牛角→祭祀")
  - code: correlation_as_link
    description: 把只谈相关性的选项当补全链条(如"气候变暖与变绿正相关"而非"变暖→浮游植物增多")
  - code: single_sentence_fallback
    description: 两句式当一句式处理,选只支持结论、没让论据参与推理的选项
  - code: necessity_direction
    description: 混淆必要与充分条件方向("只有C才B"等价于B→C,方向反了即错)
  fix_action: 做10道补全逻辑真题,每题先写下缺口方向再对照选项,特别标记含两关键词但方向相反的干扰项,限时80秒/题
  time_budget_sec: 80
  accuracy_rule: 正确率≥80%
  pitfall: 考官常同时给两个含相同关键词、但方向相反的选项,解题口诀"箭头指向结论处,方向反了全错误"——先定缺口方向再选,别被关键词数量骗到。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
