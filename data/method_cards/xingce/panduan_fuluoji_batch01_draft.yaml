  title: 逻辑推理题型三步识别
  recognition: 拿到题干先判定"有没有事实真"+"选项是逻辑还是事实",10秒内锁定用代入/前件验证/推矛盾哪种方法
  applicability:
    include:
    - 题干有"逻辑箭头+明确事实真"→直接把事实真代入推理(送分题)
    - 题干只有逻辑真、选项也是逻辑箭头→把选项前件代入题干验证能否推出后件
    - 题干只有逻辑真、选项是事实陈述→必须推矛盾找隐藏事实真
    exclude:
    - 问"一定为假/可能为真"(用代入验证找前真后假)
    - 真话假话题(条件真假未知,不能直接推理)
