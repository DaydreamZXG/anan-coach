  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/量变质变
  title: 引入他因-量变不等于质变(未达阈值)
  recognition: 题干由'某指标的量变(增加/减少/优化)'推'必然发生质变(生病/变好)', 削弱=证明未达阈值
  applicability:
    include:
    - 数值/比例论证的削弱(细菌致病/噪音影响/手机辐射致癌/塑料微粒)
    - 食品安全/辐射/健康风险支持与削弱题
    exclude:
    - 纯逻辑形式推理
    - 无数量/程度变化的因果题
  method_steps:
  - '识别量变指标与质变断言: ''细菌含量增加→市民生病人数一定增加'''
  - '找阈值项: 引入中间变量证明量变未超承载限度(免疫系统可清除、噪音低于日常基准、含量远低于国标/安全标准)'
  - '支持''量变→质变'': 引入影响结果的他因或展示相关因素的改变(做题量100→500道), 不能用绝对数值(95分)当''变好''证据'
  - 安全类题优先找'未超标即安全'的量化标准选项
  error_signatures:
  - code: absolute_as_trend
    description: 把绝对数值(95分)当成'变好'的证据, 忽略对比基准
  - code: correlation_as_causality
    description: 把相关(通话时长与脑瘤风险)当因果
  - code: individual_counterexample
    description: 个体反例否定比例趋势(有人用手机健康不削弱整体风险)
  - code: dose_ignored
    description: 抛开剂量谈毒性, 选'成分存在即有害'的选项
  fix_action: 做10道量变≠质变题, 限时75秒/题
  time_budget_sec: 75
  accuracy_rule: 正确率≥85%
