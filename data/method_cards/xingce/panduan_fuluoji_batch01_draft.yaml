    - '"禁用X后仍发生Y"需排除X的延迟伤害'
    - 技术机制类需确认唯一感知渠道（鲨鱼仅靠电信号）
    exclude:
    - 题干已提供对照组排除他因
    - 只讨论相关性不涉及因果
  method_steps:
  - 找因果链条：因A→果B
  - 列出推导成立必须排除的干扰：其他原因、延迟效应、其他渠道
  - 优先选"明确排除其他因素/机制唯一"的选项，再取反验证
  - 对比记忆：问削弱时选"结果还受其他因素影响/疾病多年后才显现"
  error_signatures:
  - code: assumed_single_cause
    description: 默认只有题干一个原因，忽略"还受其他因素影响"的可能
  - code: delayed_effect_ignored
    description: 没考虑旧因素潜伏期，误判"当前正常=永远安全"
  - code: overreach_assumption
    description: 假设过强（要求"防卫成功"而非"存在威胁"）
  fix_action: 做6道隐藏前提/假设题，每题先写"推导成立要排除什么"再对选项
  time_budget_sec: 75
  accuracy_rule: 正确率≥80%
