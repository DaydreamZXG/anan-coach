- id: mc_cause_effect_direction
  exam_scope: guokao
  track: xingce
  module_name: 判断推理
  tag_path: 判断推理/逻辑判断/因果推理/方向判定
  title: 区分由因推果与由果推因
  recognition: 结论是'由原因预测未来结果'(预言家思维)还是'由结果反推过去原因'(刑侦思维), 标志词'因此/所以'对应'是由于/源自'
  applicability:
    include:
    - 需要先定推理方向的所有因果推理削弱题
    - 归因类题干(结果→原因)的第一步定位
    exclude:
    - 支持题(两种推理的支持逻辑相同, 无需区分方向)
    - 形式逻辑的命题推导题
  method_steps:
  - '用''因此/所以''或''是由于/源自''定位结论, 判断时间方向: 结论指向未来结果→由因推果; 结论追溯过去原因→由果推因'
  - '由因推果削弱: 引入反向他因让结果不成立(有A无B), 如''胃特别强健'''', 排除''其他方法也能达到结果''选项(高铁/飞机都能到北京)'
  - '由果推因削弱: 引入替代原因解释结果(非A的C导致B), 如''食物中毒''替代''吃药''; 排除只削弱原原因强度的程度型、共存型选项'
  - '口诀: 预言看结果断链条, 刑侦换凶手找解释; 替代不破因, 多因可破果'
  error_signatures:
  - code: direction_mixed
    description: '把两种推理的削弱方式混用: 由因推果误用''其他原因也能达果'', 由果推因误用''其他方法'''
  - code: alternative_route_as_weakener
    description: 由因推果题误把'存在替代途径'当削弱(理疗也能治感冒不削弱吃药能治感冒)
  - code: vague_possibility_selected
    description: 由果推因题误选'可能影响'但未指明影响方向的选项
  fix_action: 做15道因果方向判定专项题, 限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥90%
  pitfall: 由果推因接受'多因一果', 替代原因是削弱; 由因推果的'替代途径'不破因。同一选项在不同结构中的作用可能相反(牛奶助眠题的C/D选项互换)。
