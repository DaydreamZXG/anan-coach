- id: mc_sumdiff_parity
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/和差倍比/和差公式与奇偶性
  title: 和差倍比-和差公式与奇偶性
  recognition: 已知两数之和与差求两数; 或可用奇偶性快速排除选项。
  applicability:
    include:
    - 年龄问题、流水行程等已知和与差的场景
    - '求大数/小数: 大数=(和+差)÷2, 小数=(和-差)÷2'
    - '奇偶性: 两数和为偶则差必为偶(和差同奇偶); 积含偶因子则积为偶'
    exclude:
    - 只知和或只知差(缺少一个条件)
    - 能直接列出唯一方程求解
  method_steps:
  - '提取和差关系: 大数=(和+差)÷2, 小数=(和-差)÷2'
  - 复杂题先推导中间量和差(王哥比小李大5岁且比小王大2岁→小王比小李大3岁)
  - '奇偶性排除: 和与差同奇偶(书+杂志=39为奇→差必为奇, 排除偶数选项)'
  - '数字调换题: 十位数不能为0, 用限定条件筛唯一解'
  error_signatures:
  - code: wrong_formula
    description: 大数小数公式分子写反((和+差)/2是大数)
  - code: parity_overuse
    description: 用奇偶性排除了正确选项(奇偶性只用于排除, 不能直接定解)
  - code: tens_digit_zero
    description: 数字调换时允许十位为0的错误设定
  fix_action: 做6道和差/奇偶性题, 限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 正确率≥85%
  pitfall: 奇偶性只保证"和差同奇偶", 只能用来排除选项, 仍需代入验证
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
