- id: mc_profit_assign_fraction
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/经济利润/赋值与份数
  title: 经济利润-赋值与份数
  recognition: 题干只给比例/倍数无具体数值(进价降20%、销量翻倍、利润为上月1.8倍); 含折扣/提价百分数。
  applicability:
    include:
    - '赋值法: 设原价/进价为易算值(10元), 首日销量为1件'
    - '份数思想: 利润40%→成本5份利润2份售价7份; 打八折→原价5份售价4份'
    - '倍数法: 销量倍数=总利润倍数÷单件利润倍数(1.8÷1.5=1.2)'
    - '打包法: 每卖4个赚120元、剩余1个亏100元→每组净赚20元'
    exclude:
    - 题干已给出具体数值(直接计算)
    - 题目直接问赋值对象本身的值(需设未知数)
  method_steps:
  - 对"只给比例"的量赋值(进价=10、销量=1件), 全程一致、不重复赋值
  - '百分数转份数: 40%=2/5→成本5份利润2份; 折扣对原价: 八折→4/5份'
  - '倍数关系: 总利润=销量×单件利润, 已知两个倍数求第三个(销量倍数=1.8÷1.5)'
  - '打包/分组: 赚的组与亏的剩余合并算净收益, 净收益÷每组净额=组数'
  error_signatures:
  - code: double_assign
    description: 对同一量重复赋值造成矛盾
  - code: ignore_unsold_loss
    description: 打包时漏算未售出部分的亏损
  - code: ratio_base_mix
    description: 利润相对成本与折扣相对原价的基准混淆
  fix_action: 做6道赋值/份数/打包利润题, 限时80秒/题
  time_budget_sec: 80
  accuracy_rule: 正确率≥80%
  pitfall: 利润百分比相对成本、折扣百分比相对原价, 两个基准不能混; 赋值后不能再对同一量二次赋值
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
