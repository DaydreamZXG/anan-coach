- id: mc_qty_15_pythagorean
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/平面几何/勾股定理
  title: 勾股定理与常用勾股数
  recognition: 直角三角形或可构造直角三角形求边长/距离,或出现2.6、15等'不像整数'的数据(往往是勾股数比例的缩放)
  applicability:
    include:
    - 已知直角三角形两边求第三边
    - 构造辅助线出现直角(距离、最短路径、半径垂直)后用勾股定理
    - 120°等腰三角形边长比1:1:√3(追及类几何题高频)
    exclude:
    - 只给角、无直角结构且没构造线索的题(考虑相似或正弦)
    - 直接套面积公式的题
  method_steps:
  - 背熟高频勾股数:3-4-5、5-12-13、7-24-25、8-15-17及其倍数
  - 识别直角三角形(a²+b²=c²,c为斜边)用已知两边求第三边;锐角三角形满足a²+b²>c²,钝角满足a²+b²<c²
  - 遇到小数或非常规数,整体除以公因子还原为勾股数比例(如10/24/26÷2=5/12/13,2.6=13/5)
  - 用奇数生成法补全勾股数:奇数n的平方拆成相邻两数(5²=25→12+13→5-12-13)
  error_signatures:
  - code: leg_hypotenuse_mixed
    description: 把直角边当斜边,或漏看c是斜边
  - code: scale_lost
    description: 识别出勾股数比例但忘记乘回缩放倍数
  - code: non_right_applied
    description: 对非直角三角形硬套勾股定理
  fix_action: 做6道勾股距离题(含小数数据),每题限时70秒,先写勾股数表再做题,每步检查是否还原比例
