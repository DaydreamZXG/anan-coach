- id: mc_profit_core_formula
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/经济利润/核心公式
  title: 经济利润-核心公式与损耗
  recognition: 出现进价/成本价、定价/标价、售价、销量、利润、折扣、损耗等概念。
  applicability:
    include:
    - 总利润=总收入-总成本; 总收入=售价×销量; 总成本=进价×购入量+附加成本(运费)
    - 全部售出时总利润=单件利润×销量
    - '利润率=总利润÷总成本(成本利润率); 打折: 售价=定价×折扣率'
    - '连续打折: 两次各降a%、b%的总降幅=a+b-a×b(百分比)'
    exclude:
    - 存在未售出/损耗时不能用单件利润×销量(沉没成本), 必须用总收入-总成本
    - 资料分析中的利润率=利润÷收入(行测数量用成本利润率, 勿混用)
  method_steps:
  - '列成本: 总成本=进价×购入量+运费等附加成本; 有损耗时实际销量=总量×(1-损耗率)'
  - '算收入: 总收入=售价×实际销量(未售出不计收入, 但成本已发生)'
  - 总利润=总收入-总成本; 利润率=总利润÷总成本
  - '折扣按顺序计算: 打八折再减5元=定价×0.8-5'
  error_signatures:
  - code: treat_loss_as_sold
    description: 损耗/未售出部分仍按售出计入收入
  - code: ignore_sunk_cost
    description: 忽略未售出部分的成本已发生(沉没成本)
  - code: revenue_rate_misuse
    description: 误用利润÷收入当利润率(应为利润÷成本)
  fix_action: 做6道利润计算题(含损耗/折扣/连续降价), 限时75秒/题
  time_budget_sec: 75
  accuracy_rule: 正确率≥85%
  pitfall: 有损耗一律用"总利润=总收入-总成本"总式; 利润率基准是总成本而非收入
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
