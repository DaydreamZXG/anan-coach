- id: mc_shuliang_pailie_geting
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/排列组合/同素分堆（隔板法）
  title: 排列组合-同素分堆（隔板法）
  recognition: 相同的物品/名额分给若干组，各组有「至少几个/无限制/至多几个」约束
  applicability:
    include:
    - n个相同物品分k组每组至少1个：C(k-1,n-1)
    - 允许分0个（无限制）：借一法，总数+n后再按≥1分（10个分4组→C(3,13)=286）
    - 每组至少t个：预分配（先发t-1个）再按≥1分；反向「至多m个」：超额分配+收回（先发m+1再收回，收回时至少还1）
    exclude:
    - 物品不同（要用排列组合分类讨论）
    - 各组名额已固定的分配（用「先定名额再挑人」）
  method_steps:
  - 识别物品是否相同、组是否不同（不同组有区别，不需乘排列）
  - 把约束统一成「每组≥1」：下限t→先预发(t-1)个；允许0个→借一法（每组借1个使总数+n）
  - 套公式：C(k-1, n-1)（n为转化后的物品数，k为组数）
  - 上限约束（至多m个）反向处理：借满m+1再收回，收回时每组至少还1个
  error_signatures:
  - code: items_distinct
    description: 把不同物品当成同素用隔板法
  - code: blank_group_allowed
    description: 允许0个时没用借一法，误当每组≥1
  - code: wrong_lower_bound
    description: 预分配数量错（要求≥t应先发t-1个，不是t个）
  - code: endpoint_slot_used
    description: 误用两端间隔插板（会产生空组）
  fix_action: 做5道同素分堆题（≥1/可0/≥t/至多m四种变式），限时75秒/题
  time_budget_sec: 75
  accuracy_rule: 正确率≥80%
  pitfall: 隔板只能插在中间间隔（两端插板会出空组）；「下限高提前发、下限低借来补」，所有变式统一转成「每组≥1」标准模型
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
