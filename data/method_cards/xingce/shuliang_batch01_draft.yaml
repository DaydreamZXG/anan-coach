- id: mc_qty_14_date_weekday
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/周期问题/日期星期推算
  title: 日期周期-星期推算
  recognition: 给某月/某段时间内各星期几出现次数(如'某月有5个周二4个周三')或已知某日星期几求N天后星期几
  applicability:
    include:
    - 某月/某段时间内某星期几出现次数的题
    - 跨月、跨年推算星期
    - 通过'某星期几出现次数异常'反推具体日期
    exclude:
    - 不含星期概念的纯周期计数题(用'完整周期与余数'卡)
    - 求具体天数间隔而非星期的题(改用逐月累加法)
  method_steps:
  - 记住特殊天数与7的余数:闰年2月29=4×7+1、小月30=4×7+2、大月31=4×7+3、第三季度92=13×7+1、平年365=52×7+1、闰年366=52×7+2
  - 先排除完整周数:某月30天=4周+2天,多出的2天从该月1日的星期往后占用(29日、30日分别与1日、2日星期相同)
  - 据题目条件定位:若'5个周二4个周三',说明余下2天含周二不含周三,即可确定月末最后一天是周二
  - 跨月推星期:分段按整月累加天数(如3月1日→5月1日=31+30=61天),再除7看余几,从起始星期往后推
  error_signatures:
  - code: month_days_wrong
    description: 记错月份天数(大月31/小月30/闰年2月29),导致余数错误
  - code: remainder_direction
    description: 余数天对应的星期方向弄反(应从月初星期往后加,不是往前减)
  - code: leap_year_cross
    description: 跨年推算时忽略次年是否为闰年对2月天数的影响
  fix_action: 做5道日期星期题(月内计数+跨月推算),每题限时70秒,先默写特殊天数与7的余数表再动笔
  time_budget_sec: 70
  accuracy_rule: 正确率≥75%
  pitfall: '''某星期几出现5次''通常意味着当月天数除以7的余数落在了该星期几上——方向是''从该月1日的星期往后推余数天'',不是往前'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
  validation:
