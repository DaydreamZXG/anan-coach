  title: 最值问题-比赛得分与循环赛
  recognition: 单循环/双循环比赛求总场次，或已知总分推平局数、再推某人得分
  applicability:
    include:
    - 单循环（每两队一场）：总场次=C(n,2)=n(n-1)/2；双循环（主客场）：n(n-1)
    - 淘汰赛决出冠军：每场淘汰1人，共n-1场（35人→35场）
    - 胜负局单场3分、平局单场2分；总分=3×总场次-平局数
    exclude:
    - 给定具体对阵关系的逻辑推理题（如篮球D队比了几场）
