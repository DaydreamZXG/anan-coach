  title: 排列组合-递推与标数法（最短路径）
  recognition: 走楼梯/开灯方案/最短路径等「上一步决定下一步」的计数，或网格最短路求走法数
  applicability:
    include:
    - 走台阶：a(n)=a(n-1)+a(n-2)，初始a1=1,a2=2（斐波那契 1,2,3,5,8,13,21,34,55，9级=55）
    - 每次可跨1-3级：a(n)=a(n-1)+a(n-2)+a(n-3)
    - 网格最短路径：标数法（边缘点标1，内部点=左点+下点）或组合数C(m,m+n)（向右m步向上n步）
    - 必经点：分段相乘（甲→丙 × 丙→乙）
    exclude:
    - 有障碍/不规则的网格（用标数法而非组合数公式）
    - 普通排列组合题
  method_steps:
  - 判断递推来源：最后一步跨1级来自n-1、跨2级来自n-2，建立a(n)=a(n-1)+a(n-2)(+a(n-3))
  - 定初始值：a1=1、a2=2，依次递推到目标项
  - 网格路径：边缘标1，内部点=左点+下点递推（标数法）；规整网格可直接C(向下的步数,总步数)
  - 经过必经点则分成两段分别算再相乘
  error_signatures:
  - code: wrong_init
    description: 初始条件设错（如a0应=1却设0）
  - code: miscount_labels
    description: 标数法漏加/错加相邻点数值
  - code: used_combination_on_irregular
    description: 不规则网格（有障碍）硬套C(m,m+n)
  - code: reversed_order
    description: 递推方向写反
  fix_action: 做4道递推与最短路径题，限时80秒/题
  time_budget_sec: 80
  accuracy_rule: 正确率≥75%
  pitfall: 递推要选对「最后一步」的来源（跨1/跨2/跨3）并定准初始值；组合数法只适用规整网格，有障碍必须用标数法
