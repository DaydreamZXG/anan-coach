  applicability:
    include:
    - 全部错排：记D(n)数列 D1=0,D2=1,D3=2,D4=9,D5=44,D6=265
    - 递推公式：D(n)=(n-1)×[D(n-1)+D(n-2)]
    - 部分错排：先选正确的C(k,n)，剩余错排D(n-k)
    exclude:
    - 问正常排列（无「错位/不在原位」条件）
    - 相邻/插空等排列
  method_steps:
  - 识别「不在原位置」→错位排列，先想D(n)记忆数列
  - 全部错排直接套D(n)记忆值（D3=2、D4=9、D5=44）
  - 恰有k个在正确位置：C(k,n)×D(n-k)
  - 需要递推时用D(n)=(n-1)×[D(n-1)+D(n-2)]
  error_signatures:
  - code: wrong_value
    description: 错排值记错（D3=2、D4=9、D5=44）
  - code: forgot_select
    description: 部分错排忘了先选正确的C(k,n)
  - code: misidentify
    description: 把「恰好1人正确」与「至少1人正确」混淆
