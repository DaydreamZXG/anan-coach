  method_steps:
  - 先算总场次：单循环C(n,2)，双循环n(n-1)，淘汰赛n-1
  - 由总分差推平局数：平局数=3×总场次-实际总分（每平1场比胜负局少1分）
  - 用个人胜场/平场限制逐步推理（如冠军全胜占4个胜场，亚军必输给冠军1场，其余场次只能平）
