  recognition: '一边消耗一边自动增长/减少: 牛吃草(草生长)、检票口(旅客持续增加)、水池(进水管与出水管)、自动扶梯、草地枯萎。'
  applicability:
    include:
    - 初始量恒定+恒定增长率+消耗率, 给出两组(消耗力量, 时间)
    - 求第三情况所需力量/时间, 或求初始量/增长速度
    exclude:
    - 无增长/消耗双因素
    - 增长率随情况变化不恒定
  method_steps:
  - '核心公式: 初始量=(消耗速度-增长速度)×时间, 记净效率=消耗速度-增长速度'
  - '两组数据: 时间比→净效率比(反比)→效率差对应力量差→求净效率与增长速度(10牛20天vs15牛10天→生长=5牛)'
  - 初始量=净效率×对应时间(100=(10-5)×20)
  - '第三情况: 所需量=初始量÷(力量-增长速度); 多块面积先按面积比例换算初始量'
