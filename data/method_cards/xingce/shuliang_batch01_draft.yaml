- id: mc_shuliang_zuizhi_gouzaoshulie
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/最值问题/构造数列
  title: 最值问题-构造数列
  recognition: 总量固定（人数/总分/本书已知），问「最多者尽量少」或「最少者尽量多」，常带「各不相同」
  applicability:
    include:
    - 总分固定求第n名/最大年龄等极值（20人平均88分，求第10名最低分）
    - 书/蛋糕/得分分配且各人数量不同，求极值
    - 多约束极值（百分制及格线、最高分上限、倍率关系）
    exclude:
    - 允许相等、直接均分的题
    - 「保证」型抽屉原理题
    - 混合平均/十字交叉题
  method_steps:
  - 先算总量：如总分=人数×平均分
  - 定向：求最小→让其他元素尽量取最大（构造成连续整数）；求最大→让其他尽量取最小
  - 设目标为a，按 a, a-1, a-2,…（或 a+1, a+2,…）列式，用等差数列求和：奇数项Sn=中项×项数，偶数项Sn=(首项+末项)×项数/2
  - 解方程取整：问最小向上取整，问最大向下取整；再验证实际分配方案可行
  error_signatures:
  - code: wrong_round_dir
    description: 取整方向搞反（求最小应向上取整，求最大应向下取整）
  - code: ignore_distinct
    description: 忽略「各不相同」约束，构造出相等数值
  - code: exceed_cap
    description: 让其他元素取最大值时冲破题设上限（如最高分不超过21）
  - code: no_feasibility_check
    description: 求出小数直接取整，未验证能否组合出给定总量（21本分5人需验证）
  fix_action: 做5道构造数列极值题（含整数约束），限时85秒/题
  time_budget_sec: 85
  accuracy_rule: 正确率≥75%
  pitfall: 小数取整方向「最少向上顶，最多向下压」；「各不相同/上限/及格线」等约束必须同时满足，不能只取整不看题
