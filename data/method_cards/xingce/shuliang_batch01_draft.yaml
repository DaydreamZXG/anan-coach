- id: mc_qty_18_bottle_exchange
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/特殊题型/空瓶换酒
  title: 空瓶换酒-等价兑换
  recognition: '''a个空瓶换1瓶饮料/啤酒'',已知买b瓶求最多喝多少瓶,或已知喝c瓶求至少买几瓶'
  applicability:
    include:
    - a空瓶换1瓶(含1空瓶)的总量计算
    - 正向:购买b瓶,最多喝⌊b×a/(a-1)⌋瓶
    - 逆向:需要喝c瓶,至少买⌈c×(a-1)/a⌉瓶
    exclude:
    - 题中空瓶不参与再次兑换(只需一次兑换结果)
    - 兑换规则含'瓶盖+瓶身'多条件的情况
  method_steps:
  - 核心换算:a空瓶换1瓶等价于(a-1)个空瓶换'纯酒量'(换来的那瓶喝完后空瓶会返还)
  - 正向:可喝总瓶数=b×a/(a-1),向下取整(如8空瓶换1瓶、买127瓶→127×8/7≈145)
  - 逆向:需买瓶数=c×(a-1)/a,向上取整(如喝347瓶、7换1→347×6/7≈298)
  - 必要时按'换→喝→再换'逐步验证,防止取整边界差1
  error_signatures:
  - code: minus_one_missing
    description: 直接用b/a而不是b/(a-1),漏掉空瓶返还
  - code: floor_ceil_direction
    description: 正向应向下取整、逆向应向上取整,方向弄反
  - code: borrow_bottle
    description: 借瓶机制处理错(借1瓶的实质是让总瓶数凑成a的倍数)
  fix_action: 做4道空瓶换酒题(正逆向各2道),每题限时60秒,先写b×a/(a-1)再取整
  time_budget_sec: 60
  accuracy_rule: 正确率≥85%
