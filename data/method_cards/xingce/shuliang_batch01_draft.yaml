- id: mc_qty_15_shortest_path_mirror
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/平面几何/最短路径
  title: 最短路径-镜像对称(将军饮马)
  recognition: '''两定点+一动点在直线上''求AP+PB最短(饮马/集散中心/河岸取水),或两个动点求折线最短'
  applicability:
    include:
    - 将军饮马:定点A到直线(河)再到定点B的最短折线
    - 集散中心选址:在公路上找一点使AO+BO最小
    - 双动点(如池塘两岸各一个动点):作两次镜像对称
    exclude:
    - 必须垂直过河的题(用速度分解/桥固定长度模型)
    - 圆上取点求最短(考虑切线,不是简单对称)
  method_steps:
  - 作其中一个定点关于动点所在直线的对称点A'
  - 连接A'B,与直线的交点即为最优动点位置
  - 最短路径长度=A'B(两点之间直线最短),必要时再用勾股定理求A'B
  - 双动点:起点关于CD边对称、终点关于AB边对称,连接两个对称点即为理论最短
  error_signatures:
  - code: wrong_symmetric_point
    description: 对称点做错(应关于动点所在直线对称)
  - code: path_double_count
    description: 把AB原长与A'B混加(集散中心题总路程可能是A'B+AB,需看清题目问什么)
  - code: direction_confused
    description: 两动点时对称对象对应错(起点关于CD边、终点关于AB边搞反)
  fix_action: 做4道镜像对称最短路径题,每题限时80秒,先画对称点再连线,不要直接量AB
  time_budget_sec: 80
  accuracy_rule: 正确率≥70%
  pitfall: 对称对象必须是'动点所在的线',对称后连线与线的交点才是最优位置;集散中心这类题要看清楚求的是A'B还是总路程
