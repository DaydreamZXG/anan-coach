  module_name: 数量关系
  tag_path: 数量关系/容斥问题/双集合容斥
  title: 容斥问题-双集合容斥
  recognition: 两个条件/集合,问同时满足、只满足其一或两者都不的人数。
  applicability:
    include:
    - 两个集合求交集(重叠部分)人数
    - 已知交集求总人数
    - 求只满足其中一个条件的人数
    exclude:
    - 三个集合(用三集合分层法)
    - 问最多/最少人数(用铺砖思维最值)
  method_steps:
  - 先算总人次=A+B(不去重直接相加)
  - 算实际涉及人数=总人数-两者都不的人数
  - 重叠部分=总人次-实际涉及人数(煎饼模型)
  - 只满足其一=该集合人数-重叠部分;公式:A∪B=A+B-A∩B
  error_signatures:
  - code: double_counted
    description: 直接把A+B当实际人数,未扣重叠部分
  - code: ignore_neither
    description: 忘记扣除"两者都不"的人数
  - code: three_set_two_formula
    description: 三集合题目误用双集合公式
  fix_action: 做6道双集合容斥题,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥90%
