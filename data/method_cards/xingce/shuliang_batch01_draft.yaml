- id: mc_engineering_core_formula
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/工程效率/三量公式与反比
  title: 工程效率-工程量=效率×时间
  recognition: 涉及工程量、效率、时间三量(生产零件、修路、单独/合作完成)。
  applicability:
    include:
    - 工程量不变列等量关系(两种工作方式总工程量相等)
    - '总量未知: 取单独完成时间的公倍数设总量得整数效率(甲15天乙30天丙60天→总量60)'
    - 合作时间=总工程量÷(效率甲+效率乙)
    - '效率与时间反比; 合作超时: 甲乙合作t小时、甲单独超时a、乙单独超时b, 则t²=a×b'
    exclude:
    - 有生长/消耗双因素(用牛吃草净效率模型)
    - 多人多任务分工(用统筹方法)
  method_steps:
  - '核心公式: 工程量=效率×时间; 优先找"工程量不变"列等式(32t+48(8-t-1.5)=256)'
  - 总量未知时取各时间的公倍数赋值, 效率=总量÷时间
  - 合作时间=总量÷效率和; 效率变化先转时间比(提高40%→5:7→7:5), 只作用于剩余工作量
  - 故障/休息时间单独扣减, 判断是否计入总时间
  error_signatures:
  - code: time_unit_mix
    description: 小时与分钟混用(0.4小时=24分钟不是40分钟)
  - code: fault_time_miscount
    description: 故障/休息时间计入或扣减判断错误
  - code: ratio_on_done_part
    description: 效率比误用于已完工部分
  fix_action: 做8道工程基础题(含故障/效率变化/合作), 限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥85%
  pitfall: 效率变化只影响剩余工作量; 时间单位必须统一(效率按小时计则分钟换算成小时)
