- id: mc_rc_three_set
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/容斥问题/三集合容斥
  title: 容斥问题-三集合容斥(分层人次法)
  recognition: 三个集合/三项活动,给出各自人数与两层、三层重叠人数,求总人数或某层人数。
  applicability:
    include:
    - 已知A、B、C及重叠条件求总人数
    - 求仅参加一项、仅参加两项的人数
    - 问卷回收、报名统计等人数-人次转换
    exclude:
    - 两个集合(用双集合公式)
    - 求最值(用铺砖思维)
  method_steps:
  - 分层设量:一层(仅一项)、二层(仅两项)、三层(三项都参加)
  - 人次守恒:总人次=一层×1+二层×2+三层×3;总人数=一层+二层+三层
  - 人次差:总人次-总人数=二层+2×三层(多计部分),快速求未知层
  - 标准公式:A∪B∪C=A+B+C-(A∩B+A∩C+B∩C)+A∩B∩C,代入求值
  error_signatures:
  - code: three_layer_minus_once
    description: 三层重叠只减一次(每人在三个集合中被计3次,应多减2次)
  - code: two_layer_extra_wrong
    description: 二层多计部分算错(每人多计1次而非2次)
  - code: neither_ignored
    description: 忘记加回"三者都不"的人数
  fix_action: 做7道三集合容斥题,限时80秒/题,必画三层圈图分层标注
  time_budget_sec: 80
  accuracy_rule: 正确率≥80%
