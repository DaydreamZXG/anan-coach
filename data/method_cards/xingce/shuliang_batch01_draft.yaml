- id: mc_shuliang_pailie_dingxu
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/排列组合/定序与环形
  title: 排列组合-定序与环形（消序）
  recognition: 部分元素顺序固定（甲乙丙固定顺序/身高递增排两排），或「围成圆桌/环形」旋转视为相同
  applicability:
    include:
    - 定序：7人排队甲乙丙顺序固定→A(7,7)÷A(3,3)或C(3,7)×A(4,4)
    - 两排按身高递增、合唱前后排对齐（每列定序）：只选每排成员，顺序自动确定
    - 环形：n个不同对象围一圈→(n-1)!（固定1人破环成线）；环形+相邻（夫妻绑成单元再环形）
    exclude:
    - 元素可随意换位的普通排列
    - 纯分组（无排列要求）
    - 有固定方位/方向标识的方桌（按线形排列）
  method_steps:
  - 先判断是定序还是环形
  - 定序：先全排列A(n,n)，再除以定序元素的全排列A(k,k)；或先给定序元素选位置C(k,n)再排其余
  - 环形：固定1个参照对象，剩余n-1个做线形排列=(n-1)!
  - 环形含相邻约束：先捆绑成复合单元，单元环形排列后再乘内部排列
  error_signatures:
  - code: circle_used_line
    description: 环形误用A(n,n)忘除n（环形少一位）
  - code: sequence_not_removed
    description: 定序元素的全排列忘记除
  - code: fixed_reference
    description: 有固定参照物的方桌误用环形公式
  - code: adjacency_internal
    description: 环形+相邻时捆绑单元忘记乘内部排列
  fix_action: 做5道定序与环形混合题（含环形相邻），限时80秒/题
  time_budget_sec: 80
