- id: mc_qty_19_multilevel
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/数字推理/多级数列
  title: 数字推理-多级数列(做差做商)
  recognition: 数列单调递增/递减或倍数感强,求下一项(江苏/浙江/广东/福建等地方考试考数推)
  applicability:
    include:
    - 单调数列→逐项做差(后项减前项),一般最多做差两次
    - 明显倍数关系→做商,公比为负则数列增减交替
    - 数字过大(三位数以上剧增)→优先乘法/幂次关系
    exclude:
    - 项数≥7或含小数点/根号/分式的数列(优先考虑分组)
    - 数字接近幂次数(优先考虑幂次修正卡)
  method_steps:
  - 先判方向:单调→做差;增减交替→做差后看是否负公比等比;倍数感强→做商(统一'后项除前项')
  - 做差后继续观察新数列(等差/等比/平方等),必要时二次做差;用前2-3项验证规律成立再推下一项
  - 特殊排除:数列含0时禁用做商/做积(0不能作除数),改用做差/求和
  - 常规方法失效时按特征切换:项多或含小数点/根号/分式→分组观察(奇偶位/左右分);合数且项少(4项)→因式分解(如10=2×5、21=3×7、44=4×11、?=5×13)
  error_signatures:
  - code: subtract_direction
    description: 前后项相减方向不统一(混用前项减后项/后项减前项)
  - code: zero_division
    description: 数列含0还用做商(0不能作除数)
  - code: premature_conclusion
    description: 只验证1项就断定规律
  fix_action: 做6道多级数推题,每题限时60秒,严格按'先做差/做商,再验证3项'流程走
  time_budget_sec: 60
  accuracy_rule: 正确率≥75%
  pitfall: 做差/做商后得到的新数列才是找规律的载体,很多人盯着原数列硬看;统一用'后项减前项'避免方向混乱
