- id: mc_qty_16_sum_product_extreme
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/平面几何/和定积最
  title: 和定积最-周长固定面积最大
  recognition: 周长(或边长和)固定问面积最大(围栏/围墙/场地),或面积固定求周长最小
  applicability:
    include:
    - 长方形周长固定,求最大面积
    - 三面围栏(一面靠墙),求长宽比使面积最大
    - 整数边长限制下的最值(取最接近的相邻整数对)
    exclude:
    - 没有固定和约束的面积比较题
    - 问其他形状(圆/三角形)与长方形比较(直接用'同周长圆形面积最大'结论)
  method_steps:
  - 周长固定→半周长m确定,面积S=a(m-a)是开口向下的二次函数,在a=m/2(长=宽=正方形)时最大
  - 整数限制:取最接近m/2的相邻整数对(如半周长45→22和23),保证两数和为m
  - 三面围栏:设宽为a,面积S=a×(总长−2a),令两因子相等解a;或用镜像法把墙当对称轴补成整矩形,最优长宽比2:1
  - 推广结论:周长固定时越接近圆面积越大;表面积固定时越接近球体体积越大
  error_signatures:
  - code: half_perimeter_wrong
    description: 把周长当半周长用(正方形边长=周长÷4不是÷2)
  - code: integer_rounding
    description: 整数约束下直接取两个22浪费警戒线,必须22和23保证和为45
  - code: fence_two_factor
    description: 三面围栏设元后没把面积写成两因子乘积形式
  fix_action: 做4道和定积最题(含三面围栏),每题限时70秒,先写面积函数再找对称轴
  time_budget_sec: 70
  accuracy_rule: 正确率≥75%
  pitfall: 三面围栏的最优解不是'长=宽',而是长:宽=2:1(墙相当于对称轴,补全成矩形后才是正方形)
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
