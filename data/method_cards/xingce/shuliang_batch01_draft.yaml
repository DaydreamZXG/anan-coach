  module_name: 数量关系
  tag_path: 数量关系/行程问题/钟面问题
  title: 行程问题-钟面问题(相对速度)
  recognition: 求某时刻时针与分针夹角,或分针追上时针重合、再次垂直、成直线的时间。
  applicability:
    include:
    - 计算某时刻时针分针的夹角
    - 求两针重合、垂直、成直线所需时间
    - 12小时内两针垂直/重合的次数
    exclude:
    - 普通相遇追及(无钟面)
    - 涉及日历、星期的周期问题
  method_steps:
  - 记速度:分针6°/min,时针0.5°/min,分针相对时针快5.5°/min
  - 夹角计算:先定基准时刻两针角度差,再±5.5°×经过分钟数
  - 追及型:所需时间=要补足(或多走)的角度差÷5.5°/min
  - 次数题:首次垂直需分针多走90°(耗时180/11分钟),之后每次垂直需多走180°(耗时360/11分钟),按时段累加
  error_signatures:
  - code: hand_speed_wrong
    description: 时针速度误记为6°/min或分针记成0.5°/min
  - code: vertical_angle_180
    description: 再次垂直只加90°,忽略重合之后再垂直还需多走180°
  - code: half_three_fallback
    description: 误以为3点半两针垂直(实际时针已走15°,夹角75°)
