- id: mc_rc_extreme
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/容斥问题/容斥最值
  title: 容斥问题-最值(铺砖思维)
  recognition: 问"至少/最多有多少人同时满足两项或三项",或交并集的取值范围。
  applicability:
    include:
    - 求双集合交集的取值区间或最值
    - 求至少满足N项的最小人数(三集合)
    - 每人报名项数受限,求未报名人数最多/最少
    exclude:
    - 求某层人数的定值(用分层公式)
    - 纯比例无具体人数约束的题
  method_steps:
  - 双集合最值:A∩B∈[0,min(A,B)],A∪B∈[max(A,B),A+B]
  - 铺砖模型:总人次=总砖块数;先满足硬性要求(如每人至少一项→每人先铺1块),剩余砖块自由分配
  - 求"至少几人满足≥2项":剩余砖块尽量垒高(每人多拿),砖块数÷可多拿数向上取整
  - 求"最多":剩余砖块尽量铺平扩散;若某单项人数>其他项之和,最多未报名=总人数-该最大单项
  error_signatures:
  - code: high_low_reversed
    description: 求最少时误铺平、求最多时误垒高(优化方向反了)
  - code: hard_requirement_missed
    description: 漏掉"每人至少一项"等硬性约束就自由分配
  - code: single_max_overflow
    description: 最大单项>其他项之和仍硬套整除公式
  fix_action: 做6道容斥最值题,限时85秒/题,先写总人次和硬性约束再分配
  time_budget_sec: 85
  accuracy_rule: 正确率≥75%
  pitfall: 求"至少"要把剩余砖块集中在少数人身上(每人多拿、减少受影响人数);求"最多"才铺平扩散;且高层受最小单项人数限制。
