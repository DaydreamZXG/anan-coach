- id: mc_qty_19_recurrence
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/数字推理/递推数列
  title: 递推数列-前两项关系
  recognition: 数列非单调/忽大忽小,或做差做商都看不出规律,项数不多(5项左右),选项出现分数/小数
  applicability:
    include:
    - 斐波那契型:a(n+2)=a(n)+a(n+1)(1,1,2,3,5,8)
    - 加权型:a(n+2)=2a(n)+a(n+1)(3/2,8,11,27,49)
    - 逆向型:a(n+2)=a(n+1)−a(n)(60,40,-20,-60)
    - 选项出现0.5或小数→提示1/2系数递推
    exclude:
    - 项数≥7的数列(优先考虑分组/机械划分)
    - 单调且增速均匀的数列(先用做差)
  method_steps:
  - 先做差,把差值序列与原数列逐项对照找关联(差值=前项/后项等)
  - 出现0.5、22.5等非常规数字→优先尝试×1/2系数递推
  - 套候选关系并验证至少3项:斐波那契a(n+2)=a(n)+a(n+1);加权a(n+2)=2a(n)+a(n+1);逆向a(n+2)=a(n+1)−a(n)
  - 优先尝试常见系数1/2、2、3;不行再尝试前两项和/差/积组合(如a(n+2)=3a(n)−a(n+1):4×3-5=7、5×3-7=8)
  error_signatures:
  - code: coefficient_miss
    description: 忽略0.5等小数提示,硬用整数递推
  - code: verify_partial
    description: 只验证一项关系就下结论
  - code: mix_operations
    description: 把加法递推与系数递推的公式弄混
  fix_action: 做5道递推数推题,每题限时80秒,遇到小数先想1/2系数,验证至少3项
  time_budget_sec: 80
  accuracy_rule: 正确率≥65%
  pitfall: 递推数列必须先找'哪两项怎样组合得到第三项',做完差后把差值序列与原数列逐项对照往往能直接暴露关系
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
