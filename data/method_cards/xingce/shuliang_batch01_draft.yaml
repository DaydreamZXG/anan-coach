- id: mc_xc_uniform_motion
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/行程问题/匀变速运动
  title: 行程问题-匀变速运动(v-t图像法)
  recognition: 题目出现先匀加速后匀减速、初末速度为0、v-t图像、加速度等字眼。
  applicability:
    include:
    - 先匀加速后匀减速求最大速度或总位移
    - 给出v-t图像比较两人路程大小
    - 已知初速度、时间、位移求末速度或加速度
    exclude:
    - 匀速直线运动(直接用S=vt)
    - 非匀变速的走走停停问题
    - 含车身长度的火车问题
  method_steps:
  - 画v-t图像,图像与坐标轴围成的面积=路程
  - 平均速度=总路程÷总时间;匀变速中平均速度=(V0+V末)/2
  - 初末速度为0的对称加速-减速:最大速度=2×平均速度
  - a=(V末-V0)/t;位移S=V0t+½at²(矩形面积+三角形面积)
  error_signatures:
  - code: area_unit_ignored
    description: 算图像面积时忽略坐标轴单位(分钟/小时)换算
  - code: max_speed_half
    description: 初末速度为0时误把平均速度当最大速度
  - code: unit_unified_fail
    description: km/h与m/s、分钟与小时未统一
  fix_action: 做4道匀变速运动题,限时80秒/题,每题必画v-t图标面积
  time_budget_sec: 80
  accuracy_rule: 正确率≥75%
  pitfall: v-t图像中两线交点只表示瞬时速度相同,不表示路程相等;比路程要看各自曲线围成的面积。
