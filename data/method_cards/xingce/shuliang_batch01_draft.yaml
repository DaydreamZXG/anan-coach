- id: mc_yr_concentration
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/溶液问题/浓度与溶质守恒
  title: 溶液问题-浓度与溶质守恒
  recognition: 盐水/酒精/糖水浓度,蒸发水或加水后浓度变化,求溶质、溶液量或添加量。
  applicability:
    include:
    - 蒸发水或加水稀释,溶质不变,求新浓度或求溶质/溶液
    - 加盐/加糖提高浓度,列质量守恒方程求添加量
    - 多次蒸发/加水等量操作,用调和数列(10/12/15/20)速断
    exclude:
    - 两种溶液混合(用线段法或方程,另卡)
    - 倒出补满的循环稀释(另卡)
    - 置换交换问题(另卡)
  method_steps:
  - 基础关系:溶液=溶质+溶剂;浓度=溶质÷溶液=溶质÷(溶质+溶剂);溶质=浓度×溶液
  - 蒸发/加水:溶质不变,浓度与溶液质量成反比:W1:W2=C2:C1(如40%稀释到5%,溶液需变为8倍)
  - 加盐(溶质溶液同变):设加x,列(原溶质+x)/(原溶液+x)=目标浓度,解方程
  - 蒸发等量水浓度按调和数列递增(10%→12%→15%→20%),加水则递减,可直接推下一项
  error_signatures:
  - code: denominator_solvent
    description: 把溶剂质量当分母(100克水+20克盐误算20%,实际16.67%)
  - code: add_salt_simple_proportion
    description: 加盐时按浓度比例直接算,忽略溶液总量同步增加
  - code: evaporate_direction_reversed
    description: 蒸发与加水的浓度升降方向搞反(蒸发升、加水降)
  fix_action: 做8道浓度/蒸发/加水题,限时70秒/题
  time_budget_sec: 70
  accuracy_rule: 正确率≥85%
  pitfall: 加盐时分子分母同步变化,不能套浓度比例;必须列(原溶质+x)/(原溶液+x)=目标浓度的方程;分母永远是溶液(溶质+溶剂)。
