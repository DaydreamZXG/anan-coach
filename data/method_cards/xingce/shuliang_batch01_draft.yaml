- id: mc_ratio_direct_inverse
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/和差倍比/正反比关系
  title: 和差倍比-正反比与公倍数赋值
  recognition: 形如A=B×C(总价=单价×数量、路程=速度×时间、工程量=效率×时间), 且其中一个量保持不变。
  applicability:
    include:
    - 单价不变→总价与数量成正比; 路程不变→速度与时间成反比; 工程量不变→效率与时间成反比
    - '给速度比/效率比求时间比(反比取倒数: m:n→n:m)'
    - 总量未知时设总量=各时间公倍数(或速度比乘积m×n), 得整数效率
    exclude:
    - 三个量同时变化无常量
    - 总量已给具体数值(直接计算)
    - 效率变化仅发生在部分工作量(反比只用于剩余部分)
  method_steps:
  - 在A=B×C中找出不变量(常量)
  - B不变→A与C成正比; A不变→B与C成反比, 速度比m:n对应时间比n:m
  - '总量固定时赋值: 设总量=时间公倍数(小王50天小李75天→取150), 效率=总量÷时间'
  - 按时间比分配总时间(或按效率代入列方程)求解
  error_signatures:
  - code: ratio_direction_wrong
    description: 反比方向取反(速度比2:3应得时间比3:2)
  - code: apply_to_done_part
    description: 效率变化只影响剩余工作量, 误作用于已完成部分
  - code: not_use_lcm
    description: 周期/交替工程未用最小公倍数
  fix_action: 做8道正反比与公倍数赋值题, 限时60秒/题
  time_budget_sec: 60
  accuracy_rule: 正确率≥85%
  pitfall: 反比成立的前提是总量不变; 效率比与时间比互为倒数, 且"效率下降20%"(5:4)只对剩余工作量生效
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
