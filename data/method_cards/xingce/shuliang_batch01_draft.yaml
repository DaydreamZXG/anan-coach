- id: mc_shuliang_gailv_tiaojian
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/概率问题/条件概率
  title: 概率-条件概率与独立事件
  recognition: 后一事件概率受前一事件结果影响（不放回/已知条件/两事件相关）；P(AB)=P(A)×P(B|A)
  applicability:
    include:
    - 相关事件：P(AB)=P(A)×P(B|A)，不能用P(B)代替P(B|A)
    - 独立事件：P(AB)=P(A)×P(B)直接相乘（掷骰/抽签放回）
    - 分类相加分步相乘：P(C)=P(A)P(C|A)+P(B)P(C|B)
    - 容斥型概率：P(A∪B)=P(A)+P(B)-P(A∩B)；若P(AB)≠P(A)P(B)则两事件相关
    - 环形座位相邻概率：固定1人，剩余n-1个位置中相邻有2个→2/(n-1)
    exclude:
    - 等可能、无前置条件的古典概型
    - 连续量几何概率
  method_steps:
  - 先判断事件独立还是相关（有无「已知/不放回/顺序影响」）
  - 独立→直接相乘；相关→用P(AB)=P(A)×P(B|A)
  - 分步相乘、分类相加；「至少」用1-对立
  - 求「有人/满足其一」时画韦恩图用容斥：P(A∪B)=P(A)+P(B)-P(A∩B)
  error_signatures:
  - code: treat_related_as_independent
    description: 相关事件误当独立事件，直接用P(B)相乘
  - code: formula_condition_use
    description: 条件概率题硬套古典概型有利/总数
  - code: union_overlap
    description: 容斥型概率忘记减/加交集
  - code: circular_mistake
    description: 环形座位相邻概率用成直线算法（100人应为2/99）
  fix_action: 做5道条件概率/独立事件题（含容斥与环形座位），限时85秒/题
  time_budget_sec: 85
  accuracy_rule: 正确率≥80%
  pitfall: 相关事件必须乘条件概率P(B|A)而非P(B)；若P(AB)≠P(A)P(B)说明两事件相关，要改用容斥/条件概率而不是直接相乘
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
