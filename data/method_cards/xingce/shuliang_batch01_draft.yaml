  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/立体几何/切割与截面
  title: 立体几何-切割表面积变化
  recognition: 正方体/球/圆柱被切一刀或挖个洞,问表面积增加或减少多少
  applicability:
    include:
    - 正方体挖通道/挖圆柱洞,求表面积变化
    - 球切成两半/圆柱截取,求新增截面面积
    - 沿对角线切割长方体/正方体
    exclude:
    - 求体积的切割题(用体积公式,不看面)
    - 涂色计数类(魔方问题用涂色公式卡)
  method_steps:
  - 列'多出哪些面、少了哪些面'清单:新增面=截面/通道内壁,消失面=被挖掉的表面
  - ΔS=新增面面积之和−消失面面积之和(挖圆柱洞:增2πrh通道内壁,减2πr²上下两洞口)
  - 球切半球:原曲面不变,新增两个圆截面各πr²(两半球总表面积=原16π+新增8π)
  - 球形汉堡(球穿圆柱孔):球半径R、截面半径r、孔半高h满足R²=r²+h²(勾股),内壁侧面积=2πr×(2h)
  error_signatures:
  - code: new_vs_lost
    description: 只算新增面漏算消失面,或把消失面也当成增加
  - code: hole_double
    description: 挖洞题忘记上下两个面都减少
  - code: radius_use
    description: 球形汉堡用截面直径而非半径
  fix_action: 做4道切割表面积题(挖洞+半球+球形汉堡),每题限时90秒,先分别写'多出哪些面/少了哪些面'再算ΔS
