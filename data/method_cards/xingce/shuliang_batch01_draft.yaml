- id: mc_shuliang_pailie_chakong
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/排列组合/插空法
  title: 排列组合-插空法（不相邻）
  recognition: 「甲与乙不能相邻/不相邻」或「两两不相邻」，需把受限元素插进空位
  applicability:
    include:
    - 不相邻：先排无限制元素，再在形成的空位（含两端）中插入受限元素
    - 部分相邻「2+1」结构：相邻两元素捆成整体再与第三人插空；必须相邻则用捆绑法（整体排列后乘内部排列）
    - 逆向：「至少两人相邻」=总数-「都不相邻」（C(3,12)-C(3,10)=100）
    exclude:
    - 定序/环形问题（用消序法）
    - 相同元素分堆（隔板法）
    - 无「相邻/不相邻」字样的普通排列
  method_steps:
  - 先排无限制元素：A(m,m)，形成m+1个空位（含两端）
  - 从空位中选位置插入受限元素：需区分排序用A(k,m+1)，相同元素用C
  - 不相邻=两人插入不同空位；空位数必须≥受限元素数（如6个空位放4位老人）
  - 若含相邻约束：先捆绑相邻元素（乘内部A(k,k)），再整体插空
  error_signatures:
  - code: wrong_slots
    description: 空位数算错（应为无限制元素数+1，含两端）
  - code: slot_shortage
    description: 空位不够还硬插（如老人数大于空位数）
  - code: order_ignored
    description: 受限元素不同却用C不用A
  - code: condition_misread
    description: 条件翻译反（「相邻两灯至少一盏亮」等价于「关的灯不相邻」，不是开的灯不相邻）
  fix_action: 做5道插空法题（含逆向与相邻对照），限时80秒/题
  time_budget_sec: 80
  accuracy_rule: 正确率≥80%
  pitfall: 空位数=无限制元素数+1（含两端）；受限元素有区别要用A；「相邻/不相邻」条件先翻译对再动笔
