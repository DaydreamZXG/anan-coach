- id: mc_xc_meet_chase
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/行程问题/相遇追及
  title: 行程问题-相遇与追及
  recognition: 两人相向而行求相遇,同向而行求追及,或多次相遇、环形跑道套圈、狗往返跑问题。
  applicability:
    include:
    - 相向而行(迎面)求相遇时间:速度和×时间=总路程
    - 同向而行求追及时间:速度差×时间=初始距离差
    - 多次相遇/往返运动,利用路程比=速度比列比例
    - 狗/鸟在相遇过程中往返跑,求其总路程=速度×相遇总时间
    exclude:
    - 涉及车身长度的火车错车(另卡)
    - 顺水逆水行船(用流水行船公式)
    - 走走停停、变速的非匀速运动
  method_steps:
  - 判断运动方向:相向(迎面)用速度和,同向(追及)用速度差
  - 相遇:总路程=(V1+V2)×t;追及:追及时间=初始距离差÷(V2-V1)
  - 多次相遇:第一次两人共走1倍全程,第二次共走3倍全程(每次累加2倍),用路程比=速度比列方程
  - 简化技巧:把慢者视为静止,快者相对速度=速度差/速度和;环形套圈次数=多跑路程÷周长;狗跑总路程=狗速×相遇总时间(忽略往返细节)
  error_signatures:
  - code: sum_diff_swapped
    description: 相遇题误用速度差,追及题误用速度和
  - code: multiple_meeting_wrong
    description: 多次相遇路程倍数算错(第二次是3倍不是2倍)
  - code: reference_frame_confused
    description: 参照系转换后忘记还原实际速度
  fix_action: 做8道相遇追及题(含环形、多次相遇、狗跑),限时75秒/题,必画示意图列式
  time_budget_sec: 75
  accuracy_rule: 正确率≥80%
  pitfall: 追及时间=初始距离差÷速度差,其中的"初始距离差"是追及开始时两人间的距离而非全程;有人提前出发的题要先算出提前走出的那段距离。
