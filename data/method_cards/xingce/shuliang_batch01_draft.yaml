- id: mc_qty_15_similar_triangle
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/平面几何/相似三角形
  title: 相似三角形-比例法
  recognition: 图形中出现平行线、共角、垂直结构(投影/影子、三角形内作平行线),求边长或比例
  applicability:
    include:
    - 影子/灯光测量问题(人、灯杆构成的相似三角形)
    - 大三角形套小三角形、DE∥BC等平行结构
    - 直角三角形斜边上的高(射影定理:AD²=BD×CD、AB²=BD×BC)
    exclude:
    - 没有可证相似的角相等/边平行线索的图形
    - 需要精确面积的题(可考虑蝴蝶定理/正弦面积)
  method_steps:
  - 找相似判定:①平行线(同位角相等)DE∥BC→△ADE∽△ABC;②共角+再一个角相等;③垂直+共锐角
  - 写对应边成比例:AD:AB=AE:AC=DE:BC(小三角形边对大三角形对应边,注意配对)
  - 求面积时用相似比的平方:面积比=(对应边长比)²
  - 射影定理:直角三角形斜边上的高AD²=BD×CD,适用于'直角+高'结构直接建立平方关系
  error_signatures:
  - code: corresponding_side_mismatch
    description: 对应边配对错位,比例式写反
  - code: ratio_not_squared
    description: 求面积时用了长度比而不是长度比的平方
  - code: shadow_equation
    description: 影子测量题漏写位移变化量构成的等量关系
  fix_action: 做5道相似三角形题(影子测量+平行结构),每题限时75秒,先标出对应角/对应边再写比例式
  time_budget_sec: 75
