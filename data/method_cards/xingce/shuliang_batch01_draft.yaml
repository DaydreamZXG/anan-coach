- id: mc_qty_19_power
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/数字推理/幂次数列
  title: 幂次数列-幂次修正
  recognition: 数字跨度大、突增至三位数,或出现169/343/64等幂次数(或接近幂次数如26靠近27)时
  applicability:
    include:
    - 明显幂次数(1-20平方、1-10立方)直接识别
    - 幂次修正:数字=幂次±c(如26=27-1、63=64-1)
    - 底数和指数分别成规律的双数列(n^n型、n^(n-1)型、(2n-1)^n型)
    - 交替幂次:底数+2递增、指数3/2交替、修正项+1/-1交替
    exclude:
    - 数字是两质数乘积(如46=2×23)无法幂次变形(转多级做差)
    - 小数/分数为主的数列
  method_steps:
  - 背熟关键幂次数:1-20平方、1-10立方、3^4=81、3^5=243、4^3=64、6^3=216
  - 把数列改写为底数^指数形式,优先选较小底数(64看作4^3而非8^2)
  - 观察修正项:数字=幂次±c,c恒定或成规律;数列单调递增且接近幂次数时优先试±1
  - 指数不一时,分别看底数列与指数列是否自然/等差/交替(如4^3+1、6^2−1、8^3+1、10^2−1)
  error_signatures:
  - code: wrong_power_choice
    description: 幂次基准选错(用8^2而不用4^3,导致规律隐藏)
  - code: correction_ignored
    description: 只看到幂次漏看±c修正项
  - code: prime_product
    description: 把质数乘积硬掰成幂次(46=2×23行不通还要硬凑)
  fix_action: 做5道幂次修正数推题,每题限时70秒,先写1-20平方表再拆数字
  time_budget_sec: 70
  accuracy_rule: 正确率≥70%
  pitfall: 修正项的符号和大小要单独验证(可能是+1/-1交替,也可能是+底数、+指数等),不是只看幂次本身
