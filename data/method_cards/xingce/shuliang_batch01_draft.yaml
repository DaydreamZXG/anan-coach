- id: mc_eq_indefinite_equation
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/方程思想/不定方程
  title: 方程思想-不定方程(公因子法与赋零法)
  recognition: 方程个数少于未知数个数; 问对象数量(整数型)或问多个变量的组合值(非整数型)。
  applicability:
    include:
    - 整数解+附加条件(正整数、倍数、取值范围、必须两种都要有)
    - 系数与常数项存在公因子(5a+17b=100→17b必为5的倍数)
    - '非整数型: 问整体组合值(10x+6y、a+b+c)而不问单个变量值'
    exclude:
    - 二元一次方程有唯一解
    - 非整数型但题目直接问某个变量值(不能对该变量赋零)
    - 无任何附加条件的纯代数题
  method_steps:
  - '整数型: 先化简(约去系数最大公约数, 如16x+10y=28→8x+5y=14); 找系数与常数项公因子d→另一项必为d的倍数→枚举并筛除不合附加条件的解'
  - '多组解: 首解(x0,y0)后按(x0±b, y0∓a)递推枚举(如5a+3b=51得a=3、6、9及a=0), 结合"十多个/两种都用"选解'
  - '非整数型: 对系数复杂的变量赋零化普通方程, 求其余变量, 代回求组合值; 换一个变量赋零应得到同一组合值'
  - '验算: 组合值唯一性成立即可选, 中间出现负值/分数属正常'
  error_signatures:
  - code: skip_simplify
    description: 未约去最大公约数直接找公因子, 遗漏倍数关系
  - code: assign_zero_to_asked
    description: 对题目直接求解的变量赋零(如问笔盒价格不能令笔盒=0)
  - code: ignore_hidden_condition
    description: 忽略"必须使用两种包装""十多个盒子"等隐含限制选错解
  - code: doubt_negative
    description: 赋零法出现负值就怀疑解法, 实际组合值仍唯一
  fix_action: 做6道不定方程题(4道整数公因子+2道赋零法), 限时90秒/题
  time_budget_sec: 90
  accuracy_rule: 正确率≥70%
  pitfall: '先判断题目问单个值还是组合值: 整数型先化简再找公因子枚举, 非整数型用赋零法但不可对所求变量赋零'
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
