- id: mc_shuliang_pailie_jiaicheng
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/排列组合/加乘原则与排列组合
  title: 排列组合-加乘原则与A/C选择
  recognition: 计数题第一步：完成事件「能分类独立完成」用相加，「需分步依次完成」用相乘；取出元素要不要排顺序决定用A还是C
  applicability:
    include:
    - 若干互斥类别、每类能单独完成事件→分类相加（4+3+2）
    - 多个步骤依次衔接→分步相乘（9×6）
    - 有序分配/排队→排列A(m,n)=m×(m-1)×…×(m-n+1)；无序选人/归组→组合C(m,n)=A(m,n)/A(n,n)
    exclude:
    - 相邻/不相邻/定序等带特殊约束的题（先套特殊方法）
    - 相同元素分堆（用隔板法）
    - 问概率（先算古典概型再相除）
  method_steps:
  - 明确「完成事件」的完整定义，判断是类别独立（加）还是步骤衔接（乘）
  - 判断有无顺序：有→A(m,n)；无→C(m,n)，用C(m,n)=A(m,n)/A(n,n)消序
  - 组合数对称性：C(m,n)=C(m,m-n)，n>m/2时用互补项更快；熟记C(2,4)=6、C(2,5)=10、C(2,6)=15、C(3,6)=20
  error_signatures:
  - code: wrong_operation
    description: 该乘用了加、该加用了乘
  - code: order_judgement_error
    description: 有顺序用成组合C、无顺序用成排列A
  - code: cancel_not_divide
    description: 消序想用加减抵消，实际必须除法（乘2则除2）
  - code: classify_overlap
    description: 分类时类别重复或遗漏
  fix_action: 做6道加乘原则与A/C判别计算题，限时70秒/题
  time_budget_sec: 70
  accuracy_rule: 正确率≥85%
  pitfall: 消序只能用除法（乘2则除2），不能用加减抵消；分类要「不重不漏」、分步要「完整衔接」
