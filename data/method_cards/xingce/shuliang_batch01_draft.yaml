- id: mc_qty_14_mod_congruence
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/周期问题/同余问题
  title: 余数问题-余同取余/差同减差/和同加和
  recognition: 一个数被两个以上不同的数整除后余数有规律(余数相同、或'不足数'相同、或除数和余数和相同)
  applicability:
    include:
    - 形如'C=3a+1=4b+1'余数相同的题
    - 形如'C=3a-1=4b-1'都'缺1'的题
    - 在给定范围内统计满足条件的数有多少个
    exclude:
    - 分配问题(被分配对象和接收对象都固定,同一变量直接列方程,如2a+13=3a-15)
    - 题目已给出具体余数只需取模验证的简单题
  method_steps:
  - 把每式改写为'除数×商+余数'的规范形式(如5a-2=5(a-1)+3,真实余数是3),再判定类型:余数相同→余同;不足数(除数-余数)相同→差同;除数+余数和相同→和同
  - 取两除数的最小公倍数LCM作为周期基数(如5和7→35,3和4→12,4和5→20)
  - 写通式:余同 C=k·LCM+r(r为共同余数);差同 C=k·LCM−d(d为共同不足数);和同 C=k·LCM+S(S为共同和值)
  - 在给定范围内代入k验证,并逐条核对原始条件(整除/余数),统计符合条件的个数(注意首项和完整周期数)
  error_signatures:
  - code: type_misclassified
    description: 分不清余同/差同/和同,选错通式符号
  - code: difference_sign
    description: 差同问题用加号而非减号(把'缺1'写成'余1')
  - code: lcm_wrong
    description: 最小公倍数算错(如4和6误算为24,应为12)
  - code: range_counting
    description: 范围计数时漏算首项或完整周期数
  fix_action: 做5道同余问题(三类型各约2道),每题限时75秒,先默写'余同取余/差同减差/和同加和'口诀再套通式
  time_budget_sec: 75
  accuracy_rule: 正确率≥70%
  pitfall: 判断类型要看改写后的'真实余数',不是看表达式里的减号:如m=5a-2真实余数是3(属余同),而m=3a-1真实余数是2(属'缺1'差同)——搞反了通式符号就错
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
