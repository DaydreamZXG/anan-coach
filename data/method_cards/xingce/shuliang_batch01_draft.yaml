- id: mc_qty_16_curtain_drag
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/平面几何/面积/拉窗帘法
  title: 拉窗帘法-平行移动顶点
  recognition: 三角形某顶点可沿平行于底边的方向自由移动(常与平行线、比例条件一起出现),求面积或面积定值
  applicability:
    include:
    - 顶点沿平行于底的轨道移动而底边固定,面积不变(等底等高S=½ah)
    - 求复杂图形中某三角形面积的定值
    - 极限思维:动点取极端位置(端点/中点)快速验证定值
    exclude:
    - 没有平行轨道(底边的平行线)可移动顶点的图形
    - 需要求具体线段长度而非面积的题
  method_steps:
  - 找到与底边平行的轨道线(常由平行线或图形结构提供)
  - 沿平行线把顶点拉到便于计算的位置(如与已知点重合),面积S=½×底×高不变
  - 结合相似三角形确定边长比例,反推目标面积(如S△ADF/S△ABC=1/4×2/3)
  - 定值题可令动点取极端位置(如移到边上)快速求解
  error_signatures:
  - code: height_changed
    description: 移动顶点时没沿平行线,导致高变化、面积不再相等
  - code: ratio_misapplied
    description: 面积比例关系写错(各分步比例没相乘)
  - code: extreme_invalid
    description: 极限位置选取超出题目允许范围
  fix_action: 做4道拉窗帘法题,每题限时80秒,动笔前先确认顶点移动的平行轨道
