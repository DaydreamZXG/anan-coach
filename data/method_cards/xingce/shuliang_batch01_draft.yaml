  title: 魔方涂色-切割计数
  recognition: 边长为a的正方体切割成a×a×a个小立方体,求涂色1面/2面/3面或未涂色的小立方体个数
  applicability:
    include:
    - 3面涂色(顶点):恒为8个
    - 2面涂色(棱上):12(a-2)个
    - 1面涂色(面心):6(a-2)²个
    - 未涂色(内部):(a-2)³个
    exclude:
    - 不是等分切割的正方体问题
    - 求表面积而非小立方体计数的题
  method_steps:
  - 确认切割边长a(a×a×a个小立方体)
  - 直接套公式:三面涂色=8;两面涂色=12(a-2);一面涂色=6(a-2)²;未涂色=(a-2)³
  - 验证:四类个数之和=a³;求涂色数可先算未涂色再用总数减(如8³−6³=512−216=296)
  - 求概率/占比时除以a³(如单面6个÷27=2/9)
