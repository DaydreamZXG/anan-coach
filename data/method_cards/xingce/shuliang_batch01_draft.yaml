  module_name: 数量关系
  tag_path: 数量关系/行程问题/火车过桥
  title: 行程问题-火车过桥
  recognition: 题目中出现火车/列车通过隧道、桥梁或与另一列火车错车,要求求车长、速度或通过时间。
  applicability:
    include:
    - 火车通过隧道/桥梁,求车长或所需时间
    - 速度不变时,用时间比=路程比求未知路程/时间
    - 求列车完全通过某点(车头进到车尾出)的时间或车身长度
    exclude:
    - 两人/两车直接相遇或追及(无车身长度概念)
    - 人或点状物体运动,路程不含车身
    - 只问车头到达某点,不需要完整车长
  method_steps:
  - 确定实际路程:火车通过桥/隧道时,总路程=桥(隧道)长+火车自身长度l
  - 若速度不变,列时间比=路程比:(桥1+l)/(桥2+l)=t1/t2,解出车长l
  - 求速度:速度=总路程÷时间;再按题目变化(如过桥速度减半)计算新路程所需时间
  error_signatures:
  - code: ignore_car_length
    description: 忽略火车自身长度,直接用桥长当路程
  - code: ratio_reversed
    description: 时间比与路程比的对应方向写反
  - code: unit_mismatch
    description: 米/秒与千米/小时未换算(1米/秒=3.6千米/小时)
  fix_action: 做5道火车过桥/列车错车题,限时75秒/题,每题检查路程是否已含车长
