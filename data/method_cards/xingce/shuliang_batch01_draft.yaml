- id: mc_eq_zhier_qiu_yi
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/方程思想/知二求一
  title: 方程思想-知二求一与设未知数
  recognition: '题干符合"知二求一"命题模式: 核心公式(总利润=总收入-总成本、工程量=效率×时间、路程=速度×时间、单价×数量=总价)给出两个量求第三个量;
    或未知量带百分数/分数需要设未知数。'
  applicability:
    include:
    - 题干直接给成本/售价/利润、效率/时间/工程量、速度/时间/路程中的两个量
    - 边读题即可算出中间量(进货成本=进价×数量、实际销量=总量×(1-损耗率))
    - 未知量带百分数(加价40%、逐日降10%)或分数(糖果x/3、x/4)
    exclude:
    - 只给比例/倍数无具体数值(改用赋值法/份数法)
    - 未知数多于方程个数(改用不定方程法)
    - 两个对象系数不同求数量分配(改用假设法)
  method_steps:
  - 识别核心公式并圈出两个已知量, 用"知二求一"定位目标量; 边读题即时算中间量(进货成本=3.5×100=350元, 损耗后实际销量=100×98%=98袋)
  - '设未知数: 百分数转分数(40%=2/5)设成本5a则售价7a; 分数情形设总量x(男生x/4人、女生x/3人); 连续降价用总降幅=a%+b%-a%×b%'
  - 按等量关系列方程并求解, 回答题目所求的量(如问5本书原价总和5a而非单价a)
  - '回代验证: 单位统一(元/袋)、各环节逻辑自洽'
  error_signatures:
  - code: ignore_additional_cost
    description: 忽略运费/设计费/损耗等附加成本未计入总成本
  - code: decimal_unknown
    description: 百分数直接设a导致小数运算(应设5a、7a)
  - code: ignore_loss_sales
    description: 忽略损耗仍按进货量计销量(实际销量须乘(1-损耗率))
  - code: answer_wrong_object
    description: 解出a后未换算题目问的总和(如5a、总价)
  fix_action: 做6道"知二求一+设未知数"题(含损耗、连续降价变式), 限时80秒/题
  time_budget_sec: 80
  accuracy_rule: 正确率≥80%
  pitfall: 损耗商品成本按进货量全额计、收入只按实际销量计; 设未知数优先取百分数分母的倍数(40%取5a)避免小数
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
