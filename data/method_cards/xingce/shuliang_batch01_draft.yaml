  tag_path: 数量关系/排列组合/正难则反
  title: 排列组合-正难则反（容斥）
  recognition: 正面分类多而复杂，或条件带「至少/不能/不在/不相邻」等否定词；满足数=总数-反面数
  applicability:
    include:
    - 「至少1个/每类至少1」→反面「全选某一类」；「至多3本」→反面「4本」
    - 多个否定条件（不能放两端且不相邻）：总数-反1-反2+反1且反2
    - 假言条件「若P则Q」的反面是「P且非Q」
    exclude:
    - 正面情况本来就少（直接分类更快）
    - 无否定条件的直接计数
  method_steps:
  - 先算总数（不考虑限制）：如A(4,4)=24或C(4,8)=70
  - 分别算各反面情况（可用捆绑法），如「玻璃杯在两端」=2×A(3,3)
  - 多条件按容斥：总数-Σ反面+Σ反面交集（补回同时违反两个条件的情况）
  - 涉及概率时直接 P=1-P(反面)
  error_signatures:
  - code: miss_overlap
    description: 多个否定条件重叠部分忘记加回（24-12-12漏+8）
  - code: wrong_negation
    description: 否定条件找反（「至少1」反成「至少0」；假言命题反成「非P则Q」）
  - code: bind_internal_forgot
    description: 捆绑相邻元素后漏乘内部排列A(2,2)
  fix_action: 做5道正难则反/容斥排列题，限时85秒/题
