- id: mc_qty_16_butterfly
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/平面几何/面积比例/蝴蝶定理
  title: 蝴蝶定理-面积比例
  recognition: 四边形被两条对角线(或交叉线)分成四个区域,求面积比例或某区域面积
  applicability:
    include:
    - 任意四边形对角线分割成的四个三角形面积关系
    - 梯形/平行四边形(有平行边):求各区域面积比例(1:2:2:4等)
    - 中点/等分点结合的面积问题
    exclude:
    - 没有完整'四边形对角线分割四区域'结构的图形
    - 规则图形面积直接可算的题(先套基础公式)
  method_steps:
  - 标出四区域:四边形对角线交于O,形成S1、S2、S3、S4四个三角形
  - 核心公式:S1×S3=S2×S4(对角相乘相等,任意四边形成立);可用正弦面积公式S=½ab·sinC推导验证
  - 有平行边(梯形/平行四边形)时:S2=S4=√(S1×S3)
  - 上下底比a:b→面积比a²:ab:ab:b²,记住常用比例:1:2→1:2:2:4、1:3→1:3:3:9、2:3→4:6:6:9
  error_signatures:
  - code: product_misorder
    description: 对角相乘写成相邻相乘
  - code: square_root_missing
    description: 平行情形下S2用加减而非√(S1×S3)
  - code: trapezoid_assumed
    description: 任意四边形误当梯形用S2=S4
  fix_action: 做5道蝴蝶定理题(任意四边形+梯形),每题限时80秒,先标出四个区域再套公式
  time_budget_sec: 80
  accuracy_rule: 正确率≥70%
  pitfall: S1×S3=S2×S4对任意四边形都成立,但S2=S4只在存在平行边(梯形/平行四边形)时成立
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
