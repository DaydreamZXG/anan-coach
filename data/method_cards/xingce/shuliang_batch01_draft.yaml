- id: mc_xc_river_boat
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/行程问题/流水行船
  title: 行程问题-流水行船
  recognition: 船在顺水/逆水中航行,求船速、水速或漂流时间;或帽子/物品落水后多久能追回。
  applicability:
    include:
    - 顺水/逆水航行,求静水船速或水速
    - 顺逆水往返两城,求距离
    - 物品(帽子)落水漂流,求追回时间(追帽子模型)
    exclude:
    - 静水中(无水流)的普通相遇追及
    - 火车过桥等含车身长度问题
    - 环形跑道问题
  method_steps:
  - 列速度公式:V顺=V船+V水;V逆=V船-V水
  - 两式相加减:V船=(V顺+V逆)÷2;V水=(V顺-V逆)÷2(和差公式)
  - 求距离:距离=顺水速度×顺水时间(或逆水速度×逆水时间)
  - 追帽子模型:以水流为参照系帽子相对静止,逆流上行时间=顺流追回时间,总追及时间=发现时已过去的时间,与水速无关
  error_signatures:
  - code: speed_add_sub_wrong
    description: 顺水误用相减、逆水误用相加
  - code: mean_formula_wrong
    description: 船速误算为(V顺-V逆)/2而非(V顺+V逆)/2
  - code: drift_time_error
    description: 漂流距离用水速还是船速混用(漂流只用船不带桨,速度=水速)
  fix_action: 做5道流水行船/追帽子题,限时75秒/题
  time_budget_sec: 75
  accuracy_rule: 正确率≥80%
  pitfall: 漂流速度就是水速(船不划桨);往返速度比与时间比成反比(顺水快则顺水用时短),求水速一定用(顺速-逆速)÷2。
