- id: mc_ratio_unify_invariant
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/和差倍比/比例统一与不变量
  title: 和差倍比-比例统一与不变量
  recognition: 出现多组比例(甲:乙与乙:丙)或同一比例发生增减变化, 其中有共同量或不变量。
  applicability:
    include:
    - 多级比例求统一比(初级:中级=5:3、中级:高级=2:1)
    - 物品增减前后比例变化, 抓未增减的对象(白球数量不变、年龄差不变)
    - 总量不变重新分配(树苗分配、杂粮调配)
    exclude:
    - 单一比例直接份数法(无需统一)
    - 变化前后比例无任何共同量
  method_steps:
  - 找共同量(桥梁)或不变量(未增减的量、年龄差、总量)
  - 把共同量在两比例中的数值统一为公倍数(3和2→6, 得初级:中级:高级=10:6:3)
  - 总量不变时先统一总份数(7:4:3=14份与5:3:2=10份→统一为70份)
  - 用"份数差对应实际差值"求1份, 反推所求量
  error_signatures:
  - code: not_find_invariant
    description: 未抓不变量直接对比两比例
  - code: wrong_unify_multiplier
    description: 统一比例时乘错倍数
  - code: different_piece_value
    description: 不同比例中"1份"实际值不同仍直接比份数差
  fix_action: 做6道比例统一题(含增减不变量), 限时80秒/题
  time_budget_sec: 80
  accuracy_rule: 正确率≥80%
  pitfall: 不同比例中的"1份"代表不同的实际值, 必须先经共同量/不变量统一后再比份数差; 总量不变则要统一总份数
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
