- id: mc_yr_mix_line
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/溶液问题/混合与线段法
  title: 溶液问题-混合与线段法(十字交叉)
  recognition: 两种或多种浓度溶液混合后得到中间浓度,求取用质量比或其中一种浓度。
  applicability:
    include:
    - 两种溶液按质量比混合,求混合浓度或质量比
    - 加纯水(0%浓度)或纯溶质(100%浓度)视为特殊浓度混合
    - 广义"部分量/总量"混合(均值、占比、增速、效率),距离比=分母反比
    exclude:
    - 单一溶液蒸发/加水(用溶质守恒)
    - 三种以上多次混合的复杂情形(直接列溶质守恒方程更稳)
  method_steps:
  - 溶质守恒:m×a+n×b=(m+n)×c,混合浓度c必介于a、b之间
  - 线段法:画线段,距离比(a-c):(c-b)=n:m,即距离比=质量反比,质量大的靠近自身浓度
  - 纯水=0%浓度、纯溶质=100%浓度,同样套线段法
  - 复杂多溶液:列方程(Σ各溶液质量×浓度=总溶液×混合浓度)求解
  error_signatures:
  - code: distance_ratio_reversed
    description: 距离比与质量比方向写反(应距离比=质量反比)
  - code: direct_average
    description: 质量不相等仍直接对浓度取算术平均
  - code: ratio_as_concentration
    description: 把1:7的配比直接当浓度(实际溶质占1/8)
  fix_action: 做7道混合浓度/线段法题,限时70秒/题
  time_budget_sec: 70
  accuracy_rule: 正确率≥85%
  pitfall: 线段法距离比与质量成反比——质量大的那份使混合浓度更靠近自身;溶质守恒是列式根本,复杂题直接用方程比线段法少错。
