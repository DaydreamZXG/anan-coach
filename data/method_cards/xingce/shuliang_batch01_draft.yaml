- id: mc_qty_18_bash_game
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/特殊题型/轮流取物
  title: 轮流取物-巴什博弈必胜策略
  recognition: n个物品两人轮流取、每次取1~m个、取最后一个者胜,问先手/后手策略或谁必胜
  applicability:
    include:
    - 标准巴什博弈:每次取1~m个
    - 变形:双方可取数量不同(找可控周期和,如一方取2/4另一方取1/3→周期5)
    exclude:
    - '''取完为负/取最多为负''等非标准规则(需要重新分析)'
    - 与取物无关的博弈题
  method_steps:
  - 计算关键数m+1(最小取1+最大取m)
  - 判断先手优势:n mod (m+1)≠0时先手必胜,首取n mod (m+1)个(如80个、每次1-6→取80mod7=3个)
  - 此后每轮配合:对方取x,我取(m+1−x),保证每轮合计拿走m+1
  - 变体题:找出双方都能控制的周期和(如2+3=4+1=5),谁能先把总数变成周期倍数谁控局
  error_signatures:
  - code: modulo_zero
    description: 先手取0个(当n是m+1的倍数时应后手必胜,先手无必胜策略)
  - code: key_number
    description: 关键数误用为m而不是m+1
  - code: variant_cycle
    description: 变体题没找到共同周期就硬套m+1
  fix_action: 做3道轮流取物题(标准+变体),每题限时70秒,先算m+1再判断先手取几个
  time_budget_sec: 70
  accuracy_rule: 正确率≥70%
  pitfall: 对方取x我方必须取(m+1−x)才能锁定每轮合计为m+1,漏掉这个'凑数'配合就输
