  title: 概率-古典概型（有利情况数/总情况数）
  recognition: 等可能结果有限，问「随机/任取/任意」事件概率，P=有利情况数÷总情况数
  applicability:
    include:
    - P=限定条件下的度量/已定事实的度量（数量、长度、面积均可）
    - 抽签/密码等概率模型：正确签等概率分布，尝试n次概率=n/总数；不放回与放回第k次抽中概率相同
    - 概率反推：数量=总数×概率；或设未知数列概率方程（彩球：a-3/3a-10=2/5）
    exclude:
    - 有前置条件信息的题（条件概率）
    - 时间/长度/面积等连续量（几何概率）
  method_steps:
  - 定总情况数（组合或排列，分子分母规则必须统一）
  - 数有利情况数
  - 概率=有利情况数/总情况数；相同物品须编号视为不同个体
  - 含「至少/不」字优先用 P=1-P(对立事件)
  error_signatures:
  - code: denominator_numerator_rule
    description: 分子用组合、分母用排列，计数规则不统一
  - code: same_items_not_numbered
    description: 相同颜色球不编号，漏算排列
  - code: condition_ignored
    description: 忽略「已知」前置条件，把条件概率当古典概型
