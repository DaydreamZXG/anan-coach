- id: mc_qty_17_vol_surface
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/立体几何/体积与表面积
  title: 立体几何-体积与表面积公式
  recognition: 出现正方体/长方体/圆柱/圆锥/球,求体积、表面积、水深变化或体积比
  applicability:
    include:
    - 柱体(正方体/长方体/圆柱)体积V=Sh(底面积×高)
    - 锥体(圆锥/棱锥)体积V=⅓Sh
    - 球体积V=4/3πr³、表面积S=4πr²;圆柱表面积=2πr²+2πrh
    - 容器翻倒/竖立:体积不变,底面积与高成反比
    exclude:
    - 立体表面的最短路径(用展开法卡)
    - 球面距离/经纬度(用大圆三步走)
  method_steps:
  - 按图形选公式:柱体V=Sh、锥体V=⅓Sh、球V=4/3πr³、球表面积4πr²
  - 体积不变时,新水深=原体积÷新底面积(容器竖立/翻转题;底面积缩小1/4则高度扩大4倍)
  - 相似立体:长度比k→面积比k²→体积比k³(如圆锥高度比1:2,体积比1:8)
  - 圆锥母线l=√(r²+h²),侧面积=πrl(侧面展开为扇形);圆台侧面积=π(r+R)l
  error_signatures:
  - code: cone_factor
    description: 锥体体积漏乘1/3
  - code: sphere_coeff
    description: 球体积4/3与球表面积4混用(体积带三次方,表面积带二次方)
  - code: slant_height
    description: 把圆锥高当母线用(侧面积需用母线l=√(r²+h²))
  - code: base_area_mix
    description: 容器翻倒时用错底面(最大底面/最小底面判断错)
