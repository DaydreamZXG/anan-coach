- id: mc_xc_harmonic_mean
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/行程问题/等路程平均速度
  title: 行程问题-等路程平均速度(调和平均数)
  recognition: 往返、上下坡往返或两段路程相等但速度不同,求全程平均速度。
  applicability:
    include:
    - 往返平均速度(去程V1、返程V2)
    - 上下坡往返,上坡总路程=下坡总路程(对称)
    - 一半路程按一种速度、另一半按另一种速度行驶
    exclude:
    - 按时间分配速度(一半时间甲速一半乙速,用算术平均(V1+V2)/2)
    - 三段不等长路程需分段求总时间再除总路程
    - 走走停停间歇运动
  method_steps:
  - 判断两段路程相等,套调和平均数公式:V平均=2V1V2/(V1+V2)
  - 速算检验:调和平均数介于两速度之间且更接近较小值,必小于算术平均(V1+V2)/2,可用选项排除
  - 总路程=平均速度×总时间,进而求单程距离或总时间
  error_signatures:
  - code: arithmetic_mean_misuse
    description: 误用算术平均(V1+V2)/2,高估平均速度
  - code: unequal_distance_formula
    description: 两段路程不相等仍直接套调和平均公式
  - code: weight_ignored
    description: 混合路程平均速度直接对各段速度取平均,忽略路程权重
  fix_action: 做5道往返/上下坡平均速度题,限时75秒/题
  time_budget_sec: 75
  accuracy_rule: 正确率≥85%
  pitfall: 只有两段路程相等时才能用调和平均;往返问题因上坡总路程=下坡总路程仍满足条件。调和平均必小于算术平均,选项排除法常用。
