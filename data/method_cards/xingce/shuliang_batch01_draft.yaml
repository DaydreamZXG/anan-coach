  title: 工程效率-统筹分工与效率变化
  recognition: 多人承担多项任务(分工/同时开工同时竣工); 或工程中途效率提高/降低导致提前/延期完工。
  applicability:
    include:
    - '分工: 各人擅长不同任务, 优势方先独立完成再协助对方'
    - '内部效率比: 比较每人做A/B的效率倍数, 倍数大者专做该任务'
    - '同时竣工: 总时间=总工作量÷总效率, 反推各人分配'
