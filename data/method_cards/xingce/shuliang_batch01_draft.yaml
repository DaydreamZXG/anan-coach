- id: mc_yr_repeat_swap
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/溶液问题/反复操作置换
  title: 溶液问题-反复倒出补满与置换
  recognition: 倒出一部分溶液后加满水,重复多次求最终浓度;或两容器等量交换溶液后浓度相同,求交换量。
  applicability:
    include:
    - 反复"倒出x%+加满"的循环稀释,求最终浓度
    - 容器间等量交换后浓度相同的置换问题
    - 求交换量或某一容器目标浓度
    exclude:
    - 单次混合或蒸发加水(另卡)
    - 一次性把两种溶液全部混合(用线段/方程)
  method_steps:
  - 循环稀释:每次"倒出a/b后补满"等效于浓度×(1-a/b);n次后浓度=C0×(1-a/b)^n
  - 补入含溶质液体(非纯水):基准平移法——所有浓度先减干扰浓度,按纯水稀释算,结果再加回
  - 置换相等量:整体混合浓度=总溶质÷总溶液;要求两容器浓度相同则按原质量比回分各自应含对方溶液的量
  - 等量双向交换总量守恒:甲瓶酒精量=乙瓶水量,交换只是内部循环,总量不变
  error_signatures:
  - code: retention_ratio_wrong
    description: 倒出2/5后剩余比例写成2/5(正确为3/5)
  - code: add_nonpure_as_water
    description: 补入含溶质液体却按纯水稀释计算
  - code: exchange_mass_lost
    description: 交换时误以为总量变化,忽略总量守恒
  fix_action: 做6道循环稀释/置换题,限时75秒/题
  time_budget_sec: 75
  accuracy_rule: 正确率≥80%
  pitfall: 每次操作后浓度乘的是"剩余比例":倒出2/5后×3/5,"倒出1/3补满"每次×2/3,不是减1/3;基准平移法记得最后把减掉的值加回。
