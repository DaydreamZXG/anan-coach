- id: mc_qty_14_cycle_full_period
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/周期问题/完整周期与余数
  title: 周期问题-完整周期与余数处理
  recognition: 看到'每n天/每隔n天'重复出现的排班、值班、提交、活动等,求一段时间内发生次数或某天是否发生
  applicability:
    include:
    - 排班/值班/学习提交等按固定周期重复的计数题
    - 求某段时间内某事件发生次数:先算完整周期数再处理余数
    - 两件周期不同的事件同一天发生,求下次同时发生(用最小公倍数)
    exclude:
    - 涉及星期几计数且需跨月/跨年的日期题(见'日期星期推算'卡)
    - 一个数被多个除数整除、余数有规律的题(用'同余三口诀'卡)
  method_steps:
  - 确定周期长度:'每隔n天'一律换算为'每n+1天'(隔4天=每5天、隔2天=每3天);'每n天'周期就是n天
  - 计算完整周期数=总天数÷周期长度(向下取整),完整周期内各对象个数恒定(如'上2休3'任意连续10天必含4个工作日)
  - 余数天数从该周期起始位置往后单独数出对象数,与完整周期结果相加
  - 两周期事件同步:下次同时发生=两周期天数的最小公倍数LCM(a,b)之后(如周期3天与4天→12天)
  error_signatures:
  - code: every_n_days_misconverted
    description: 把'每隔n天'直接当成周期n天,实际应为n+1天
  - code: remainder_ignored
    description: 只算完整周期忘记处理余数,或余数天数乱取起点
  - code: lcm_misuse
    description: 求两周期同步时刻却用乘积或相加,应为最小公倍数
  fix_action: 做6道周期计数题(含'每隔n天'换算、完整周期+余数、两周期同步各2道),每题限时60秒,动笔前先标周期长度
  time_budget_sec: 60
  accuracy_rule: 正确率≥80%
  pitfall: 周期起点不影响完整周期内的对象总数,但决定余数部分的起点——余数天数必须从该周期起始日往后数,不能从第1天顺延
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
