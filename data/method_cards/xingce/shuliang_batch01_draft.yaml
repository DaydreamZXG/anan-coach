  applicability:
    include:
    - 4人分3部门每部门至少1人（2-1-1分配）；5人分3天每天1-2人（2-2-1分配）
    - 每组有上限的分配（干部帮扶每人最多2户）
    - 放置问题「谁选谁」：5个不同锦囊各选1个锦盒→4^5（不是5^4）
    exclude:
    - 纯平均分组且无接收对象（需除以A(n,n)）
    - 相同元素分配（隔板法）
