  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/立体几何/表面最短路径
  title: 表面最短路径-展开法
  recognition: 蚂蚁/虫子沿圆柱、圆锥、长方体表面从一点爬到另一点求最短距离
  applicability:
    include:
    - 圆柱侧面爬行(展开为长方形)
    - 圆锥侧面爬行(展开为扇形,用弧长比求圆心角)
    - 长方体表面爬行(展开相邻两面求对角线)
    exclude:
    - 球面最短距离(沿大圆弧走,不是平面展开)
    - 可穿透内部的题(题干限制只能沿表面走)
  method_steps:
  - 把曲面展开成平面:圆柱侧面→长方形(高=圆柱高h,宽按爬行需要选半周长πr或整周长2πr)
  - 展开后两点间直线距离即最短,用勾股定理求解(如15-20-25对应3-4-5)
  - 圆锥展开为扇形:半径=母线l=√(r²+h²),圆心角=360°×(底面周长÷扇形所在圆周长2πl)
  - 长方体:展开相邻两面,路径=√((a+b)²+c²);为取最短,选含最小两边的组合展开
  error_signatures:
  - code: half_vs_full
    description: 该绕整圈却展开半圈(误选25而非10√13)
  - code: slant_height
    description: 圆锥展开用高h而非母线l作扇形半径
  - code: which_faces
    description: 长方体展开选错相邻面组合
  fix_action: 做4道展开法最短路径题(圆柱/圆锥/长方体),每题限时90秒,先画展开图再算直线距离
