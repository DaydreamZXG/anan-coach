- id: mc_shuliang_gailv_jihe
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/概率问题/几何概率
  title: 概率-几何概率（长度/面积比）
  recognition: 时间/长度/面积等连续量均匀随机，概率=有利部分度量÷总度量
  applicability:
    include:
    - 等时间等待：整点前15分钟概率=15/60=1/4
    - 二维坐标：总面积与约束直线围成面积之比（如|x-y|≤10的带状面积/30×30）
    - 正方形顶点扇形禁区：4个90°扇形可拼成整圆，有效=总面积-圆面积（86/400）
    - 线段切三段成三角形：用三角形不等式围出的面积/总面积（概率1/4）
    exclude:
    - 离散有限个结果（古典概型）
    - 带条件概率的题
  method_steps:
  - 建度量模型：一维用线段长度（时间轴），二维用坐标系面积
  - 二维：总面积=约束范围面积（如30×30=900），画出约束线（如y=x±10）
  - 有效面积=总面积-失效面积；概率=有效面积/总面积
  - 多个扇形合并成整圆计算（4个90°扇形=1个圆），用π≈3.14估算
  error_signatures:
  - code: wrong_region
    description: 约束区域画错（方向或不等号反）
  - code: unit_mismatch
    description: 时间/长度单位不统一
  - code: sector_not_merged
    description: 多个扇形分开算导致误差
  - code: mean_distribution_fail
    description: 非均匀分布硬用面积比
  fix_action: 做4道几何概率题（1维时间+2维坐标），限时90秒/题
  time_budget_sec: 90
  accuracy_rule: 正确率≥70%
  pitfall: 二维几何概率关键是画对约束线围成的区域；扇形禁区可合并成整圆简化计算；注意单位统一
