- id: mc_shuliang_zuizhi_chouti
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/最值问题/抽屉原理
  title: 最值问题-抽屉原理（最不利原则）
  recognition: 看到「至少……保证……」或「至少多少次（人/个）才能保证有k个相同/达到k层」，要把物品分进若干抽屉
  applicability:
    include:
    - n+1个物品放入n个抽屉，至少有一个抽屉物品≥2；推广：m×n+1个物品放n个抽屉，至少一个抽屉≥m+1
    - 保证至少k个同色/同身高/同方案的取物、分组题
    - 分组问题「多于k人/至少k人」反推人数（m+1=k+1）
    exclude:
    - 某抽屉容量不足的题（某颜色球不够k-1个，须按实际容量调整，不能直接套公式）
    - 求「最大值最小/最小值最大」的构造数列题
    - 已给具体概率、求概率的题
  method_steps:
  - 定抽屉：分组依据/方案种数=抽屉数n，物品=分配对象
  - 找最不利情况：让每个抽屉都只铺满k-1层（目标数量-1），最多可放 n×(k-1) 个
  - 临界+1：答案=n×(k-1)+1（公式：(目标数量-1)×抽屉数+1）
  - 若某抽屉容量不足，该抽屉按实际容量铺满（如该色球只有4个就铺4个），其余抽屉仍铺k-1
  error_signatures:
  - code: ignore_capacity_limit
    description: 忽略某抽屉容量不足，直接套n×(k-1)+1导致答案偏大（产品检测题误用2109×3）
  - code: disturb_by_quantity
    description: 被小球具体数量（4,6,8,9,11,10）等干扰项迷惑，没抓住抽屉=颜色种类数
  - code: threshold_shift
    description: 「多于2人」误理解成≥2人，实际是≥3人，m值反推错
  - code: forget_plus_one
    description: 铺满临界层后忘记+1，答案差1
  fix_action: 做6道抽屉原理/最不利原则真题，限时75秒/题
  time_budget_sec: 75
