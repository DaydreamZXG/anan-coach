- id: mc_eq_hypothesis_method
  exam_scope: guokao
  track: xingce
  module_name: 数量关系
  tag_path: 数量关系/方程思想/假设法
  title: 方程思想-假设法(鸡兔同笼/盈亏平衡)
  recognition: 两个对象有不同的"乘积系数"(鸡2脚兔4脚、完好箱+30元破损箱-60元、熟练工6件学徒工2件), 已知对象总数与总量。
  applicability:
    include:
    - 已知总头数与总脚数/总工作量求两种对象数量
    - 含正负收益对象(运货完好得30元、破损倒赔60元)
    - 座位分配、效率分组等"多退少补"盈亏平衡场景
    exclude:
    - 单一对象问题
    - 需同时满足两个以上独立条件(用联立方程组)
    - 对象数量有倍数/范围等整数附加条件(用不定方程)
  method_steps:
  - 假设全部为对象A, 算理论总量(35头全鸡=70脚)
  - 差额=实际总量-假设总量(94-70=24)
  - 单位差异=把1个A换成1个B引起的总量总变化(鸡→兔多2脚; 完好→破损损失30+60=90元)
  - 对象B个数=差额÷单位差异(24÷2=12只兔)
  error_signatures:
  - code: wrong_unit_diff
    description: 单位差异算错(破损箱是损失30+60=90而非30-60)
  - code: ignore_negative_side
    description: 忽略负收益对象(破损箱倒赔60元未计入)
  - code: diff_direction
    description: 差额方向弄反(应实际总量-假设总量)
  fix_action: 做5道假设法题(含倒赔/负收益/座位变式), 限时90秒/题
  time_budget_sec: 90
  accuracy_rule: 正确率≥80%
  pitfall: 单位差异是"替换1个对象引起总量的总变化", 负收益也要计入绝对值(破损每箱损失90元)
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
