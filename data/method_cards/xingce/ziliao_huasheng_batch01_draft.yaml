- id: mc_mult_scale
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/速算技巧/乘法放缩
  title: 乘法放缩（拆整百×百分比）
  recognition: 乘法中某乘数接近整百数且可拆为整百×(1±x%)，如617≈600×1.03、103=100×1.03
  applicability:
    include:
    - 求现期B=A×(1+r)型乘法
    - 乘数余数相对整百的比例≤10%时（余量比例超15%改直乘）
    exclude:
    - 余数比例超过15%时误差失控
    - 选项差距极小需精确到个位时
  method_steps:
  - 找百分比关系：617≈600×1.03（600的1%=6、3%=18），408≈400×1.02
  - 先算整百部分：865×400=346000
  - 用1%基准补余量：346000的2%=6920，加总得352920
  - 余量百分比小时用'10%减1%'：46×700=32200，9%=3220-322=2898
  error_signatures:
  - code: pct_miscalc
    description: 余数对整百的百分比关系判错（18是900的2%不是1%）
  - code: overuse
    description: 余数超15%仍强用放缩，误差不可控
  - code: base_unit_wrong
    description: 1%基准算错量级（600的1%=6而非60）
  fix_action: 做15道三位数×三位数乘法放缩题，每天先练652×7/8/9心算，限时60秒/题
  time_budget_sec: 50
  accuracy_rule: 正确率85%，有效数字对上即可、不要求个位精确
  pitfall: 补百分比必须用'整百部分×1%×倍数'，别把1%基准的位数（6还是60）数错
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
