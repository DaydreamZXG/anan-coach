- id: mc_zl_tidai_bijiao
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比较类/替代比较法
  title: 替代比较法
  recognition: 比较增速/年均增长率/比重而想省去基期计算
  applicability:
    include:
    - b/a代替x/a比增速（x=b-a），少算一步减法
    - 末期/基期代替年均增长率（年数相同时，(1+r)^n单调于末期/基期）
    - 部分A/整体用部分A/部分B代替比大小
    - x/b代替x/a（缺基期时）
    exclude:
    - 负增长情形（替代关系可能失效）
    - 需要具体增速数值
    - 增长率较小（<100%）且要精确值时直接用公式
  method_steps:
  - 判断所比较指标能否替代（增速比大小→b/a；年均→末期/基期）
  - 选替代式，计算或心算各替代值（保留3位）
  - 排序替代值，替代值大者对应指标大
  - 对照选项
  error_signatures:
  - code: negative_replace
    description: 负增长时用x/b代替x/a出错
  - code: period_unequal
    description: 年均替代时各对象年数不一致
  - code: skip_a
    description: 需要b/a却直接比了x（漏加基期）
  fix_action: 做8道替代比较题，限时45秒/题，先写'替代式'再算
  time_budget_sec: 45
  accuracy_rule: 正确率85%以上
  pitfall: 替代只保序不保量：它能告诉你谁大谁小，不能给出具体增速值；负增长时谨慎用x/b替代。
