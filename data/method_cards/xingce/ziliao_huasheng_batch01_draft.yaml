- id: mc_zl_xuanduan_fa
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/盐水混合/线段法
  title: 线段法（已知2R和量比求第3R）
  recognition: 已知整体与一个部分的率（或两部分的率）又知道量之比，求第三个率（常见混合增长率或某部分增长率）
  applicability:
    include:
    - 混合增长率：已知一部分增长率和整体增长率、量比求另一部分增长率
    - 已知两率求混合值（整体必在两率之间、靠近量大一侧）
    - 多部分混合粗略判断范围
    exclude:
    - 已知3个率求量比→十字交叉更省
    - 各部分量相近且选项极近时需精确基期量比
    - 缺少'整体=两部分'关系
  method_steps:
  - 划线标点：数轴从左到右标出两率（小左大右）
  - 量之反比：两率到混合点的距离比=对应量之比的反比（量大者距离短）
  - 几何计算：总跨度按份数均分，定位混合点或未知率
  - 校验：混合点必在两率之间、靠近量大一方
  error_signatures:
  - code: ratio_not_inverse
    description: 量比直接当距离比用，没取反比
  - code: current_as_base
    description: 增长率混合用现期量比代替基期量比（增速悬殊时错）
  - code: symbol_ignored
    description: 负增长率时距离计算忘带方向
  fix_action: 做10道混合增长率题，限时55秒/题，统一'划线-反比-分格'三步
  time_budget_sec: 55
  accuracy_rule: 正确率90%以上
  pitfall: 增长率混合的量比必须是基期量比；只有增速接近（差≤5个百分点）且较小、选项宽松时才可用现期量近似。
