  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比重/基期比重
  title: 基期比重
  recognition: 求上年(基期)某部分占整体的比重,或基期两个量的比值/倍数
  applicability:
    include:
    - 基期比重=现期比重×(1+b)/(1+a)
    - 基期比值(城镇/农村收入比、比值变化)
    - 基期倍数
    exclude:
    - 只判断比重升降(改用增速比较,不计算)
    - 求现期比重
  method_steps:
  - 求现期比值,分子分母各截三位(82989取829、46385取463),829/463≈1.79
  - 乘调整系数(1+b)/(1+a):分子增速a>分母增速b则基期比重>现期
  - 增速差小时用近似:现期比重+现期比重×增速差(增速差1.6%→加0.03得1.82)
