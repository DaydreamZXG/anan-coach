  - code: unit_mismatch
    description: 亿吨与万吨、微克与毫克未统一直接比较
  - code: sort_reversed
    description: 排序算对但选反（题干要求"从低到高"）
  - code: total_row_counted
    description: 计数时把"全国/合计"行算进去
  - code: subject_object_reverse
