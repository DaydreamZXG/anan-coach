  recognition: 问'某段时间内平均每年增长多少'，给期间起止年份的数值
  applicability:
    include:
    - 公式(末期-基期)/年份差
    - 五年计划（十三五2016-2020）、问题年份延后时基期前推一年（如(2020-2015)/5）
