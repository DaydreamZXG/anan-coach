- id: mc_zl_shuangxian_fa
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比较类/双线法
  title: 双线法（增速大小比较）
  recognition: 比较连续年份/项目的增长率大小，给出现期量与基期量序列
  applicability:
    include:
    - 求各年增量x=b-a（保留3位），观察基期a单调变化
    - 分子x降+分母a升→增速必降
    - 分子明显占优（某年增量远大于其他）时直接选
    exclude:
    - 基期波动大（非单调）时需验证计算
    - 求具体增速数值
    - 图形题斜率比较（斜率大≠增速快）
  method_steps:
  - 逐项算增量x=b-a，保留3位有效数字
  - 建坐标系：横轴基期a、纵轴增量x，增速=x/a即与原点连线斜率
  - 优先排除'分子减分母增'的年份；再看分子变化突出的选项
  - 必要时用增速=x/a（截位）验证1-2个关键年份
  error_signatures:
  - code: slope_equals_growth
    description: 误以为斜率（增量）最大=增速最大，忽视基期差异
  - code: non_monotonic_use
    description: 基期不单调时仍只用排除法
  - code: adjacent_only
    description: 只比相邻年份漏掉更早年份
  fix_action: 做8道双线法题，限时50秒/题，每道画出a-x简图
  time_budget_sec: 50
  accuracy_rule: 正确率85%以上
  pitfall: 斜率表示增量而非增长率——同样增量5，从5→10是100%，从10→15只有50%。
