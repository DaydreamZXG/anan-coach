- id: mc_zl_san_paixu
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/盐水混合/三排序问题
  title: 三排序问题
  recognition: 比较'整体与两个部分'三者的大小排序，常问'有几个满足某部分>整体'
  applicability:
    include:
    - 整体必在两部分之间，部分1>整体⇔整体>部分2
    - 当月vs累计增速：当月增速>累计增速 ⇔ 本月累计增速环比上升
    - 出口占比上升 ⇔ 出口增速>进口增速（总增速介于两者之间时）
    - 新增占比拉高累计占比 ⇔ 新增占比>累计占比
    exclude:
    - 需要精确数值（求具体增速）
    - 三者关系不明（不满足整体=部分和）
    - 只给两组数据无法确定第三组排序
  method_steps:
  - 识别'整体-部分1-部分2'结构，确认谁是整体
  - 把所求排序等价转换成已知的两个排序（如'女生>全班'转成'全班>男生'）
  - 按转换后的条件逐一数出满足的个数（统计累计增速环比上升的月份数）
  - 对照选项秒选
  error_signatures:
  - code: equivalence_wrong
    description: 等价转换方向搞反（如把部分1>整体写成整体>部分1）
  - code: count_window
    description: 统计月份时漏掉起始月份（如只数3-12月共10个月）
  - code: sign_compare
    description: 正负增速比较时忘记-15.8%<141.3%这类大小
  fix_action: 做10道三排序题，限时45秒/题，每道先写等价关系式再数数
  time_budget_sec: 45
  accuracy_rule: 正确率90%以上
  pitfall: 三排序的实质是'整体值介于两部分之间'，只可判断排序不可算具体值；等价条件选错整题就反了。
