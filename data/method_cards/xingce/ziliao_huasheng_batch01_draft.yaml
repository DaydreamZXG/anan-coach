- id: mc_assumed_distribution
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/速算技巧/假设分配法
  title: 假设分配法
  recognition: 现期量和增长率都已知,需要较精确地估基期量/增长量,尤其增长率大或要做基期差值时
  applicability:
    include:
    - 求基期量/增长量:把现期拆成若干易算基数分别乘r
    - 基期差值、基期和差计算(如进出口基期差、第三产业与城乡居民基期量)
    - 增长率>50%时替代盐水法做精确计算
    exclude:
    - r是整分数可直接用415分数法
    - 选项差距极大只需粗估
  method_steps:
  - 把现期量拆成易算的整十/整百基数+剩余(如3183=3000+183、7586=7000+586)
  - 每个基数乘r得增量并累加,逐块从现期量中扣除得基期(3000×6.06%≈182,剩余183×6.06%≈11)
  - 剩余部分继续分配直到误差可接受;结果与选项接近时改用四位有效数字二次验证(1195 vs 1200)
  error_signatures:
  - code: allocation_bias
    description: 分配基数上下同时给多/给少导致估算单向偏移
  - code: precision_too_low
    description: 结果接近(如1195 vs 1200)仍用三位数精度
  - code: high_growth_error
    description: 增长率>50%时忽略误差放大,1%误差可导致结果偏差约0.5个百分点
  fix_action: 做15道假设分配法求基期/增量题,限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 85%
  pitfall: 增长率大时最后两位做差是主要误差源,结果接近必须把精度提到四位数
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
