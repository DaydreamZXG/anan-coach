- id: mc_product_multiplication_unit
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/基期与现期/乘积比较与单位换算
  title: 产量乘积倍数比较与单位换算
  recognition: 比较两个“量×率”的乘积大小(总产量=面积×单产),或涉及公顷/亩、亿/万等隐含单位换算
  applicability:
    include:
    - 比较总产量=面积×单产时先看倍数关系:若a是a'的m倍而b'不到b的m倍,则a×b>a'×b'
    - 1公顷=15亩:30.7公斤/公顷÷15≈2公斤/亩,5988.8÷15≈399.3公斤/亩
    - 单位合理性校验:烤烟7.06万吨/3.2665万公顷≈2.16吨/公顷,排除不合理的万吨/公顷选项
    exclude:
    - 两个乘积的倍数都接近1时需要精确计算
    - 乘数与被乘数单位已在同量级、无需换算时
  method_steps:
  - 识别乘积关系与隐含单位(公顷↔亩×15,亿↔万×10000)
  - 比较乘积:固定一边,看另一边的倍数是否足够抵消
  - 例:玉米36759.7×5972.7与小麦24186.5×5327.4,面积约1.5倍、单产约1.1倍→玉米更大
  - 单产结果换算到合理量级(吨/公顷)做常识校验
  error_signatures:
  - code: unit_conversion_wrong
    description: 公顷亩换算方向搞反(÷15写成×15)
  - code: grain_vs_rice_confuse
    description: 把谷物整体单产当成稻谷单产
  - code: multiple_check_lazy
    description: 不比较倍数直接算乘积,浪费时间且易错
  fix_action: 做6道乘积比较与单位换算题,限时50秒/题
  time_budget_sec: 50
  accuracy_rule: ≥85%
  pitfall: “谷物整体单产≠稻谷单产”,每个单产都独立换算独立验证;单位合理性是最快的纠错手段。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
