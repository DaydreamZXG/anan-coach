- id: mc_base_period_ratio_split
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比重/基期比重
  title: 基期比重拆分法
  recognition: 求去年某部分占整体的比重,给出现期比重和部分/整体增长率
  applicability:
    include:
    - 基期比重=现期比重×(1+r整体)/(1+r部分)
    - 拆分乘法:832×75%=624,余数43/832≈5%,75%+5%=80%
    - 比重之和恒100%,可用非住宅占比=100%-84%反推校验
    exclude:
    - 选项差距极小、需要精确计算时
    - 部分与整体增长率都很大(>10%)时简化误差大
  method_steps:
  - 先算现期比重:整数部分与余数部分分别拆算再相加
  - 看增速比:若r部分≈r整体,基期比重≈现期比重;若r部分>r整体,基期比重比现期小
  - 微调:基期比重≈现期比重×(1+r整体-r部分),如80%×105%≈84%
  - 用100%-某部分占比反推另一部分,验证是否与选项吻合
  error_signatures:
  - code: wrong_growth_ratio
    description: 分子分母增长率放反(把部分增长率放到整体位置)
  - code: naive_use_current_ratio
    description: 直接把现期比重当成基期比重,不做增速调整
  - code: split_remainder_error
    description: 拆分的余数占比(如43/832≈5%)估错导致结果偏移
