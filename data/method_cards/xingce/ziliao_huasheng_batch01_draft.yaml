- id: mc_zl_geji_bizhong
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比重类/隔级比重
  title: 隔级比重（过河拆桥法）
  recognition: 问'小集合占大集合'，直接数据缺失，但给出(小/中)和(中/大)两层占比
  applicability:
    include:
    - 小/大=(小/中)×(中/大)，中间层级约去（如公立医院床位/全国床位=75.7%×77.1%）
    - 已知(小/大)和(中/大)求(小/中)：小/中=(小/大)÷(中/大)
    - 给定百分比时优先建相对关系而非算绝对值
    exclude:
    - 直接有小/大数据时不绕弯
    - 只有两层结构无需桥梁
    - 需要中间层绝对数值时
  method_steps:
  - 识别三层结构，确认哪个是中间层（中）
  - 用已知两个占比搭建桥梁：小/大=(小/中)×(中/大)，或除法(小/大)÷(中/大)
  - 把百分数转成好算分数约分（75.7%≈3/4、77.1%≈77%；35.8%÷44.5%≈358/445再约分）
  - 心算乘积或商，对照选项
  error_signatures:
  - code: wrong_caliber
    description: 把'医院中公立占比'与'公立占全国比重'两个口径当同一个
  - code: absolute_operation
    description: 明明只给百分比却构造4.17万亿÷(44.5%×GDP)的绝对运算
  - code: skip_reduction
    description: 复杂百分数不约分硬算
  fix_action: 做8道隔级比重题，限时60秒/题，强制先写'小/大=(小/中)×(中/大)'再算
  time_budget_sec: 60
  accuracy_rule: 正确率90%以上
  pitfall: 约分时分子分母要同除同一数（如358/445同÷111→322/400≈80.5%），确保放缩方向一致。
