- id: mc_frac_415
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/基期与现期/415份数法
  title: 415份数法（含415修正）
  recognition: 增长率可近似为常见分数（25%=1/4、33.3%=1/3、16.7%=1/6、14.3%=1/7、-9.1%=-1/11）
  applicability:
    include:
    - 已知现期B和增长率r，求基期A或增量X
    - r在常见分数附近、选项差距较大时
    exclude:
    - r不是常见分数且选项差距小时
    - 需精确到个位时
  method_steps:
  - 将r化为分数1/n：基期n份、增量1份、现期(n+1)份；负增长现期为(n-1)份
  - 每份=现期÷(n+1)：B=780、r=25%→每份=780÷5=156，增量=156，基期=624
  - 快速取量替代法：25%→增量=现期×0.2，33%→×0.25，50%→×0.33，100%→×0.5，42.9%→×0.3，66.6%/80%→×0.4
  - r非精确分数时修正：除n则乘(n-2)（除8乘6、除7乘5、除6乘4），修正方向看估大还是估小
  error_signatures:
  - code: neg_frac
    description: 负增长份数写成n+1份（-9.1%应为11:-1:10）
  - code: base_sign
    description: 负增长基期方向搞反（基期=现期+|增量|，是加不是减）
  - code: correction_wrong
    description: 修正系数记错或方向错（估小则一份应变大）
  fix_action: 做15道415份数法题，先背熟1/2~1/11分数表再套份数，限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 正确率85%
  pitfall: 把27.4%估成25%（估小）时，真实增量比算出的略大，不要回调
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
