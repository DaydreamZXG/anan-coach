  title: 思维陷阱排查五查
  recognition: 统计类材料题（表格/图表+选项），动笔前先排查时间、单位、排序、合计行、主客体五类坑
  applicability:
    include:
    - 时间范围题（2011-2020要排除2009-2010前两年、"1-X月"vs"全年"、环比vs同比）
    - 含"合计/总计/全国"行的表格计数题
    - 排序类（明确"从低到高"）与倍数表述类（"多多少倍"=比值-1）
    - 进出口主客体表述（"A从B进口"≡"B向A出口"）
    exclude:
    - 纯数值计算、无时间/单位/排序干扰的简单题（可直接算）
    - 明确给单一数值的基期/现期题
  method_steps:
  - 锁时间：先圈出题干时间范围，划掉范围外数据（"环比比邻居，同比比兄弟"）；材料"1-X月"警惕选项的"全年"
  - 换单位：先统一单位再比较（1毫克=1000微克、1亿吨=10000万吨）
  - 排合计行：计数类默认"全国/合计/总计"行不计入（如省市增速比较排除"全国"行）
  - 明表述：确认排序方向与倍数含义（"多多少倍"=A/B-1）、主客体方向（进口方/出口方对调）
