- id: mc_saline_method_mixed_growth
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/增长率/混合增长率
  title: 盐水法(混合增长率)
  recognition: 两部分(进口/出口、季度、废铅/其他)增速不同,已知部分增速和整体增速求另一部分,或求混合增速;整体增速介于部分之间
  applicability:
    include:
    - 求混合增速:整体居中,介于两分项之间
    - 已知整体+一个部分反推另一部分(线段法)
    - 两个部分增速相同时整体增速也相同(顺差增长率=24.5%)
    exclude:
    - 增长率>50%时现期量之比≠基期量之比,需用假设分配或直除
    - 能直接算出结果时优先A/B/X公式而非盐水
    - 需要精确值
  method_steps:
  - 画线段:两个部分增速为两端,整体增速居中
  - 估基期量之比(增长率大时不可用现期量比)
  - 量值反比:距离比=基期量比的倒数,按比例分配跨度求未知端(量比1:2→距离2:1,跨度17%分配得7.5%;量比3:1→距离1:3,第四季度=10.9%+3×1.2%)
  error_signatures:
  - code: base_vs_present_ratio
    description: 高增长率下用现期量比代替基期量比产生显著误差(80.3%/86.9%案例)
  - code: inverse_direction
    description: 量比与距离比方向取反,应为倒数关系
  - code: overkill_use
    description: 能精确计算时仍硬用盐水,复杂易错
  fix_action: 做8道混合增长率/十字交叉题,限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 85%
  pitfall: 基期量之比≠现期量之比:增长率悬殊时必须用基期量比,否则要么换成假设分配/直除
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
