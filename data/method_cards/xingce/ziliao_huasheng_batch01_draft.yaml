- id: mc_growth_amount_comparison
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/增长量/增长量大小比较
  title: 增长量比较(大大则大、一大一小看乘积)
  recognition: 比较多个量的增长量大小,已知各量基期(或现期)与增长率
  applicability:
    include:
    - 基期大且增长率大→增长量一定大(大大则大)
    - 一大一小时比较现期×r的乘积:粮油食品13776×10.2% vs 日用品5392×13.7%
    - 牛肉5.2×3.4% > 羊肉3.1×4.0%用乘积判定
    exclude:
    - 增长率>20%时现期×r近似增量误差大,需除以(1+r)
    - 单位不统一时先换算
  method_steps:
  - 先比基期与增长率方向:两者都大者直接胜出
  - 一大一小时比现期×r的乘积(增量≈现期·r,当r较小时)
  - 乘积接近时再精确除以(1+r)比较
  - 注意题干问的是增长率还是增长量,别拿增量比法套增速
  error_signatures:
  - code: product_rule_when_large_r
    description: r>20%时用现期×r代替增量,偏差大
  - code: multiply_wrong_factors
    description: 用基期×增长率而不是现期×增长率比较乘积
  - code: confuse_growth_rate_amount
    description: 混淆增长快慢(率)与增长高低(量)的题干要求
