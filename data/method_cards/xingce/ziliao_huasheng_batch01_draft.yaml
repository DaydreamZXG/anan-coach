- id: mc_zl_bizhi_cha
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/平均数与倍数/比值差
  title: 比值差（平均数差）
  recognition: 问'平均每单位（每人次/每场）比去年增加/减少了多少元'
  applicability:
    include:
    - 公式：去年分子/今年分母×(r1-r2)，r1分子增速、r2分母增速
    - 用假设分配求去年分子（如149.37亿→约121亿）
    - 单位换算后估算（亿元/万场→千元/场）
    exclude:
    - 问百分比变化→比值增长率
    - 现期与基期数值都直接给出→直接相减
    - 比重差（结果单位必为百分点）
  method_steps:
  - 确定分子A、分母B及各自增速r1、r2，求r1-r2（带符号）
  - 用假设分配或拆分求去年分子
  - 套公式：去年分子/今年分母×(r1-r2)
  - 统一单位后估算（如121/13.78×2.2%≈1728元），符号为负则减少
  error_signatures:
  - code: sign_ignore
    description: r1-r2为负时仍选'增加'选项
  - code: unit_mix
    description: 亿元/万场与元/场量级没换算
  - code: rate_vs_gap
    description: 与比值增长率公式混淆，用了(1+r2)做分母
  fix_action: 做8道比值差题，限时60秒/题，先写'符号+公式'再算
  time_budget_sec: 60
  accuracy_rule: 正确率85%以上
