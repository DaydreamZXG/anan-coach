- id: mc_zl_nianjun_zengzhanglv
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/年均增长/年均增长率（格尺法）
  title: 年均增长率（格尺法）
  recognition: 问'某段时间年均增长百分之几'，给末期与基期值
  applicability:
    include:
    - 公式末期/基期=(1+r)^n
    - 记忆值：1.05^4≈1.22、1.1^4≈1.46、1.15^4≈1.75、1.2^4≈2.07
    - 选项差距大直接代入验证；稍近用格尺法细分；极近用1+nr近似
    - 与间隔增长率结合逆推
    exclude:
    - 选项间隔极大（7%/11%/16%/21%）时代入即可无需格尺
    - r较大且n>5时近似误差大
    - 未判断是否前推基期
  method_steps:
  - 确定基期（五年计划/延后问法前推一年），算末期/基期
  - 差距大：对照记忆值代入选项验证（如1.35介于1.1^2=1.21与1.2^2=1.44之间）
  - 稍近：格尺法，把两记忆刻度间按份均分定位（如1.46与1.75分5格每格1%）
  - 极近：末期/基期≈1+nr直接解r
  error_signatures:
  - code: n_wrong
    description: 年份差n算错（2019-2021是2年不是3年）
  - code: ignore_high_order
    description: 增长率大时仍用1+nr近似
  - code: base_skip
    description: 未判断前推基期直接取图表首年
  fix_action: 做12道年均增长率题，限时70秒/题，先背1.22/1.46/1.75/2.07再算
  time_budget_sec: 70
  accuracy_rule: 正确率85%以上
  pitfall: 口诀'年均增长非平均，复合计算要记清'——(1+r)^n是利滚利，7%×3≈21%的线性相加是陷阱。
