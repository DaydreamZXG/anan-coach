- id: mc_hypothesis_allocation
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/基期与现期/假设分配法
  title: 假设分配法
  recognition: 已知现期B和增长率r求基期/增量，r在0%-20%区间（最佳5%-15%）
  applicability:
    include:
    - r≤20%的基期/增量计算
    - 多步复合运算（基期和差、连续基期）
    exclude:
    - r>25%时误差变大，改用415或修正法
    - 选项差距极小需五位精度时（改用代入验证法）
  method_steps:
  - 假设整百/整十基期A₀（参考现期首位：B=645取600，B=702取600而非700）
  - 算增量X₀=A₀×r：600×5.6%≈34
  - 剩余=B-(A₀+X₀)：645-634=11，已多分配则全给基期→A=611
  - 第二步剩余按10%基准分配：剩余×10%≈参考值，r>10%取略大、r<10%取略小，误差1-2可接受
  error_signatures:
  - code: step2_direction
    description: 第二步剩余量归到基期还是增量搞错
  - code: neg_sign
    description: 负增长率（-4.2%）分配时符号处理错，增量应为负
  - code: overshoot
    description: 第二步修正量超过剩余量的25%
  - code: bad_initial
    description: 初始假设远离现期（现期700+还假设700）导致反复回调
  fix_action: 做20道假设分配题，r集中在5%-15%，先练两步走（整百假设→10%基准调余量），限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 正确率85%（允许±1-2误差，选项不极近）
  pitfall: 增长率>20%仍硬用假设分配误差放大；增长率的百分之几（12.3%里的2.3%部分）必须按现期对应分配而非直觉取整
