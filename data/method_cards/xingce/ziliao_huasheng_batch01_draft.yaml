  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比重类/现期比重
  title: 现期比重计算
  recognition: 问'某部分占整体的比重'，材料给出同一时期的分子分母
  applicability:
    include:
    - 一般现期比重=部分/整体
    - 比重和/差=(部分和或差)/整体
    - 饼图题按12点钟方向顺时针排序，用1/2、1/3、1/4、1/8特殊比例对照
    exclude:
    - 问去年比重→基期比重公式
    - 问比重变化量→比重差
    - 分子分母分属不同时期
  method_steps:
  - 先确认'谁占谁'：确定分子（部分）与分母（整体），警惕'其中'提示词和图表数据错位
  - 核对时间口径：如'1-11月'需用1-12月减12月，进出口等概念需加总
  - 用拆分法估算：分子拆成'分母好算倍数+剩余'，或先算1%对应值再缩放
  - 与选项比对，饼图题直接对照特殊比例排除
  error_signatures:
