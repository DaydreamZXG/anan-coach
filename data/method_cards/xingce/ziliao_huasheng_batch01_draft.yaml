- id: mc_zl_415_fenpei
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/速算技巧/415分配法
  title: 415分配法（四一五法）
  recognition: 求增长量或基期量，且增长率能近似为常见几分之一（1/3、1/4、1/5、1/2等）时
  applicability:
    include:
    - 求一般增长量，增长率近似1/n常见分数（用415或假设分配）
    - 求基期量，配合假设分配快速拆现期
    - 选项差距大、只需估算时
    exclude:
    - 增长率不接近常见分数（如27.4%）时需先放缩到常见分数附近
    - 选项间隔极小必须精确计算
    - 负增长率场景需先看清方向再分配
  method_steps:
  - 把增长率近似为常见分数：33.3%≈1/3、25%≈1/4、50%≈1/2、100%≈1，现期量记为B
  - 用'右侧分份'出增量：r=1/3时增量=现期的1/4、r=1/4时增量=现期的1/5、r=1/2时增量=现期的1/3、r=100%时增量=现期一半（66.6%则增量=现期×0.4）
  - 基期量=现期-增量；反馈校验：增量/基期≈r，偏差大则微调初始假设
  error_signatures:
  - code: wrong_denominator
    description: 增量直接用现期×r，忘了增量=现期×r/(1+r)，把r=1/3的增量算成1/3而非1/4
  - code: negative_direction
    description: 负增长率 r=-33.3% 仍按正数1/4分配，方向算反
  - code: no_feedback
    description: 算完不做增量/基期≈r的反馈校验，误差累积
  fix_action: 做10道增长量计算题（增长率覆盖正负1/3、1/4、1/5、50%），限时45秒/题，只写'右侧分份'式不列完整除法，每题末尾做反馈校验
  time_budget_sec: 45
  accuracy_rule: 正确率90%以上（这是全卷速算地基）
  pitfall: 415分配得出的是近似值，务必用'增量占比≈r'做一次反馈校验，误差大时重新假设初始值。
