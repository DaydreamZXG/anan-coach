    exclude:
    - 有完整上年数据的普通相邻年增量（直接现期-基期）
    - 求"平均增量"（用总量÷年数，不是逐年加总）
  method_steps:
  - 非首年增量 = 本年现期 - 上年现期，可用"前两位相减法"粗判（794-682看前两位即知≈112>80）
  - 首年增量 = 首年现期 × 首年同比增速（如682×12.4%≈84.6万）
  - 增速若取整估大（12.4%按12.5%算），结果偏大，接近临界值时留余量或向下修正
