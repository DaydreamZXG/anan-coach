- id: mc_zl_wangzhe_rongyao
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比较类/王者荣耀法
  title: 王者荣耀法（基准+剩余拆分）
  recognition: 判断某占比是否超过特殊值（50%、1/3、2/3、75%），常见于综合分析题
  applicability:
    include:
    - 判断'超过50%'、'超过1/3'、'超过2/3'等阈值是否成立
    - 分子分母能拆出好算的'基准部分'（如5400/2700=50%）
    - 剩余部分占比小的情形
    exclude:
    - 剩余部分占比大（如>30%），基准意义失效
    - 需要精确占比数值
    - 普通两分数比较（直接用趋势法）
  method_steps:
  - 把分子分母同缩到好算基准：如5412/(2700+12)→5400/2700=50%，剩余1/12
  - 判断剩余部分对基准的影响方向：剩余占比<基准（50%）则整体略小于50%
  - 剩余占比>基准则整体略超阈值，等于则持平
  - 与题干'是否超过阈值'对照得出结论
  error_signatures:
  - code: base_not_round
    description: 基准拆不出整比例还硬拆
  - code: remainder_heavy
    description: 剩余占比接近或超过基准时仍判方向
  - code: unit_mismatch
    description: 基准分子分母量级不一致（如5400/2700时未注意0）
  fix_action: 做8道王者荣耀法题，限时45秒/题，格式'基准X%+剩余→方向'
  time_budget_sec: 45
  accuracy_rule: 正确率90%以上
  pitfall: 只判断'是否超过阈值'，误差容忍度高；若剩余部分对整体影响超过基准一半，别再勉强定性。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
