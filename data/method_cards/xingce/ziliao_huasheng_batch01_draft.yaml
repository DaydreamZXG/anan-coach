- id: mc_add_sub_tail_highbit
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/速算技巧/加减法速算
  title: 加减法速算（尾数法/高位叠加/分段法）
  recognition: 精确加/减求和或求差，选项末位或差值可快速区分答案
  applicability:
    include:
    - 若干精确数值相加求总和，选项末位不同
    - 减法判断增量/差值是否超过某阈值
    exclude:
    - 含小数舍入的估算值（如4.9万+2.1万），尾数会失真
    - 选项末位相同且需要判断十位以上
  method_steps:
  - 尾数法：选项末位不同看1位尾数、相同看2位尾数，只加末位即选答案；必须是精确整数
  - 高位叠加：按千/百/十/个位逐层相加，善用等差数列求和（奇数项和=中间项×项数）
  - 减法分段：拆成两段不借位减法，必要时用负数记借位；相邻百位减法插基准值（721-688=700+21-(700+12)）
  - 阈值判断：百位差>阈值百位直接判定，百位差=阈值百位再比尾数够不够减
  error_signatures:
  - code: tail_not_exact
    description: 对含小数/舍入的估算数据用尾数法，尾数失效
  - code: carry_forgot
    description: 加法忽略末位进位（1+8=9还可能有进位成7）
  fix_action: 做20道四位数加减法限时训练，每题先定尾数法还是高位叠加，限时30秒/题
  time_budget_sec: 40
  accuracy_rule: 正确率90%以上（加减法不容许错）
  pitfall: 尾数法只适用精确整数，题干出现小数或'约/近'字眼立即放弃改用高位叠加
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
