- id: mc_ratio_difference_calc
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比重/比重差计算
  title: 比重差计算(现期比重×增速差)
  recognition: 问某部分占整体的比重较上年上升/下降多少个百分点
  applicability:
    include:
    - 比重差=现期比重×(r部分-r整体)/(1+r部分)
    - r部分较小时简化为现期比重×(r部分-r整体):1016/2295≈44.3%×11%≈4.87%
    - 快速判断方向:部分增速为负、整体增速为正则比重必定下降
    exclude:
    - 选项差距极小、临界值附近(如4% vs 4.2%)时不可简化
    - r部分<-10%时(1+r部分)不可忽略
  method_steps:
  - 算现期比重a/b到能区分选项的精度
  - 找增速差r部分-r整体
  - 比重差≈a/b×(r部分-r整体);需精度时除以(1+r部分)
  - 符号判断:r部分>r整体则比重上升,反之下降
  error_signatures:
  - code: ignore_denominator_term
    description: 忽略(1+r部分)导致临界值误判(如4%与4.2%)
  - code: base_period_vs_diff_confuse
    description: 把比重差当基期比重差或反之,混用公式
  - code: direction_sign_error
    description: 增速差正负号取反,升降方向答错
  fix_action: 做8道比重差题,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: ≥85%
  pitfall: 临界值附近的题(“上升4个百分点以上”)必须精确算,简化会导致方向对但数值卡错边界。
