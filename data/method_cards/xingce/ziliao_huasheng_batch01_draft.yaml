- id: mc_ratio_product_growth_rate
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/增长率/比值与乘积增长率
  title: 比值增长率与乘积增长率判别
  recognition: 要求某量的增速，而该量由另两个量相除（A=B÷C）或相乘（A=B×C）构成，已知两因子增速
  applicability:
    include:
    - A=B÷C型：平均数（人均收入、单位面积产量）、单价（出口量=出口额÷单价）、整体=部分÷占比
    - A=B×C型：总产量=亩产×面积、总销售额=销量×单价、部分=整体×占比（看到"占比"想乘积）
    exclude:
    - 单一量直接给现期基期求增速（直接用定义式计算）
    - 问"上升/下降多少百分点"的占比差或比值差（用(a/B)×(r1-r2)，不是增长率公式）
  method_steps:
  - 识别构造：含"÷"或平均数/单价→比值型；含"×"、占比、亩产×面积→乘积型
  - 比值增长率：R=(r1-r2)/(1+r2)，r1为分子增速、r2为分母增速（如出口量=(31.5%-9.3%)/(1+9.3%)≈20.3%）
  - 乘积增长率：R=r1+r2+r1×r2，交叉项不能漏（如9.7%+0.87%+9.7%×0.87%≈10.7%）
  - 占比类先把占比换算成增速再代入：占比从80.2%→80.9%，增速≈0.7%÷80.2%≈0.87%
  error_signatures:
  - code: ratio_product_swap
