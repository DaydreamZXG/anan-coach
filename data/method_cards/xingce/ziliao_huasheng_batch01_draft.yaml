- id: mc_zl_fenshu_bijiao
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比较类/分数大小比较
  title: 分数大小比较（趋势法/通分法）
  recognition: 比较两个（组）分数大小或排序，如比重、基期量、性别比等比值
  applicability:
    include:
    - 趋势法：分子增速>分母增速→分数变大（如3/468 vs 4/489）
    - 通分法：分母相同比分子、分子相同比分母；或统一分子/分母后比
    - 分子分母比值明显的连续年份/选项比较
    exclude:
    - 需要具体数值（计算题）→直除
    - 分数与特殊值（50%等）比较且属综合分析→王者荣耀法
    - 增速比较（不同基期）→双线法
  method_steps:
  - 两分数同时放大看：估算分子涨了多少倍、分母涨了多少倍
  - 分子涨得快（倍数大）→分数变大；分母涨得快→分数变小
  - 或通分：统一分母（找倍数）或统一分子（放大到相同值）后直接比
  - 判断'后面分数是变大还是变小'得出排序
  error_signatures:
  - code: abs_diff_confusion
    description: 只看数值差（46→117）不看倍数，把'涨得快'误判
  - code: same_denominator_error
    description: 分子相同比分母时把分母大的当成大的
  - code: partial_compare
    description: 只比较第一对忘了逐步传递排序
  fix_action: 做10道分数比较题，限时40秒/题，只写'分子x倍/分母y倍'判断
  time_budget_sec: 40
  accuracy_rule: 正确率90%以上
  pitfall: 趋势法只看'谁涨得快'而非'谁涨得多'；涨得快慢用倍数估算，别用绝对差值。
