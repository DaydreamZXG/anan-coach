- id: mc_zl_jiqi_bizhong
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比重类/基期比重
  title: 基期比重计算
  recognition: 材料给现期（今年）数据，问题问去年（基期）比重或倍数、平均数
  applicability:
    include:
    - 基期比重=现期比重×(1+r整体)/(1+r部分)
    - 基期倍数、基期平均数同公式（基期A/基期B）
    - 增长率较小时(1+r2)/(1+r1)≈1+(r2-r1)
    exclude:
    - 问现期比重直接除
    - 只需判断增或减无定量需求时用比重趋势
    - 选项间隔很大时只需定性
  method_steps:
  - 先求现期比重（截位直除或拆分估出约值）
  - 写出调整因子(1+r整体)/(1+r部分)，判断与1的大小：r部分>r整体则因子<1
  - 结果=现期比重×因子：因子<1略降、>1略升；差异大时算精确因子（如100.8/104.1≈1-3.3/104）
  - 直接排除'现期比重值'的干扰选项（以坑治坑）
  error_signatures:
  - code: now_as_base_trap
    description: 选项中的现期比重是诱饵，直接选错
  - code: factor_flipped
    description: 分子分母增长率位置写反，把部分放分子
  - code: ratio_vs_diff
    description: 用(r部分-r整体)直接替代(1+r整体)/(1+r部分)做乘法
  fix_action: 做12道基期比重/倍数题，限时60秒/题，先圈出r部分、r整体再套公式
  time_budget_sec: 60
  accuracy_rule: 正确率90%以上
  pitfall: 口诀'现期比重乘上1+增长率反过来'——部分r1放分母、整体r2放分子；选项几乎必含现期比重干扰项。
