- id: mc_zl_shizi_jiaocha
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/盐水混合/十字交叉法
  title: 十字交叉法（已知3R求量比）
  recognition: 整体=两部分相加，已知整体和两部分的率（增长率/浓度/满意度）三个值，求两部分量之比
  applicability:
    include:
    - 增长率混合求基期量比（A/B=(r整体-r部分2)/(部分1-整体)）
    - 浓度、满意度、人均收入等a=b/c结构的量
    - 求人数比：口诀'求人数想盐水'（人数常为分母）
    exclude:
    - 不满足'整体=部分1+部分2'（人均收入不能直接相加时先确认可加性）
    - 已知两个率和量比求第三个率→线段法
    - 只问排序→三排序
  method_steps:
  - 画十字：左上r1、右上r2、中间r整体
  - 交叉相减取正：r整体-r2 与 r1-r整体，得量比 部分1/部分2=(r整体-r2)/(r1-r整体)
  - 口诀'大差对小量'：差大对应量小的部分
  - 检查所求顺序（如题问'女:男'还是'男:女'），必要时换算占比
  error_signatures:
  - code: order_flipped
    description: 交叉相减后量比顺序与所求方向颠倒
  - code: non_additive
    description: 把不能相加的人均收入直接套盐水模型
  - code: absolute_sign
    description: 差未取绝对值导致负数混乱
  fix_action: 做10道十字交叉题，限时50秒/题，只写'交叉式+量比'两步，标注所求是哪个量的比
  time_budget_sec: 50
  accuracy_rule: 正确率90%以上
  pitfall: 十字交叉求的是'分母量之比'——增长率对应基期量、平均数对应人数，先确认所求哪个量的比。
