- id: mc_zl_chaifen_fangsuo
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/速算技巧/拆分与放缩
  title: 拆分与放缩
  recognition: 求占比/比值，分子或分母是三、四位数，想避开完整除法
  applicability:
    include:
    - 现期比重=部分/整体的估算（如839/1892）
    - 分子接近分母的1/2、1/3、1/4等好算数时
    - 求整体=部分/占比反推时
    exclude:
    - 选项间隔极小（如1.5 vs 1.8）必须精确计算
    - 涉及增长率乘积时用415或直除
    - 分子分母无好算关系且剩余部分过大时直接直除
  method_steps:
  - 找一个好算基准：分母的一半（50%）、1/3、1/4，或把分母拆成整数部分+零头
  - 把分子拆成'基准对应值±剩余'：如839=946-107，839/1892=(946-107)/1892≈50%-5.7%
  - 剩余小项按占比估：如47600/81752≈47600/80000=0.595，零头1752项可忽略
  - 选最接近选项，必要时用'1%对应值'精细定位
  error_signatures:
  - code: small_remainder_blown
    description: 忽略的零头占比实际接近1%时仍忽略，导致选项错
  - code: base_too_far
    description: 基准取得太远，剩余部分占比超过30%失去意义
  - code: direction_mixed
    description: 分子分母放缩方向相反，误差叠加
  fix_action: 做12道占比估算题，限时50秒/题，强制用'基准±剩余'格式书写，标注剩余占比是否可忽略
  time_budget_sec: 50
  accuracy_rule: 正确率85%以上（估算允许小幅误差）
  pitfall: 拆分只对'剩余部分很小'的分数有效；若剩余占分子20%以上，直接改用截位直除。
