  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/速算技巧/截位直除
  title: 截位直除法
  recognition: 现期量÷(1+r)求基期,或A/B除法,数字位数长且r不是特殊分数
  applicability:
    include:
    - 基期量=现期÷(1+r)需要较精确的商
    - 除法求比重/占比,选项首位不同
    - 结余率等需要精确商的场景(选项差距小时不宜用放缩)
    exclude:
    - r是特殊分数(改用415/分数法)
    - 选项差距极小(个位差异)需完整五位数
  method_steps:
  - 分子分母同截三位有效数字(四舍五入)
  - 直除得商的首位或前两位(807.5/1.132≈713、11800/135.4≈87开头)
  - 与选项首位/次位比对锁定答案
  error_signatures:
  - code: truncation_error
    description: 截位舍入导致末位对不上选项
  - code: digit_loss
    description: 差值运算后有效数字降到两位使误差放大(进口=总额−出口)
  - code: wrong_direction
    description: 应除(1+r)却误除(1−r)
