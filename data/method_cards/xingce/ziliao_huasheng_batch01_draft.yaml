  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/盐水混合/混合增长率判断
  title: 混合增长率判断
  recognition: 问整体增长率（或某部分增长率），材料给整体+部分增长率或总量，具有'整体=部分1+部分2'结构
  applicability:
    include:
    - 进出口总额与进口/出口；1-6月与6月；收支盈余=收入-支出
    - 判断混合值介于两分量之间、靠近量大一方
    - 特殊反超：增长率悬殊（+150% vs +21.5%）时现期量大的未必基期量大，必须求基期
    exclude:
    - 问间隔增长率（时间上连续两年）→用r1+r2+r1×r2
    - 明确给出现期量比且增速接近时可近似
    - 不符合整体=部分相加关系
  method_steps:
  - 先定性：混合率必在两部分率之间，且靠近基期量大的部分
  - 量比悬殊或选项近时，取中间值估算再微调，或线段法分格精算
  - 若增长率悬殊（翻番级）先算基期量A=B/(1+r)再定靠近方向
  - 结果落区间后对照选项排除两端值
  error_signatures:
  - code: current_size_order
    description: 现期量大就认为基期量也大（忽略+150%类高增速）
  - code: range_violation
    description: 结果选在两部分率范围之外
  - code: nominal_vs_real
    description: 名义与实际增长率混淆（需扣除价格因素时）
  fix_action: 做12道混合增长率题，限时55秒/题，先定性区间再定量
  time_budget_sec: 55
  accuracy_rule: 正确率90%以上
  pitfall: 混合值只会落在两部分率之间——若选项全在区间外或靠近量大一侧但数据异常，检查是否用了现期量代替基期量。
