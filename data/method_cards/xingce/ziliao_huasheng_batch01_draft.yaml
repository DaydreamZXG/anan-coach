- id: mc_assumption_allocation
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/速算技巧/假设分配法
  title: 假设分配法(增量/基期互推)
  recognition: 已知现期和增长率求增量或基期,且增长率是便于分配的简单百分数(如4%、24.4%)
  applicability:
    include:
    - 已知现期2091亿增长4%求增量:先2000×4%=80,余91×4%≈3.6,合计83.6亿
    - 反推基期:假设2000亿则增量300亿,实际2428亿需更大基数
    - 环比反推上月:假设基期1.15、增量0.15的分配
    - 近似增长率估算:192.7亿增长24.4%≈25%(1/4),增量≈192.7/5≈38.5
    exclude:
    - 增长率非整数且选项差距很小时需精确计算
    - 可以直接截位直除时用除法更快
  method_steps:
  - 取一个好算的整数基期a,增量≈a×r
  - 余数(现期-a)单独分配:余×r
  - 两项相加得总增量;现期-增量=基期
  - 用选项反推:假设偏小则真实基数更大,按比例放大调整
  error_signatures:
  - code: forget_remainder_allocation
    description: 只算整数部分增量,漏掉余数部分的增量
  - code: wrong_assumption_direction
    description: 假设基期偏大/偏小的方向判断反,调整方向错误
  - code: rate_round_overflow
    description: 把24.4%约成25%后未记住实际结果应略小于估算值
