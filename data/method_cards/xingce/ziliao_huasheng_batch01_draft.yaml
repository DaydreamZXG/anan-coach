  title: 四幺五分数法（百分数转分数速算）
  recognition: 算式里出现百分数（增速/占比），想用简单分数替换来做乘法或除法
  applicability:
    include:
    - 乘法中遇百分数：拆分（55%=50%+5%）或方缩（212×334≈200×334+6%×334≈66840）
    - 除法中遇(1+r)：把r转成简单分数估算
    - 选项差距大、不需精确的场合
    exclude:
    - 选项极近需精确计算（分数近似误差可能致错）
    - 百分数与分数对应关系不熟时强行转换（记忆优先）
  method_steps:
  - 背熟常用对照：20%=1/5、25%=1/4、33.3%=1/3、50%=1/2、66.7%=2/3、75%=3/4、9.1%≈1/11、11.1%≈1/9
  - 乘法拆分：按分配律拆成整百×(1+百分数)，百分数部分单独精确算（6%×334不能只估40）
  - 除法放缩：分母接近整百时分子分母同比例变化；r<0先取绝对值
  - 修正系数成套记：1/9对应"除10后乘8"；33.3%乘2.2、50%乘1.3、66.7%乘0.9、100%乘0.5
