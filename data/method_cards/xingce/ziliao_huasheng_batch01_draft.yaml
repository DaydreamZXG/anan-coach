- id: mc_growth_rate_substitution
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/增长率/增长率替代比较与1%基准
  title: 增长率替代比较(增量/末期)与1%基准速算
  recognition: 比较多个量的增速大小且增量易得,或求某量变化值需要快速估算
  applicability:
    include:
    - 用增量/末期数代替增量/基期数比较增速:失业险2.42/292.1<1%,城乡居民养老189.1/2077.99≈9%
    - 用x/b代替x/a比较增速,保持比较基准统一
    - 求变化量时以1%为基准:10.8万的1%=1080元,2.2%≈2.2×1080≈2376元
    - 用整基数校验:4000的5%仅200,判断某增速是否>5%
    exclude:
    - 选项给出精确增速值、需要真实基期时
    - 被比较量的基期差异极大时替代排序可能失真
  method_steps:
  - 取各量的增量/末期数作为增速替代值,直接排序
  - 求变化量:先算现期值的1%作为基准
  - 变化量≈1%基准×增速差(以百分点计)
  - 量级校验:用整基数(如4000、2000)的百分比估算合理性
  error_signatures:
  - code: treat_substitution_as_exact
    description: 用末期替代基期的排序值当作精确增速作答
  - code: percent_base_error
    description: 1%基准取错基数(用末期而不是现期)
  - code: mixed_comparison_bases
    description: 替代比较时部分用基期部分用末期,基准不统一导致比乱数据
  fix_action: 做8道替代比较题,限时45秒/题
  time_budget_sec: 45
  accuracy_rule: ≥85%
  pitfall: 替代比较只保证排序,不保证精确值;所有被比较项必须用同一种基准(都取末期)才不会乱。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
