- id: mc_negative_growth_assignment
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/基期与现期/基期量计算
  title: 负增长率假设分配法
  recognition: 已知现期量b和负增长率r（-20%~0%），求基期量（如现期687、r=-3.4%）
  applicability:
    include:
    - 小负增长率（-20%以内）的基期量估算
    - 现期量为百位量级、选项差距较大、需快速出答案
    exclude:
    - 增长率超过-30%（如-30.7%）：建议改用直除法
    - 选项精确到个位或要求高精度的计算（本方法允许误差1以内）
    - 增长率为正数的基期计算（按正增长假设分配流程走）
  method_steps:
  - 基期取整：取略大于现期的整百数作基期a（现期400+取500、500+取600；如687→700、432→500）
  - 算初始增量：x = a×r（r为负，x为负；如700×(-3.4%)≈-24）
  - 求剩余：剩余 = b - (a + x)；剩余小（如11）直接并入基期得"基期711、增量-24"；剩余大则二次分配，基期加调整量、增量反向回调（+2与-46配对，正负抵消）
  - 验证：基期≈现期/(1+r)，误差1以内即收手，不再过度修正
  error_signatures:
  - code: base_below_current
    description: 基期整百取值小于现期（如现期432取400），分配方向矛盾
  - code: sign_violation
    description: 增量符号与基期同号，违反"基现同号、增量反号"规则
  - code: double_assign_same_sign
    description: 二次分配时两边符号相同，未做到正负抵消
  - code: over_refine_small_residue
    description: 剩余量很小时仍反复二次分配，精度收益为零
  fix_action: 做10道负增长率基期估算题，限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 百位量级误差1以内可接受；正确率90%以上
  pitfall: 负增长率下基期值必须大于现期值——从小于现期的整百数起分必然方向全错
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
