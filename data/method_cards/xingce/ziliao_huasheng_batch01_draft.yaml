    description: 就近取数把'辽宁占沿海城市比重'的分母误用为150万
  - code: time_window_mix
    description: 1-11月与1-12月数据混用
  - code: add_vs_single
    description: 进出口总额需加总进出口却只算单边
  fix_action: 做10道现期比重题（含2道饼图），限时55秒/题，先标出分子分母再算
  time_budget_sec: 55
  accuracy_rule: 正确率90%以上
  pitfall: 比重=部分/整体中'部分'有时需自行加总（进出口、1-11月），且分母可能离分子很远，先标出分子分母再动手。
