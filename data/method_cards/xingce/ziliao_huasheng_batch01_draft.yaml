- id: mc_mom_reverse_fraction
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/基期与现期/环比反推(份数法)
  title: 环比反推上月值(份数法)
  recognition: 已知本月值和环比变化率,需反推上月或前月数据,或用累计值推单月
  applicability:
    include:
    - 环比下降不足1/3:设去年为3份、变化量1份,反推上月
    - 用累计值减本月和前月估算目标月(1-3月总量1291万-336万-估算2月)
    - 港口2月环比用假设分配:基期约1.15、增量0.15,1月=4.54-2.85≈1.7,占比37.4%
    exclude:
    - 选项差距极小需精确计算
    - 环比变化率接近1/2等非简单分数时份数法误差大
  method_steps:
  - 把环比变化率写成简单分数(如≈1/3、1/4)
  - 设基期为n份、变化量为1份,现期=n±1份
  - 求单份值反推上月,再代入累计值求目标月
  - 边界验证:“不到三分之一”则估算值应比按1/3算的略小
  error_signatures:
  - code: ignore_boundary_word
    description: 忽略“不到三分之一”等限定词导致估算偏大
  - code: sign_error_chain
    description: 环比下降/上升方向用反,反推全错
  - code: accumulated_error
    description: 累计值减本月再减估算上月,估算误差累积到目标月
  fix_action: 做6道环比反推题,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: ≥85%
  pitfall: “不到1/3”这类边界词决定估算偏小方向;上月是估算值时误差会向后累积。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
