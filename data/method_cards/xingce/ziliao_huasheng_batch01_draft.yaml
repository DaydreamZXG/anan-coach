- id: mc_zl_jiashe_fenpei
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/速算技巧/假设分配法
  title: 假设分配法
  recognition: 求基期量/去年值，现期量和增长率都已知（比值差、基期比重、拉动增长的分母）
  applicability:
    include:
    - 比值差中求'去年的分子'（如149.37亿→去年约121亿）
    - 基期比重/基期平均数公式中的分子分母
    - 拉动增长、增量贡献率里的增量或基期量
    exclude:
    - 增长率很小（如<3%）时用拆分/直除更快
    - 只需定性判断（比重升/降）时不需要假设分配
    - 增长率极不常见（如43%）时先假设整数基期再校验
  method_steps:
  - 先假设一个好算的基期量A0（取整或接近真实值），增量=A0×r
  - 算现期估计=A0+A0×r，与真实现期B比较差值
  - 把差值按比例分摊：约差值×(1+r)给基期、差值×r给增量，得修正后基期
  - 校验：基期×(1+r)≈现期，一致即出答案
  error_signatures:
  - code: skip_feedback
    description: 假设一次就算完，不做(1+r)校验导致累计误差
  - code: split_all_to_base
    description: 差值全部摊给基期，忽略增量也需同步修正
  - code: decimal_clutter
    description: 保留过多小数位拖慢速度（保留3位有效数字即可）
  fix_action: 做12道基期量计算题（增长率覆盖5%~150%含翻番），限时50秒/题，统一'假设-对比-分摊-校验'四步
  time_budget_sec: 50
  accuracy_rule: 正确率90%以上，误差控制在选项分辨率之内
  pitfall: 初始假设越接近真实值后续越简单；增长率悬殊（如+150%）时现期量大未必基期量大，必须先求基期再比大小。
