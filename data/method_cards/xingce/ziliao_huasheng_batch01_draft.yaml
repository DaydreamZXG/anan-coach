- id: mc_inclusion_exclusion
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/其他/容斥原理(交集最值)
  title: 容斥原理求交集人数
  recognition: 两个比例群体在同一总样本中,问“至少/至多多少人同时满足两个条件”
  applicability:
    include:
    - 交集最小值=A+B-100%:71-80岁24.2%且用线上支付78.5%,至少24.2%+78.5%-100%=2.7%≈30人
    - 交集最大值=完全包含情况(取较小者)
    - 判断两集合是否必然有交集(看两占比之和是否超100%)
    - 放大字体55.6%+放大图标66.1%-100%=21.7%≈241人≥230
    exclude:
    - 三集合容斥
    - 求两集合之外的人数
  method_steps:
  - 交集最大值=min(A,B)(完全包含)
  - 交集最小值=A+B-100%(超过100%的部分必然重叠)
  - 人数=百分比×总样本数(注意用对当年样本总量)
  - 结果与题目给出的门槛人数比较判断选项
  error_signatures:
  - code: forget_minus_total
    description: 求“至少”时忘记减100%
  - code: wrong_total_base
    description: 用错样本总数(如1181与1107两年混用)
  - code: min_max_reversed
    description: 把交集最小值与最大值公式用反
  fix_action: 做5道容斥原理题,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: ≥85%
  pitfall: A+B-100%只在两占比之和超过100%时适用;和不超过100%时最小交集可为0。
