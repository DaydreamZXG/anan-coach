- id: mc_zl_bizhi_zengzhanglv
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/平均数与倍数/比值增长率
  title: 比值增长率（平均数增长率）
  recognition: 问'平均数（单价/人均/单位产量）同比增长了百分之几'
  applicability:
    include:
    - 公式r=(r1-r2)/(1+r2)，r1为分子（总量）增速、r2为分母（份数）增速
    - 需自行用增量求r1、r2（如出口金额增速、出口数量增速）
    - 部分=整体×占比时的占比增速
    exclude:
    - 问绝对值变化（元）→比值差
    - 分子分母增速未给出且无法求
    - 平均数现期基期都给出时直接算
  method_steps:
  - 识别分子（A）与分母（B），按'后除前'（A/B）确认
  - 算r1=(A现-A基)/A基、r2=(B现-B基)/B基（截位3位）
  - 代入(r1-r2)/(1+r2)估算（如21%/1.06≈20%）
  - 注意结果符号与大小，对照选项
  error_signatures:
  - code: use_general_growth
    description: 误用一般增长率公式算平均数
  - code: denom_wrong
    description: (r1-r2)忘除(1+r2)，或除以(1+r1)
  - code: flip_ab
    description: 分子分母增速对调（把r1、r2位置写反）
  fix_action: 做10道比值增长率题，限时55秒/题，固定先写r1、r2再套公式
  time_budget_sec: 55
  accuracy_rule: 正确率90%以上
  pitfall: 比值增长率与比值差公式分母不同——差用(1+r1)，率用(1+r2)，别混；单位是百分比而非量纲。
