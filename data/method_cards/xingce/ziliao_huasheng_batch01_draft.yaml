- id: mc_interval_growth_rate
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/增长率/间隔增长率
  title: 间隔增长率（含逆运用与间隔基期）
  recognition: 跨两年求总增长率，或已知总增速反推某一年增速，或求'前年'基期
  applicability:
    include:
    - 求'前年'基期：先算间隔增长率再按一般基期求
    - 已知总增长率R和一个单年增速反推另一年
    - 求间隔倍数=1+间隔增长率
    exclude:
    - 只有单年数据的一般增长率
  method_steps:
  - 公式R=r₁+r₂+r₁×r₂，乘积项<1%时可忽略；乘积项估算法：18%×1/9≈2%
  - 增速'回落/提高'换算：回落x个百分点→当年=x+回落前；提高x→当年=提高前-x
  - 逆运用：r₁≈R-r₂-乘积项（比R-r₂略小）；若R<r₂则r₁必为负（R-r₂后再加小量）
  - 间隔基期=现期÷(1+R)，用415/假设分配求解
  error_signatures:
  - code: pct_point_direction
    description: 增速提高/回落的方向加减反
  - code: product_ignored
    description: 选项极近时忽略乘积项导致差约1%选错
  - code: year_anchor
    description: '''前年/2019年''时间锚点看错'
  fix_action: 做12道间隔增长率题（含3道逆运用），先画时间轴再套公式，限时55秒/题
  time_budget_sec: 55
  accuracy_rule: 正确率85%
  pitfall: 逆运用时R-r₂之后还要再减乘积项，不能直接拿差值当答案；R<r₂则中间年份必为负增长
