- id: mc_div_split_ratio
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比重问题/比重拆分速算
  title: 除法拆分法（比重类）
  recognition: 求比重/占比，分子明显小于分母，分子在分母的50%±10%、或10%附近、或100%附近
  applicability:
    include:
    - 比重=部分÷整体，分子≤分母
    - 分子在分母50%附近或1%-20%区间或接近100%时
    exclude:
    - 分子比分母大很多时
    - 结果落在65%-90%区间（拆分步骤繁琐，优先放缩法）
  method_steps:
  - 截位同进同舍保留三位：47598÷89894→475÷898
  - 定1%基准'包子单价'=分母÷100（898→8.98）
  - 以50%为基准拆分子：475=449+26（449=898÷2），26÷8.98≈2.9个百分点
  - 结果=50%+2.9%=52.9%；高比重用逆向：32503÷33546=1-(10÷335)≈97%
  error_signatures:
  - code: not_equiv
    description: 分子未保持等价变形（462写成就近数而非493-31）
  - code: uneven_truncate
    description: 分子分母截位未同进同舍，造成系统性偏差
  - code: magnitude_misjudge
    description: 结果量级数错（33/2100≈1.57%误判为15.7%）
  fix_action: 做20道比重拆分题，每题先口算分母的1%基准再拆分子，限时50秒/题
  time_budget_sec: 50
  accuracy_rule: 正确率85%
