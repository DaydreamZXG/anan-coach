- id: mc_extreme_rate_reverse_check
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/增长率/极端增长率反向验证
  title: 极端增长率反向验证
  recognition: 增长率异常大(如1208.8%)或异常负值,求基期量或反推数量级
  applicability:
    include:
    - 超大增长率反推基期:100元增长12倍→1300元,实际1082<1300→基期<100亿元
    - 极端增速时优先考虑数量级合理性,跳过公式直算
    - 用选项数量级(如是否超过某整百)快速排除
    exclude:
    - 正常增速(±50%内)直接计算更快
    - 要求精确到个位数的题目
  method_steps:
  - 看到异常大增速先设整基期(如100亿元)
  - 现期=基期×(1+r),把真实现期与该整基期推算值比较定基期上下界
  - 增长1208.8%≈现期=基期×(1+12.088), 实际1082亿<100×(1+12.088)≈1309亿→基期<100
  - 用数量级匹配选项作答
  error_signatures:
  - code: rate_multiple_error
    description: 把1208.8%误当12.088倍而不是(1+12.088)倍
  - code: ignore_magnitude
    description: 不验证数量级直接套公式,选错量级选项
  - code: forget_minus_upper_half
    description: 已知全年销量后忘记减上半年销量(常见陷阱)
  fix_action: 做5道极端增速反向验证题,限时60秒/题
  time_budget_sec: 60
  accuracy_rule: ≥80%
  pitfall: 增长1208.8%意味着现期=基期×(1+12.088),不是基期×12;数量级先行校验。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
