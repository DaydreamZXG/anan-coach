- id: mc_increment_comparison_multiple
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/增长量/增量比较
  title: 增量比较(一大一小看倍数)
  recognition: 比较两个部分的增长量谁大,已知各自现期量和增速
  applicability:
    include:
    - 小增速时增量≈b×r(1+r)分母可忽略
    - 一大一小看倍数:现期量与增速一大一小时比乘积
    - 排序题先定最大最小再比中间(正大负小看绝对量)
    exclude:
    - 增速>10%需完整计算Δ=b×r/(1+r)
    - 现期量倍数与增速倍数很接近(边缘案例)
    - 基数差异悬殊的极端情况
  method_steps:
  - 同号才能比:正增量>负增量
  - 双大直接判:现期量大且增速也大者增量大,排除另一
  - 一大一小:算现期量倍数与增速倍数,乘积大者增量大(3.18/7.63≈0.42倍×增速比7.3/2.5≈2.92倍)
  error_signatures:
  - code: base_effect_ignored
    description: 基数差悬殊(127.6 vs 8.13)时忽略基数效应,高增速弥补不了绝对量
