  title: 假设分配法（份数比例速算）
  recognition: 已知现期量B和增长率r，快速求增量X与基期量A（b=ax题型）
  applicability:
    include:
    - r为33%、42.9%、50%、66%、80%-100%等典型比例时按份数直接出增量
    - '|r|<30%的基期计算：先估整百再修正'
    - 15%以上增速配合四幺五分数法辅助
    exclude:
    - 选项极近（千分级差异）：应改用代入验证法，不用速算
    - 增长率绝对值超过30%且无典型分数（建议直除）
  method_steps:
  - 命中的典型比例直接给增量：33%→X=B/4（基期3:增量1:现期4）；42.9%→X=0.3B；50%→X=B/3（2:1:3）；66%→X=0.4B（3:2:5）；80%-100%→X≈B/2
  - 未命中：取接近现期的整百基期A，X≈A×r，用A的10%、20%量级做上下修正
  - 精度不足做二次修正，直到A+X=B（误差到个位即可）
  - 负增长率：被分配数取绝对值（|A|>|B|），增量X与基期A异号，余数并入基数项
  error_signatures:
  - code: ratio_shares_wrong
    description: 份数关系记反（33%是3:1:4，X=B/4而不是B×1/3）
  - code: no_adjustment
    description: 估完整百基期不修正，直接把假设值当答案
  - code: negative_sign_mix
    description: 负增长时基期取整小于现期，或增量符号与基期同号
  - code: over_use_415
    description: r很小（如3%）时也硬上份数法，不如直接计算
