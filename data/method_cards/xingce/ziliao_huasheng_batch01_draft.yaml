  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/速算技巧/截位直除
  title: 截位直除
  recognition: 求平均数、倍数等'不规则'比值，需要精确除法
  applicability:
    include:
    - 平均数=总量/份数的计算
    - 现期倍数、基期倍数等比值
    - 现期比重分子分母都是三、四位数的除法
    exclude:
    - 增长率特殊（1/3等）时优先415分配
    - 只需比大小的题用趋势法/替代比较
    - 选项差距极大时可只算首位
  method_steps:
  - 分子分母同时截取3位有效数字（3288→328，1899→190），忽略后位
  - 直接相除，商保留2-3位有效数字；不能整除时补0下一位
  - 与选项对照选最接近项，差距大时首位即可定
  - 单位统一换算后先约零（亿=万万、万=百百）再算
  error_signatures:
  - code: magnitude_lost
    description: 截位后商太小，忘记把量级（10^k）还原导致选项错位
  - code: one_side_truncate
    description: 只截分母不截分子，放缩方向不一致
  - code: unit_ignore
    description: 亿元/万场与元/场量级未换算直接比较
  fix_action: 做15道平均数/倍数除法题，限时45秒/题，只写截位后的3位竖式，先换算单位再落笔
