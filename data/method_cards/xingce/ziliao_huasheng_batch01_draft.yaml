  tag_path: 资料分析/增长率/盐水原理(混合增速)
  title: 盐水原理判断混合增速与比重升降
  recognition: 整体由两部分组成,问整体增速范围、部分增速范围,或问比重较上年升还是降
  applicability:
    include:
    - 整体增速必在两部分增速之间且偏向量大一方:出口19.9%与进口13.3%之间,偏向出口额大的一边,肯定>16%
    - 判断比重升降只比增速大小:部分增速>整体增速则比重上升,不用算绝对值
    - 上下半年同比增速相同(如均168%)则全年增速=该增速,同浓度混合验证
    - 混合增速反推基期量之比(盐水法得基期比8:5)
    exclude:
    - 不能用盐水原理做精确加权计算,只能定方向/范围
    - 三部分以上混合时原理复杂
    - 题干要求精确百分点值时需十字交叉或加权平均
  method_steps:
  - 混合增速必介于最小与最大增速之间
  - 偏向基数(量)大的一方:量之比反比于增速差之比
  - 判断比重升降:只比较部分增速与整体增速大小,不看负号与绝对值
  - 需精度时用加权平均或十字交叉补算
  error_signatures:
  - code: wrong_bias_side
    description: 混合增速偏向量小的一方,方向判断反
  - code: use_saline_for_exact
    description: 用盐水原理精确求值导致偏差
  - code: forget_containment
    description: 忘记整体增速必须落在分项增速之间,选出了区间外的选项
