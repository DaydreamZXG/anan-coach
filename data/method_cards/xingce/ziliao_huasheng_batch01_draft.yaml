  method_steps:
  - 看分子分母原始比例（356/986≈1:3）
  - 分母向整百调整：986+14=1000
  - 分子按同比例同步增减：+5（新增盐水浓度与原比例一致）
  - 结果=361/1000=36.1%；口诀'看比例、调整百、同增减、保浓度'
