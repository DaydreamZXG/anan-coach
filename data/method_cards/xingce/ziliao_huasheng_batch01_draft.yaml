  tag_path: 资料分析/年均增长/等间隔增速推算
  title: 等间隔增速推算
  recognition: 给出两段等间隔（如2-6月、7-11月各5个月）且增速相同，已知两点值求第三点值
  applicability:
    include:
    - 关系式：11月值=6月值²/1月值（期末/中期=中期/期初）
    - 类似2023-2025与2020-2022增速相同求2025值
    - 江苏高频考法
    exclude:
    - 间隔不等时不能套此式
    - 无明确'增速相同/间隔相同'条件
    - 需要年均增速本身而非预测值
  method_steps:
  - 确认两段间隔相同且增速相同
  - 列比例：期末/中期=中期/期初，移项得 期末=中期²/期初
  - 估算：中期/期初≈k，则期末≈中期×k（如1028/565≈1.8→结果≈1028×1.8≈1850）
  - 与选项比对（略小于中期×2取最接近项）
  error_signatures:
  - code: period_mismatch
    description: 间隔不同硬套等比例
  - code: base_shift
    description: 年初用上年末数据没前推（2023年初=2022年末）
  - code: square_wrong
    description: 把'中期²'理解成六月平方而非移项产物
  fix_action: 做6道等间隔推算题，限时60秒/题，只写'期末=中期²/期初'
  time_budget_sec: 60
  accuracy_rule: 正确率85%以上
