- id: mc_zl_zengliang_bijiao
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比较类/增量大小比较
  title: 增量大小比较
  recognition: 比较两个（组）量的增长量/下降量大小，给出现期量B和增长率r
  applicability:
    include:
    - 大大则大：B和r都大时增量必大
    - 一大一小看倍数：比较B的倍数与r的倍数，B倍数>r倍数则B大一方增量大
    - 负增长率比绝对值（下降量），带符号排序
    exclude:
    - 需要具体增量数值→415或假设分配
    - 只需排序首位/末位时可只看极值
    - 增长率数据缺失
  method_steps:
  - 正负分组：正增长增量>负增长；负增长按|r|和B比下降量
  - 同方向用'大大则大'快速定大小
  - 一大一小时算倍数：B是对方x倍、r是对方y倍，x>y则增量大
  - 现期量差距大但倍数接近时用b×r粗算校验
  error_signatures:
  - code: sign_order_ignored
    description: 正增量比大小却忽略符号排序（负增量其实应排末位）
  - code: ignore_magnitude
    description: 只比r不看B量级（如B差17倍时r优势不足）
  - code: negative_not_last
    description: 负增长项忘了直接排末位
  fix_action: 做10道增量排序题，限时50秒/题，先写'正负分组→倍数'
  time_budget_sec: 50
  accuracy_rule: 正确率90%以上
  pitfall: 增量排序必须带符号：负增长量比任何正增长量都小；下降量比绝对值大者下降更多。
