- id: mc_zl_bizhong_cha
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比重类/比重差计算
  title: 比重差计算
  recognition: 问'比重上升/下降了几个百分点'，需要定量数值
  applicability:
    include:
    - 比重差=基期部分量/现期整体量×(r1-r2)，结果绝对值<|r1-r2|
    - 秒杀：结果必小于增速差，先排除大于|r1-r2|的选项
    - 量级判断：a/B较小时（如10%）变化量≈a/B×增速差，很小
    - 选项间隔大时用a/B≈现期部分/现期整体近似
    exclude:
    - 只需判断方向→比重趋势
    - 选项间隔小到0.3个百分点（如1.5 vs 1.8）时必须精确计算
    - 缺r1或r2数据
  method_steps:
  - 确认r1（部分增速）、r2（整体增速）及符号
  - 算增速差r1-r2；比重差绝对值必小于它，先排除过大选项
  - 估算基期部分/现期整体（约=现期部分/现期整体），相乘得量级
  - 必要时用假设分配求精确基期分子再算（如7500/1.314≈5723）
  error_signatures:
  - code: unit_pp
    description: 结果写百分数（1.5%）而非百分点（1.5个百分点）
  - code: exceed_gap
    description: 结果大于|r1-r2|还选，违背秒杀原理
  - code: precise_slop
    description: 选项间隔0.3个百分点时仍用估算导致选错
  fix_action: 做10道比重差题，限时60秒/题，先写'变化量<|r1-r2|'再估算
  time_budget_sec: 60
  accuracy_rule: 正确率90%以上
  pitfall: 比重差单位是百分点；若算出结果>增速差说明公式或数据取错，立刻回头查分子分母。
  author_note: 依据公开行测方法论整理,AI生成,等待人工回测
