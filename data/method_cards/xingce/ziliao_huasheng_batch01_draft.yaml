  title: 比重趋势判断
  recognition: 问'比重上升/下降的有几个年份（品类）'，只需定性不需要具体百分点
  applicability:
    include:
    - 比较r部分与r整体：r1>r2比重上升，r1<r2下降，相等不变
    - 逆运用：比重上升→部分增速>整体增速（用于比较各部分增速排序）
    - 结合现期占比推测基期：现占比X%且上升→原占比<X%；下降→原>X%
    - 适用于平均数、倍数等其他比值
    exclude:
    - 问变化幅度（几个百分点）→比重差公式
    - 增长率数据完全缺失
    - 现期占比接近需精确大小时
  method_steps:
  - 锁定分子r1与分母r2（按题干指标定位，别错配）
  - 带符号比较大小（10%>5%>-5%>-10%），只比大小不比差值
  - 若缺整体增速，用三排序思想等价转成'某部分增速>另一部分增速'
  - 顺带定基期位置：上升则基期<现期占比
  error_signatures:
  - code: sign_mix
    description: 正负号比较错误，把-3.54%当作大于正增速
  - code: pair_mismatch
    description: 分子分母指标错配（如用进口增速比出口占比）
  - code: gap_vs_growth
    description: 用增速回落幅度（几个百分点）代替增速本身比较
  fix_action: 做12道比重趋势题，限时45秒/题，只写'r1?r2→升/降'不列式计算
