- id: mc_ziliao_xianqi_bizhong_01
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比重问题/现期比重
  title: 现期比重：先找部分和整体
  recognition: 题干问某部分占总体的比重、占比或百分点差
  applicability:
