- id: mc_ziliao_zengzhanglv_yiban_01
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/增长率/一般增长率
  title: 一般增长率：先定基期再算增幅
  recognition: 题干问同比、环比、增长速度或增幅，材料能定位现期量和上一期量
  applicability:
    include:
      - 题干直接问增长率、增速、增幅
      - 材料同时给出现期量和基期量，或能由相邻时期定位
    exclude:
      - 题干问增长量而不是增长率
      - 多个部分合并后才求整体增速
  method_steps:
    - 先标出现期和基期，判断答案应为正还是负
    - 增长率 = 增长量 / 基期，增长量 = 现期 - 基期
    - 选项差距大时只估首两位，优先排除符号和量级错误
    - 基期接近整百整千时，把分母化整再估百分数
  error_signatures:
    - code: growth_rate_denominator_wrong
      description: 把现期量当作增长率分母
    - code: growth_rate_sign_missed
      description: 现期小于基期时没有先判负增长
  fix_action: 做 {n} 题一般增长率同类题，限时 {sec} 秒/题
  time_budget_sec: 55
  accuracy_rule: 选项相差超过3个百分点时估算；相差小于3个百分点时保留一位小数
  pitfall: 增长率分母永远是基期，不是现期
  author_note: AI 生成，基于 product.questions 资料分析高频 tag 抽样与解析总结；待产品负责人按附录 C 人工回测
