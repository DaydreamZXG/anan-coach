- id: mc_ziliao_xianqiliang_01
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/基期与现期/现期计算
  title: 现期量计算：基期顺推
  recognition: 题干给出基期量和增长率，问后来某期、保持增速后的现期量
  applicability:
    include:
      - 题干出现若保持、预计、将达到、某年为多少
      - 已知基期量和增长率或能先求出增长率
    exclude:
      - 问过去基期量
      - 题干要求复杂递推且每期增速不同
  method_steps:
    - 现期 = 基期 x (1 + 增长率)
    - 如果先给相邻两期量，先求增长率再顺推
    - 连续多年同增速且选项粗时，用倍数感判断量级
    - 问首次超过时，先算每年净增加量，再用差距除以增量
  error_signatures:
    - code: current_period_direction_wrong
      description: 把顺推现期误做成反推基期
    - code: projection_increment_wrong
      description: 保持增量和保持增速没有区分
  fix_action: 做 {n} 题现期计算同类题，限时 {sec} 秒/题
  time_budget_sec: 60
  accuracy_rule: 单步顺推保留整数或一位小数；首次超过题先估年份再精算临界点
  pitfall: 看清题干说的是保持增量还是保持增速
