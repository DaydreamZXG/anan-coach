- id: mc_ziliao_bizhi_jisuan_01
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/倍数与比值相关/比值计算
  title: 比值计算：先翻译除法关系
  recognition: 题干问是几倍、比值、强度、密度、单位量或 A 约为 B 的多少
  applicability:
    include:
      - 题干需要把两个同口径量做除法
      - 选项为倍数、范围或单位强度
    exclude:
      - 问比重且有明确部分整体关系
      - 问增长率的倍数，需要先求两个增长率
  method_steps:
    - 把题干翻译成 A / B，先写清谁除以谁
    - 单位不同先统一，尤其万、亿、日均、公里
    - 选项为范围时估首两位即可
