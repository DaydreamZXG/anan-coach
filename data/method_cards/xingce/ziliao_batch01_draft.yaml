      - 材料给出同一时期的部分量和总体量
      - 题干出现占、比重、占比、百分点
    exclude:
      - 问上一期比重
      - 问两期比重变化
  method_steps:
    - 先圈部分量，再圈整体量，确认二者同一时期同一单位
    - 比重 = 部分 / 整体
    - 问百分点差时分别算两个比重再相减
    - 选项粗时把整体化成便于除的整百、整千
