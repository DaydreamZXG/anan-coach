- id: mc_ziliao_jiqiliang_01
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/基期与现期/基期计算
  title: 基期量计算：化除为乘
  recognition: 题干给出现期量和增长率，问上年、上期或基期的量
  applicability:
    include:
      - 题干明确问上一年、上期、基期、2024年等过去口径
      - 材料给出现期量和同比、环比或增长率
    exclude:
      - 问增长量而不是基期量
      - 需要先合并多个现期量再求基期
  method_steps:
    - 基期 = 现期 / (1 + 增长率)
    - 增长率绝对值小于5%时，用现期乘以 (1 - r) 快速近似
    - 增长率为负时分母是 1 - |r|，基期会大于现期
    - 选项差距大于5%时估算，不做完整除法
  error_signatures:
    - code: base_period_formula_flip
      description: 把基期公式记成现期乘以 (1 + r)
    - code: negative_growth_direction_wrong
      description: 负增长时仍把基期算得比现期小
  fix_action: 做 {n} 题基期量同类题，限时 {sec} 秒/题
  time_budget_sec: 55
  accuracy_rule: 选项差距大于5%时估算；差距小于5%时保留一位小数核算
  pitfall: 看到负增长先提醒自己基期应大于现期
