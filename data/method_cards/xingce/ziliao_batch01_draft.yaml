- id: mc_ziliao_jiqi_bizhong_01
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比重问题/基期比重
  title: 基期比重：现期比重乘增长率修正
  recognition: 题干问上年、上期或基期某部分占总体的比重
  applicability:
    include:
      - 已知部分现期量、整体现期量及二者增长率
      - 题干明确问过去时期的比重
    exclude:
      - 只问现期比重
      - 材料已直接给出基期部分和基期整体
  method_steps:
    - 先算现期比重 = 部分现期 / 整体现期
    - 基期比重 = 现期比重 x (1 + 整体增速) / (1 + 部分增速)
    - 部分增速大于整体增速时，基期比重小于现期比重
    - 选项粗时先用升降关系排除，再估修正系数
  error_signatures:
    - code: base_proportion_growth_order_wrong
      description: 把修正系数写成 (1 + 部分增速) / (1 + 整体增速)
    - code: base_proportion_direction_wrong
      description: 没先用增速大小判断基期比重相对现期的方向
  fix_action: 做 {n} 题基期比重同类题，限时 {sec} 秒/题
  time_budget_sec: 70
  accuracy_rule: 先用方向排除；选项接近时再计算修正系数
  pitfall: 基期比重公式里整体增速在分子，部分增速在分母
