- id: mc_ziliao_zengzhangliang_jisuan_01
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/增长量/增长量计算
  title: 增长量计算：优先用现期和率
  recognition: 题干问增加了多少、增长量、同比增量或环比增量
  applicability:
    include:
      - 已知现期量和增长率
      - 或材料直接给出现期量和基期量
    exclude:
      - 问增长率
      - 问多个对象增长量大小排序
  method_steps:
    - 有现期和基期时，增长量 = 现期 - 基期
    - 有现期和增长率时，增长量 = 现期 x r / (1 + r)
    - r 接近 1/n 时，用现期 / (n + 1) 速算增长量
    - 负增长时增长量为负，问减少量时取绝对值
  error_signatures:
    - code: growth_amount_use_current_times_rate
      description: 直接用现期乘增长率，少除以 (1 + r)
    - code: growth_amount_negative_misread
      description: 没区分增长量为负和减少量为正
  fix_action: 做 {n} 题增长量计算同类题，限时 {sec} 秒/题
  time_budget_sec: 55
  accuracy_rule: r 可化成常见分数时用 n+1 公式；不能化分数时按选项差距估算
  pitfall: 现期乘增长率算出来偏大，常是陷阱项
