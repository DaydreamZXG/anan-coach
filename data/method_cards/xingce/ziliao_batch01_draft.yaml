- id: mc_ziliao_zengzhangliang_bijiao_01
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/增长量/增长量比较
  title: 增长量比较：大大则大，一大一小再算
  recognition: 题干问哪个增长量最大、最小，或要求比较多个对象同比增量
  applicability:
    include:
      - 多个对象均给出现期量和增长率
      - 题干目标是增长量大小而不是增长率大小
    exclude:
      - 只比较增长率
      - 数据口径不同，不能直接横比
  method_steps:
    - 同时比较现期量和增长率，现期大且率大则增长量必大
    - 现期小且率小的对象可先排除
    - 一大一小时，用现期 x r / (1 + r) 估算关键候选
    - 只精算最接近的两个候选
  error_signatures:
    - code: growth_amount_compare_rate_only
      description: 只按增长率大小比较增长量
    - code: growth_amount_compare_all_calculated
      description: 每个选项都完整计算，耗时过长
  fix_action: 做 {n} 题增长量比较同类题，限时 {sec} 秒/题
  time_budget_sec: 60
  accuracy_rule: 先用大大则大排除；只在一大一小时估算增长量
  pitfall: 增长率最高不等于增长量最大
