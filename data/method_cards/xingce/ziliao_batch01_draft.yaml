- id: mc_ziliao_hunhe_zengzhanglv_01
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/增长率/混合增长率
  title: 混合增长率：居中偏向基期大者
  recognition: 题干问两个或多个部分合计后的同比、环比增长率
  applicability:
    include:
      - 已知各部分现期量和各自增长率
      - 题干要求整体、合计、总体的增长率
    exclude:
      - 只问单个部分增长率
      - 各部分口径重叠，不能直接相加
  method_steps:
    - 先确定各部分增长率的最大值和最小值，整体增速必在两者之间
    - 用现期量除以 1 + r 估出各部分基期量
    - 基期量大的部分对整体增速拉力更大
    - 选项在两端之外直接排除，居中选偏向基期大者的一侧
  error_signatures:
    - code: mixed_growth_outside_range
      description: 选了不在各部分增长率区间内的整体增速
    - code: mixed_growth_weight_current
      description: 用现期量大小直接判断偏向，忽略应按基期量加权
  fix_action: 做 {n} 题混合增长率同类题，限时 {sec} 秒/题
  time_budget_sec: 65
  accuracy_rule: 选项间距大时用居中偏向判断；选项贴近时估基期权重再算
  pitfall: 混合增长率不是各增速的简单平均
