- id: mc_ziliao_liangqi_bizhong_01
  exam_scope: guokao
  track: xingce
  module_name: 资料分析
  tag_path: 资料分析/比重问题/两期比重
  title: 两期比重：先看部分增速减整体增速
  recognition: 题干问比重上升、下降或比上年提高几个百分点
  applicability:
    include:
      - 已知部分现期量、整体现期量及二者增速
      - 题干比较两个时期的比重变化
    exclude:
      - 只问现期比重
      - 缺少部分或整体的增长率
  method_steps:
    - 先比较部分增速 a 和整体增速 b
    - a 大于 b，比重上升；a 小于 b，比重下降
    - 变化幅度约为现期比重 x (a - b) / (1 + a)
    - 只问升降时不用计算百分点
  error_signatures:
    - code: two_period_proportion_direction_wrong
      description: 没用部分增速减整体增速判断升降
    - code: two_period_proportion_overcalculate
      description: 只问升降仍完整计算百分点，浪费时间
  fix_action: 做 {n} 题两期比重同类题，限时 {sec} 秒/题
  time_budget_sec: 65
  accuracy_rule: 先判升降；选项只问方向不算幅度，问百分点再估现期比重乘增速差
  pitfall: 比重变化的正负只看部分增速和整体增速的大小
