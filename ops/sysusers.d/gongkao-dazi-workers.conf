# Dedicated, non-login operating-system principals for deployed job consumers.
# systemd-sysusers assigns local UIDs; names, not numeric UIDs, are the
# deployment authority.
u gongkao-wkr-data     - "Gongkao data-rights worker"       /nonexistent /usr/sbin/nologin
u gongkao-wkr-cause    - "Gongkao cause-agent worker"      /nonexistent /usr/sbin/nologin
u gongkao-wkr-external - "Gongkao external-learning worker" /nonexistent /usr/sbin/nologin
u gongkao-wkr-essay    - "Gongkao essay-review worker"     /nonexistent /usr/sbin/nologin
u gongkao-wkr-coach    - "Gongkao coach-notification worker" /nonexistent /usr/sbin/nologin
u gongkao-wkr-ilink    - "Gongkao iLink worker"            /nonexistent /usr/sbin/nologin
u gongkao-backup       - "Gongkao backup authority"        /var/lib/gongkao-backup /usr/sbin/nologin
