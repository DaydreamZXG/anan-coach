rule_files:
  - commercial-readiness.rules.yml

evaluation_interval: 1m

tests:
  - name: mandatory empty queue consumer death still alerts
    interval: 1m
    input_series:
      - series: 'anan_job_consumer_deployed{job_type="xingce_cause_agent_v1"}'
        values: '1+0x4'
      - series: 'anan_job_consumer_enabled{job_type="xingce_cause_agent_v1"}'
        values: '1+0x4'
      - series: 'anan_job_consumer_heartbeat_healthy{job_type="xingce_cause_agent_v1"}'
        values: '0+0x4'
      - series: 'anan_job_queued{job_type="xingce_cause_agent_v1"}'
        values: '0+0x4'
      - series: 'anan_job_running{job_type="xingce_cause_agent_v1"}'
        values: '0+0x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: GongkaoEnabledJobConsumerHeartbeatUnhealthy
        exp_alerts:
          - exp_labels:
              job_type: xingce_cause_agent_v1
              severity: critical
            exp_annotations:
              summary: "已部署且启用的后台消费者 heartbeat 不健康"

  - name: conditional disabled empty queue is exempt
    interval: 1m
    input_series:
      - series: 'anan_job_consumer_deployed{job_type="essay_grounded_review_v2"}'
        values: '1+0x4'
      - series: 'anan_job_consumer_enabled{job_type="essay_grounded_review_v2"}'
        values: '0+0x4'
      - series: 'anan_job_consumer_heartbeat_healthy{job_type="essay_grounded_review_v2"}'
        values: '0+0x4'
      - series: 'anan_job_queued{job_type="essay_grounded_review_v2"}'
        values: '0+0x4'
      - series: 'anan_job_running{job_type="essay_grounded_review_v2"}'
        values: '0+0x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: GongkaoEnabledJobConsumerHeartbeatUnhealthy
        exp_alerts: []
      - eval_time: 3m
        alertname: GongkaoDisabledJobConsumerBacklog
        exp_alerts: []

  - name: conditional disabled backlog alerts
    interval: 1m
    input_series:
      - series: 'anan_job_consumer_deployed{job_type="essay_grounded_review_v2"}'
        values: '1+0x4'
      - series: 'anan_job_consumer_enabled{job_type="essay_grounded_review_v2"}'
        values: '0+0x4'
      - series: 'anan_job_consumer_heartbeat_healthy{job_type="essay_grounded_review_v2"}'
        values: '0+0x4'
      - series: 'anan_job_queued{job_type="essay_grounded_review_v2"}'
        values: '1+0x4'
      - series: 'anan_job_running{job_type="essay_grounded_review_v2"}'
        values: '0+0x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: GongkaoDisabledJobConsumerBacklog
        exp_alerts:
          - exp_labels:
              job_type: essay_grounded_review_v2
              severity: critical
            exp_annotations:
              summary: "未部署或关闭的后台消费者仍有 backlog"

  - name: active orphan alerts
    interval: 1m
    input_series:
      - series: anan_background_jobs_unregistered_active
        values: '1+0x3'
    alert_rule_test:
      - eval_time: 1m
        alertname: GongkaoUnregisteredBackgroundJob
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "存在绕过注册权威的活动后台任务"
