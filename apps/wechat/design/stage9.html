<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf3f1" />
    <title>岸岸 · 阶段 9 核心 UI 原型</title>
    <link rel="stylesheet" href="./stage9.css" />
  </head>
  <body>
    <main class="prototype-shell">
      <aside class="prototype-panel" aria-label="原型导航">
        <div class="brand-lockup">
          <span class="brand-mark">岸</span>
          <div>
            <strong>岸岸</strong>
            <small>STAGE 9 · CORE UI</small>
          </div>
        </div>

        <div class="prototype-intro">
          <span class="status-pill"><i></i> 可运行视觉原型</span>
          <h1>把复杂证据，<br />变成今天的行动。</h1>
          <p>先统一登录、今日、岗位、学习报告和我的。业务结论不改，只重做层级、节奏和可信感。</p>
        </div>

        <nav class="screen-switcher" aria-label="选择页面">
          <button class="screen-switcher__item" data-screen="login">
            <span>01</span><b>登录</b><small>品牌第一印象</small>
          </button>
          <button class="screen-switcher__item" data-screen="today">
            <span>02</span><b>今日</b><small>核心行动入口</small>
          </button>
          <button class="screen-switcher__item" data-screen="position">
            <span>03</span><b>岗位</b><small>决策与证据</small>
          </button>
          <button class="screen-switcher__item" data-screen="report">
            <span>04</span><b>报告</b><small>能力变化</small>
          </button>
          <button class="screen-switcher__item" data-screen="profile">
            <span>05</span><b>我的</b><small>账户与权益</small>
          </button>
        </nav>

        <div class="prototype-principles">
          <div>
            <span>01</span>
            <p>青绿色只承担行动和可信状态，不大面积铺底。</p>
          </div>
          <div>
            <span>02</span>
            <p>关键数字先给结论，再解释证据口径。</p>
          </div>
          <div>
            <span>03</span>
            <p>岸岸出现在陪伴节点，不遮挡训练内容。</p>
          </div>
        </div>
      </aside>

      <section class="device-stage" aria-label="小程序页面预览">
        <div class="stage-meta">
          <div>
            <span id="screen-code">B01</span>
            <strong id="screen-name">今日</strong>
          </div>
          <p id="screen-note">目标、容量、依据和首要任务在一个首屏完成交代。</p>
        </div>
        <div class="device" id="device">
          <div class="device__speaker" aria-hidden="true"></div>
          <div class="device__screen" id="app-screen"></div>
        </div>
        <p class="stage-footnote">390 × 844 · 微信小程序视觉基准 · Maple Mono CN</p>
      </section>
    </main>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <script type="module" src="./stage9.js"></script>
  </body>
</html>
